# The phone companion's texts (crate::companion and the page in assets/companion, which asks
# for them at /api/texts): the English text is the key, as in app.yml. The Dutch, German and
# French follow Omsi-Hub's phone where it had the same text.

"Connect to openOMSI":
  nl: "Verbinden met openOMSI"
  de: "Mit openOMSI verbinden"
  da: "Forbind til openOMSI"
  fr: "Se connecter à openOMSI"
  ru: "Подключение к openOMSI"
  uk: "Підключення до openOMSI"
  pl: "Połącz z openOMSI"
"Enter the pairing code the game shows.":
  nl: "Toets de koppelcode in die het spel toont."
  de: "Gib den Kopplungscode ein, den das Spiel anzeigt."
  da: "Indtast den parringskode, spillet viser."
  fr: "Saisissez le code d’appairage affiché par le jeu."
  ru: "Введите код сопряжения, который показывает игра."
  uk: "Введіть код спарювання, який показує гра."
  pl: "Wpisz kod parowania wyświetlany przez grę."
"That code is not right. The game shows the current one.":
  nl: "Die code klopt niet. Het spel toont de geldige."
  de: "Dieser Code stimmt nicht. Das Spiel zeigt den gültigen."
  da: "Den kode er forkert. Spillet viser den aktuelle."
  fr: "Ce code n’est pas le bon. Le jeu affiche le code valable."
  ru: "Код неверный. Действующий код показывает игра."
  uk: "Код неправильний. Чинний код показує гра."
  pl: "Ten kod jest nieprawidłowy. Aktualny kod pokazuje gra."
"Too many tries. Wait a minute.":
  nl: "Te veel pogingen. Wacht een minuut."
  de: "Zu viele Versuche. Warte eine Minute."
  da: "For mange forsøg. Vent et minut."
  fr: "Trop d’essais. Attendez une minute."
  ru: "Слишком много попыток. Подождите минуту."
  uk: "Забагато спроб. Зачекайте хвилину."
  pl: "Zbyt wiele prób. Poczekaj minutę."
"Connection lost. Trying again…":
  nl: "Verbinding kwijt. Opnieuw proberen…"
  de: "Verbindung verloren. Neuer Versuch…"
