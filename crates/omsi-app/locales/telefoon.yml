"Tap the tour you drive: you take it on at once, and its codes go to the IBIS.":
  nl: "Tik de omloop aan die je rijdt: je neemt hem meteen aan, en de codes gaan naar de IBIS."
  de: "Tippe den Umlauf an, den du fährst: du übernimmst ihn sofort, und die Codes gehen ans IBIS."
  da: "Tryk på den tur, du kører: du overtager den med det samme, og dens koder sendes til IBIS."
  fr: "Touchez le service que vous conduisez : vous le prenez aussitôt, et ses codes vont à l’IBIS."
  ru: "Нажмите на выход, который поедете: он сразу ваш, а его коды уходят в IBIS."
  uk: "Торкніться обороту, який поїдете: він одразу ваш, а його коди йдуть в IBIS."
  pl: "Dotknij brygady, którą jedziesz: od razu ją przejmujesz, a jej kody trafiają do IBIS."
