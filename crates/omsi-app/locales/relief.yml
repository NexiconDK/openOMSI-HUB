# NexiconDK, ticket inspection round V (crates/omsi-app/src/patrol.rs): a player as one of his bus
# company's ticket inspectors in a map's world - K by a passenger checks the ticket.
"Ticket inspection on line %{line} until %{time}: get into a bus, then K by a passenger checks the ticket.":
  de: "Fahrkartenkontrolle auf Linie %{line} bis %{time}: Steig in einen Bus, dann prüft K neben einem Fahrgast die Fahrkarte."
  da: "Billetkontrol på linje %{line} til kl. %{time}: Stig ind i en bus, og tryk K ved en passager for at tjekke billetten."
  fr: "Contrôle sur la ligne %{line} jusqu'à %{time} : monte dans un bus, puis K près d'un passager contrôle son titre."
  nl: "Kaartcontrole op lijn %{line} tot %{time}: stap in een bus, dan controleert K bij een reiziger het kaartje."
  pl: "Kontrola biletów na linii %{line} do %{time}: wsiądź do autobusu, potem K przy pasażerze sprawdza bilet."
  ru: "Контроль на маршруте %{line} до %{time}: войди в автобус, затем K рядом с пассажиром проверяет билет."
  uk: "Контроль на маршруті %{line} до %{time}: зайди в автобус, потім K біля пасажира перевіряє квиток."
"Your ticket-inspection duty is over.":
  de: "Deine Kontrollschicht ist vorbei."
  da: "Din kontrolvagt er slut."
  fr: "Ton service de contrôle est terminé."
  nl: "Je controledienst is voorbij."
  pl: "Twój dyżur kontrolerski się skończył."
  ru: "Твоя смена контролёра закончилась."
  uk: "Твоя зміна контролера закінчилася."
"Get into a bus first: K by a passenger checks the ticket.":
  de: "Steig zuerst in einen Bus: K neben einem Fahrgast prüft die Fahrkarte."
  da: "Stig først ind i en bus: K ved en passager tjekker billetten."
  fr: "Monte d'abord dans un bus : K près d'un passager contrôle son titre."
  nl: "Stap eerst in een bus: K bij een reiziger controleert het kaartje."
  pl: "Najpierw wsiądź do autobusu: K przy pasażerze sprawdza bilet."
  ru: "Сначала войди в автобус: K рядом с пассажиром проверяет билет."
  uk: "Спочатку зайди в автобус: K біля пасажира перевіряє квиток."
"Nobody to check within reach: walk up to a passenger.":
  de: "Niemand in Reichweite: Geh zu einem Fahrgast."
  da: "Ingen at tjekke inden for rækkevidde: Gå hen til en passager."
  fr: "Personne à contrôler à portée : approche-toi d'un passager."
  nl: "Niemand binnen bereik: loop naar een reiziger."
  pl: "Nikogo w zasięgu: podejdź do pasażera."
  ru: "Рядом никого нет: подойди к пассажиру."
  uk: "Поруч нікого немає: підійди до пасажира."
"Ticket, please…":
  de: "Fahrkarte, bitte…"
  da: "Billetten, tak…"
  fr: "Votre titre, s'il vous plaît…"
  nl: "Uw kaartje, alstublieft…"
  pl: "Bilet do kontroli…"
  ru: "Ваш билет, пожалуйста…"
  uk: "Ваш квиток, будь ласка…"
"Valid ticket. (%{n} checked in this bus)":
  de: "Gültige Fahrkarte. (%{n} in diesem Bus geprüft)"
  da: "Gyldig billet. (%{n} tjekket i denne bus)"
  fr: "Titre valable. (%{n} contrôlés dans ce bus)"
  nl: "Geldig kaartje. (%{n} gecontroleerd in deze bus)"
  pl: "Bilet ważny. (%{n} sprawdzonych w tym autobusie)"
  ru: "Билет действителен. (%{n} проверено в этом автобусе)"
  uk: "Квиток дійсний. (%{n} перевірено в цьому автобусі)"
"No ticket! A penalty fare of %{fine} is written. (%{n} checked, %{c} without a ticket)":
  de: "Keine Fahrkarte! Ein erhöhtes Beförderungsentgelt von %{fine} wird ausgestellt. (%{n} geprüft, %{c} ohne Fahrkarte)"
  da: "Ingen billet! Der udskrives en kontrolafgift på %{fine}. (%{n} tjekket, %{c} uden billet)"
  fr: "Pas de titre ! Une amende de %{fine} est dressée. (%{n} contrôlés, %{c} sans titre)"
  nl: "Geen kaartje! Er wordt een boete van %{fine} uitgeschreven. (%{n} gecontroleerd, %{c} zonder kaartje)"
  pl: "Brak biletu! Wystawiono opłatę dodatkową %{fine}. (%{n} sprawdzonych, %{c} bez biletu)"
  ru: "Нет билета! Выписан штраф %{fine}. (%{n} проверено, %{c} без билета)"
  uk: "Немає квитка! Виписано штраф %{fine}. (%{n} перевірено, %{c} без квитка)"
"Checked already.":
  de: "Schon geprüft."
  da: "Allerede tjekket."
  fr: "Déjà contrôlé."
  nl: "Al gecontroleerd."
  pl: "Już sprawdzony."
  ru: "Уже проверен."
  uk: "Вже перевірений."
"That passenger is no longer there.":
  de: "Dieser Fahrgast ist nicht mehr da."
  da: "Den passager er her ikke længere."
  fr: "Ce passager n'est plus là."
  nl: "Die reiziger is er niet meer."
  pl: "Tego pasażera już nie ma."
  ru: "Этого пассажира уже нет."
  uk: "Цього пасажира вже немає."
"In this bus: %{n} checked, %{c} without a ticket. Today: %{t} checked, %{a} without.":
  de: "In diesem Bus: %{n} geprüft, %{c} ohne Fahrkarte. Heute: %{t} geprüft, %{a} ohne."
  da: "I denne bus: %{n} tjekket, %{c} uden billet. I dag: %{t} tjekket, %{a} uden."
  fr: "Dans ce bus : %{n} contrôlés, %{c} sans titre. Aujourd'hui : %{t} contrôlés, %{a} sans."
  nl: "In deze bus: %{n} gecontroleerd, %{c} zonder kaartje. Vandaag: %{t} gecontroleerd, %{a} zonder."
  pl: "W tym autobusie: %{n} sprawdzonych, %{c} bez biletu. Dziś: %{t} sprawdzonych, %{a} bez."
  ru: "В этом автобусе: %{n} проверено, %{c} без билета. Сегодня: %{t} проверено, %{a} без."
  uk: "У цьому автобусі: %{n} перевірено, %{c} без квитка. Сьогодні: %{t} перевірено, %{a} без."
"No answer about that ticket: try again.":
  de: "Keine Antwort zu dieser Fahrkarte: Versuch es noch einmal."
  da: "Intet svar om den billet: Prøv igen."
  fr: "Pas de réponse pour ce titre : réessaie."
  nl: "Geen antwoord over dat kaartje: probeer het opnieuw."
  pl: "Brak odpowiedzi w sprawie tego biletu: spróbuj ponownie."
  ru: "Нет ответа по этому билету: попробуй ещё раз."
  uk: "Немає відповіді щодо цього квитка: спробуй ще раз."
"Your ticket-inspection duty is over: thank you. You may end the game now.":
  de: "Deine Kontrollschicht ist vorbei: danke. Du kannst das Spiel jetzt beenden."
  da: "Din kontrolvagt er slut: tak. Du kan afslutte spillet nu."
  fr: "Ton service de contrôle est terminé : merci. Tu peux quitter le jeu."
  nl: "Je controledienst is voorbij: bedankt. Je kunt het spel nu afsluiten."
  pl: "Twój dyżur kontrolerski się skończył: dziękujemy. Możesz teraz zakończyć grę."
  ru: "Твоя смена контролёра закончилась: спасибо. Можешь выйти из игры."
  uk: "Твоя зміна контролера закінчилася: дякуємо. Можеш вийти з гри."
"The world does not know your ticket-inspection duty: start it again from the launcher.":
  de: "Die Welt kennt deine Kontrollschicht nicht: Starte sie im Launcher neu."
  da: "Verden kender ikke din kontrolvagt: Start den igen fra launcheren."
  fr: "Le monde ne connaît pas ton service de contrôle : relance-le depuis le lanceur."
  nl: "De wereld kent je controledienst niet: start hem opnieuw vanuit de launcher."
  pl: "Świat nie zna twojego dyżuru kontrolerskiego: uruchom go ponownie z launchera."
  ru: "Мир не знает о твоей смене контролёра: запусти её снова из лаунчера."
  uk: "Світ не знає про твою зміну контролера: запусти її знову з лаунчера."
"Ticket inspector %{name} checks the tickets in your bus.":
  de: "Kontrolleur %{name} prüft die Fahrkarten in deinem Bus."
  da: "Kontrollør %{name} tjekker billetterne i din bus."
  fr: "Le contrôleur %{name} contrôle les titres dans ton bus."
  nl: "Controleur %{name} controleert de kaartjes in je bus."
  pl: "Kontroler %{name} sprawdza bilety w twoim autobusie."
  ru: "Контролёр %{name} проверяет билеты в твоём автобусе."
  uk: "Контролер %{name} перевіряє квитки у твоєму автобусі."
"Everybody near you is checked: walk on through the bus.":
  de: "Alle in deiner Nähe sind geprüft: Geh weiter durch den Bus."
  da: "Alle i nærheden er tjekket: Gå videre gennem bussen."
  fr: "Tout le monde près de toi est contrôlé : avance dans le bus."
  nl: "Iedereen bij je in de buurt is gecontroleerd: loop verder door de bus."
  pl: "Wszyscy w pobliżu są sprawdzeni: idź dalej przez autobus."
  ru: "Все рядом проверены: иди дальше по автобусу."
  uk: "Усі поруч перевірені: іди далі автобусом."
