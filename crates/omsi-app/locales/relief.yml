_version: 2
# NexiconDK, Bus Company Online: relief at the stop (crates/omsi-app/src/relief.rs) - a player who
# takes a tour over from the AI waits on foot at the stop, the AI's bus is handed over there.
"Wait here for your bus: line %{line} at %{time}. Its driver gets out at the stop, then G at the front door takes the wheel.":
  de: "Warte hier auf deinen Bus: Linie %{line} um %{time}. Sein Fahrer steigt an der Haltestelle aus, dann übernimmt G an der Vordertür das Steuer."
  fr: "Attends ton bus ici : ligne %{line} à %{time}. Son conducteur descend à l'arrêt, puis G à la porte avant prend le volant."
  nl: "Wacht hier op je bus: lijn %{line} om %{time}. De chauffeur stapt bij de halte uit, daarna neemt G bij de voordeur het stuur over."
  pl: "Czekaj tu na swój autobus: linia %{line} o %{time}. Kierowca wysiądzie na przystanku, potem G przy przednich drzwiach przejmuje kierownicę."
  ru: "Жди здесь свой автобус: маршрут %{line} в %{time}. Водитель выйдет на остановке, затем G у передней двери — за руль."
  uk: "Чекай тут на свій автобус: маршрут %{line} о %{time}. Водій вийде на зупинці, потім G біля передніх дверей — за кермо."
"Your bus is here: walk up to it.":
  de: "Dein Bus ist da: geh zu ihm hin."
  fr: "Ton bus est là : approche-toi."
  nl: "Je bus is er: loop ernaartoe."
  pl: "Twój autobus już jest: podejdź do niego."
  ru: "Твой автобус прибыл: подойди к нему."
  uk: "Твій автобус прибув: підійди до нього."
"The driver gets out: then G at the front door takes the wheel.":
  de: "Der Fahrer steigt aus: dann übernimmt G an der Vordertür das Steuer."
  fr: "Le conducteur descend : ensuite G à la porte avant prend le volant."
  nl: "De chauffeur stapt uit: daarna neemt G bij de voordeur het stuur over."
  pl: "Kierowca wysiada: potem G przy przednich drzwiach przejmuje kierownicę."
  ru: "Водитель выходит: затем G у передней двери — за руль."
  uk: "Водій виходить: потім G біля передніх дверей — за кермо."
"Your bus: G at the front door takes the wheel.":
  de: "Dein Bus: G an der Vordertür übernimmt das Steuer."
  fr: "Ton bus : G à la porte avant prend le volant."
  nl: "Je bus: G bij de voordeur neemt het stuur over."
  pl: "Twój autobus: G przy przednich drzwiach przejmuje kierownicę."
  ru: "Твой автобус: G у передней двери — за руль."
  uk: "Твій автобус: G біля передніх дверей — за кермо."
"Wait: the driver gets out first.":
  de: "Warte: zuerst steigt der Fahrer aus."
  fr: "Attends : le conducteur descend d'abord."
  nl: "Wacht: eerst stapt de chauffeur uit."
  pl: "Poczekaj: najpierw wysiada kierowca."
  ru: "Подожди: сначала выйдет водитель."
  uk: "Зачекай: спершу вийде водій."
"You were not there in time: the AI drives the %{time}. Your bus comes to %{stop} for the %{next}: ride along to there (G at a door of the bus).":
  de: "Du warst nicht rechtzeitig da: die KI fährt die %{time}. Dein Bus kommt um %{next} nach %{stop}: fahr bis dorthin mit (G an einer Tür des Busses)."
  fr: "Tu n'étais pas là à temps : l'IA fait le départ de %{time}. Ton bus arrive à %{stop} pour celui de %{next} : monte jusque-là (G à une porte du bus)."
  nl: "Je was er niet op tijd: de AI rijdt de %{time}. Je bus komt naar %{stop} voor de %{next}: rij tot daar mee (G bij een deur van de bus)."
  pl: "Nie zdążyłeś: SI prowadzi kurs o %{time}. Twój autobus przyjedzie na %{stop} na kurs o %{next}: jedź tam jako pasażer (G przy drzwiach autobusu)."
  ru: "Ты не успел: рейс в %{time} ведёт ИИ. Твой автобус придёт на %{stop} к рейсу в %{next}: доедь туда пассажиром (G у двери автобуса)."
  uk: "Ти не встиг: рейс о %{time} веде ШІ. Твій автобус прийде на %{stop} до рейсу о %{next}: доїдь туди пасажиром (G біля дверей автобуса)."
"You were not there in time: the AI drives the rest of your duty.":
  de: "Du warst nicht rechtzeitig da: die KI fährt den Rest deines Dienstes."
  fr: "Tu n'étais pas là à temps : l'IA assure la fin de ton service."
  nl: "Je was er niet op tijd: de AI rijdt de rest van je dienst."
  pl: "Nie zdążyłeś: SI prowadzi resztę twojej służby."
  ru: "Ты не успел: остаток смены ведёт ИИ."
  uk: "Ти не встиг: решту зміни веде ШІ."
"The world does not know this trip: your bus is put at the stop.":
  de: "Die Welt kennt diese Fahrt nicht: dein Bus wird an die Haltestelle gestellt."
  fr: "Le monde ne connaît pas ce trajet : ton bus est placé à l'arrêt."
  nl: "De wereld kent deze rit niet: je bus wordt bij de halte neergezet."
  pl: "Świat nie zna tego kursu: twój autobus zostaje postawiony na przystanku."
  ru: "Мир не знает этого рейса: твой автобус поставлен на остановке."
  uk: "Світ не знає цього рейсу: твій автобус поставлено на зупинці."
"Your bus could not be put down: %{why}":
  de: "Dein Bus konnte nicht hingestellt werden: %{why}"
  fr: "Ton bus n'a pas pu être placé : %{why}"
  nl: "Je bus kon niet worden neergezet: %{why}"
  pl: "Nie udało się postawić twojego autobusu: %{why}"
  ru: "Не удалось поставить твой автобус: %{why}"
  uk: "Не вдалося поставити твій автобус: %{why}"
"Your bus comes with %{name}: they get out at the stop and hand it over to you.":
  de: "Dein Bus kommt mit %{name}: an der Haltestelle steigt er aus und übergibt ihn dir."
  fr: "Ton bus arrive avec %{name} : il descend à l'arrêt et te le remet."
  nl: "Je bus komt met %{name}: die stapt bij de halte uit en draagt hem aan jou over."
  pl: "Twój autobus przyjedzie z %{name}: wysiądzie na przystanku i przekaże ci go."
  ru: "Твой автобус ведёт %{name}: на остановке он выйдет и передаст его тебе."
  uk: "Твій автобус веде %{name}: на зупинці він вийде й передасть його тобі."
"%{name} waits here to take your bus over: stop, get up (Ctrl+Shift+G) and get out.":
  de: "%{name} wartet hier, um deinen Bus zu übernehmen: halte an, steh auf (Strg+Umschalt+G) und steig aus."
  fr: "%{name} attend ici pour reprendre ton bus : arrête-toi, lève-toi (Ctrl+Maj+G) et descends."
  nl: "%{name} wacht hier om je bus over te nemen: stop, sta op (Ctrl+Shift+G) en stap uit."
  pl: "%{name} czeka tu, żeby przejąć twój autobus: zatrzymaj się, wstań (Ctrl+Shift+G) i wysiądź."
  ru: "%{name} ждёт здесь, чтобы принять твой автобус: остановись, встань (Ctrl+Shift+G) и выйди."
  uk: "%{name} чекає тут, щоб прийняти твій автобус: зупинись, встань (Ctrl+Shift+G) і вийди."
"Handed over: %{name} drives on.":
  de: "Übergeben: %{name} fährt weiter."
  fr: "Remis : %{name} continue."
  nl: "Overgedragen: %{name} rijdt verder."
  pl: "Przekazano: %{name} jedzie dalej."
  ru: "Передано: дальше едет %{name}."
  uk: "Передано: далі їде %{name}."
# NexiconDK, Bus Company Online: single trips (27 October 2026) - at the end of a trip taken on its
# own the player may drive the tour's next trip as well (the game menu's line, `relief::drive_on`).
"Drive on with the next trip":
  de: "Mit der nächsten Fahrt weiterfahren"
  fr: "Continuer avec le trajet suivant"
  nl: "Doorrijden met de volgende rit"
  pl: "Jedź dalej następnym kursem"
  ru: "Ехать дальше следующим рейсом"
  uk: "Їхати далі наступним рейсом"
"You drive on: the %{time} is yours too.":
  de: "Du fährst weiter: die Fahrt um %{time} gehört auch dir."
  fr: "Tu continues : le trajet de %{time} est aussi à toi."
  nl: "Je rijdt door: de rit van %{time} is ook van jou."
  pl: "Jedziesz dalej: kurs o %{time} też jest twój."
  ru: "Ты едешь дальше: рейс в %{time} тоже твой."
  uk: "Ти їдеш далі: рейс о %{time} теж твій."
"The tour has no trip after this one for you, or it has left.":
  de: "Der Umlauf hat nach dieser Fahrt keine weitere für dich, oder sie ist schon abgefahren."
  fr: "Le service n'a pas de trajet après celui-ci pour toi, ou il est déjà parti."
  nl: "De omloop heeft na deze rit geen rit meer voor jou, of die is al vertrokken."
  pl: "Brygada nie ma dla ciebie kursu po tym albo już odjechał."
  ru: "После этого рейса у выхода нет рейса для тебя, или он уже ушёл."
  uk: "Після цього рейсу у виходу немає рейсу для тебе, або він уже пішов."
"End of your trip: the AI drives the tour on from here - or drive its next trip yourself (game menu › Drive on with the next trip).":
  de: "Ende deiner Fahrt: die KI fährt den Umlauf von hier aus weiter - oder fahre seine nächste Fahrt selbst (Spielmenü › Mit der nächsten Fahrt weiterfahren)."
  fr: "Fin de ton trajet : l'IA poursuit le service à partir d'ici - ou conduis toi-même son trajet suivant (menu du jeu › Continuer avec le trajet suivant)."
  nl: "Einde van je rit: de AI rijdt de omloop vanaf hier verder - of rijd de volgende rit zelf (spelmenu › Doorrijden met de volgende rit)."
  pl: "Koniec twojego kursu: SI prowadzi brygadę dalej stąd - albo poprowadź jej następny kurs sam (menu gry › Jedź dalej następnym kursem)."
  ru: "Конец твоего рейса: дальше выход ведёт ИИ - или проведи его следующий рейс сам (меню игры › Ехать дальше следующим рейсом)."
  uk: "Кінець твого рейсу: далі вихід веде ШІ - або проведи його наступний рейс сам (меню гри › Їхати далі наступним рейсом)."
# NexiconDK, Bus Company Online (27 October 2026): at the end of a duty the AI takes the player's bus
# over to drive the tour on (its driver walks up and gets in); a player who gave his bus on to
# another, his duty going on with another tour, waits for that trip's bus (`relief`).
"The AI drives the tour on with your bus at %{time}: stop, get up (Ctrl+Shift+G) and get out - its driver takes it over.":
  de: "Die KI fährt den Umlauf um %{time} mit deinem Bus weiter: halte an, steh auf (Strg+Umschalt+G) und steig aus - ihr Fahrer übernimmt ihn."
  fr: "L'IA poursuit le service avec ton bus à %{time} : arrête-toi, lève-toi (Ctrl+Maj+G) et descends - son conducteur le reprend."
  nl: "De AI rijdt de omloop om %{time} verder met jouw bus: stop, sta op (Ctrl+Shift+G) en stap uit - haar chauffeur neemt hem over."
  pl: "SI prowadzi brygadę dalej twoim autobusem o %{time}: zatrzymaj się, wstań (Ctrl+Shift+G) i wysiądź - jej kierowca go przejmie."
  ru: "ИИ продолжит выход на твоём автобусе в %{time}: остановись, встань (Ctrl+Shift+G) и выйди - его водитель примет автобус."
  uk: "ШІ продовжить вихід на твоєму автобусі о %{time}: зупинись, встань (Ctrl+Shift+G) і вийди - його водій прийме автобус."
"The driver comes to take your bus over.":
  de: "Der Fahrer kommt, um deinen Bus zu übernehmen."
  fr: "Le conducteur arrive pour reprendre ton bus."
  nl: "De chauffeur komt je bus overnemen."
  pl: "Kierowca idzie przejąć twój autobus."
  ru: "Водитель идёт принять твой автобус."
  uk: "Водій іде прийняти твій автобус."
"Handed over: the AI drives the tour on.":
  de: "Übergeben: die KI fährt den Umlauf weiter."
  fr: "Remis : l'IA poursuit le service."
  nl: "Overgedragen: de AI rijdt de omloop verder."
  pl: "Przekazano: SI prowadzi brygadę dalej."
  ru: "Передано: ИИ ведёт выход дальше."
  uk: "Передано: ШІ веде вихід далі."
"The AI could not take your bus over: it stays yours.":
  de: "Die KI konnte deinen Bus nicht übernehmen: er bleibt deiner."
  fr: "L'IA n'a pas pu reprendre ton bus : il reste le tien."
  nl: "De AI kon je bus niet overnemen: hij blijft van jou."
  pl: "SI nie mogła przejąć twojego autobusu: zostaje twój."
  ru: "ИИ не смог принять твой автобус: он остаётся твоим."
  uk: "ШІ не зміг прийняти твій автобус: він лишається твоїм."
"Your duty goes on with line %{line} at %{time} from %{stop}: wait there for its bus.":
  de: "Dein Dienst geht weiter mit Linie %{line} um %{time} ab %{stop}: warte dort auf ihren Bus."
  fr: "Ton service continue avec la ligne %{line} à %{time} depuis %{stop} : attends-y son bus."
  nl: "Je dienst gaat verder met lijn %{line} om %{time} vanaf %{stop}: wacht daar op haar bus."
  pl: "Twoja służba trwa dalej linią %{line} o %{time} z przystanku %{stop}: czekaj tam na jej autobus."
  ru: "Твоя смена продолжается маршрутом %{line} в %{time} от остановки %{stop}: жди там его автобус."
  uk: "Твоя зміна триває маршрутом %{line} о %{time} від зупинки %{stop}: чекай там на його автобус."
"Hand the bus over to the AI here":
  de: "Den Bus hier an die KI übergeben"
  fr: "Remettre le bus à l'IA ici"
  nl: "De bus hier aan de AI overdragen"
  pl: "Przekaż tu autobus SI"
  ru: "Передать автобус ИИ здесь"
  uk: "Передати автобус ШІ тут"
"The AI is asked to take your bus over here.":
  de: "Die KI wird gefragt, deinen Bus hier zu übernehmen."
  fr: "On demande à l'IA de reprendre ton bus ici."
  nl: "De AI wordt gevraagd je bus hier over te nemen."
  pl: "SI zostaje poproszona o przejęcie tu twojego autobusu."
  ru: "ИИ просят принять твой автобус здесь."
  uk: "ШІ просять прийняти твій автобус тут."
"Stop at a stop of your trip, or at its terminus, to hand the bus over.":
  de: "Halte an einer Haltestelle deiner Fahrt oder an ihrer Endhaltestelle, um den Bus zu übergeben."
  fr: "Arrête-toi à un arrêt de ton trajet, ou à son terminus, pour remettre le bus."
  nl: "Stop bij een halte van je rit, of bij het eindpunt, om de bus over te dragen."
  pl: "Zatrzymaj się na przystanku swojego kursu albo na pętli, aby przekazać autobus."
  ru: "Остановись на остановке своего рейса или на конечной, чтобы передать автобус."
  uk: "Зупинись на зупинці свого рейсу або на кінцевій, щоб передати автобус."
"The AI takes your bus over here: get up (Ctrl+Shift+G) and get out - its driver comes.":
  de: "Die KI übernimmt deinen Bus hier: steh auf (Strg+Umschalt+G) und steig aus - ihr Fahrer kommt."
  fr: "L'IA reprend ton bus ici : lève-toi (Ctrl+Maj+G) et descends - son conducteur arrive."
  nl: "De AI neemt je bus hier over: sta op (Ctrl+Shift+G) en stap uit - haar chauffeur komt eraan."
  pl: "SI przejmuje tu twój autobus: wstań (Ctrl+Shift+G) i wysiądź - jej kierowca już idzie."
  ru: "ИИ принимает твой автобус здесь: встань (Ctrl+Shift+G) и выйди - его водитель уже идёт."
  uk: "ШІ приймає твій автобус тут: встань (Ctrl+Shift+G) і вийди - його водій уже йде."
"The AI cannot take your bus over here: try at another stop.":
  de: "Die KI kann deinen Bus hier nicht übernehmen: versuch es an einer anderen Haltestelle."
  fr: "L'IA ne peut pas reprendre ton bus ici : essaie à un autre arrêt."
  nl: "De AI kan je bus hier niet overnemen: probeer het bij een andere halte."
  pl: "SI nie może tu przejąć twojego autobusu: spróbuj na innym przystanku."
  ru: "ИИ не может принять твой автобус здесь: попробуй на другой остановке."
  uk: "ШІ не може прийняти твій автобус тут: спробуй на іншій зупинці."
"Hand-over called off: you drove off.":
  de: "Übergabe abgebrochen: du bist weggefahren."
  fr: "Remise annulée : tu es reparti."
  nl: "Overdracht afgebroken: je bent weggereden."
  pl: "Przekazanie odwołane: odjechałeś."
  ru: "Передача отменена: ты уехал."
  uk: "Передачу скасовано: ти поїхав."
"Handed over: the AI drives on, and you are free. Leave the server (Esc) to take another trip or duty in the launcher.":
  de: "Übergeben: die KI fährt weiter, und du bist frei. Verlass den Server (Esc), um im Launcher eine andere Fahrt oder einen anderen Dienst zu nehmen."
  fr: "Remis : l'IA continue, et tu es libre. Quitte le serveur (Échap) pour prendre un autre trajet ou service dans le launcher."
  nl: "Overgedragen: de AI rijdt verder, en je bent vrij. Verlaat de server (Esc) om in de launcher een andere rit of dienst te nemen."
  pl: "Przekazano: SI jedzie dalej, a ty jesteś wolny. Opuść serwer (Esc), aby wziąć w launcherze inny kurs lub służbę."
  ru: "Передано: ИИ едет дальше, а ты свободен. Покинь сервер (Esc), чтобы взять в лаунчере другой рейс или смену."
  uk: "Передано: ШІ їде далі, а ти вільний. Залиш сервер (Esc), щоб узяти в лаунчері інший рейс або зміну."
"Your bus is on its way: follow it on the map (game menu › City map).":
  de: "Dein Bus ist unterwegs: verfolge ihn auf der Karte (Spielmenü › Stadtplan)."
  fr: "Ton bus est en route : suis-le sur la carte (menu du jeu › Plan de la ville)."
  nl: "Je bus is onderweg: volg hem op de kaart (spelmenu › Stadskaart)."
  pl: "Twój autobus jest w drodze: śledź go na mapie (menu gry › Mapa miasta)."
  ru: "Твой автобус в пути: следи за ним на карте (меню игры › Карта города)."
  uk: "Твій автобус у дорозі: стеж за ним на мапі (меню гри › Карта міста)."
"Your bus":
  de: "Dein Bus"
  fr: "Ton bus"
  nl: "Je bus"
  pl: "Twój autobus"
  ru: "Твой автобус"
  uk: "Твій автобус"
"%{n} min late":
  de: "%{n} Min. Verspätung"
  fr: "%{n} min de retard"
  nl: "%{n} min te laat"
  pl: "%{n} min spóźnienia"
  ru: "опаздывает на %{n} мин"
  uk: "запізнюється на %{n} хв"
"on its trip before":
  de: "auf seiner Fahrt davor"
  fr: "sur son trajet précédent"
  nl: "op zijn rit ervoor"
  pl: "na poprzednim kursie"
  ru: "на предыдущем рейсе"
  uk: "на попередньому рейсі"
