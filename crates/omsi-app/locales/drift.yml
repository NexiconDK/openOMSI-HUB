  fr: "Aucun de ces bus n'est en leasing."
  nl: "Geen van deze bussen is geleased."
  pl: "Żaden z tych autobusów nie jest w leasingu."
  ru: "Ни один из этих автобусов не в лизинге."
  uk: "Жоден із цих автобусів не в лізингу."
"The head office gave %{bus} back":
  de: "Die Zentrale hat %{bus} zurückgegeben"
  da: "Hovedkontoret har afleveret %{bus}"
  fr: "Le siège a rendu %{bus}"
  nl: "Het hoofdkantoor heeft %{bus} teruggegeven"
  pl: "Centrala zwróciła %{bus}"
  ru: "Головной офис вернул %{bus}"
  uk: "Головний офіс повернув %{bus}"
"By the head office's order the leased bus %{bus} went back to the leasing company early: %{amount}.":
  de: "Auf Anordnung der Zentrale ging der Leasingbus %{bus} früher an die Leasinggesellschaft zurück: %{amount}."
  da: "Efter hovedkontorets ordre er den leasede bus %{bus} afleveret tidligt til leasingselskabet: %{amount}."
  fr: "Sur ordre du siège, le bus en leasing %{bus} a été rendu plus tôt à la société de leasing : %{amount}."
  nl: "Op order van het hoofdkantoor is de leasebus %{bus} vroeg teruggegeven aan de leasemaatschappij: %{amount}."
  pl: "Na polecenie centrali autobus z leasingu %{bus} wrócił wcześniej do firmy leasingowej: %{amount}."
  ru: "По распоряжению головного офиса лизинговый автобус %{bus} досрочно возвращён лизинговой компании: %{amount}."
  uk: "За розпорядженням головного офісу лізинговий автобус %{bus} достроково повернуто лізинговій компанії: %{amount}."
