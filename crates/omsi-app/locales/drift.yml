"The group's leased buses":
  de: "Die Leasingbusse des Konzerns"
  da: "Koncernens leasede busser"
  fr: "Les bus en leasing du groupe"
  nl: "De leasebussen van het concern"
  pl: "Autobusy grupy w leasingu"
  ru: "Лизинговые автобусы группы"
  uk: "Лізингові автобуси групи"
"Tick the leased buses to give back before their lease ends: each costs three monthly rates, paid by its depot, which does the order at its next step.":
  de: "Hake die Leasingbusse an, die vor Ende des Leasings zurückgehen sollen: jeder kostet drei Monatsraten, bezahlt von seinem Betriebshof, der den Auftrag bei seinem nächsten Schritt ausführt."
  da: "Sæt flueben ved de leasede busser, der skal afleveres før leasingen udløber: hver koster tre månedlige rater, betalt af dens depot, som udfører ordren ved sit næste skridt."
  fr: "Coche les bus en leasing à rendre avant la fin du leasing : chacun coûte trois mensualités, payées par son dépôt, qui exécute l'ordre à sa prochaine étape."
  nl: "Vink de leasebussen aan die vóór het einde van de lease terug moeten: elk kost drie maandtermijnen, betaald door zijn stalling, die de order bij zijn volgende stap uitvoert."
  pl: "Zaznacz autobusy z leasingu do zwrotu przed końcem leasingu: każdy kosztuje trzy raty miesięczne, płacone przez jego zajezdnię, która wykona polecenie w następnym kroku."
  ru: "Отметь лизинговые автобусы, которые нужно вернуть до конца лизинга: каждый стоит три месячных платежа, их платит его депо, которое выполнит распоряжение на следующем шаге."
  uk: "Познач лізингові автобуси, які треба повернути до кінця лізингу: кожен коштує три місячні платежі, їх платить його депо, яке виконає розпорядження на наступному кроці."
"No depot has leased buses.":
  de: "Kein Betriebshof hat Leasingbusse."
  da: "Intet depot har leasede busser."
  fr: "Aucun dépôt n'a de bus en leasing."
  nl: "Geen stalling heeft leasebussen."
  pl: "Żadna zajezdnia nie ma autobusów w leasingu."
  ru: "Ни у одного депо нет автобусов в лизинге."
  uk: "Жодне депо не має автобусів у лізингу."
"Only an operations assistant of the company can take a shift.":
  de: "Nur ein Betriebsassistent der Firma kann eine Schicht übernehmen."
  da: "Kun en af firmaets driftsassistenter kan tage en vagt."
  fr: "Seul un assistant d'exploitation de l'entreprise peut prendre un poste."
  nl: "Alleen een bedrijfsassistent van het bedrijf kan een dienst nemen."
  pl: "Tylko asystent ruchu firmy może wziąć zmianę."
  ru: "Только ассистент по эксплуатации компании может взять смену."
  uk: "Лише асистент з експлуатації компанії може взяти зміну."
"There is no such shift.":
  de: "Diese Schicht gibt es nicht."
  da: "Den vagt findes ikke."
  fr: "Ce poste n'existe pas."
  nl: "Die dienst bestaat niet."
  pl: "Nie ma takiej zmiany."
  ru: "Такой смены нет."
  uk: "Такої зміни немає."
"An operations assistant works at most five shifts a week.":
  de: "Ein Betriebsassistent arbeitet höchstens fünf Schichten pro Woche."
  da: "En driftsassistent arbejder højst fem vagter om ugen."
  fr: "Un assistant d'exploitation travaille au plus cinq postes par semaine."
  nl: "Een bedrijfsassistent werkt hoogstens vijf diensten per week."
  pl: "Asystent ruchu pracuje najwyżej pięć zmian w tygodniu."
  ru: "Ассистент по эксплуатации работает не больше пяти смен в неделю."
  uk: "Асистент з експлуатації працює не більше п'яти змін на тиждень."
"Too little rest: an operations assistant needs eleven hours off between two shifts.":
  de: "Zu wenig Ruhe: ein Betriebsassistent braucht elf Stunden frei zwischen zwei Schichten."
  da: "For lidt hvile: en driftsassistent skal have elleve timer fri mellem to vagter."
  fr: "Trop peu de repos : un assistant d'exploitation a besoin de onze heures entre deux postes."
  nl: "Te weinig rust: een bedrijfsassistent heeft elf uur vrij nodig tussen twee diensten."
  pl: "Za mało odpoczynku: asystent ruchu potrzebuje jedenastu godzin wolnego między dwiema zmianami."
  ru: "Слишком мало отдыха: ассистенту по эксплуатации нужно одиннадцать часов между сменами."
  uk: "Замало відпочинку: асистенту з експлуатації потрібно одинадцять годин між змінами."
"Operations assistants work for companies on Bus Company Online: here you run the day yourself.":
  de: "Betriebsassistenten arbeiten für Firmen in Bus Company Online: hier führst du den Tag selbst."
  da: "Driftsassistenter arbejder for firmaer i Bus Company Online: her kører du selv dagen."
  fr: "Les assistants d'exploitation travaillent pour les entreprises de Bus Company Online : ici, tu gères la journée toi-même."
  nl: "Bedrijfsassistenten werken voor bedrijven in Bus Company Online: hier regel je de dag zelf."
  pl: "Asystenci ruchu pracują dla firm w Bus Company Online: tutaj sam prowadzisz dzień."
  ru: "Ассистенты по эксплуатации работают в компаниях Bus Company Online: здесь ты ведёшь день сам."
  uk: "Асистенти з експлуатації працюють у компаніях Bus Company Online: тут ти ведеш день сам."
