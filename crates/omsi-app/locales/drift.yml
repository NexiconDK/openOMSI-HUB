"Every shift of the week to the assistant with the fewest, each keeping to his shift as far as the rules allow.":
  de: "Jede Schicht der Woche an den Assistenten mit den wenigsten, jeder bleibt bei seiner Schicht, soweit die Regeln es erlauben."
  da: "Hver vagt i ugen til den assistent, der har færrest, og hver holder sig til sin vagt, så vidt reglerne tillader det."
  fr: "Chaque poste de la semaine à l'assistant qui en a le moins, chacun gardant son poste autant que les règles le permettent."
  nl: "Elke dienst van de week naar de assistent met de minste, ieder houdt zijn dienst zover de regels het toelaten."
  pl: "Każda zmiana tygodnia dla asystenta, który ma ich najmniej; każdy trzyma się swojej zmiany, na ile pozwalają zasady."
  ru: "Каждая смена недели — ассистенту с наименьшим числом смен, каждый держится своей смены, насколько позволяют правила."
  uk: "Кожна зміна тижня — асистентові з найменшою кількістю змін, кожен тримається своєї зміни, наскільки дозволяють правила."
