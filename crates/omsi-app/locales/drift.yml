  uk: "Сьогодні немає (хворий, у відпустці чи на курсах)"
"%{n} of %{m} shifts a week":
  de: "%{n} von %{m} Schichten pro Woche"
  da: "%{n} af %{m} vagter om ugen"
  fr: "%{n} postes sur %{m} par semaine"
  nl: "%{n} van %{m} diensten per week"
  pl: "%{n} z %{m} zmian w tygodniu"
  ru: "%{n} из %{m} смен в неделю"
  uk: "%{n} з %{m} змін на тиждень"
"An operations assistant runs the day while neither you nor a co-owner or manager is online: he gives the duties of drivers who called in sick to a colleague who can take them, sends the spare bus at once when one breaks down, and sends for an agency driver when nobody of yours can. Give each shift of the week an assistant: at most five shifts each, eleven hours off between two.":
  de: "Ein Betriebsassistent führt den Tag, solange weder du noch ein Mitinhaber oder Manager online ist: er gibt die Dienste krankgemeldeter Fahrer an einen Kollegen, der sie übernehmen kann, schickt bei einer Panne sofort den Reservebus und bestellt einen Leihfahrer, wenn keiner deiner Leute kann. Gib jeder Schicht der Woche einen Assistenten: höchstens fünf Schichten je Person, elf Stunden frei zwischen zwei."
  da: "En driftsassistent kører dagen, mens hverken du eller en medejer eller manager er online: han giver sygemeldte chaufførers vagter til en kollega, der kan tage dem, sender reservebussen med det samme ved et nedbrud og bestiller en vikarchauffør, når ingen af jeres egne kan. Giv hver vagt i ugen en assistent: højst fem vagter hver og elleve timers fri mellem to vagter."
  fr: "Un assistant d'exploitation gère la journée quand ni toi ni un copropriétaire ou un manager n'êtes en ligne : il donne les services des conducteurs malades à un collègue qui peut les prendre, envoie tout de suite le bus de réserve en cas de panne et fait venir un intérimaire quand personne des tiens ne peut. Donne un assistant à chaque poste de la semaine : au plus cinq postes chacun, onze heures de repos entre deux."
  nl: "Een bedrijfsassistent regelt de dag zolang jij noch een mede-eigenaar of manager online is: hij geeft de diensten van zieke chauffeurs aan een collega die ze kan nemen, stuurt bij pech meteen de reservebus en laat een uitzendchauffeur komen als niemand van jullie kan. Geef elke dienst van de week een assistent: hoogstens vijf diensten per persoon, elf uur rust tussen twee."
  pl: "Asystent ruchu prowadzi dzień, gdy ani ty, ani współwłaściciel czy menedżer nie jesteście online: przekazuje służby chorych kierowców koledze, który może je wziąć, od razu wysyła autobus rezerwowy przy awarii i wzywa kierowcę z agencji, gdy nikt z twoich nie może. Przydziel asystenta każdej zmianie tygodnia: najwyżej pięć zmian na osobę, jedenaście godzin wolnego między dwiema."
  ru: "Ассистент по эксплуатации ведёт день, пока ни ты, ни совладелец или менеджер не в сети: он отдаёт смены заболевших водителей коллеге, который может их взять, сразу отправляет резервный автобус при поломке и вызывает водителя из агентства, если никто из твоих не может. Назначь ассистента на каждую смену недели: не больше пяти смен на человека, одиннадцать часов отдыха между сменами."
  uk: "Асистент з експлуатації веде день, поки ні ти, ні співвласник чи менеджер не в мережі: він віддає зміни хворих водіїв колезі, який може їх узяти, одразу відправляє резервний автобус у разі поломки й викликає водія з агентства, якщо ніхто з твоїх не може. Признач асистента на кожну зміну тижня: не більше п'яти змін на людину, одинадцять годин відпочинку між змінами."
