  da: "Fravælg alle"
  fr: "Tout décocher"
  nl: "Niets aanvinken"
  pl: "Odznacz wszystkie"
  ru: "Снять все"
  uk: "Зняти всі"
"Give back the ticked buses":
  de: "Angehakte Busse zurückgeben"
  da: "Aflever de markerede busser"
  fr: "Rendre les bus cochés"
  nl: "Aangevinkte bussen teruggeven"
  pl: "Zwróć zaznaczone autobusy"
  ru: "Вернуть отмеченные автобусы"
  uk: "Повернути позначені автобуси"
"Planned on a tour today: the tour loses its bus when it goes back.":
  de: "Heute auf einem Umlauf geplant: der Umlauf verliert seinen Bus, wenn er zurückgeht."
  da: "Planlagt på en tur i dag: turen mister sin bus, når den afleveres."
  fr: "Prévu sur un service aujourd'hui : le service perd son bus quand il est rendu."
  nl: "Vandaag op een omloop gepland: de omloop verliest zijn bus als hij teruggaat."
  pl: "Zaplanowany dziś na kursie: kurs straci autobus, gdy zostanie zwrócony."
  ru: "Сегодня запланирован на выход: выход останется без автобуса, когда его вернут."
  uk: "Сьогодні запланований на випуск: випуск залишиться без автобуса, коли його повернуть."
"Buses %{list} go back to the leasing company today.":
  de: "Die Busse %{list} gehen heute an die Leasinggesellschaft zurück."
  da: "Busserne %{list} afleveres til leasingselskabet i dag."
  fr: "Les bus %{list} retournent aujourd'hui à la société de leasing."
  nl: "De bussen %{list} gaan vandaag terug naar de leasemaatschappij."
  pl: "Autobusy %{list} wracają dziś do firmy leasingowej."
  ru: "Автобусы %{list} сегодня возвращаются лизинговой компании."
  uk: "Автобуси %{list} сьогодні повертаються лізинговій компанії."
"Giving them back early costs %{amount} (three monthly rates each), and the month's rates up to today %{owed}.":
  de: "Die frühe Rückgabe kostet %{amount} (je drei Monatsraten), dazu die Monatsraten bis heute %{owed}."
  da: "At aflevere dem tidligt koster %{amount} (tre månedlige rater hver), og månedens rater frem til i dag %{owed}."
  fr: "Les rendre plus tôt coûte %{amount} (trois mensualités chacun), plus les mensualités du mois jusqu'à aujourd'hui %{owed}."
  nl: "Ze vroeg teruggeven kost %{amount} (drie maandtermijnen per bus), plus de termijnen van deze maand tot vandaag %{owed}."
  pl: "Wcześniejszy zwrot kosztuje %{amount} (po trzy raty miesięczne), a raty za ten miesiąc do dziś %{owed}."
  ru: "Досрочный возврат стоит %{amount} (по три месячных платежа), плюс платежи за этот месяц до сегодня %{owed}."
  uk: "Дострокове повернення коштує %{amount} (по три місячні платежі), плюс платежі за цей місяць до сьогодні %{owed}."
"From then on the company saves %{amount} a month.":
  de: "Danach spart die Firma %{amount} im Monat."
  da: "Derefter sparer firmaet %{amount} om måneden."
  fr: "Ensuite l'entreprise économise %{amount} par mois."
  nl: "Daarna bespaart het bedrijf %{amount} per maand."
  pl: "Od tej pory firma oszczędza %{amount} miesięcznie."
  ru: "После этого компания экономит %{amount} в месяц."
  uk: "Відтак компанія заощаджує %{amount} на місяць."
