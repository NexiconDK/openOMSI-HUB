  da: "Væk i dag (syg, på ferie eller på kursus)"
  fr: "Absent aujourd'hui (malade, en congé ou en formation)"
  nl: "Vandaag afwezig (ziek, met vakantie of op cursus)"
  pl: "Nieobecny dziś (chory, na urlopie lub na kursie)"
