"No leased buses. A new bus at the dealer can be leased: a rate every month instead of the price now.":
  de: "Keine Leasingbusse. Einen neuen Bus beim Händler kann man leasen: eine Rate jeden Monat statt des Preises jetzt."
  da: "Ingen leasede busser. En ny bus hos forhandleren kan leases: en rate hver måned i stedet for prisen nu."
  fr: "Aucun bus en leasing. Un bus neuf chez le concessionnaire peut être pris en leasing : une mensualité au lieu du prix tout de suite."
  nl: "Geen leasebussen. Een nieuwe bus bij de dealer kan geleased worden: elke maand een termijn in plaats van nu de prijs."
  pl: "Brak autobusów w leasingu. Nowy autobus u dealera można wziąć w leasing: rata co miesiąc zamiast ceny od razu."
  ru: "Нет автобусов в лизинге. Новый автобус у дилера можно взять в лизинг: ежемесячный платёж вместо всей цены сразу."
  uk: "Немає автобусів у лізингу. Новий автобус у дилера можна взяти в лізинг: щомісячний платіж замість усієї ціни одразу."
"Tick the buses you want to give back before their lease ends. Each costs three monthly rates, and the month's rate up to today.":
  de: "Hake die Busse an, die du vor Ende des Leasings zurückgeben willst. Jeder kostet drei Monatsraten und die Monatsrate bis heute."
  da: "Sæt flueben ved de busser, du vil aflevere før leasingen udløber. Hver koster tre månedlige rater og månedens rate frem til i dag."
  fr: "Coche les bus que tu veux rendre avant la fin du leasing. Chacun coûte trois mensualités, plus la mensualité du mois jusqu'à aujourd'hui."
  nl: "Vink de bussen aan die je vóór het einde van de lease wilt teruggeven. Elk kost drie maandtermijnen, plus de termijn van deze maand tot vandaag."
  pl: "Zaznacz autobusy, które chcesz zwrócić przed końcem leasingu. Każdy kosztuje trzy raty miesięczne oraz ratę za ten miesiąc do dziś."
  ru: "Отметь автобусы, которые хочешь вернуть до конца лизинга. Каждый стоит три месячных платежа и платёж за этот месяц до сегодняшнего дня."
  uk: "Познач автобуси, які хочеш повернути до кінця лізингу. Кожен коштує три місячні платежі та платіж за цей місяць до сьогодні."
