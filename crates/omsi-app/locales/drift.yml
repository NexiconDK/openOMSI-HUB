"This duty is over: it ran without a driver and can no longer be given today.":
  de: "Dieser Dienst ist vorbei: Er lief ohne Fahrer und kann heute nicht mehr vergeben werden."
  da: "Denne vagt er forbi: den kørte uden chauffør og kan ikke længere besættes i dag."
  fr: "Ce service est terminé : il s'est déroulé sans conducteur et ne peut plus être attribué aujourd'hui."
  nl: "Deze dienst is voorbij: hij reed zonder chauffeur en kan vandaag niet meer worden toegewezen."
  pl: "Ta służba już się skończyła: odbyła się bez kierowcy i dziś nie można jej już obsadzić."
  ru: "Эта смена уже закончилась: она прошла без водителя, и сегодня её больше нельзя назначить."
  uk: "Ця зміна вже закінчилася: вона пройшла без водія, і сьогодні її більше не можна призначити."
