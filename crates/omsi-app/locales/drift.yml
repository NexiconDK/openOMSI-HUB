  da: "Denne bus er ikke leaset."
  fr: "Ce bus n'est pas en leasing."
  nl: "Deze bus is niet geleased."
  pl: "Ten autobus nie jest w leasingu."
  ru: "Этот автобус не в лизинге."
  uk: "Цей автобус не в лізингу."
