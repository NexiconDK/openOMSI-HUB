  fr: "%{name} est de poste et gère la journée maintenant."
  nl: "%{name} heeft dienst en regelt nu de dag."
  pl: "%{name} jest na zmianie i prowadzi teraz dzień."
  ru: "%{name} на смене и сейчас ведёт день."
  uk: "%{name} на зміні й зараз веде день."
"%{name} is at the desk, but a boss is online: he leaves the day to you.":
  de: "%{name} ist im Dienst, aber ein Chef ist online: er überlässt dir den Tag."
  da: "%{name} er på vagt, men en chef er online: han overlader dagen til jer."
  fr: "%{name} est de poste, mais un chef est en ligne : il te laisse la journée."
  nl: "%{name} heeft dienst, maar er is een baas online: hij laat de dag aan jullie over."
  pl: "%{name} jest na zmianie, ale szef jest online: zostawia dzień tobie."
  ru: "%{name} на смене, но начальник в сети: он оставляет день тебе."
  uk: "%{name} на зміні, але керівник у мережі: він залишає день тобі."
"Nobody is at the desk now: what comes up waits for you (and the duties nobody covers go as the server's rules say).":
  de: "Gerade ist niemand im Dienst: was anfällt, wartet auf dich (und Dienste, die niemand übernimmt, gehen nach den Regeln des Servers)."
  da: "Ingen er på vagt nu: det, der dukker op, venter på dig (og vagter, som ingen dækker, går efter serverens regler)."
  fr: "Personne n'est de poste : ce qui arrive t'attend (et les services que personne ne couvre suivent les règles du serveur)."
  nl: "Er heeft nu niemand dienst: wat er opkomt wacht op jou (en diensten die niemand dekt gaan volgens de regels van de server)."
  pl: "Nikt nie jest teraz na zmianie: to, co się pojawi, czeka na ciebie (a służby bez kierowcy idą według zasad serwera)."
  ru: "Сейчас никто не на смене: всё, что произойдёт, ждёт тебя (а смены без водителя идут по правилам сервера)."
  uk: "Зараз ніхто не на зміні: усе, що станеться, чекає на тебе (а зміни без водія йдуть за правилами сервера)."
"Away today (ill, on holiday or on a course)":
