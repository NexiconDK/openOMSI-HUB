"Snow or a storm: every world of the map takes its weather, the buses run late and fewer ride. A strike: the duties of the company (or every company) do not run. What is dropped then is not fined, nor off the quality bonus - nor paid.":
  de: "Schnee oder Sturm: jede Welt der Karte bekommt dieses Wetter, die Busse verspäten sich und weniger fahren mit. Ein Streik: die Dienste der Firma (oder jeder Firma) fahren nicht. Was dann ausfällt, wird nicht bestraft und nicht vom Qualitätsbonus abgezogen - aber auch nicht bezahlt."
  da: "Sne eller storm: alle verdener på kortet får det vejr, busserne bliver forsinket, og færre kører med. En strejke: firmaets (eller alle firmaers) vagter kører ikke. Det, der udgår, giver ingen bøde og intet fradrag i kvalitetsbonussen - men betales heller ikke."
  fr: "Neige ou tempête : tous les mondes de la carte prennent ce temps, les bus prennent du retard et moins de gens voyagent. Une grève : les services de l'entreprise (ou de toutes) ne roulent pas. Ce qui est supprimé alors n'est pas sanctionné ni retenu sur le bonus qualité - ni payé."
  nl: "Sneeuw of storm: elke wereld van de kaart krijgt dat weer, de bussen lopen vertraging op en er rijden minder mensen mee. Een staking: de diensten van het bedrijf (of elk bedrijf) rijden niet. Wat dan uitvalt, krijgt geen boete en gaat niet van de kwaliteitsbonus af - maar wordt ook niet betaald."
  pl: "Śnieg lub burza: każdy świat mapy dostaje tę pogodę, autobusy się spóźniają i jeździ mniej osób. Strajk: służby firmy (lub każdej firmy) nie jeżdżą. To, co wtedy odpadnie, nie jest karane ani potrącane z premii jakościowej - ale też nie jest płatne."
  ru: "Снег или буря: все миры карты получают эту погоду, автобусы опаздывают, пассажиров меньше. Забастовка: смены компании (или всех компаний) не выходят. Сорванное тогда не штрафуется и не вычитается из премии за качество - но и не оплачивается."
  uk: "Сніг або буря: усі світи карти отримують цю погоду, автобуси запізнюються, пасажирів менше. Страйк: зміни компанії (або всіх компаній) не виходять. Зірване тоді не штрафується й не вираховується з премії за якість - але й не оплачується."
