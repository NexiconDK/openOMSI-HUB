"The AI operators that bid in the server's tenders, on every map. The size says which packages one bids on and how many contracts it holds at once on a map; the style what it puts on its own cost, never under the abnormally low line. One bids only with buses that meet a tender's requirements. Its quality rises a point with each contract run to its term and falls five with each given up. Without a list every map keeps its own drawn operators.":
  de: "Die KI-Betreiber, die in den Ausschreibungen des Servers bieten, auf jeder Karte. Die Größe sagt, auf welche Pakete einer bietet und wie viele Verträge er auf einer Karte zugleich hält; der Stil, was er auf seine eigenen Kosten aufschlägt, nie unter der Grenze für ungewöhnlich niedrige Angebote. Einer bietet nur mit Bussen, die die Anforderungen einer Ausschreibung erfüllen. Seine Qualität steigt um einen Punkt mit jedem bis zum Ende gefahrenen Vertrag und fällt um fünf mit jedem aufgegebenen. Ohne Liste behält jede Karte ihre eigenen gezogenen Betreiber."
  da: "De AI-operatører, der byder i serverens udbud, på alle kort. Størrelsen siger, hvilke pakker en byder på, og hvor mange kontrakter den har på én gang på et kort; stilen, hvad den lægger oven i sin egen kostpris, aldrig under grænsen for unormalt lave bud. En byder kun med busser, der opfylder et udbuds krav. Dens kvalitet stiger et point for hver kontrakt kørt til ende og falder fem for hver opgivet. Uden en liste beholder hvert kort sine egne trukne operatører."
  fr: "Les opérateurs IA qui soumissionnent aux appels d'offres du serveur, sur chaque carte. La taille dit sur quels lots l'un soumissionne et combien de contrats il détient à la fois sur une carte ; le style ce qu'il ajoute à son propre coût, jamais sous le seuil des offres anormalement basses. Un opérateur ne soumissionne qu'avec des bus conformes aux exigences de l'appel d'offres. Sa qualité monte d'un point par contrat mené à son terme et baisse de cinq par contrat abandonné. Sans liste, chaque carte garde ses propres opérateurs tirés au sort."
  nl: "De AI-vervoerders die op elke kaart in de aanbestedingen van de server bieden. De grootte zegt op welke pakketten er een biedt en hoeveel contracten hij tegelijk op een kaart heeft; de stijl wat hij op zijn eigen kosten zet, nooit onder de grens voor abnormaal lage biedingen. Een vervoerder biedt alleen met bussen die aan de eisen van een aanbesteding voldoen. Zijn kwaliteit stijgt een punt per contract dat tot het einde is gereden en daalt vijf per opgegeven contract. Zonder lijst houdt elke kaart haar eigen getrokken vervoerders."
  pl: "Operatorzy AI, którzy składają oferty w przetargach serwera, na każdej mapie. Wielkość mówi, na które pakiety ktoś składa oferty i ile umów ma jednocześnie na mapie; styl — ile dolicza do własnych kosztów, nigdy poniżej progu rażąco niskiej ceny. Operator składa ofertę tylko autobusami spełniającymi wymagania przetargu. Jego jakość rośnie o punkt za każdą umowę doprowadzoną do końca i spada o pięć za każdą porzuconą. Bez listy każda mapa zachowuje swoich wylosowanych operatorów."
  ru: "ИИ-перевозчики, которые подают ставки в тендерах сервера на каждой карте. Размер определяет, на какие пакеты он претендует и сколько контрактов держит одновременно на карте; стиль — какую наценку он делает на свою себестоимость, никогда не ниже порога аномально низкой цены. Он подаёт ставку только с автобусами, отвечающими требованиям тендера. Его качество растёт на балл за каждый доведённый до конца контракт и падает на пять за каждый брошенный. Без списка каждая карта сохраняет своих случайных перевозчиков."
  uk: "ШІ-перевізники, які подають ставки в тендерах сервера на кожній карті. Розмір визначає, на які пакети він претендує і скільки контрактів тримає одночасно на карті; стиль — яку націнку він робить на свою собівартість, ніколи не нижче порогу аномально низької ціни. Він подає ставку лише з автобусами, що відповідають вимогам тендера. Його якість зростає на бал за кожен доведений до кінця контракт і падає на п'ять за кожен покинутий. Без списку кожна карта зберігає своїх випадкових перевізників."
