"The line goes to the company without bidding, at your price a timetable hour; its open tender ends so. A line an operator runs: end its term first (below).":
  de: "Die Linie geht ohne Gebote an die Firma, zu Ihrem Preis je Fahrplanstunde; ihre offene Ausschreibung endet damit. Eine Linie, die ein Betreiber fährt: zuerst seine Laufzeit beenden (unten)."
  da: "Linjen går til firmaet uden bud, til din pris pr. køreplantime; dens åbne udbud slutter dermed. En linje, som en operatør kører: afslut først dens periode (nedenfor)."
  fr: "La ligne va à l'entreprise sans appel d'offres, à votre prix par heure d'horaire ; son appel d'offres ouvert se termine ainsi. Une ligne qu'un opérateur exploite : terminez d'abord son contrat (ci-dessous)."
  nl: "De lijn gaat zonder biedingen naar het bedrijf, tegen uw prijs per dienstregelingsuur; haar open aanbesteding eindigt daarmee. Een lijn die een vervoerder rijdt: beëindig eerst zijn looptijd (hieronder)."
  pl: "Linia trafia do firmy bez przetargu, po twojej cenie za godzinę rozkładową; jej otwarty przetarg się kończy. Linia, którą obsługuje przewoźnik: najpierw zakończ jego umowę (poniżej)."
  ru: "Линия переходит к компании без торгов, по вашей цене за час по расписанию; её открытый тендер на этом заканчивается. Линия оператора: сначала завершите его срок (ниже)."
  uk: "Лінія переходить до компанії без торгів, за вашою ціною за годину за розкладом; її відкритий тендер на цьому завершується. Лінія оператора: спершу завершіть його строк (нижче)."
