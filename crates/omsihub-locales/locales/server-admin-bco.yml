"The stops between the two close (OMSI drives the map's roads: no road round it). A journey of the line is not fined for being late by the minutes, and is paid them on top.":
  de: "Die Haltestellen dazwischen sind gesperrt (OMSI fährt die Straßen der Karte: kein Umweg). Eine Fahrt der Linie wird für eine Verspätung um diese Minuten nicht bestraft und bekommt sie extra bezahlt."
  da: "Stoppestederne imellem lukkes (OMSI kører kortets veje: ingen vej udenom). En tur på linjen får ikke bøde for at være forsinket med minutterne og får dem betalt oveni."
  fr: "Les arrêts entre les deux ferment (OMSI suit les routes de la carte : pas de déviation). Une course de la ligne n'est pas pénalisée pour ce retard et ces minutes lui sont payées en plus."
  nl: "De haltes ertussen sluiten (OMSI rijdt de wegen van de kaart: geen omleiding). Een rit van de lijn krijgt geen boete voor die minuten vertraging en krijgt ze extra betaald."
  pl: "Przystanki pomiędzy są zamknięte (OMSI jeździ drogami mapy: bez objazdu). Kurs linii nie dostaje kary za spóźnienie o te minuty i dostaje je dodatkowo zapłacone."
  ru: "Остановки между ними закрыты (OMSI ездит по дорогам карты: объезда нет). Рейс маршрута не штрафуется за опоздание на эти минуты и получает их оплату сверху."
  uk: "Зупинки між ними закрито (OMSI їздить дорогами карти: об'їзду немає). Рейс маршруту не штрафують за запізнення на ці хвилини, і їх оплачують зверху."
