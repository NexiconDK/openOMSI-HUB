"A timetable of the map's for rail replacement, run on your days: bids for a day at your fixed price a timetable hour - the quality decides - or given to a company directly.":
  de: "Ein Fahrplan der Karte für Schienenersatzverkehr, an deinen Tagen gefahren: Gebote einen Tag lang zu deinem festen Preis je Fahrplanstunde - die Qualität entscheidet - oder direkt an eine Firma vergeben."
  da: "En af kortets køreplaner for togbusser, kørt på dine dage: bud i en dag til din faste pris pr. køreplantime - kvaliteten afgør det - eller givet direkte til et firma."
  fr: "Un horaire de la carte pour des bus de remplacement, exploité les jours choisis : offres pendant un jour à votre prix fixe par heure d'horaire - la qualité décide - ou attribué directement à une entreprise."
  nl: "Een dienstregeling van de kaart voor treinvervangend vervoer, op jouw dagen gereden: biedingen een dag lang tegen je vaste prijs per dienstregelingsuur - de kwaliteit beslist - of direct aan een bedrijf gegeven."
  pl: "Rozkład mapy dla komunikacji zastępczej, kursujący w twoje dni: oferty przez jeden dzień po twojej stałej cenie za godzinę rozkładową - decyduje jakość - lub przyznany bezpośrednio firmie."
  ru: "Расписание карты для замены поездов, в ваши дни: ставки один день по вашей фиксированной цене за час - решает качество - или напрямую компании."
  uk: "Розклад мапи для заміни поїздів, у ваші дні: ставки один день за вашою фіксованою ціною за годину - вирішує якість - або напряму компанії."
