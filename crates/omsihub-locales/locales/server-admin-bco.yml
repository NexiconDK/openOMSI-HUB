"The floor, fuel and size of every installed bus as the server takes them: the game guesses them from the bus's files and name, you correct them here. The tenders' requirements, the vehicle points and the authority's fines go by them; the companies take a change at their next step.":
  de: "Boden, Antrieb und Größe jedes installierten Busses, wie der Server sie nimmt: das Spiel schätzt sie aus den Dateien und dem Namen des Busses, hier korrigierst du sie. Danach richten sich die Anforderungen der Ausschreibungen, die Fahrzeugpunkte und die Strafen des Aufgabenträgers; die Firmen übernehmen eine Änderung bei ihrem nächsten Schritt."
  da: "Gulv, drivmiddel og størrelse for hver installeret bus, som serveren regner med dem: spillet gætter dem ud fra bussens filer og navn, og du retter dem her. Udbuddenes krav, materielpointene og trafikselskabets bøder går efter dem; firmaerne tager en ændring ved deres næste skridt."
  fr: "Le plancher, le carburant et la taille de chaque bus installé tels que le serveur les prend : le jeu les devine d'après les fichiers et le nom du bus, vous les corrigez ici. Les exigences des appels d'offres, les points véhicules et les amendes de l'autorité en dépendent ; les entreprises prennent un changement à leur prochaine étape."
  nl: "Vloer, brandstof en grootte van elke geïnstalleerde bus zoals de server ze neemt: het spel raadt ze uit de bestanden en naam van de bus, jij corrigeert ze hier. De eisen van de aanbestedingen, de voertuigpunten en de boetes van de opdrachtgever gaan erop af; de bedrijven nemen een wijziging bij hun volgende stap."
  pl: "Podłoga, paliwo i wielkość każdego zainstalowanego autobusu, tak jak przyjmuje je serwer: gra zgaduje je z plików i nazwy autobusu, ty je tu poprawiasz. Według nich idą wymagania przetargów, punkty za pojazdy i kary organizatora; firmy przyjmują zmianę w swoim następnym kroku."
  ru: "Пол, топливо и размер каждого установленного автобуса, как их берёт сервер: игра угадывает их по файлам и названию автобуса, а вы исправляете их здесь. По ним идут требования тендеров, баллы за автобусы и штрафы заказчика; компании принимают изменение на следующем шаге."
  uk: "Підлога, паливо й розмір кожного встановленого автобуса, як їх бере сервер: гра вгадує їх за файлами й назвою автобуса, а ви виправляєте їх тут. За ними йдуть вимоги тендерів, бали за автобуси й штрафи замовника; компанії беруть зміну на наступному кроці."
