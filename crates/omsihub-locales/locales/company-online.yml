"Found a company on the server":
  de: "Einen Betrieb auf dem Server gründen"
  fr: "Fonder une entreprise sur le serveur"
  nl: "Een bedrijf op de server oprichten"
  pl: "Załóż firmę na serwerze"
  ru: "Основать компанию на сервере"
  uk: "Заснувати компанію на сервері"
"The company stays on its map for good. You are its owner, with every permission.":
  de: "Der Betrieb bleibt für immer auf seiner Karte. Du bist sein Besitzer, mit allen Rechten."
  fr: "L'entreprise reste sur sa carte pour toujours. Vous en êtes le propriétaire, avec toutes les autorisations."
  nl: "Het bedrijf blijft voorgoed op zijn kaart. Jij bent de eigenaar, met alle rechten."
  pl: "Firma zostaje na swojej mapie na zawsze. Jesteś jej właścicielem, ze wszystkimi uprawnieniami."
  ru: "Компания навсегда остаётся на своей карте. Вы её владелец со всеми правами."
  uk: "Компанія назавжди залишається на своїй мапі. Ви її власник з усіма правами."
"Founding costs %{price} of your own money: you have %{money}.":
  de: "Die Gründung kostet %{price} deines eigenen Geldes: du hast %{money}."
  fr: "La fondation coûte %{price} de votre propre argent : vous avez %{money}."
  nl: "Oprichten kost %{price} van je eigen geld: je hebt %{money}."
  pl: "Założenie kosztuje %{price} twoich własnych pieniędzy: masz %{money}."
  ru: "Основание стоит %{price} ваших собственных денег: у вас %{money}."
  uk: "Заснування коштує %{price} ваших власних грошей: у вас %{money}."
"Found":
  de: "Gründen"
  fr: "Fonder"
  nl: "Oprichten"
  pl: "Załóż"
  ru: "Основать"
  uk: "Заснувати"
"%{name} is founded: join it to run it.":
  de: "%{name} ist gegründet: tritt bei, um ihn zu führen."
  fr: "%{name} est fondée : rejoignez-la pour la diriger."
  nl: "%{name} is opgericht: doe mee om het te leiden."
  pl: "%{name} została założona: dołącz, aby nią kierować."
  ru: "%{name} основана: присоединитесь, чтобы управлять ею."
  uk: "%{name} засновано: приєднайтеся, щоб керувати нею."
"%{lines} lines · %{buses} buses · %{staff} staff · %{players} players":
  de: "%{lines} Linien · %{buses} Busse · %{staff} Mitarbeiter · %{players} Spieler"
  fr: "%{lines} lignes · %{buses} bus · %{staff} employés · %{players} joueurs"
  nl: "%{lines} lijnen · %{buses} bussen · %{staff} medewerkers · %{players} spelers"
  pl: "linie: %{lines} · autobusy: %{buses} · pracownicy: %{staff} · gracze: %{players}"
  ru: "линий: %{lines} · автобусов: %{buses} · сотрудников: %{staff} · игроков: %{players}"
  uk: "ліній: %{lines} · автобусів: %{buses} · працівників: %{staff} · гравців: %{players}"
"Starting on the server…":
  de: "Startet auf dem Server…"
  fr: "Démarrage sur le serveur…"
  nl: "Start op de server…"
  pl: "Uruchamia się na serwerze…"
  ru: "Запускается на сервере…"
  uk: "Запускається на сервері…"
"The server's code is no longer valid: ask the server's owner for its code.":
  de: "Der Code des Servers ist nicht mehr gültig: frag den Besitzer des Servers nach seinem Code."
  fr: "Le code du serveur n'est plus valable : demandez son code au propriétaire du serveur."
  nl: "De code van de server is niet meer geldig: vraag de eigenaar van de server om de code."
  pl: "Kod serwera jest już nieważny: poproś właściciela serwera o jego kod."
  ru: "Код сервера больше не действителен: попросите код у владельца сервера."
  uk: "Код сервера більше не дійсний: попросіть код у власника сервера."
"The server runs another version of Omsi-Hub: both need the same version.":
  de: "Der Server läuft mit einer anderen Version von Omsi-Hub: beide brauchen dieselbe Version."
  fr: "Le serveur utilise une autre version d'Omsi-Hub : les deux doivent avoir la même version."
  nl: "De server draait een andere versie van Omsi-Hub: beide hebben dezelfde versie nodig."
  pl: "Serwer działa na innej wersji Omsi-Hub: obie strony potrzebują tej samej wersji."
  ru: "На сервере другая версия Omsi-Hub: нужна одна и та же версия."
  uk: "На сервері інша версія Omsi-Hub: потрібна та сама версія."
"The server did not understand that: both need the same version of Omsi-Hub.":
  de: "Der Server hat das nicht verstanden: beide brauchen dieselbe Version von Omsi-Hub."
  fr: "Le serveur n'a pas compris : les deux doivent avoir la même version d'Omsi-Hub."
  nl: "De server begreep dat niet: beide hebben dezelfde versie van Omsi-Hub nodig."
  pl: "Serwer tego nie zrozumiał: obie strony potrzebują tej samej wersji Omsi-Hub."
  ru: "Сервер не понял запрос: нужна одна и та же версия Omsi-Hub."
  uk: "Сервер не зрозумів запит: потрібна та сама версія Omsi-Hub."
"Your login on the server has run out: log in again.":
  de: "Deine Anmeldung auf dem Server ist abgelaufen: melde dich erneut an."
  fr: "Votre connexion au serveur a expiré : reconnectez-vous."
  nl: "Je login op de server is verlopen: log opnieuw in."
  pl: "Twoje logowanie na serwerze wygasło: zaloguj się ponownie."
  ru: "Срок вашего входа на сервер истёк: войдите снова."
  uk: "Термін вашого входу на сервер сплив: увійдіть знову."
"The server has no such company.":
  de: "Der Server hat keinen solchen Betrieb."
  fr: "Le serveur n'a pas cette entreprise."
  nl: "De server heeft zo'n bedrijf niet."
  pl: "Serwer nie ma takiej firmy."
  ru: "На сервере нет такой компании."
  uk: "На сервері немає такої компанії."
"The company is starting on the server: try again in a moment.":
  de: "Der Betrieb startet auf dem Server: versuch es gleich noch einmal."
  fr: "L'entreprise démarre sur le serveur : réessayez dans un instant."
  nl: "Het bedrijf start op de server: probeer het zo nog eens."
  pl: "Firma uruchamia się na serwerze: spróbuj ponownie za chwilę."
  ru: "Компания запускается на сервере: попробуйте снова через минуту."
  uk: "Компанія запускається на сервері: спробуйте ще раз за мить."
"That map is not installed on the server.":
  de: "Diese Karte ist auf dem Server nicht installiert."
  fr: "Cette carte n'est pas installée sur le serveur."
  nl: "Die kaart is niet op de server geïnstalleerd."
  pl: "Ta mapa nie jest zainstalowana na serwerze."
  ru: "Эта карта не установлена на сервере."
  uk: "Ця мапа не встановлена на сервері."
"That is no game mode.":
  de: "Das ist kein Spielmodus."
  fr: "Ce n'est pas un mode de jeu."
  nl: "Dat is geen spelmodus."
  pl: "To nie jest tryb gry."
  ru: "Это не режим игры."
  uk: "Це не режим гри."
"Founding a company costs %{price}: you have %{money}.":
  de: "Die Gründung eines Betriebs kostet %{price}: du hast %{money}."
  fr: "Fonder une entreprise coûte %{price} : vous avez %{money}."
  nl: "Een bedrijf oprichten kost %{price}: je hebt %{money}."
  pl: "Założenie firmy kosztuje %{price}: masz %{money}."
  ru: "Основание компании стоит %{price}: у вас %{money}."
  uk: "Заснування компанії коштує %{price}: у вас %{money}."
"The server could not found the company: it says why in its log.":
  de: "Der Server konnte den Betrieb nicht gründen: sein Protokoll sagt, warum."
  fr: "Le serveur n'a pas pu fonder l'entreprise : son journal indique pourquoi."
  nl: "De server kon het bedrijf niet oprichten: zijn logboek zegt waarom."
  pl: "Serwer nie mógł założyć firmy: jego dziennik mówi dlaczego."
  ru: "Сервер не смог основать компанию: причина в его журнале."
  uk: "Сервер не зміг заснувати компанію: причина в його журналі."
"The server does not answer. Is it running? Over the internet its tunnel must be up (tunnel = 1), or its port open.":
  de: "Der Server antwortet nicht. Läuft er? Über das Internet muss sein Tunnel aktiv sein (tunnel = 1) oder sein Port offen."
  fr: "Le serveur ne répond pas. Est-il démarré ? Par Internet, son tunnel doit être actif (tunnel = 1) ou son port ouvert."
  nl: "De server antwoordt niet. Draait hij? Via internet moet zijn tunnel actief zijn (tunnel = 1) of zijn poort open."
  pl: "Serwer nie odpowiada. Czy działa? Przez internet jego tunel musi działać (tunnel = 1) albo port musi być otwarty."
  ru: "Сервер не отвечает. Он запущен? Через интернет должен работать его туннель (tunnel = 1) или быть открыт порт."
  uk: "Сервер не відповідає. Він запущений? Через інтернет має працювати його тунель (tunnel = 1) або бути відкритий порт."
"Sign in with your Omsi-Hub account in the launcher, or start Steam, to log in to the server.":
  de: "Melde dich im Launcher mit deinem Omsi-Hub-Konto an oder starte Steam, um dich auf dem Server anzumelden."
  fr: "Connectez-vous avec votre compte Omsi-Hub dans le lanceur, ou démarrez Steam, pour vous connecter au serveur."
  nl: "Meld je in de launcher aan met je Omsi-Hub-account, of start Steam, om op de server in te loggen."
  pl: "Zaloguj się kontem Omsi-Hub w launcherze albo uruchom Steam, aby zalogować się na serwer."
  ru: "Войдите в лаунчере с аккаунтом Omsi-Hub или запустите Steam, чтобы войти на сервер."
  uk: "Увійдіть у лаунчері з обліковим записом Omsi-Hub або запустіть Steam, щоб увійти на сервер."
"This Steam account was used on the server from another computer. Sign in with your Omsi-Hub account here once to add this computer.":
  de: "Dieses Steam-Konto wurde auf dem Server von einem anderen Computer aus benutzt. Melde dich hier einmal mit deinem Omsi-Hub-Konto an, um diesen Computer hinzuzufügen."
  fr: "Ce compte Steam a été utilisé sur le serveur depuis un autre ordinateur. Connectez-vous une fois ici avec votre compte Omsi-Hub pour ajouter cet ordinateur."
  nl: "Dit Steam-account is op de server vanaf een andere computer gebruikt. Meld je hier één keer aan met je Omsi-Hub-account om deze computer toe te voegen."
  pl: "To konto Steam było używane na serwerze z innego komputera. Zaloguj się tu raz kontem Omsi-Hub, aby dodać ten komputer."
  ru: "Этот аккаунт Steam использовался на сервере с другого компьютера. Войдите здесь один раз с аккаунтом Omsi-Hub, чтобы добавить этот компьютер."
  uk: "Цей обліковий запис Steam використовувався на сервері з іншого комп'ютера. Увійдіть тут один раз з обліковим записом Omsi-Hub, щоб додати цей комп'ютер."
"Your Steam account belongs to another player on this server: it was not added to yours.":
  de: "Dein Steam-Konto gehört auf diesem Server einem anderen Spieler: es wurde nicht zu deinem hinzugefügt."
  fr: "Votre compte Steam appartient à un autre joueur sur ce serveur : il n'a pas été ajouté au vôtre."
  nl: "Je Steam-account hoort op deze server bij een andere speler: het is niet aan het jouwe toegevoegd."
  pl: "Twoje konto Steam należy na tym serwerze do innego gracza: nie zostało dodane do twojego."
  ru: "Ваш аккаунт Steam принадлежит на этом сервере другому игроку: он не добавлен к вашему."
  uk: "Ваш обліковий запис Steam належить на цьому сервері іншому гравцеві: його не додано до вашого."
"Your player on this server has another Steam account: this one was not added.":
  de: "Dein Spieler auf diesem Server hat ein anderes Steam-Konto: dieses wurde nicht hinzugefügt."
  fr: "Votre joueur sur ce serveur a un autre compte Steam : celui-ci n'a pas été ajouté."
  nl: "Je speler op deze server heeft een ander Steam-account: dit is niet toegevoegd."
  pl: "Twój gracz na tym serwerze ma inne konto Steam: to nie zostało dodane."
  ru: "У вашего игрока на этом сервере другой аккаунт Steam: этот не добавлен."
  uk: "Ваш гравець на цьому сервері має інший обліковий запис Steam: цей не додано."
"The server did not accept your Omsi-Hub account: sign in again in the launcher.":
  de: "Der Server hat dein Omsi-Hub-Konto nicht angenommen: melde dich im Launcher erneut an."
  fr: "Le serveur n'a pas accepté votre compte Omsi-Hub : reconnectez-vous dans le lanceur."
  nl: "De server heeft je Omsi-Hub-account niet geaccepteerd: meld je opnieuw aan in de launcher."
  pl: "Serwer nie przyjął twojego konta Omsi-Hub: zaloguj się ponownie w launcherze."
  ru: "Сервер не принял ваш аккаунт Omsi-Hub: войдите снова в лаунчере."
  uk: "Сервер не прийняв ваш обліковий запис Omsi-Hub: увійдіть знову в лаунчері."
"The server could not reach Omsi-Hub online to check your account: try again in a moment.":
  de: "Der Server konnte Omsi-Hub online nicht erreichen, um dein Konto zu prüfen: versuch es gleich noch einmal."
  fr: "Le serveur n'a pas pu joindre Omsi-Hub en ligne pour vérifier votre compte : réessayez dans un instant."
  nl: "De server kon Omsi-Hub online niet bereiken om je account te controleren: probeer het zo nog eens."
  pl: "Serwer nie mógł połączyć się z Omsi-Hub online, aby sprawdzić twoje konto: spróbuj ponownie za chwilę."
  ru: "Серверу не удалось связаться с Omsi-Hub online для проверки аккаунта: попробуйте снова через минуту."
  uk: "Серверу не вдалося зв'язатися з Omsi-Hub online для перевірки облікового запису: спробуйте ще раз за мить."
"This server takes no Omsi-Hub accounts: start Steam to log in.":
  de: "Dieser Server nimmt keine Omsi-Hub-Konten an: starte Steam, um dich anzumelden."
  fr: "Ce serveur n'accepte pas les comptes Omsi-Hub : démarrez Steam pour vous connecter."
  nl: "Deze server neemt geen Omsi-Hub-accounts aan: start Steam om in te loggen."
  pl: "Ten serwer nie przyjmuje kont Omsi-Hub: uruchom Steam, aby się zalogować."
  ru: "Этот сервер не принимает аккаунты Omsi-Hub: запустите Steam, чтобы войти."
  uk: "Цей сервер не приймає облікові записи Omsi-Hub: запустіть Steam, щоб увійти."
"This server takes no Steam logins: sign in with your Omsi-Hub account in the launcher.":
  de: "Dieser Server nimmt keine Steam-Anmeldungen an: melde dich im Launcher mit deinem Omsi-Hub-Konto an."
  fr: "Ce serveur n'accepte pas les connexions Steam : connectez-vous avec votre compte Omsi-Hub dans le lanceur."
  nl: "Deze server neemt geen Steam-logins aan: meld je in de launcher aan met je Omsi-Hub-account."
  pl: "Ten serwer nie przyjmuje logowania przez Steam: zaloguj się kontem Omsi-Hub w launcherze."
  ru: "Этот сервер не принимает вход через Steam: войдите в лаунчере с аккаунтом Omsi-Hub."
  uk: "Цей сервер не приймає вхід через Steam: увійдіть у лаунчері з обліковим записом Omsi-Hub."
"This is not a Bus Company Online server's code. Ask the server's owner for its code (HUB-…): his main server shows it.":
  de: "Das ist kein Code eines Bus-Company-Online-Servers. Frag den Besitzer des Servers nach seinem Code (HUB-…): sein Hauptserver zeigt ihn an."
  fr: "Ce n'est pas le code d'un serveur Bus Company Online. Demandez son code au propriétaire du serveur (HUB-…) : son serveur principal l'affiche."
  nl: "Dit is geen code van een Bus Company Online-server. Vraag de eigenaar van de server om de code (HUB-…): zijn hoofdserver toont hem."
  pl: "To nie jest kod serwera Bus Company Online. Poproś właściciela serwera o jego kod (HUB-…): pokazuje go jego serwer główny."
  ru: "Это не код сервера Bus Company Online. Попросите код у владельца сервера (HUB-…): его показывает главный сервер."
  uk: "Це не код сервера Bus Company Online. Попросіть код у власника сервера (HUB-…): його показує головний сервер."
"Enter the server's code first.":
  de: "Gib zuerst den Code des Servers ein."
  fr: "Saisissez d'abord le code du serveur."
  nl: "Voer eerst de code van de server in."
  pl: "Najpierw wpisz kod serwera."
  ru: "Сначала введите код сервера."
  uk: "Спочатку введіть код сервера."
"This is the code of a Bus Company Online server: open Bus Company Online at the start of the bus company and enter it there.":
  de: "Das ist der Code eines Bus-Company-Online-Servers: öffne Bus Company Online am Start des Busbetriebs und gib ihn dort ein."
  fr: "C'est le code d'un serveur Bus Company Online : ouvrez Bus Company Online au démarrage de l'entreprise de bus et saisissez-le là."
  nl: "Dit is de code van een Bus Company Online-server: open Bus Company Online bij de start van het busbedrijf en voer hem daar in."
  pl: "To kod serwera Bus Company Online: otwórz Bus Company Online na starcie firmy autobusowej i wpisz go tam."
  ru: "Это код сервера Bus Company Online: откройте Bus Company Online в начале автобусной компании и введите его там."
  uk: "Це код сервера Bus Company Online: відкрийте Bus Company Online на старті автобусної компанії та введіть його там."
"This company is on a Bus Company Online server: join it from the server's list in your launcher (Bus Company Online).":
  de: "Dieser Betrieb ist auf einem Bus-Company-Online-Server: tritt ihm über die Liste des Servers in deinem Launcher bei (Bus Company Online)."
  fr: "Cette entreprise est sur un serveur Bus Company Online : rejoignez-la depuis la liste du serveur dans votre lanceur (Bus Company Online)."
  nl: "Dit bedrijf staat op een Bus Company Online-server: doe mee via de lijst van de server in je launcher (Bus Company Online)."
  pl: "Ta firma jest na serwerze Bus Company Online: dołącz do niej z listy serwera w swoim launcherze (Bus Company Online)."
  ru: "Эта компания на сервере Bus Company Online: присоединяйтесь к ней из списка сервера в вашем лаунчере (Bus Company Online)."
  uk: "Ця компанія на сервері Bus Company Online: приєднайтеся до неї зі списку сервера у вашому лаунчері (Bus Company Online)."
"On the Bus Company Online server the server's clock runs the company, in real time for everybody: it cannot be changed here.":
  de: "Auf dem Bus-Company-Online-Server führt die Uhr des Servers den Betrieb, in Echtzeit für alle: sie kann hier nicht geändert werden."
  fr: "Sur le serveur Bus Company Online, l'horloge du serveur fait tourner l'entreprise, en temps réel pour tous : elle ne peut pas être modifiée ici."
  nl: "Op de Bus Company Online-server laat de klok van de server het bedrijf lopen, in realtime voor iedereen: die kan hier niet worden gewijzigd."
  pl: "Na serwerze Bus Company Online firmą kieruje zegar serwera, w czasie rzeczywistym dla wszystkich: nie można go tu zmienić."
  ru: "На сервере Bus Company Online компанией управляют часы сервера, в реальном времени для всех: здесь их изменить нельзя."
  uk: "На сервері Bus Company Online компанією керує годинник сервера, у реальному часі для всіх: тут його змінити не можна."
"Founded the company on the server: every permission, for good.":
  de: "Hat den Betrieb auf dem Server gegründet: alle Rechte, für immer."
  fr: "A fondé l'entreprise sur le serveur : toutes les autorisations, pour toujours."
  nl: "Heeft het bedrijf op de server opgericht: alle rechten, voorgoed."
  pl: "Założył firmę na serwerze: wszystkie uprawnienia, na stałe."
  ru: "Основал компанию на сервере: все права, навсегда."
  uk: "Заснував компанію на сервері: усі права, назавжди."
"The server's clock":
  de: "Die Uhr des Servers"
  fr: "L'horloge du serveur"
  nl: "De klok van de server"
  pl: "Zegar serwera"
  ru: "Часы сервера"
  uk: "Годинник сервера"
"You are not a player of this company: join it first.":
  de: "Du bist kein Spieler dieses Betriebs: tritt ihm zuerst bei."
  fr: "Vous n'êtes pas joueur de cette entreprise : rejoignez-la d'abord."
  nl: "Je bent geen speler van dit bedrijf: doe eerst mee."
  pl: "Nie jesteś graczem tej firmy: najpierw do niej dołącz."
  ru: "Вы не игрок этой компании: сначала присоединитесь к ней."
  uk: "Ви не гравець цієї компанії: спочатку приєднайтеся до неї."
"The server could not start the map's world: it says why in its log.":
  de: "Der Server konnte die Welt der Karte nicht starten: sein Protokoll sagt, warum."
  fr: "Le serveur n'a pas pu démarrer le monde de la carte : son journal indique pourquoi."
  nl: "De server kon de wereld van de kaart niet starten: zijn logboek zegt waarom."
  pl: "Serwer nie mógł uruchomić świata mapy: jego dziennik mówi dlaczego."
  ru: "Сервер не смог запустить мир карты: причина в его журнале."
  uk: "Сервер не зміг запустити світ мапи: причина в його журналі."
"The map's world has no way in over the internet yet: its tunnel is starting.":
  de: "Die Welt der Karte ist über das Internet noch nicht erreichbar: ihr Tunnel startet."
  fr: "Le monde de la carte n'est pas encore accessible par Internet : son tunnel démarre."
  nl: "De wereld van de kaart is via internet nog niet bereikbaar: haar tunnel start."
  pl: "Świat mapy nie jest jeszcze dostępny przez internet: jego tunel się uruchamia."
  ru: "Мир карты пока недоступен через интернет: его туннель запускается."
  uk: "Світ мапи ще недоступний через інтернет: його тунель запускається."
"Starting the world of %{map} on the server… (about a minute)":
  de: "Die Welt von %{map} startet auf dem Server… (etwa eine Minute)"
  fr: "Démarrage du monde de %{map} sur le serveur… (environ une minute)"
  nl: "De wereld van %{map} start op de server… (ongeveer een minuut)"
  pl: "Uruchamianie świata %{map} na serwerze… (około minuty)"
  ru: "Запуск мира %{map} на сервере… (около минуты)"
  uk: "Запуск світу %{map} на сервері… (близько хвилини)"
"The company's share":
  de: "Der Anteil des Betriebs"
  fr: "La part de l'entreprise"
  nl: "Het aandeel van het bedrijf"
  pl: "Udział firmy"
  ru: "Доля компании"
  uk: "Частка компанії"
"The company keeps %{share} % of what a trip of its players brings in; the rest is the driver's pay, into his money on the server.":
  de: "Der Betrieb behält %{share} % dessen, was eine Fahrt seiner Spieler einbringt; der Rest ist der Lohn des Fahrers, auf sein Geld auf dem Server."
  fr: "L'entreprise garde %{share} % de ce que rapporte un trajet de ses joueurs ; le reste est la paie du conducteur, versée sur son argent sur le serveur."
  nl: "Het bedrijf houdt %{share} % van wat een rit van zijn spelers opbrengt; de rest is het loon van de chauffeur, op zijn geld op de server."
  pl: "Firma zatrzymuje %{share} % tego, co przynosi kurs jej graczy; reszta to wynagrodzenie kierowcy, na jego pieniądze na serwerze."
  ru: "Компания оставляет себе %{share} % от того, что приносит рейс её игроков; остальное — оплата водителя, на его деньги на сервере."
  uk: "Компанія залишає собі %{share} % від того, що приносить рейс її гравців; решта — оплата водія, на його гроші на сервері."
"From tomorrow: %{share} %":
  de: "Ab morgen: %{share} %"
  fr: "À partir de demain : %{share} %"
  nl: "Vanaf morgen: %{share} %"
  pl: "Od jutra: %{share} %"
  ru: "С завтрашнего дня: %{share} %"
  uk: "З завтрашнього дня: %{share} %"
"From tomorrow the company keeps %{share} % of its players' trips.":
  de: "Ab morgen behält der Betrieb %{share} % der Fahrten seiner Spieler."
  fr: "À partir de demain, l'entreprise garde %{share} % des trajets de ses joueurs."
  nl: "Vanaf morgen houdt het bedrijf %{share} % van de ritten van zijn spelers."
  pl: "Od jutra firma zatrzymuje %{share} % kursów swoich graczy."
  ru: "С завтрашнего дня компания оставляет себе %{share} % от рейсов своих игроков."
  uk: "З завтрашнього дня компанія залишає собі %{share} % від рейсів своїх гравців."
"The picture":
  de: "Das Bild"
  fr: "L'image"
  nl: "De afbeelding"
  pl: "Obraz"
  ru: "Изображение"
  uk: "Зображення"
"The picture could not be taken: a PNG, JPEG, GIF, BMP or WebP of at most 3 MB.":
  de: "Das Bild konnte nicht übernommen werden: ein PNG, JPEG, GIF, BMP oder WebP von höchstens 3 MB."
  fr: "L'image n'a pas pu être prise : un PNG, JPEG, GIF, BMP ou WebP de 3 Mo au plus."
  nl: "De afbeelding kon niet worden overgenomen: een PNG, JPEG, GIF, BMP of WebP van hoogstens 3 MB."
  pl: "Nie udało się przyjąć obrazu: PNG, JPEG, GIF, BMP lub WebP o rozmiarze najwyżej 3 MB."
  ru: "Не удалось принять изображение: PNG, JPEG, GIF, BMP или WebP не больше 3 МБ."
  uk: "Не вдалося прийняти зображення: PNG, JPEG, GIF, BMP або WebP не більше 3 МБ."
"Its player left the duty":
  de: "Sein Spieler hat den Dienst verlassen"
  fr: "Son joueur a quitté le service"
  nl: "De speler heeft de dienst verlaten"
  pl: "Gracz opuścił służbę"
  ru: "Игрок покинул смену"
  uk: "Гравець покинув зміну"
"%{name} left duty %{k} of line %{n} (tour %{tour}): the rest of it is dropped.":
  de: "%{name} hat Dienst %{k} der Linie %{n} (Umlauf %{tour}) verlassen: Der Rest fällt aus."
  fr: "%{name} a quitté le service %{k} de la ligne %{n} (tournée %{tour}) : le reste est supprimé."
  nl: "%{name} heeft dienst %{k} van lijn %{n} (omloop %{tour}) verlaten: de rest vervalt."
  pl: "%{name} opuścił(a) służbę %{k} linii %{n} (obieg %{tour}): reszta zostaje odwołana."
  ru: "%{name} покинул(а) смену %{k} линии %{n} (оборот %{tour}): остальное отменено."
  uk: "%{name} покинув(ла) зміну %{k} лінії %{n} (оборот %{tour}): решту скасовано."
"%{name} left duty %{k} of line %{n} (tour %{tour}) before its first trip: all of it is dropped.":
  de: "%{name} hat Dienst %{k} der Linie %{n} (Umlauf %{tour}) vor seiner ersten Fahrt verlassen: Er fällt ganz aus."
  fr: "%{name} a quitté le service %{k} de la ligne %{n} (tournée %{tour}) avant son premier trajet : il est supprimé en entier."
  nl: "%{name} heeft dienst %{k} van lijn %{n} (omloop %{tour}) vóór de eerste rit verlaten: de hele dienst vervalt."
  pl: "%{name} opuścił(a) służbę %{k} linii %{n} (obieg %{tour}) przed pierwszym kursem: cała zostaje odwołana."
  ru: "%{name} покинул(а) смену %{k} линии %{n} (оборот %{tour}) до первого рейса: она отменена целиком."
  uk: "%{name} покинув(ла) зміну %{k} лінії %{n} (оборот %{tour}) до першого рейсу: її скасовано повністю."
"You left it: its trips are dropped":
  de: "Du hast ihn verlassen: seine Fahrten fallen aus"
  fr: "Vous l'avez quitté : ses trajets sont supprimés"
  nl: "Je hebt hem verlaten: de ritten vervallen"
  pl: "Opuściłeś ją: jej kursy są odwołane"
  ru: "Вы её покинули: её рейсы отменены"
  uk: "Ви її покинули: її рейси скасовано"
"You left it: the rest of it is dropped":
  de: "Du hast ihn verlassen: der Rest fällt aus"
  fr: "Vous l'avez quitté : le reste est supprimé"
  nl: "Je hebt hem verlaten: de rest vervalt"
  pl: "Opuściłeś ją: reszta jest odwołana"
  ru: "Вы её покинули: остальное отменено"
  uk: "Ви її покинули: решту скасовано"
"Dropped (%{name} left)":
  de: "Fällt aus (%{name} weg)"
  fr: "Supprimé (%{name} parti)"
  nl: "Vervalt (%{name} weg)"
  pl: "Odwołane (%{name} odszedł)"
  ru: "Отменено (%{name} ушёл)"
  uk: "Скасовано (%{name} пішов)"
"Left it: the rest is dropped":
  de: "Verlassen: der Rest fällt aus"
  fr: "Quitté : le reste est supprimé"
  nl: "Verlaten: de rest vervalt"
  pl: "Opuszczona: reszta odwołana"
  ru: "Покинута: остальное отменено"
  uk: "Покинута: решту скасовано"
"Duties left":
  de: "Verlassene Dienste"
  fr: "Services quittés"
  nl: "Verlaten diensten"
  pl: "Opuszczone służby"
  ru: "Брошенные смены"
  uk: "Покинуті зміни"
"When a player leaves his duty halfway":
  de: "Wenn ein Spieler seinen Dienst mittendrin verlässt"
  fr: "Quand un joueur quitte son service en cours"
  nl: "Als een speler zijn dienst halverwege verlaat"
  pl: "Gdy gracz opuści służbę w połowie"
  ru: "Когда игрок бросает смену на полпути"
  uk: "Коли гравець кидає зміну на півдорозі"
"The AI drives the rest":
  de: "Die KI fährt den Rest"
  fr: "L'IA conduit le reste"
  nl: "De AI rijdt de rest"
  pl: "Resztę prowadzi SI"
  ru: "Остальное ведёт ИИ"
  uk: "Решту веде ШІ"
"Its trips are dropped":
  de: "Seine Fahrten fallen aus"
  fr: "Ses trajets sont supprimés"
  nl: "De ritten vervallen"
  pl: "Jej kursy są odwołane"
  ru: "Её рейсы отменяются"
  uk: "Її рейси скасовуються"
"The AI drives the rest of his duty in the world, and the company books its trips. He is paid for what he drove; his card counts the duties he left.":
  de: "Die KI fährt den Rest seines Dienstes in der Welt, und der Betrieb bucht dessen Fahrten. Er wird für das bezahlt, was er gefahren ist; seine Karte zählt die Dienste, die er verlassen hat."
  fr: "L'IA conduit le reste de son service dans le monde, et l'entreprise comptabilise ses trajets. Il est payé pour ce qu'il a conduit ; sa fiche compte les services qu'il a quittés."
  nl: "De AI rijdt de rest van zijn dienst in de wereld, en het bedrijf boekt de ritten. Hij wordt betaald voor wat hij reed; zijn kaart telt de diensten die hij verliet."
  pl: "Resztę jego służby w świecie prowadzi SI, a firma księguje jej kursy. Dostaje zapłatę za to, co przejechał; jego karta liczy opuszczone służby."
  ru: "Остаток его смены в мире ведёт ИИ, и компания учитывает её рейсы. Ему платят за то, что он проехал; его карточка считает брошенные смены."
  uk: "Решту його зміни у світі веде ШІ, і компанія обліковує її рейси. Йому платять за те, що він проїхав; його картка рахує покинуті зміни."
"Nobody drives the rest of his duty: its trips are dropped, the company loses their takings and pays the authority's penalties. He is paid for what he drove; his card counts the duties he left.":
  de: "Niemand fährt den Rest seines Dienstes: dessen Fahrten fallen aus, der Betrieb verliert ihre Einnahmen und zahlt die Strafen des Aufgabenträgers. Er wird für das bezahlt, was er gefahren ist; seine Karte zählt die Dienste, die er verlassen hat."
  fr: "Personne ne conduit le reste de son service : ses trajets sont supprimés, l'entreprise perd leurs recettes et paie les pénalités de l'autorité. Il est payé pour ce qu'il a conduit ; sa fiche compte les services qu'il a quittés."
  nl: "Niemand rijdt de rest van zijn dienst: de ritten vervallen, het bedrijf verliest de opbrengst en betaalt de boetes van de opdrachtgever. Hij wordt betaald voor wat hij reed; zijn kaart telt de diensten die hij verliet."
  pl: "Nikt nie prowadzi reszty jego służby: kursy są odwołane, firma traci ich wpływy i płaci kary organizatora. Dostaje zapłatę za to, co przejechał; jego karta liczy opuszczone służby."
  ru: "Остаток его смены никто не ведёт: рейсы отменяются, компания теряет выручку и платит штрафы заказчика. Ему платят за то, что он проехал; его карточка считает брошенные смены."
  uk: "Решту його зміни ніхто не веде: рейси скасовуються, компанія втрачає виручку і платить штрафи замовника. Йому платять за те, що він проїхав; його картка рахує покинуті зміни."
"From now on what a player leaves of his duty is dropped.":
  de: "Ab jetzt fällt aus, was ein Spieler von seinem Dienst übrig lässt."
  fr: "Désormais, ce qu'un joueur laisse de son service est supprimé."
  nl: "Vanaf nu vervalt wat een speler van zijn dienst laat liggen."
  pl: "Od teraz to, co gracz zostawi ze swojej służby, jest odwoływane."
  ru: "Теперь то, что игрок бросил из своей смены, отменяется."
  uk: "Відтепер те, що гравець покинув зі своєї зміни, скасовується."
"From now on the AI drives what a player leaves of his duty.":
  de: "Ab jetzt fährt die KI, was ein Spieler von seinem Dienst übrig lässt."
  fr: "Désormais, l'IA conduit ce qu'un joueur laisse de son service."
  nl: "Vanaf nu rijdt de AI wat een speler van zijn dienst laat liggen."
  pl: "Od teraz SI prowadzi to, co gracz zostawi ze swojej służby."
  ru: "Теперь то, что игрок бросил из своей смены, ведёт ИИ."
  uk: "Відтепер те, що гравець покинув зі своєї зміни, веде ШІ."
"On the Bus Company Online server every line is won in its tender: it cannot be bought outright.":
  de: "Auf dem Bus-Company-Online-Server wird jede Linie in ihrer Ausschreibung gewonnen: sie kann nicht direkt gekauft werden."
  fr: "Sur le serveur Bus Company Online, chaque ligne se gagne par son appel d'offres : elle ne peut pas être achetée directement."
  nl: "Op de Bus Company Online-server wordt elke lijn in haar aanbesteding gewonnen: ze kan niet direct worden gekocht."
  pl: "Na serwerze Bus Company Online każdą linię wygrywa się w jej przetargu: nie można jej kupić od razu."
  ru: "На сервере Bus Company Online каждую линию выигрывают на её тендере: купить её сразу нельзя."
  uk: "На сервері Bus Company Online кожну лінію виграють на її тендері: купити її одразу не можна."
"Another company of the map runs this line: it goes out to tender again towards the end of its concession.":
  de: "Ein anderer Betrieb der Karte fährt diese Linie: sie wird gegen Ende seiner Konzession wieder ausgeschrieben."
  fr: "Une autre entreprise de la carte exploite cette ligne : elle est remise en appel d'offres vers la fin de sa concession."
  nl: "Een ander bedrijf van de kaart rijdt deze lijn: ze wordt tegen het einde van zijn concessie opnieuw aanbesteed."
  pl: "Tę linię obsługuje inna firma z mapy: trafi ponownie do przetargu pod koniec jej koncesji."
  ru: "Эту линию обслуживает другая компания карты: её снова выставят на тендер ближе к концу её концессии."
  uk: "Цю лінію обслуговує інша компанія карти: її знову виставлять на тендер ближче до кінця її концесії."
"The line goes out to tender in a moment: its auction is on the Concessions page.":
  de: "Die Linie wird gleich ausgeschrieben: ihre Auktion steht auf der Seite Konzessionen."
  fr: "La ligne est mise en appel d'offres dans un instant : son enchère est sur la page Concessions."
  nl: "De lijn wordt zo aanbesteed: de veiling staat op de pagina Concessies."
  pl: "Linia za chwilę trafi do przetargu: jej aukcja jest na stronie Koncesje."
  ru: "Линия вот-вот выйдет на тендер: её аукцион — на странице «Концессии»."
  uk: "Лінія ось-ось вийде на тендер: її аукціон — на сторінці «Концесії»."
"The tender of line %{n} is withdrawn: on the server the map's tenders are shared by its companies":
  de: "Die Ausschreibung der Linie %{n} ist zurückgezogen: auf dem Server teilen sich die Betriebe einer Karte deren Ausschreibungen"
  fr: "L'appel d'offres de la ligne %{n} est retiré : sur le serveur, les appels d'offres d'une carte sont communs à ses entreprises"
  nl: "De aanbesteding van lijn %{n} is ingetrokken: op de server delen de bedrijven van een kaart haar aanbestedingen"
  pl: "Przetarg na linię %{n} został wycofany: na serwerze przetargi mapy są wspólne dla jej firm"
  ru: "Тендер на линию %{n} отозван: на сервере тендеры карты общие для всех её компаний"
  uk: "Тендер на лінію %{n} відкликано: на сервері тендери карти спільні для всіх її компаній"
"a company of the server":
  de: "ein Betrieb des Servers"
  fr: "une entreprise du serveur"
  nl: "een bedrijf van de server"
  pl: "firma z serwera"
  ru: "компания сервера"
  uk: "компанія сервера"
"Bids until %{time} (%{left} from now), scored 70 % price and 30 % quality; every company of the map bids. Ask at most %{amount} to lead now.":
  de: "Gebote bis %{time} (noch %{left}), bewertet zu 70 % nach Preis und 30 % nach Qualität; jeder Betrieb der Karte bietet mit. Biete höchstens %{amount}, um jetzt vorn zu liegen."
  fr: "Offres jusqu'à %{time} (dans %{left}), notées 70 % prix et 30 % qualité ; chaque entreprise de la carte enchérit. Demandez au plus %{amount} pour mener maintenant."
  nl: "Biedingen tot %{time} (nog %{left}), beoordeeld op 70 % prijs en 30 % kwaliteit; elk bedrijf van de kaart biedt mee. Vraag hoogstens %{amount} om nu voor te liggen."
  pl: "Oferty do %{time} (jeszcze %{left}), oceniane w 70 % za cenę i w 30 % za jakość; licytuje każda firma z mapy. Zażądaj najwyżej %{amount}, aby teraz prowadzić."
  ru: "Ставки до %{time} (осталось %{left}), оценка: 70 % цена и 30 % качество; торгуется каждая компания карты. Запросите не больше %{amount}, чтобы сейчас лидировать."
  uk: "Ставки до %{time} (залишилося %{left}), оцінка: 70 % ціна і 30 % якість; торгується кожна компанія карти. Запросіть не більше %{amount}, щоб зараз лідирувати."
"The application could not be written.":
  de: "Die Bewerbung konnte nicht gespeichert werden."
  fr: "La candidature n'a pas pu être enregistrée."
  nl: "De aanvraag kon niet worden opgeslagen."
  pl: "Nie udało się zapisać zgłoszenia."
  ru: "Не удалось записать заявку."
  uk: "Не вдалося записати заявку."
"The bid could not be written to the server's tenders.":
  de: "Das Gebot konnte nicht in die Ausschreibungen des Servers geschrieben werden."
  fr: "L'offre n'a pas pu être enregistrée dans les appels d'offres du serveur."
  nl: "Het bod kon niet in de aanbestedingen van de server worden opgeslagen."
  pl: "Nie udało się zapisać oferty w przetargach serwera."
  ru: "Не удалось записать ставку в тендеры сервера."
  uk: "Не вдалося записати ставку в тендери сервера."
"Line %{n} goes out to tender for every company of the map: bid for it on the Concessions page.":
  de: "Linie %{n} wird für alle Betriebe der Karte ausgeschrieben: biete auf der Seite Konzessionen mit."
  fr: "La ligne %{n} est mise en appel d'offres pour toutes les entreprises de la carte : enchérissez sur la page Concessions."
  nl: "Lijn %{n} wordt aanbesteed voor alle bedrijven van de kaart: bied mee op de pagina Concessies."
  pl: "Linia %{n} trafia do przetargu dla wszystkich firm z mapy: licytuj na stronie Koncesje."
  ru: "Линия %{n} выходит на тендер для всех компаний карты: делайте ставку на странице «Концессии»."
  uk: "Лінія %{n} виходить на тендер для всіх компаній карти: робіть ставку на сторінці «Концесії»."
"Depots are for the companies of a Bus Company Online server.":
  de: "Depots gibt es für die Betriebe eines Bus-Company-Online-Servers."
  fr: "Les dépôts sont réservés aux entreprises d'un serveur Bus Company Online."
  nl: "Remises zijn er voor de bedrijven van een Bus Company Online-server."
  pl: "Zajezdnie są dla firm na serwerze Bus Company Online."
  ru: "Депо есть только у компаний сервера Bus Company Online."
  uk: "Депо є лише в компаній сервера Bus Company Online."
"A depot has no depots of its own: found them from the head office.":
  de: "Ein Depot hat keine eigenen Depots: gründe sie von der Zentrale aus."
  fr: "Un dépôt n'a pas de dépôts à lui : fondez-les depuis le siège."
  nl: "Een remise heeft geen eigen remises: richt ze op vanuit het hoofdkantoor."
  pl: "Zajezdnia nie ma własnych zajezdni: zakładaj je z centrali."
  ru: "У депо не бывает своих депо: открывайте их из головного офиса."
  uk: "У депо не буває власних депо: відкривайте їх із головного офісу."
"The head office runs this map: a depot goes on another.":
  de: "Die Zentrale fährt auf dieser Karte: ein Depot kommt auf eine andere."
  fr: "Le siège exploite cette carte : un dépôt va sur une autre."
  nl: "Het hoofdkantoor rijdt op deze kaart: een remise komt op een andere."
  pl: "Centrala działa na tej mapie: zajezdnia trafia na inną."
  ru: "Головной офис работает на этой карте: депо открывается на другой."
  uk: "Головний офіс працює на цій карті: депо відкривається на іншій."
"The company has a depot on this map already.":
  de: "Der Betrieb hat auf dieser Karte schon ein Depot."
  fr: "L'entreprise a déjà un dépôt sur cette carte."
  nl: "Het bedrijf heeft al een remise op deze kaart."
  pl: "Firma ma już zajezdnię na tej mapie."
  ru: "У компании уже есть депо на этой карте."
  uk: "У компанії вже є депо на цій карті."
"The head office has not the money for it: the depot and its starting money.":
  de: "Der Zentrale fehlt das Geld dafür: das Depot und sein Startgeld."
  fr: "Le siège n'a pas l'argent pour cela : le dépôt et son argent de départ."
  nl: "Het hoofdkantoor heeft het geld er niet voor: de remise en haar startgeld."
  pl: "Centrala nie ma na to pieniędzy: na zajezdnię i jej kapitał startowy."
  ru: "У головного офиса не хватает денег: на депо и его стартовый капитал."
  uk: "У головного офісу бракує грошей: на депо та його стартовий капітал."
"The server's clock is not set: the main server keeps it.":
  de: "Die Uhr des Servers ist nicht gestellt: der Hauptserver führt sie."
  fr: "L'horloge du serveur n'est pas réglée : le serveur principal la tient."
  nl: "De klok van de server is niet ingesteld: de hoofdserver houdt haar bij."
  pl: "Zegar serwera nie jest ustawiony: prowadzi go serwer główny."
  ru: "Часы сервера не установлены: их ведёт главный сервер."
  uk: "Годинник сервера не встановлено: його веде головний сервер."
"The depot could not be founded: the server says why in its log.":
  de: "Das Depot konnte nicht gegründet werden: der Server nennt den Grund in seinem Protokoll."
  fr: "Le dépôt n'a pas pu être fondé : le serveur en donne la raison dans son journal."
  nl: "De remise kon niet worden opgericht: de server zegt waarom in zijn logboek."
  pl: "Nie udało się założyć zajezdni: serwer podaje powód w swoim dzienniku."
  ru: "Не удалось открыть депо: сервер пишет причину в своём журнале."
  uk: "Не вдалося відкрити депо: сервер пише причину у своєму журналі."
"A depot of %{hq}: its money, buses and staff are its own.":
  de: "Ein Depot von %{hq}: sein Geld, seine Busse und sein Personal sind seine eigenen."
  fr: "Un dépôt de %{hq} : son argent, ses bus et son personnel sont les siens."
  nl: "Een remise van %{hq}: haar geld, bussen en personeel zijn van haarzelf."
  pl: "Zajezdnia firmy %{hq}: jej pieniądze, autobusy i personel są jej własne."
  ru: "Депо компании %{hq}: его деньги, автобусы и персонал — его собственные."
  uk: "Депо компанії %{hq}: його гроші, автобуси й персонал — його власні."
"%{lines} lines · %{buses} buses · %{staff} staff":
  de: "%{lines} Linien · %{buses} Busse · %{staff} Mitarbeiter"
  fr: "%{lines} lignes · %{buses} bus · %{staff} employés"
  nl: "%{lines} lijnen · %{buses} bussen · %{staff} medewerkers"
  pl: "%{lines} linii · %{buses} autobusów · %{staff} pracowników"
  ru: "%{lines} линий · %{buses} автобусов · %{staff} сотрудников"
  uk: "%{lines} ліній · %{buses} автобусів · %{staff} працівників"
"A depot runs the company on another map of the server: its own lines, buses, staff and tenders there. It costs %{price} of the company's money, besides the starting money you give it.":
  de: "Ein Depot betreibt den Betrieb auf einer anderen Karte des Servers: mit eigenen Linien, Bussen, Personal und Ausschreibungen dort. Es kostet %{price} vom Geld des Betriebs, dazu das Startgeld, das du ihm gibst."
  fr: "Un dépôt fait tourner l'entreprise sur une autre carte du serveur : ses propres lignes, bus, personnel et appels d'offres là-bas. Il coûte %{price} de l'argent de l'entreprise, en plus de l'argent de départ que vous lui donnez."
  nl: "Een remise laat het bedrijf rijden op een andere kaart van de server: met eigen lijnen, bussen, personeel en aanbestedingen daar. Ze kost %{price} van het geld van het bedrijf, naast het startgeld dat je haar geeft."
  pl: "Zajezdnia prowadzi firmę na innej mapie serwera: z własnymi liniami, autobusami, personelem i przetargami. Kosztuje %{price} z pieniędzy firmy, oprócz kapitału startowego, który jej dasz."
  ru: "Депо ведёт дело компании на другой карте сервера: со своими линиями, автобусами, персоналом и тендерами там. Оно стоит %{price} из денег компании, помимо стартового капитала, который вы ему дадите."
  uk: "Депо веде справу компанії на іншій карті сервера: зі своїми лініями, автобусами, персоналом і тендерами там. Воно коштує %{price} з грошей компанії, крім стартового капіталу, який ви йому дасте."
"Its starting money":
  de: "Sein Startgeld"
  fr: "Son argent de départ"
  nl: "Haar startgeld"
  pl: "Jej kapitał startowy"
  ru: "Его стартовый капитал"
  uk: "Його стартовий капітал"
"The map":
  de: "Die Karte"
  fr: "La carte"
  nl: "De kaart"
  pl: "Mapa"
  ru: "Карта"
  uk: "Карта"
"Found a depot":
  de: "Depot gründen"
  fr: "Fonder un dépôt"
  nl: "Remise oprichten"
  pl: "Załóż zajezdnię"
  ru: "Открыть депо"
  uk: "Відкрити депо"
"The company has a depot on every other map of the server.":
  de: "Der Betrieb hat auf jeder anderen Karte des Servers ein Depot."
  fr: "L'entreprise a un dépôt sur chaque autre carte du serveur."
  nl: "Het bedrijf heeft een remise op elke andere kaart van de server."
  pl: "Firma ma zajezdnię na każdej innej mapie serwera."
  ru: "У компании есть депо на каждой другой карте сервера."
  uk: "У компанії є депо на кожній іншій карті сервера."
"The depot %{name} is founded: it opens on the server in a moment, under Bus Company Online.":
  de: "Das Depot %{name} ist gegründet: es öffnet gleich auf dem Server, unter Bus Company Online."
  fr: "Le dépôt %{name} est fondé : il ouvre dans un instant sur le serveur, sous Bus Company Online."
  nl: "De remise %{name} is opgericht: ze opent zo op de server, onder Bus Company Online."
  pl: "Zajezdnia %{name} została założona: za chwilę otworzy się na serwerze, w Bus Company Online."
  ru: "Депо %{name} открыто: оно вот-вот заработает на сервере, в Bus Company Online."
  uk: "Депо %{name} відкрито: воно ось-ось запрацює на сервері, у Bus Company Online."
"Depot of %{hq}":
  de: "Depot von %{hq}"
  fr: "Dépôt de %{hq}"
  nl: "Remise van %{hq}"
  pl: "Zajezdnia firmy %{hq}"
  ru: "Депо компании %{hq}"
  uk: "Депо компанії %{hq}"
"Money goes only between a head office and its own depots.":
  de: "Geld geht nur zwischen einer Zentrale und ihren eigenen Depots."
  fr: "L'argent ne circule qu'entre un siège et ses propres dépôts."
  nl: "Geld gaat alleen tussen een hoofdkantoor en zijn eigen remises."
  pl: "Pieniądze krążą tylko między centralą a jej własnymi zajezdniami."
  ru: "Деньги переводятся только между головным офисом и его собственными депо."
  uk: "Гроші переказуються лише між головним офісом і його власними депо."
"Send at least 100.":
  de: "Sende mindestens 100."
  fr: "Envoyez au moins 100."
  nl: "Stuur minstens 100."
  pl: "Wyślij co najmniej 100."
  ru: "Отправьте не меньше 100."
  uk: "Надішліть щонайменше 100."
"The money could not be sent: the server says why in its log.":
  de: "Das Geld konnte nicht gesendet werden: der Server nennt den Grund in seinem Protokoll."
  fr: "L'argent n'a pas pu être envoyé : le serveur en donne la raison dans son journal."
  nl: "Het geld kon niet worden verstuurd: de server zegt waarom in zijn logboek."
  pl: "Nie udało się wysłać pieniędzy: serwer podaje powód w swoim dzienniku."
  ru: "Не удалось отправить деньги: сервер пишет причину в своём журнале."
  uk: "Не вдалося надіслати гроші: сервер пише причину у своєму журналі."
"The company has not that much money.":
  de: "So viel Geld hat der Betrieb nicht."
  fr: "L'entreprise n'a pas autant d'argent."
  nl: "Zoveel geld heeft het bedrijf niet."
  pl: "Firma nie ma tyle pieniędzy."
  ru: "У компании нет столько денег."
  uk: "У компанії немає стільки грошей."
"Send money":
  de: "Geld senden"
  fr: "Envoyer de l'argent"
  nl: "Geld sturen"
  pl: "Wyślij pieniądze"
  ru: "Отправить деньги"
  uk: "Надіслати гроші"
"Send to %{hq}":
