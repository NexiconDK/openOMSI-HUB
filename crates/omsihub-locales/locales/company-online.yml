  de: "%{name} hat Disponentendienst."
  da: "%{name} har trafiklederens vagt."
  fr: "%{name} est au poste de régulateur."
  nl: "%{name} heeft dispatcherdienst."
  pl: "%{name} pełni dyżur dyspozytora."
  ru: "%{name} дежурит диспетчером."
  uk: "%{name} чергує диспетчером."
"On duty, a spare bus reaches its trips in 15 minutes, the late buses wait for your call on the control room's page and you answer the doubling orders.":
  de: "Im Dienst erreicht ein Reservebus seine Fahrten in 15 Minuten, die verspäteten Busse warten auf der Seite der Leitstelle auf deine Entscheidung, und du beantwortest die Bestellungen von Verstärkerfahrten."
  da: "På vagt når en reservebus sine ture på 15 minutter, de forsinkede busser venter på din beslutning på kontrolrummets side, og du svarer på bestillingerne af dubleringer."
  fr: "En poste, un bus de réserve rejoint ses courses en 15 minutes, les bus en retard attendent votre décision sur la page du PC de régulation et vous répondez aux commandes de doublage."
  nl: "In dienst bereikt een reservebus zijn ritten in 15 minuten, wachten de vertraagde bussen op jouw beslissing op de pagina van de verkeersleiding en beantwoord jij de bestellingen van versterkingsritten."
  pl: "Na dyżurze autobus rezerwowy dociera do swoich kursów w 15 minut, spóźnione autobusy czekają na twoją decyzję na stronie centrum sterowania, a ty odpowiadasz na zamówienia kursów dodatkowych."
  ru: "На дежурстве резервный автобус выходит на свои рейсы за 15 минут, опаздывающие автобусы ждут вашего решения на странице диспетчерской, а вы отвечаете на заказы дополнительных рейсов."
  uk: "На чергуванні резервний автобус виходить на свої рейси за 15 хвилин, автобуси із запізненням чекають на ваше рішення на сторінці диспетчерської, а ви відповідаєте на замовлення додаткових рейсів."
