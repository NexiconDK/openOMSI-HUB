  da: "Starter verdenen for %{map} på serveren… (et stort kort tager nogle minutter)"
  fr: "Démarrage du monde de %{map} sur le serveur… (une grande carte prend quelques minutes)"
  nl: "De wereld van %{map} start op de server… (een grote kaart duurt een paar minuten)"
  pl: "Uruchamianie świata %{map} na serwerze… (duża mapa zajmuje kilka minut)"
