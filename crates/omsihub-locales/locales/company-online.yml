  pl: "Elektryczne · miesiąc"
  ru: "Электро · месяц"
  uk: "Електро · місяць"
"Your next bid is made with these buses: the contract runs two weeks with diesel buses and a month with electric ones, whose tours are then run with electric buses.":
  de: "Dein nächstes Gebot gilt mit diesen Bussen: Der Vertrag läuft mit Dieselbussen zwei Wochen und mit Elektrobussen einen Monat, dann werden seine Umläufe mit Elektrobussen gefahren."
  da: "Dit næste bud afgives med disse busser: kontrakten løber to uger med dieselbusser og en måned med elbusser, hvis vognløb så køres med elbusser."
  fr: "Votre prochaine offre se fait avec ces bus : le contrat dure deux semaines avec des bus diesel et un mois avec des bus électriques, ses services étant alors assurés par des bus électriques."
  nl: "Je volgende bod geldt met deze bussen: het contract loopt twee weken met dieselbussen en een maand met elektrische, waarna de omlopen met elektrische bussen worden gereden."
  pl: "Twoja następna oferta jest z tymi autobusami: umowa trwa dwa tygodnie z autobusami diesla i miesiąc z elektrycznymi, a wtedy jej kursy obsługują autobusy elektryczne."
  ru: "Ваша следующая ставка делается с этими автобусами: контракт длится две недели с дизельными и месяц с электробусами, и тогда его обороты обслуживают электробусы."
  uk: "Ваша наступна ставка робиться з цими автобусами: контракт триває два тижні з дизельними й місяць з електробусами, і тоді його оберти обслуговують електробуси."
"Electric buses open at a higher company level.":
  de: "Elektrobusse werden auf einer höheren Firmenstufe freigeschaltet."
  da: "Elbusser åbner på et højere selskabsniveau."
  fr: "Les bus électriques s'ouvrent à un niveau d'entreprise plus élevé."
  nl: "Elektrische bussen komen vrij op een hoger bedrijfsniveau."
  pl: "Autobusy elektryczne odblokowują się na wyższym poziomie firmy."
  ru: "Электробусы открываются на более высоком уровне компании."
  uk: "Електробуси відкриваються на вищому рівні компанії."
