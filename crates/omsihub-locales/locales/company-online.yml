"By the head office's order depot %{name} is closed: %{moved} of its buses are on their way to %{other}, the others sold or handed back, its staff gone and its lines out to tender again. What was left of it, %{amount}, is the head office's.":
  de: "Auf Anordnung der Zentrale ist Depot %{name} geschlossen: %{moved} seiner Busse sind auf dem Weg nach %{other}, die übrigen verkauft oder zurückgegeben, sein Personal weg und seine Linien neu ausgeschrieben. Was übrig blieb, %{amount}, gehört der Zentrale."
  da: "Efter hovedkontorets ordre er garagen %{name} lukket: %{moved} af dens busser er på vej til %{other}, de andre er solgt eller leveret tilbage, personalet er væk, og linjerne er i udbud igen. Det, der var tilbage, %{amount}, tilhører hovedkontoret."
  fr: "Sur ordre du siège, le dépôt %{name} est fermé : %{moved} de ses bus sont en route vers %{other}, les autres vendus ou rendus, son personnel parti et ses lignes remises en appel d'offres. Ce qui en restait, %{amount}, revient au siège."
  nl: "Op last van het hoofdkantoor is remise %{name} gesloten: %{moved} van haar bussen zijn onderweg naar %{other}, de andere verkocht of teruggegeven, haar personeel weg en haar lijnen opnieuw aanbesteed. Wat ervan overbleef, %{amount}, is van het hoofdkantoor."
  pl: "Na polecenie centrali zajezdnia %{name} została zamknięta: %{moved} jej autobusów jedzie do %{other}, pozostałe sprzedane lub zwrócone, personel odszedł, a linie wróciły do przetargu. To, co zostało, %{amount}, należy do centrali."
  ru: "По приказу головного офиса депо %{name} закрыто: %{moved} его автобусов едут в %{other}, остальные проданы или возвращены, персонал ушёл, линии снова на тендере. Оставшиеся %{amount} достаются головному офису."
  uk: "За наказом головного офісу депо %{name} закрите: %{moved} його автобусів їдуть до %{other}, решта продані або повернуті, персонал пішов, лінії знову на тендері. Залишок, %{amount}, належить головному офісу."
"By the head office's order depot %{name} is closed: its buses sold or handed back, its staff gone, its lines out to tender again. What was left of it, %{amount}, is the head office's.":
  de: "Auf Anordnung der Zentrale ist Depot %{name} geschlossen: seine Busse verkauft oder zurückgegeben, sein Personal weg, seine Linien neu ausgeschrieben. Was übrig blieb, %{amount}, gehört der Zentrale."
  da: "Efter hovedkontorets ordre er garagen %{name} lukket: busserne er solgt eller leveret tilbage, personalet er væk, og linjerne er i udbud igen. Det, der var tilbage, %{amount}, tilhører hovedkontoret."
  fr: "Sur ordre du siège, le dépôt %{name} est fermé : ses bus vendus ou rendus, son personnel parti, ses lignes remises en appel d'offres. Ce qui en restait, %{amount}, revient au siège."
  nl: "Op last van het hoofdkantoor is remise %{name} gesloten: haar bussen verkocht of teruggegeven, haar personeel weg, haar lijnen opnieuw aanbesteed. Wat ervan overbleef, %{amount}, is van het hoofdkantoor."
  pl: "Na polecenie centrali zajezdnia %{name} została zamknięta: autobusy sprzedane lub zwrócone, personel odszedł, linie wróciły do przetargu. To, co zostało, %{amount}, należy do centrali."
  ru: "По приказу головного офиса депо %{name} закрыто: автобусы проданы или возвращены, персонал ушёл, линии снова на тендере. Оставшиеся %{amount} достаются головному офису."
  uk: "За наказом головного офісу депо %{name} закрите: автобуси продані або повернуті, персонал пішов, лінії знову на тендері. Залишок, %{amount}, належить головному офісу."
"By the head office's order depot %{name} is closed: its buses sold or handed back, its staff gone, its lines out to tender again. The head office covered its loss of %{amount}.":
  de: "Auf Anordnung der Zentrale ist Depot %{name} geschlossen: seine Busse verkauft oder zurückgegeben, sein Personal weg, seine Linien neu ausgeschrieben. Die Zentrale hat seinen Verlust von %{amount} gedeckt."
  da: "Efter hovedkontorets ordre er garagen %{name} lukket: busserne er solgt eller leveret tilbage, personalet er væk, og linjerne er i udbud igen. Hovedkontoret dækkede underskuddet på %{amount}."
  fr: "Sur ordre du siège, le dépôt %{name} est fermé : ses bus vendus ou rendus, son personnel parti, ses lignes remises en appel d'offres. Le siège a couvert sa perte de %{amount}."
  nl: "Op last van het hoofdkantoor is remise %{name} gesloten: haar bussen verkocht of teruggegeven, haar personeel weg, haar lijnen opnieuw aanbesteed. Het hoofdkantoor dekte haar verlies van %{amount}."
  pl: "Na polecenie centrali zajezdnia %{name} została zamknięta: autobusy sprzedane lub zwrócone, personel odszedł, linie wróciły do przetargu. Centrala pokryła jej stratę w wysokości %{amount}."
  ru: "По приказу головного офиса депо %{name} закрыто: автобусы проданы или возвращены, персонал ушёл, линии снова на тендере. Головной офис покрыл его убыток в %{amount}."
  uk: "За наказом головного офісу депо %{name} закрите: автобуси продані або повернуті, персонал пішов, лінії знову на тендері. Головний офіс покрив його збиток у %{amount}."
