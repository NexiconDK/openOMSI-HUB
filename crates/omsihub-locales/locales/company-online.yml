"The world goes on loading on the server: press Drive again when you like.":
  de: "Die Welt lädt auf dem Server weiter: drücke Fahren wieder, wann du willst."
  da: "Verdenen indlæser videre på serveren: tryk på Kør igen, når du vil."
  fr: "Le monde continue de charger sur le serveur : appuyez à nouveau sur Conduire quand vous voulez."
  nl: "De wereld laadt verder op de server: druk opnieuw op Rijden wanneer je wilt."
  pl: "Świat wczytuje się dalej na serwerze: naciśnij Jedź ponownie, kiedy chcesz."
