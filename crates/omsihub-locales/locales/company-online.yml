  uk: "Організатор переніс останній день вашого контракту на лінії %{n} на %{date}."
"The line goes out to tender: announced now, it takes bids from tomorrow for three days - on the Concessions page.":
  de: "Die Linie wird ausgeschrieben: jetzt angekündigt, Gebote ab morgen drei Tage lang - auf der Seite Konzessionen."
  da: "Linjen kommer i udbud: annonceret nu, den tager imod bud fra i morgen i tre dage - på siden Koncessioner."
  fr: "La ligne est mise en appel d'offres : annoncée maintenant, elle reçoit des offres dès demain pendant trois jours - page Concessions."
  nl: "De lijn wordt aanbesteed: nu aangekondigd, biedingen vanaf morgen drie dagen lang - op de pagina Concessies."
  pl: "Linia trafia do przetargu: ogłoszona teraz, oferty od jutra przez trzy dni - na stronie Koncesje."
  ru: "Линия выставлена на тендер: объявлена сейчас, ставки принимаются с завтрашнего дня три дня - на странице «Концессии»."
  uk: "Лінію виставлено на тендер: оголошено зараз, ставки приймаються з завтра три дні - на сторінці «Концесії»."
"The authority takes its option on your contract on line %{n}: satisfactory running, so it runs %{days} days more, to %{date} (option %{k} of %{most}).":
  de: "Der Aufgabenträger zieht die Option auf deinen Vertrag für Linie %{n}: zufriedenstellender Betrieb, er läuft %{days} Tage länger, bis %{date} (Option %{k} von %{most})."
  da: "Trafikselskabet tager sin option på din kontrakt på linje %{n}: tilfredsstillende kørsel, så den kører %{days} dage mere, til %{date} (option %{k} af %{most})."
  fr: "L'autorité lève son option sur votre contrat de la ligne %{n} : exploitation satisfaisante, il court %{days} jours de plus, jusqu'au %{date} (option %{k} sur %{most})."
  nl: "De opdrachtgever lost de optie op je contract voor lijn %{n}: naar tevredenheid gereden, het loopt %{days} dagen langer, tot %{date} (optie %{k} van %{most})."
  pl: "Organizator korzysta z opcji na twoją umowę na linii %{n}: zadowalająca eksploatacja, trwa %{days} dni dłużej, do %{date} (opcja %{k} z %{most})."
  ru: "Заказчик использует опцион по вашему контракту на линии %{n}: работа удовлетворительна, он продлён на %{days} дней, до %{date} (опцион %{k} из %{most})."
  uk: "Замовник використовує опціон за вашим контрактом на лінії %{n}: робота задовільна, його продовжено на %{days} днів, до %{date} (опціон %{k} з %{most})."
"The package %{n} (lines %{lines}) won for %{amount}: its concessions run until %{date}":
  de: "Das Paket %{n} (Linien %{lines}) für %{amount} gewonnen: seine Konzessionen laufen bis %{date}"
  da: "Pakken %{n} (linje %{lines}) vundet for %{amount}: koncessionerne løber til %{date}"
  fr: "Le lot %{n} (lignes %{lines}) gagné pour %{amount} : ses concessions courent jusqu'au %{date}"
  nl: "Het pakket %{n} (lijnen %{lines}) gewonnen voor %{amount}: de concessies lopen tot %{date}"
  pl: "Pakiet %{n} (linie %{lines}) wygrany za %{amount}: jego koncesje trwają do %{date}"
  ru: "Пакет %{n} (линии %{lines}) выигран за %{amount}: его концессии действуют до %{date}"
  uk: "Пакет %{n} (лінії %{lines}) виграно за %{amount}: його концесії діють до %{date}"
