  uk: "Компанія збанкрутує завтра"
"The company has %{amount} in cash and its emergency loan running. Still in the red at tomorrow's close, it goes bankrupt: everything is sold and the company closes, its depots with it.":
  de: "Die Firma hat %{amount} in der Kasse und ihr Notkredit läuft. Ist sie beim morgigen Abschluss weiter im Minus, geht sie in Konkurs: Alles wird verkauft und die Firma schließt, ihre Depots mit ihr."
  da: "Selskabet har %{amount} i kontanter og sit nødlån løbende. Er det stadig i minus ved morgendagens afslutning, går det konkurs: alt sælges, og selskabet lukker, dets afdelinger med."
  fr: "L'entreprise a %{amount} en caisse et son prêt d'urgence en cours. Toujours dans le rouge à la clôture de demain, elle fait faillite : tout est vendu et l'entreprise ferme, ses dépôts avec elle."
  nl: "Het bedrijf heeft %{amount} in kas en de noodlening loopt. Nog steeds in de min bij de afsluiting van morgen, dan gaat het failliet: alles wordt verkocht en het bedrijf sluit, zijn depots ook."
  pl: "Firma ma %{amount} w kasie i trwa jej pożyczka awaryjna. Jeśli przy jutrzejszym zamknięciu nadal będzie na minusie, zbankrutuje: wszystko zostanie sprzedane, a firma zamknięta wraz z zajezdniami."
  ru: "У компании %{amount} в кассе и действует экстренный кредит. Если при завтрашнем закрытии она будет в минусе, она обанкротится: всё будет продано, компания закроется вместе с депо."
  uk: "У компанії %{amount} у касі й діє екстрений кредит. Якщо під час завтрашнього закриття вона буде в мінусі, вона збанкрутує: усе буде продано, компанія закриється разом із депо."
