"Six days before the term ends the line goes out to tender again, decided three days before it: the winner has three days to make ready.":
  de: "Sechs Tage vor dem Ende der Laufzeit wird die Linie neu ausgeschrieben und drei Tage davor entschieden: Der Gewinner hat drei Tage zur Vorbereitung."
  da: "Seks dage før løbetiden slutter, sendes linjen i udbud igen, afgjort tre dage før: vinderen har tre dage til at gøre klar."
  fr: "Six jours avant la fin du contrat, la ligne est remise en appel d'offres, décidé trois jours avant : le gagnant a trois jours pour se préparer."
  nl: "Zes dagen voor het einde van de looptijd wordt de lijn opnieuw aanbesteed, drie dagen ervoor beslist: de winnaar heeft drie dagen om zich voor te bereiden."
  pl: "Sześć dni przed końcem umowy linia trafia do ponownego przetargu, rozstrzyganego trzy dni wcześniej: zwycięzca ma trzy dni na przygotowanie."
  ru: "За шесть дней до конца срока линия снова выставляется на тендер, решаемый за три дня до него: у победителя есть три дня на подготовку."
  uk: "За шість днів до кінця строку лінію знову виставляють на тендер, що вирішується за три дні до нього: переможець має три дні на підготовку."
"The buses":
  de: "Die Busse"
  da: "Busserne"
  fr: "Les bus"
  nl: "De bussen"
  pl: "Autobusy"
  ru: "Автобусы"
  uk: "Автобуси"
"The winner may take over the buses its last operator ran the line with, at their book value.":
  de: "Der Gewinner kann die Busse, mit denen der bisherige Betreiber die Linie gefahren hat, zum Buchwert übernehmen."
  da: "Vinderen må overtage de busser, dens sidste operatør kørte linjen med, til deres bogførte værdi."
  fr: "Le gagnant peut reprendre les bus avec lesquels l'exploitant précédent assurait la ligne, à leur valeur comptable."
  nl: "De winnaar kan de bussen waarmee de vorige vervoerder de lijn reed overnemen tegen hun boekwaarde."
  pl: "Zwycięzca może przejąć autobusy, którymi poprzedni przewoźnik obsługiwał linię, po ich wartości księgowej."
  ru: "Победитель может выкупить автобусы, на которых линию обслуживал прежний перевозчик, по их балансовой стоимости."
  uk: "Переможець може викупити автобуси, якими лінію обслуговував попередній перевізник, за їхньою балансовою вартістю."
