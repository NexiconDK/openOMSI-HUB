  pl: "Później"
  ru: "Позже"
  uk: "Пізніше"
"Overtime given in the calendar":
  de: "Überstunden im Kalender vergeben"
  da: "Overtid givet i kalenderen"
  fr: "Heures sup. données dans le calendrier"
  nl: "Overuren gegeven in de kalender"
  pl: "Nadgodziny przydzielane w kalendarzu"
  ru: "Сверхурочные из календаря"
  uk: "Понаднормові з календаря"
"Paid out":
  de: "Ausgezahlt"
  da: "Udbetales"
  fr: "Payées"
  nl: "Uitbetaald"
  pl: "Wypłacane"
  ru: "Выплачиваются"
  uk: "Виплачуються"
"What the calendar's popup offers first when a permanent driver is given a duty of overtime: paid with the overtime rate, or saved hour for hour as time off in lieu - cheaper now, but the hours are paid later, and too many saved make the driver unhappy.":
  de: "Was das Popup des Kalenders zuerst anbietet, wenn ein fester Fahrer einen Dienst mit Überstunden bekommt: mit dem Überstundensatz bezahlt oder Stunde für Stunde als Freizeitausgleich gespart – jetzt billiger, aber die Stunden werden später bezahlt, und zu viele gesparte machen den Fahrer unzufrieden."
  da: "Hvad kalenderens popup foreslår først, når en fast chauffør får en vagt med overtid: udbetalt med overtidssats eller gemt time for time som afspadsering – billigere nu, men timerne betales senere, og for mange gemte gør chaufføren utilfreds."
  fr: "Ce que la fenêtre du calendrier propose d'abord quand un conducteur permanent reçoit un service en heures sup. : payé au taux majoré, ou mis heure pour heure en récupération – moins cher maintenant, mais les heures sont payées plus tard, et trop d'heures en réserve rendent le conducteur mécontent."
  nl: "Wat de pop-up van de kalender eerst aanbiedt als een vaste chauffeur een dienst met overuren krijgt: uitbetaald tegen het overurentarief, of uur voor uur gespaard als compensatieverlof – nu goedkoper, maar de uren worden later betaald, en te veel gespaard maakt de chauffeur ontevreden."
  pl: "Co okno kalendarza proponuje najpierw, gdy stały kierowca dostaje służbę w nadgodzinach: wypłata według stawki za nadgodziny lub odłożenie godzina za godzinę do odbioru – teraz taniej, ale godziny są płacone później, a zbyt wiele odłożonych zniechęca kierowcę."
  ru: "Что окно календаря предлагает сначала, когда штатному водителю дают смену со сверхурочными: оплата по ставке сверхурочных или отгул час за час – сейчас дешевле, но часы оплачиваются позже, а слишком много накопленных огорчает водителя."
  uk: "Що вікно календаря пропонує спершу, коли штатному водієві дають зміну з понаднормовими: оплата за ставкою понаднормових або відгул година за годину – зараз дешевше, але години оплачуються пізніше, а забагато накопичених засмучує водія."
