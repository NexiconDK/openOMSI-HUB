  uk: "Ця лінія вже має субпідряд на ці дні."
"%{main} proposes that you run its lines %{lines} as its subcontractor from %{from} to %{until}, at %{price} a timetable hour: accept or decline on the Concessions page.":
  de: "%{main} schlägt vor, dass du seine Linien %{lines} als Subunternehmer vom %{from} bis %{until} fährst, für %{price} je Fahrplanstunde: nimm auf der Konzessionsseite an oder lehne ab."
  da: "%{main} foreslår, at du kører firmaets linjer %{lines} som underleverandør fra %{from} til %{until} til %{price} pr. køreplantime: tag imod eller afslå på siden Koncessioner."
  fr: "%{main} propose que vous exploitiez ses lignes %{lines} en sous-traitance du %{from} au %{until}, à %{price} l'heure d'horaire : acceptez ou refusez sur la page Concessions."
  nl: "%{main} stelt voor dat je zijn lijnen %{lines} als onderaannemer rijdt van %{from} tot %{until}, voor %{price} per dienstregelingsuur: neem aan of weiger op de concessiepagina."
  pl: "%{main} proponuje, abyś obsługiwał jego linie %{lines} jako podwykonawca od %{from} do %{until} za %{price} za godzinę rozkładową: przyjmij lub odrzuć na stronie Koncesje."
  ru: "%{main} предлагает вам обслуживать его линии %{lines} как субподрядчик с %{from} по %{until} за %{price} за час по расписанию: примите или отклоните на странице «Концессии»."
  uk: "%{main} пропонує вам обслуговувати його лінії %{lines} як субпідрядник з %{from} до %{until} за %{price} за годину за розкладом: прийміть або відхиліть на сторінці «Концесії»."
"Your subcontract on %{lines} with %{who} runs from %{from} to %{until}, at %{price} a timetable hour.":
  de: "Dein Unterauftrag über %{lines} mit %{who} läuft vom %{from} bis %{until}, für %{price} je Fahrplanstunde."
  da: "Din underleverandøraftale om %{lines} med %{who} løber fra %{from} til %{until} til %{price} pr. køreplantime."
  fr: "Votre sous-traitance sur %{lines} avec %{who} court du %{from} au %{until}, à %{price} l'heure d'horaire."
  nl: "Je onderaanneming op %{lines} met %{who} loopt van %{from} tot %{until}, voor %{price} per dienstregelingsuur."
  pl: "Twoje podwykonawstwo na %{lines} z %{who} trwa od %{from} do %{until} za %{price} za godzinę rozkładową."
  ru: "Ваш субподряд на %{lines} с %{who} действует с %{from} по %{until} за %{price} за час по расписанию."
  uk: "Ваш субпідряд на %{lines} з %{who} діє з %{from} до %{until} за %{price} за годину за розкладом."
