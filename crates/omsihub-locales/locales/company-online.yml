"Give lines of your contracts to another company of the map for a price a timetable hour: it runs them, you are paid by the authority and pay it its hours. Either may end it with %{n} days' notice.":
  de: "Gib Linien deiner Verträge an eine andere Firma der Karte für einen Preis je Fahrplanstunde: sie fährt sie, du wirst vom Aufgabenträger bezahlt und zahlst ihr ihre Stunden. Beide können mit %{n} Tagen Frist kündigen."
  da: "Giv linjer fra dine kontrakter til et andet firma på kortet for en pris pr. køreplantime: det kører dem, du bliver betalt af trafikselskabet og betaler det dets timer. Begge kan opsige med %{n} dages varsel."
  fr: "Confiez des lignes de vos contrats à une autre entreprise de la carte pour un prix par heure d'horaire : elle les exploite, l'autorité vous paie et vous lui payez ses heures. Chacun peut y mettre fin avec %{n} jours de préavis."
  nl: "Geef lijnen van je contracten aan een ander bedrijf van de kaart voor een prijs per dienstregelingsuur: het rijdt ze, jij wordt door de opdrachtgever betaald en betaalt het zijn uren. Beide kunnen opzeggen met %{n} dagen."
  pl: "Przekaż linie ze swoich umów innej firmie z mapy za cenę za godzinę rozkładową: ona je obsługuje, organizator płaci tobie, a ty płacisz jej za godziny. Każda strona może wypowiedzieć z %{n}-dniowym wyprzedzeniem."
  ru: "Передайте линии своих контрактов другой компании карты за цену за час по расписанию: она их обслуживает, заказчик платит вам, а вы платите ей за часы. Каждая сторона может расторгнуть с уведомлением за %{n} дня."
  uk: "Передайте лінії своїх контрактів іншій компанії мапи за ціну за годину за розкладом: вона їх обслуговує, замовник платить вам, а ви платите їй за години. Кожна сторона може розірвати з повідомленням за %{n} дні."
