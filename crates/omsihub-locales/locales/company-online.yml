"The bank gave an emergency loan":
  de: "Die Bank hat einen Notkredit gegeben"
  fr: "La banque a accordé un prêt d'urgence"
  nl: "De bank heeft een noodlening gegeven"
  pl: "Bank udzielił pożyczki awaryjnej"
  ru: "Банк выдал экстренный кредит"
  uk: "Банк видав екстрений кредит"
"The company closed the day %{cost} in the red: the bank lent it %{amount} at %{rate} % over %{months} months. In the red again while it runs, the company goes bankrupt.":
  de: "Die Firma hat den Tag mit %{cost} im Minus abgeschlossen: Die Bank hat ihr %{amount} zu %{rate} % über %{months} Monate geliehen. Gerät sie wieder ins Minus, solange er läuft, geht die Firma in Konkurs."
  fr: "L'entreprise a clôturé la journée avec %{cost} de déficit : la banque lui a prêté %{amount} à %{rate} % sur %{months} mois. De nouveau dans le rouge pendant ce prêt, l'entreprise fait faillite."
  nl: "Het bedrijf sloot de dag af met %{cost} in de min: de bank leende het %{amount} tegen %{rate} % over %{months} maanden. Weer in de min zolang die loopt, gaat het bedrijf failliet."
  pl: "Firma zamknęła dzień z %{cost} na minusie: bank pożyczył jej %{amount} na %{rate} % na %{months} miesięcy. Jeśli znów będzie na minusie, gdy pożyczka trwa, firma zbankrutuje."
  ru: "Компания закрыла день с минусом %{cost}: банк одолжил ей %{amount} под %{rate} % на %{months} мес. Снова в минусе, пока идёт кредит, компания обанкротится."
  uk: "Компанія закрила день з мінусом %{cost}: банк позичив їй %{amount} під %{rate} % на %{months} міс. Знову в мінусі, поки триває кредит, компанія збанкрутує."
"The company is in the red: %{n} days to go":
  de: "Die Firma ist im Minus: noch %{n} Tage"
  fr: "L'entreprise est dans le rouge : encore %{n} jours"
  nl: "Het bedrijf staat in de min: nog %{n} dagen"
  pl: "Firma jest na minusie: zostało %{n} dni"
  ru: "Компания в минусе: осталось %{n} дн."
  uk: "Компанія в мінусі: залишилося %{n} дн."
"The company has %{amount} in cash and its emergency loan running. Still in the red at the close of %{n} more days, it goes bankrupt: everything is sold and the company closes, its depots with it.":
  de: "Die Firma hat %{amount} in der Kasse und ihr Notkredit läuft. Ist sie am Ende von noch %{n} Tagen weiter im Minus, geht sie in Konkurs: Alles wird verkauft und die Firma schließt, ihre Depots mit ihr."
  fr: "L'entreprise a %{amount} en caisse et son prêt d'urgence en cours. Toujours dans le rouge à la clôture de %{n} jours de plus, elle fait faillite : tout est vendu et l'entreprise ferme, ses dépôts avec elle."
  nl: "Het bedrijf heeft %{amount} in kas en de noodlening loopt. Nog steeds in de min na nog %{n} dagen, dan gaat het failliet: alles wordt verkocht en het bedrijf sluit, zijn depots ook."
  pl: "Firma ma %{amount} w kasie i trwa jej pożyczka awaryjna. Jeśli po kolejnych %{n} dniach nadal będzie na minusie, zbankrutuje: wszystko zostanie sprzedane, a firma zamknięta wraz z zajezdniami."
  ru: "У компании %{amount} в кассе и действует экстренный кредит. Если и через %{n} дн. она будет в минусе, она обанкротится: всё будет продано, компания закроется вместе с депо."
  uk: "У компанії %{amount} у касі й діє екстрений кредит. Якщо й через %{n} дн. вона буде в мінусі, вона збанкрутує: усе буде продано, компанія закриється разом із депо."
"The company goes bankrupt tomorrow":
  de: "Die Firma geht morgen in Konkurs"
  fr: "L'entreprise fait faillite demain"
  nl: "Het bedrijf gaat morgen failliet"
  pl: "Firma zbankrutuje jutro"
  ru: "Компания обанкротится завтра"
  uk: "Компанія збанкрутує завтра"
"The company has %{amount} in cash and its emergency loan running. Still in the red at tomorrow's close, it goes bankrupt: everything is sold and the company closes, its depots with it.":
  de: "Die Firma hat %{amount} in der Kasse und ihr Notkredit läuft. Ist sie beim morgigen Abschluss weiter im Minus, geht sie in Konkurs: Alles wird verkauft und die Firma schließt, ihre Depots mit ihr."
  fr: "L'entreprise a %{amount} en caisse et son prêt d'urgence en cours. Toujours dans le rouge à la clôture de demain, elle fait faillite : tout est vendu et l'entreprise ferme, ses dépôts avec elle."
  nl: "Het bedrijf heeft %{amount} in kas en de noodlening loopt. Nog steeds in de min bij de afsluiting van morgen, dan gaat het failliet: alles wordt verkocht en het bedrijf sluit, zijn depots ook."
  pl: "Firma ma %{amount} w kasie i trwa jej pożyczka awaryjna. Jeśli przy jutrzejszym zamknięciu nadal będzie na minusie, zbankrutuje: wszystko zostanie sprzedane, a firma zamknięta wraz z zajezdniami."
  ru: "У компании %{amount} в кассе и действует экстренный кредит. Если при завтрашнем закрытии она будет в минусе, она обанкротится: всё будет продано, компания закроется вместе с депо."
  uk: "У компанії %{amount} у касі й діє екстрений кредит. Якщо під час завтрашнього закриття вона буде в мінусі, вона збанкрутує: усе буде продано, компанія закриється разом із депо."
"The head office %{name} is bankrupt":
  de: "Die Zentrale %{name} ist im Konkurs"
  fr: "Le siège %{name} a fait faillite"
  nl: "Het hoofdkantoor %{name} is failliet"
  pl: "Centrala %{name} zbankrutowała"
  ru: "Головной офис %{name} обанкротился"
  uk: "Головний офіс %{name} збанкрутував"
"The head office stayed in the red with its emergency loan running and is closed: this depot closes with it.":
  de: "Die Zentrale blieb mit laufendem Notkredit im Minus und ist geschlossen: Dieses Depot schließt mit ihr."
  fr: "Le siège est resté dans le rouge avec son prêt d'urgence en cours et a fermé : ce dépôt ferme avec lui."
  nl: "Het hoofdkantoor bleef in de min terwijl de noodlening liep en is gesloten: dit depot sluit mee."
  pl: "Centrala pozostała na minusie przy trwającej pożyczce awaryjnej i została zamknięta: ta zajezdnia zamyka się razem z nią."
  ru: "Головной офис остался в минусе при действующем экстренном кредите и закрыт: это депо закрывается вместе с ним."
  uk: "Головний офіс залишився в мінусі з діючим екстреним кредитом і закритий: це депо закривається разом із ним."
