"Each tour is run with the bus its timetable asks for, or a bigger one.":
  de: "Jeder Umlauf wird mit dem Bus gefahren, den sein Fahrplan verlangt, oder mit einem größeren."
  da: "Hvert vognløb køres med den bus, dets køreplan kræver, eller en større."
  fr: "Chaque service est assuré avec le bus que demande son horaire, ou un plus grand."
  nl: "Elke omloop wordt gereden met de bus die de dienstregeling vraagt, of een grotere."
  pl: "Każdy kurs jest obsługiwany autobusem, którego wymaga rozkład, albo większym."
  ru: "Каждый оборот обслуживается автобусом, который требует расписание, или более крупным."
  uk: "Кожен оберт обслуговується автобусом, якого вимагає розклад, або більшим."
