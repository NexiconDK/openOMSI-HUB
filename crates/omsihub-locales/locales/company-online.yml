"A purchase this big needs the head office's approval first: ask for it in the settings, under Depots.":
  de: "Ein so großer Kauf braucht zuerst die Zustimmung der Zentrale: Bitte in den Einstellungen unter Depots darum."
  fr: "Un achat aussi important nécessite d'abord l'accord du siège : demandez-le dans les paramètres, sous Dépôts."
  nl: "Een aankoop van deze omvang heeft eerst de goedkeuring van het hoofdkantoor nodig: vraag erom in de instellingen, onder Depots."
  pl: "Tak duży zakup wymaga najpierw zgody centrali: poproś o nią w ustawieniach, w części Zajezdnie."
  ru: "Такая крупная покупка сначала требует одобрения головного офиса: запросите его в настройках, в разделе «Депо»."
  uk: "Така велика покупка спершу потребує схвалення головного офісу: попросіть його в налаштуваннях, у розділі «Депо»."
