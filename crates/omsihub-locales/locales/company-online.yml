"Doubling ordered on line %{n}":
  de: "Verstärkerfahrt auf Linie %{n} bestellt"
  da: "Dublering bestilt på linje %{n}"
  fr: "Doublage commandé sur la ligne %{n}"
  nl: "Versterkingsrit besteld op lijn %{n}"
  pl: "Zamówiono kurs dodatkowy na linii %{n}"
  ru: "Заказан дополнительный рейс на линии %{n}"
  uk: "Замовлено додатковий рейс на лінії %{n}"
"The %{time} departure of tour %{tour} was full on %{full} of its last %{like} like days: the authority orders an extra bus right behind it on its like days from %{from} to %{until}. Paid by its timetable minutes: at your contract's price with one of the line's own buses standing free, at %{amount} an hour with another. Answer by 18:00 on %{by} on the Concessions page.":
  de: "Die Abfahrt um %{time} von Umlauf %{tour} war an %{full} ihrer letzten %{like} gleichen Tage voll: der Aufgabenträger bestellt an ihren gleichen Tagen vom %{from} bis %{until} einen Verstärkerbus direkt dahinter. Bezahlt nach Fahrplanminuten: zum Vertragspreis mit einem freien eigenen Bus der Linie, mit einem anderen zu %{amount} die Stunde. Antwort bis 18:00 Uhr am %{by} auf der Konzessionsseite."
  da: "Afgangen kl. %{time} på vognløb %{tour} var fuld %{full} af de sidste %{like} ens dage: trafikselskabet bestiller en ekstra bus lige bag den på de ens dage fra %{from} til %{until}. Betales efter køreplanminutter: til kontraktens pris med en af linjens egne busser, der holder ledig, til %{amount} i timen med en anden. Svar senest kl. 18 den %{by} på siden Koncessioner."
  fr: "Le départ de %{time} du service %{tour} était plein %{full} de ses %{like} derniers jours semblables : l'autorité commande un bus supplémentaire juste derrière ses jours semblables du %{from} au %{until}. Payé selon ses minutes d'horaire : au prix du contrat avec un bus libre de la ligne, à %{amount} de l'heure avec un autre. Réponse avant 18 h le %{by} sur la page Concessions."
  nl: "Het vertrek van %{time} van omloop %{tour} was vol op %{full} van de laatste %{like} gelijke dagen: de opdrachtgever bestelt een extra bus direct erachter op die dagen van %{from} tot %{until}. Betaald per dienstregelingsminuut: tegen de contractprijs met een vrije eigen bus van de lijn, tegen %{amount} per uur met een andere. Antwoord vóór 18:00 op %{by} op de pagina Concessies."
  pl: "Odjazd o %{time} z kursu %{tour} był pełny w %{full} z ostatnich %{like} podobnych dni: organizator zamawia dodatkowy autobus tuż za nim w te dni od %{from} do %{until}. Płatne według minut rozkładowych: po cenie umowy z wolnym autobusem linii, po %{amount} za godzinę z innym. Odpowiedź do 18:00 dnia %{by} na stronie Koncesje."
  ru: "Отправление в %{time} по выходу %{tour} было переполнено %{full} из последних %{like} таких же дней: заказчик заказывает дополнительный автобус сразу за ним в такие дни с %{from} по %{until}. Оплата по минутам расписания: по цене контракта со свободным автобусом линии, по %{amount} в час с другим. Ответ до 18:00 %{by} на странице «Концессии»."
  uk: "Відправлення о %{time} за випуском %{tour} було переповнене %{full} з останніх %{like} таких самих днів: замовник замовляє додатковий автобус одразу за ним у такі дні з %{from} по %{until}. Оплата за хвилинами розкладу: за ціною контракту з вільним автобусом лінії, по %{amount} за годину з іншим. Відповідь до 18:00 %{by} на сторінці «Концесії»."
"Doubling on line %{n}: yes":
  de: "Verstärkerfahrt auf Linie %{n}: ja"
  da: "Dublering på linje %{n}: ja"
  fr: "Doublage sur la ligne %{n} : oui"
  nl: "Versterkingsrit op lijn %{n}: ja"
  pl: "Kurs dodatkowy na linii %{n}: tak"
  ru: "Дополнительный рейс на линии %{n}: да"
  uk: "Додатковий рейс на лінії %{n}: так"
"Your dispatcher said yes to the extra bus behind the %{time} departure from %{from}: the company has the money for it.":
  de: "Deine Disposition hat dem Verstärkerbus hinter der Abfahrt um %{time} ab %{from} zugestimmt: die Firma hat das Geld dafür."
  da: "Din trafikleder sagde ja til den ekstra bus bag afgangen kl. %{time} fra %{from}: firmaet har pengene til det."
  fr: "Votre régulateur a accepté le bus supplémentaire derrière le départ de %{time} à partir du %{from} : l'entreprise en a les moyens."
  nl: "Je planner zei ja tegen de extra bus achter het vertrek van %{time} vanaf %{from}: het bedrijf heeft het geld ervoor."
  pl: "Twój dyspozytor zgodził się na dodatkowy autobus za odjazdem o %{time} od %{from}: firma ma na to pieniądze."
  ru: "Ваш диспетчер согласился на дополнительный автобус за отправлением в %{time} с %{from}: у компании есть на это деньги."
  uk: "Ваш диспетчер погодився на додатковий автобус за відправленням о %{time} з %{from}: компанія має на це гроші."
"Doubling on line %{n}: no":
  de: "Verstärkerfahrt auf Linie %{n}: nein"
  da: "Dublering på linje %{n}: nej"
  fr: "Doublage sur la ligne %{n} : non"
  nl: "Versterkingsrit op lijn %{n}: nee"
  pl: "Kurs dodatkowy na linii %{n}: nie"
  ru: "Дополнительный рейс на линии %{n}: нет"
  uk: "Додатковий рейс на лінії %{n}: ні"
"Your dispatcher said no to the extra bus behind the %{time} departure from %{from}: the company is short of money. Its full departures count as complaints against the quality bonus.":
  de: "Deine Disposition hat den Verstärkerbus hinter der Abfahrt um %{time} ab %{from} abgelehnt: der Firma fehlt das Geld. Ihre vollen Abfahrten zählen als Beschwerden gegen den Qualitätsbonus."
  da: "Din trafikleder sagde nej til den ekstra bus bag afgangen kl. %{time} fra %{from}: firmaet mangler penge. Dens fulde afgange tæller som klager mod kvalitetsbonussen."
  fr: "Votre régulateur a refusé le bus supplémentaire derrière le départ de %{time} à partir du %{from} : l'entreprise manque d'argent. Ses départs pleins comptent comme réclamations contre le bonus qualité."
  nl: "Je planner zei nee tegen de extra bus achter het vertrek van %{time} vanaf %{from}: het bedrijf komt geld tekort. De volle vertrekken tellen als klachten tegen de kwaliteitsbonus."
  pl: "Twój dyspozytor odmówił dodatkowego autobusu za odjazdem o %{time} od %{from}: firmie brakuje pieniędzy. Jego pełne odjazdy liczą się jako skargi przeciw premii jakościowej."
  ru: "Ваш диспетчер отказался от дополнительного автобуса за отправлением в %{time} с %{from}: у компании не хватает денег. Переполненные отправления считаются жалобами против бонуса за качество."
  uk: "Ваш диспетчер відмовився від додаткового автобуса за відправленням о %{time} з %{from}: компанії бракує грошей. Переповнені відправлення вважаються скаргами проти бонусу за якість."
"Doubling on line %{n} ordered":
  de: "Verstärkerfahrt auf Linie %{n} bestellt"
  da: "Dublering på linje %{n} bestilt"
  fr: "Doublage commandé sur la ligne %{n}"
  nl: "Versterkingsrit op lijn %{n} besteld"
  pl: "Zamówiono kurs dodatkowy na linii %{n}"
  ru: "Заказан дополнительный рейс на линии %{n}"
  uk: "Замовлено додатковий рейс на лінії %{n}"
"The authority orders an extra bus right behind the %{time} departure of tour %{tour} from %{from} to %{until}: it is on your duty board, to be run.":
  de: "Der Aufgabenträger bestellt vom %{from} bis %{until} einen Verstärkerbus direkt hinter der Abfahrt um %{time} von Umlauf %{tour}: er steht auf deinem Dienstplan und ist zu fahren."
  da: "Trafikselskabet bestiller en ekstra bus lige bag afgangen kl. %{time} på vognløb %{tour} fra %{from} til %{until}: den står på din vagtliste og skal køres."
  fr: "L'autorité commande un bus supplémentaire juste derrière le départ de %{time} du service %{tour} du %{from} au %{until} : il est sur votre tableau de service, à assurer."
  nl: "De opdrachtgever bestelt van %{from} tot %{until} een extra bus direct achter het vertrek van %{time} van omloop %{tour}: hij staat op je dienstrooster en moet rijden."
  pl: "Organizator zamawia dodatkowy autobus tuż za odjazdem o %{time} z kursu %{tour} od %{from} do %{until}: jest w twoim grafiku i trzeba go wykonać."
  ru: "Заказчик заказывает дополнительный автобус сразу за отправлением в %{time} по выходу %{tour} с %{from} по %{until}: он в вашем графике, его нужно выполнить."
  uk: "Замовник замовляє додатковий автобус одразу за відправленням о %{time} за випуском %{tour} з %{from} по %{until}: він у вашому графіку, його треба виконати."
"Too late: an order is answered by 18:00 the day before it begins.":
  de: "Zu spät: eine Bestellung wird bis 18:00 Uhr am Vortag beantwortet."
  da: "For sent: en bestilling besvares senest kl. 18 dagen før, den begynder."
  fr: "Trop tard : une commande se répond avant 18 h la veille de son début."
  nl: "Te laat: een bestelling wordt vóór 18:00 de dag ervoor beantwoord."
  pl: "Za późno: na zamówienie odpowiada się do 18:00 dzień przed jego początkiem."
  ru: "Слишком поздно: на заказ отвечают до 18:00 накануне его начала."
  uk: "Запізно: на замовлення відповідають до 18:00 напередодні його початку."
"There is no such order to answer.":
  de: "Es gibt keine solche Bestellung zu beantworten."
  da: "Der er ingen sådan bestilling at svare på."
  fr: "Il n'y a pas de telle commande à laquelle répondre."
  nl: "Er is geen zo'n bestelling om te beantwoorden."
  pl: "Nie ma takiego zamówienia do odpowiedzi."
  ru: "Такого заказа для ответа нет."
  uk: "Такого замовлення для відповіді немає."
"The authority's own order: it is to be run.":
  de: "Die eigene Bestellung des Aufgabenträgers: sie ist zu fahren."
  da: "Trafikselskabets egen bestilling: den skal køres."
  fr: "La commande de l'autorité elle-même : elle est à assurer."
  nl: "De eigen bestelling van de opdrachtgever: die moet rijden."
  pl: "Własne zamówienie organizatora: trzeba je wykonać."
  ru: "Собственный заказ заказчика: его нужно выполнить."
  uk: "Власне замовлення замовника: його треба виконати."
"a doubling run":
  de: "eine Verstärkerfahrt"
  da: "en dubleringstur"
  fr: "un doublage effectué"
  nl: "een versterkingsrit"
  pl: "kurs dodatkowy"
  ru: "дополнительный рейс"
  uk: "додатковий рейс"
"The authority changes your contract %{name} from %{date}: %{hours} timetable hours a week (%{before} → %{after}), %{buses} contract buses, %{stops} stops. Plan your duties for it.":
  de: "Der Aufgabenträger ändert deinen Vertrag %{name} ab %{date}: %{hours} Fahrplanstunden pro Woche (%{before} → %{after}), %{buses} Vertragsbusse, %{stops} Haltestellen. Plane deine Dienste dafür."
  da: "Trafikselskabet ændrer din kontrakt %{name} fra %{date}: %{hours} køreplantimer om ugen (%{before} → %{after}), %{buses} kontraktbusser, %{stops} stoppesteder. Læg dine vagter om efter det."
  fr: "L'autorité modifie votre contrat %{name} à partir du %{date} : %{hours} heures d'horaire par semaine (%{before} → %{after}), %{buses} bus du contrat, %{stops} arrêts. Planifiez vos services en conséquence."
  nl: "De opdrachtgever wijzigt je contract %{name} vanaf %{date}: %{hours} dienstregelingsuren per week (%{before} → %{after}), %{buses} contractbussen, %{stops} haltes. Plan je diensten erop."
  pl: "Organizator zmienia twoją umowę %{name} od %{date}: %{hours} godzin rozkładowych tygodniowo (%{before} → %{after}), %{buses} autobusów umowy, %{stops} przystanków. Zaplanuj pod to swoje służby."
  ru: "Заказчик меняет ваш контракт %{name} с %{date}: %{hours} часов по расписанию в неделю (%{before} → %{after}), %{buses} автобусов по контракту, %{stops} остановок. Спланируйте смены под это."
  uk: "Замовник змінює ваш контракт %{name} з %{date}: %{hours} годин за розкладом на тиждень (%{before} → %{after}), %{buses} автобусів за контрактом, %{stops} зупинок. Сплануйте зміни під це."
"It is more than you must run without a say: you may decline it until %{date} on the Concessions page.":
  de: "Das ist mehr, als du ohne Mitsprache fahren musst: du kannst es bis %{date} auf der Seite Konzessionen ablehnen."
  da: "Det er mere, end du skal køre uden at blive spurgt: du kan afslå det indtil %{date} på siden Koncessioner."
  fr: "C'est plus que ce que vous devez exploiter sans avoir votre mot à dire : vous pouvez refuser jusqu'au %{date} sur la page Concessions."
  nl: "Dat is meer dan je zonder inspraak moet rijden: je kunt het tot %{date} weigeren op de pagina Concessies."
  pl: "To więcej, niż musisz obsługiwać bez zgody: możesz odmówić do %{date} na stronie Koncesje."
  ru: "Это больше, чем вы обязаны выполнять без согласия: можно отказаться до %{date} на странице Концессии."
  uk: "Це більше, ніж ви мусите виконувати без згоди: можна відмовитися до %{date} на сторінці Концесії."
"Your contract %{name} runs changed from today: %{hours} timetable hours a week, %{buses} contract buses.":
  de: "Dein Vertrag %{name} läuft ab heute geändert: %{hours} Fahrplanstunden pro Woche, %{buses} Vertragsbusse."
  da: "Din kontrakt %{name} kører ændret fra i dag: %{hours} køreplantimer om ugen, %{buses} kontraktbusser."
  fr: "Votre contrat %{name} fonctionne modifié dès aujourd'hui : %{hours} heures d'horaire par semaine, %{buses} bus du contrat."
  nl: "Je contract %{name} loopt vanaf vandaag gewijzigd: %{hours} dienstregelingsuren per week, %{buses} contractbussen."
  pl: "Twoja umowa %{name} od dziś działa zmieniona: %{hours} godzin rozkładowych tygodniowo, %{buses} autobusów umowy."
  ru: "Ваш контракт %{name} с сегодняшнего дня изменён: %{hours} часов по расписанию в неделю, %{buses} автобусов по контракту."
  uk: "Ваш контракт %{name} від сьогодні змінено: %{hours} годин за розкладом на тиждень, %{buses} автобусів за контрактом."
"You declined the change of your contract %{name}: line %{n} goes out to tender on its own.":
  de: "Du hast die Änderung deines Vertrags %{name} abgelehnt: Linie %{n} wird allein ausgeschrieben."
  da: "Du har afslået ændringen af din kontrakt %{name}: linje %{n} kommer i udbud for sig."
  fr: "Vous avez refusé la modification de votre contrat %{name} : la ligne %{n} est mise en appel d'offres seule."
  nl: "Je hebt de wijziging van je contract %{name} geweigerd: lijn %{n} wordt apart aanbesteed."
  pl: "Odmówiłeś zmiany umowy %{name}: linia %{n} trafia do przetargu osobno."
  ru: "Вы отказались от изменения контракта %{name}: маршрут %{n} выставляется на тендер отдельно."
  uk: "Ви відмовилися від зміни контракту %{name}: маршрут %{n} виставляють на тендер окремо."
"You declined the change of your contract %{name}: it ends on %{date}, and its lines go out to tender again.":
  de: "Du hast die Änderung deines Vertrags %{name} abgelehnt: er endet am %{date}, und seine Linien werden neu ausgeschrieben."
  da: "Du har afslået ændringen af din kontrakt %{name}: den slutter %{date}, og dens linjer kommer i udbud igen."
  fr: "Vous avez refusé la modification de votre contrat %{name} : il prend fin le %{date} et ses lignes sont remises en appel d'offres."
  nl: "Je hebt de wijziging van je contract %{name} geweigerd: het eindigt op %{date} en de lijnen worden opnieuw aanbesteed."
  pl: "Odmówiłeś zmiany umowy %{name}: kończy się %{date}, a jej linie wracają do przetargu."
  ru: "Вы отказались от изменения контракта %{name}: он заканчивается %{date}, а его маршруты снова выставляются на тендер."
  uk: "Ви відмовилися від зміни контракту %{name}: він закінчується %{date}, а його маршрути знову виставляють на тендер."
"There is no such change to decline.":
  de: "Es gibt keine solche Änderung zum Ablehnen."
  da: "Der er ingen sådan ændring at afslå."
  fr: "Il n'y a pas de telle modification à refuser."
  nl: "Er is geen zulke wijziging om te weigeren."
  pl: "Nie ma takiej zmiany do odrzucenia."
  ru: "Нет такого изменения для отказа."
  uk: "Немає такої зміни для відмови."
"This change is within what you must run: it cannot be declined.":
  de: "Diese Änderung liegt innerhalb dessen, was du fahren musst: sie kann nicht abgelehnt werden."
  da: "Ændringen ligger inden for det, du skal køre: den kan ikke afslås."
  fr: "Cette modification reste dans ce que vous devez exploiter : elle ne peut pas être refusée."
  nl: "Deze wijziging valt binnen wat je moet rijden: ze kan niet worden geweigerd."
  pl: "Ta zmiana mieści się w tym, co musisz obsługiwać: nie można jej odrzucić."
  ru: "Это изменение в пределах обязательного: от него нельзя отказаться."
  uk: "Ця зміна в межах обов'язкового: від неї не можна відмовитися."
"Your bus has a fault: drive to the next stop, set the passengers down and wait. The spare bus takes over the rest of your block.":
  de: "Dein Bus hat einen Defekt: Fahre zur nächsten Haltestelle, lass die Fahrgäste aussteigen und warte. Der Reservebus übernimmt den Rest deines Umlaufs."
  da: "Din bus har en fejl: kør til næste stoppested, sæt passagererne af og vent. Reservebussen overtager resten af dit vognløb."
  fr: "Votre bus est en panne : allez jusqu'au prochain arrêt, faites descendre les voyageurs et attendez. Le bus de réserve reprend le reste de votre service."
  nl: "Je bus heeft een storing: rijd naar de volgende halte, laat de reizigers uitstappen en wacht. De reservebus neemt de rest van je omloop over."
  pl: "Twój autobus ma usterkę: dojedź do najbliższego przystanku, wysadź pasażerów i czekaj. Autobus rezerwowy przejmie resztę twojego kursu."
  ru: "У вашего автобуса неисправность: доедьте до ближайшей остановки, высадите пассажиров и ждите. Резервный автобус возьмёт оставшуюся часть рейса."
  uk: "Ваш автобус несправний: доїдьте до найближчої зупинки, висадіть пасажирів і чекайте. Резервний автобус візьме решту рейсу."
"Your bus had an accident: stop at the next safe place and set the passengers down. The spare bus takes over the rest of your block.":
  de: "Dein Bus hatte einen Unfall: Halte an der nächsten sicheren Stelle und lass die Fahrgäste aussteigen. Der Reservebus übernimmt den Rest deines Umlaufs."
  da: "Din bus har været i et uheld: stands ved næste sikre sted og sæt passagererne af. Reservebussen overtager resten af dit vognløb."
  fr: "Votre bus a eu un accident : arrêtez-vous au prochain endroit sûr et faites descendre les voyageurs. Le bus de réserve reprend le reste de votre service."
  nl: "Je bus heeft een ongeluk gehad: stop op de volgende veilige plek en laat de reizigers uitstappen. De reservebus neemt de rest van je omloop over."
  pl: "Twój autobus miał wypadek: zatrzymaj się w najbliższym bezpiecznym miejscu i wysadź pasażerów. Autobus rezerwowy przejmie resztę twojego kursu."
  ru: "Ваш автобус попал в аварию: остановитесь в ближайшем безопасном месте и высадите пассажиров. Резервный автобус возьмёт оставшуюся часть рейса."
  uk: "Ваш автобус потрапив в аварію: зупиніться в найближчому безпечному місці й висадіть пасажирів. Резервний автобус візьме решту рейсу."
"The drivers strike":
  de: "Die Fahrer streiken"
  da: "Chaufførerne strejker"
  fr: "Les conducteurs sont en grève"
  nl: "De chauffeurs staken"
  pl: "Kierowcy strajkują"
  ru: "Водители бастуют"
  uk: "Водії страйкують"
"The line is not in service":
  de: "Die Linie ist nicht in Betrieb"
  da: "Linjen er ikke i drift"
  fr: "La ligne n'est pas en service"
  nl: "De lijn is niet in dienst"
  pl: "Linia nie jest obsługiwana"
  ru: "Линия не обслуживается"
  uk: "Лінія не обслуговується"
"The authority inspected %{buses} buses of line %{n}: %{faults} faults, %{amount}":
  de: "Der Aufgabenträger hat %{buses} Busse der Linie %{n} kontrolliert: %{faults} Mängel, %{amount}"
  da: "Trafikselskabet har kontrolleret %{buses} busser på linje %{n}: %{faults} fejl, %{amount}"
  fr: "L'autorité a contrôlé %{buses} bus de la ligne %{n} : %{faults} défauts, %{amount}"
  nl: "De opdrachtgever heeft %{buses} bussen van lijn %{n} gecontroleerd: %{faults} gebreken, %{amount}"
  pl: "Organizator skontrolował %{buses} autobusy linii %{n}: %{faults} usterek, %{amount}"
  ru: "Заказчик проверил %{buses} автобусов линии %{n}: %{faults} нарушений, %{amount}"
  uk: "Замовник перевірив %{buses} автобусів лінії %{n}: %{faults} порушень, %{amount}"
"The authority warns: %{share} % of line %{n}'s journeys dropped this week":
  de: "Der Aufgabenträger mahnt: %{share} % der Fahrten der Linie %{n} sind diese Woche ausgefallen"
  da: "Trafikselskabet advarer: %{share} % af turene på linje %{n} er udgået i denne uge"
  fr: "L'autorité avertit : %{share} % des courses de la ligne %{n} supprimées cette semaine"
  nl: "De opdrachtgever waarschuwt: %{share} % van de ritten van lijn %{n} is deze week uitgevallen"
  pl: "Organizator ostrzega: %{share} % kursów linii %{n} odwołano w tym tygodniu"
  ru: "Заказчик предупреждает: %{share} % рейсов линии %{n} сорвано на этой неделе"
  uk: "Замовник попереджає: %{share} % рейсів лінії %{n} зірвано цього тижня"
"The authority ends the contract of line %{n} on %{date}: %{share} % of its journeys dropped":
  de: "Der Aufgabenträger beendet den Vertrag der Linie %{n} zum %{date}: %{share} % ihrer Fahrten ausgefallen"
  da: "Trafikselskabet opsiger kontrakten på linje %{n} pr. %{date}: %{share} % af turene udgået"
  fr: "L'autorité met fin au contrat de la ligne %{n} le %{date} : %{share} % de ses courses supprimées"
  nl: "De opdrachtgever beëindigt het contract van lijn %{n} op %{date}: %{share} % van de ritten uitgevallen"
  pl: "Organizator kończy umowę na linię %{n} z dniem %{date}: odwołano %{share} % kursów"
  ru: "Заказчик расторгает контракт линии %{n} с %{date}: сорвано %{share} % рейсов"
  uk: "Замовник розриває контракт лінії %{n} з %{date}: зірвано %{share} % рейсів"
"Line %{n} is not in service: its %{journeys} journeys were dropped":
  de: "Linie %{n} ist nicht in Betrieb: ihre %{journeys} Fahrten sind ausgefallen"
  da: "Linje %{n} er ikke i drift: dens %{journeys} ture er udgået"
  fr: "La ligne %{n} n'est pas en service : ses %{journeys} courses ont été supprimées"
  nl: "Lijn %{n} is niet in dienst: de %{journeys} ritten zijn uitgevallen"
  pl: "Linia %{n} nie jest obsługiwana: odwołano jej %{journeys} kursów"
  ru: "Линия %{n} не обслуживается: %{journeys} её рейсов сорвано"
  uk: "Лінія %{n} не обслуговується: %{journeys} її рейсів зірвано"
"The authority's inspection":
  de: "Kontrolle des Aufgabenträgers"
  da: "Trafikselskabets kontrol"
  fr: "Le contrôle de l'autorité"
  nl: "Controle van de opdrachtgever"
  pl: "Kontrola organizatora"
  ru: "Проверка заказчика"
  uk: "Перевірка замовника"
"The authority inspected %{buses} buses of line %{n}: %{dirty} dirty, %{damaged} damaged, %{screens} without the passenger information asked - %{amount} in fines.":
  de: "Der Aufgabenträger hat %{buses} Busse der Linie %{n} kontrolliert: %{dirty} schmutzig, %{damaged} beschädigt, %{screens} ohne die verlangte Fahrgastinformation - %{amount} Strafe."
  da: "Trafikselskabet har kontrolleret %{buses} busser på linje %{n}: %{dirty} beskidte, %{damaged} beskadigede, %{screens} uden den krævede passagerinformation - %{amount} i bod."
  fr: "L'autorité a contrôlé %{buses} bus de la ligne %{n} : %{dirty} sales, %{damaged} endommagés, %{screens} sans l'information voyageurs demandée - %{amount} d'amendes."
  nl: "De opdrachtgever heeft %{buses} bussen van lijn %{n} gecontroleerd: %{dirty} vuil, %{damaged} beschadigd, %{screens} zonder de gevraagde reizigersinformatie - %{amount} aan boetes."
  pl: "Organizator skontrolował %{buses} autobusy linii %{n}: %{dirty} brudne, %{damaged} uszkodzone, %{screens} bez wymaganej informacji pasażerskiej - %{amount} kar."
  ru: "Заказчик проверил %{buses} автобусов линии %{n}: %{dirty} грязных, %{damaged} повреждённых, %{screens} без требуемой информации для пассажиров - штрафы %{amount}."
  uk: "Замовник перевірив %{buses} автобусів лінії %{n}: %{dirty} брудних, %{damaged} пошкоджених, %{screens} без потрібної інформації для пасажирів - штрафи %{amount}."
"Warning from the authority":
  de: "Abmahnung des Aufgabenträgers"
  da: "Advarsel fra trafikselskabet"
  fr: "Avertissement de l'autorité"
  nl: "Waarschuwing van de opdrachtgever"
  pl: "Ostrzeżenie organizatora"
  ru: "Предупреждение заказчика"
  uk: "Попередження замовника"
"%{share} % of the journeys of line %{n} were dropped this week, more than 3 %: another such week within four weeks ends the contract.":
  de: "%{share} % der Fahrten der Linie %{n} sind diese Woche ausgefallen, mehr als 3 %: noch so eine Woche innerhalb von vier Wochen beendet den Vertrag."
  da: "%{share} % af turene på linje %{n} er udgået i denne uge, mere end 3 %: endnu en sådan uge inden for fire uger opsiger kontrakten."
  fr: "%{share} % des courses de la ligne %{n} ont été supprimées cette semaine, plus de 3 % : une autre semaine pareille dans les quatre semaines met fin au contrat."
  nl: "%{share} % van de ritten van lijn %{n} is deze week uitgevallen, meer dan 3 %: nog zo'n week binnen vier weken beëindigt het contract."
  pl: "W tym tygodniu odwołano %{share} % kursów linii %{n}, ponad 3 %: kolejny taki tydzień w ciągu czterech tygodni kończy umowę."
  ru: "На этой неделе сорвано %{share} % рейсов линии %{n}, больше 3 %: ещё одна такая неделя в течение четырёх недель расторгнет контракт."
  uk: "Цього тижня зірвано %{share} % рейсів лінії %{n}, більше 3 %: ще один такий тиждень протягом чотирьох тижнів розірве контракт."
"Contract ended for journeys dropped":
  de: "Vertrag wegen ausgefallener Fahrten beendet"
  da: "Kontrakt opsagt for udgåede ture"
  fr: "Contrat résilié pour courses supprimées"
  nl: "Contract beëindigd wegens uitgevallen ritten"
  pl: "Umowa rozwiązana za odwołane kursy"
  ru: "Контракт расторгнут за сорванные рейсы"
  uk: "Контракт розірвано за зірвані рейси"
"%{share} % of the journeys of line %{n} were dropped this week, after a warning: the authority ends the contract on %{date}, and the line goes out to tender again.":
  de: "%{share} % der Fahrten der Linie %{n} sind diese Woche ausgefallen, nach einer Abmahnung: der Aufgabenträger beendet den Vertrag zum %{date}, und die Linie wird neu ausgeschrieben."
  da: "%{share} % af turene på linje %{n} er udgået i denne uge efter en advarsel: trafikselskabet opsiger kontrakten pr. %{date}, og linjen kommer i udbud igen."
  fr: "%{share} % des courses de la ligne %{n} ont été supprimées cette semaine, après un avertissement : l'autorité met fin au contrat le %{date} et la ligne est de nouveau mise en appel d'offres."
  nl: "%{share} % van de ritten van lijn %{n} is deze week uitgevallen, na een waarschuwing: de opdrachtgever beëindigt het contract op %{date} en de lijn wordt opnieuw aanbesteed."
  pl: "W tym tygodniu odwołano %{share} % kursów linii %{n}, po ostrzeżeniu: organizator kończy umowę z dniem %{date}, a linia trafia ponownie do przetargu."
  ru: "На этой неделе сорвано %{share} % рейсов линии %{n} после предупреждения: заказчик расторгает контракт с %{date}, линия снова выставляется на тендер."
  uk: "Цього тижня зірвано %{share} % рейсів лінії %{n} після попередження: замовник розриває контракт з %{date}, лінію знову виставляють на тендер."
"Line not in service":
  de: "Linie nicht in Betrieb"
  da: "Linje ikke i drift"
  fr: "Ligne hors service"
  nl: "Lijn niet in dienst"
  pl: "Linia nieobsługiwana"
  ru: "Линия не обслуживается"
  uk: "Лінія не обслуговується"
"Line %{n} of the contract you won is not in service: its %{journeys} journeys today are dropped - fined, and off the quality bonus.":
  de: "Linie %{n} des gewonnenen Vertrags ist nicht in Betrieb: ihre %{journeys} Fahrten heute fallen aus - mit Strafe und vom Qualitätsbonus abgezogen."
  da: "Linje %{n} i den kontrakt, du har vundet, er ikke i drift: dens %{journeys} ture i dag er udgået - med bod og fradrag i kvalitetsbonussen."
  fr: "La ligne %{n} du contrat que vous avez gagné n'est pas en service : ses %{journeys} courses d'aujourd'hui sont supprimées - avec amende et retenue sur le bonus qualité."
  nl: "Lijn %{n} van het gewonnen contract is niet in dienst: de %{journeys} ritten van vandaag vallen uit - met boete en aftrek van de kwaliteitsbonus."
  pl: "Linia %{n} z wygranej umowy nie jest obsługiwana: jej %{journeys} dzisiejszych kursów odwołano - z karą i potrąceniem z premii jakościowej."
  ru: "Линия %{n} выигранного контракта не обслуживается: её %{journeys} рейсов сегодня сорваны - штраф и вычет из премии за качество."
  uk: "Лінія %{n} виграного контракту не обслуговується: її %{journeys} рейсів сьогодні зірвано - штраф і вирахування з премії за якість."
"Only a company that bid and lost may complain about the award.":
  de: "Nur eine Firma, die geboten und verloren hat, kann sich über die Vergabe beschweren."
  da: "Kun et firma, der har budt og tabt, kan klage over tildelingen."
  fr: "Seule une entreprise qui a soumissionné et perdu peut contester l'attribution."
  nl: "Alleen een bedrijf dat heeft geboden en verloren kan over de gunning klagen."
  pl: "Tylko firma, która złożyła ofertę i przegrała, może złożyć skargę na rozstrzygnięcie."
  ru: "Обжаловать присуждение может только компания, которая делала ставку и проиграла."
  uk: "Оскаржити присудження може лише компанія, яка робила ставку й програла."
"The contract has started: complaints are taken until the day before its start.":
  de: "Der Vertrag hat begonnen: Beschwerden werden bis zum Tag vor seinem Beginn angenommen."
  da: "Kontrakten er startet: klager modtages indtil dagen før start."
  fr: "Le contrat a commencé : les réclamations sont reçues jusqu'à la veille du début."
  nl: "Het contract is begonnen: klachten worden tot de dag vóór de start aangenomen."
  pl: "Umowa się rozpoczęła: skargi przyjmowane są do dnia przed jej startem."
  ru: "Контракт уже начался: жалобы принимаются до дня перед его началом."
  uk: "Контракт уже почався: скарги приймають до дня перед його початком."
"Your complaint about this award is with the authority already.":
  de: "Deine Beschwerde über diese Vergabe liegt dem Aufgabenträger schon vor."
  da: "Din klage over denne tildeling ligger allerede hos trafikselskabet."
  fr: "Votre réclamation sur cette attribution est déjà auprès de l'autorité."
  nl: "Je klacht over deze gunning ligt al bij de opdrachtgever."
  pl: "Twoja skarga na to rozstrzygnięcie jest już u organizatora."
  ru: "Ваша жалоба на это присуждение уже у заказчика."
  uk: "Ваша скарга на це присудження вже в замовника."
"Say why you complain.":
  de: "Sag, warum du dich beschwerst."
  da: "Skriv, hvorfor du klager."
  fr: "Dites pourquoi vous faites réclamation."
  nl: "Zeg waarom je klaagt."
  pl: "Napisz, dlaczego składasz skargę."
  ru: "Укажите, почему вы жалуетесь."
  uk: "Вкажіть, чому ви скаржитеся."
"Your complaint about the award of %{n} is with the authority: it decides before the start.":
  de: "Deine Beschwerde über die Vergabe von %{n} liegt beim Aufgabenträger: er entscheidet vor dem Beginn."
  da: "Din klage over tildelingen af %{n} ligger hos trafikselskabet: det afgør den før start."
  fr: "Votre réclamation sur l'attribution de %{n} est auprès de l'autorité : elle décide avant le début."
  nl: "Je klacht over de gunning van %{n} ligt bij de opdrachtgever: die beslist vóór de start."
  pl: "Twoja skarga na rozstrzygnięcie %{n} jest u organizatora: zdecyduje przed startem."
  ru: "Ваша жалоба на присуждение %{n} у заказчика: он решит до начала."
  uk: "Ваша скарга на присудження %{n} у замовника: він вирішить до початку."
"The authority looked at your complaint about the award of %{n}: the award stands.":
  de: "Der Aufgabenträger hat deine Beschwerde über die Vergabe von %{n} geprüft: die Vergabe bleibt."
  da: "Trafikselskabet har set på din klage over tildelingen af %{n}: tildelingen står ved magt."
  fr: "L'autorité a examiné votre réclamation sur l'attribution de %{n} : l'attribution est maintenue."
  nl: "De opdrachtgever heeft je klacht over de gunning van %{n} bekeken: de gunning blijft staan."
  pl: "Organizator rozpatrzył twoją skargę na rozstrzygnięcie %{n}: rozstrzygnięcie pozostaje."
  ru: "Заказчик рассмотрел вашу жалобу на присуждение %{n}: решение остаётся в силе."
  uk: "Замовник розглянув вашу скаргу на присудження %{n}: рішення залишається чинним."
"Upon a complaint the authority gives %{n} to %{who} instead: your contract on it is withdrawn.":
  de: "Auf eine Beschwerde hin vergibt der Aufgabenträger %{n} stattdessen an %{who}: dein Vertrag darüber wird zurückgezogen."
  da: "Efter en klage giver trafikselskabet i stedet %{n} til %{who}: din kontrakt på den trækkes tilbage."
  fr: "Suite à une réclamation, l'autorité attribue %{n} à %{who} à la place : votre contrat est retiré."
  nl: "Na een klacht gunt de opdrachtgever %{n} in plaats daarvan aan %{who}: je contract erop wordt ingetrokken."
  pl: "Po skardze organizator przyznaje %{n} zamiast tego firmie %{who}: twoja umowa zostaje wycofana."
  ru: "По жалобе заказчик отдаёт %{n} компании %{who}: ваш контракт отзывается."
  uk: "За скаргою замовник віддає %{n} компанії %{who}: ваш контракт відкликано."
"Upon a complaint the authority gives %{n} to you after all, for %{amount}: the concession runs until %{date}.":
  de: "Auf eine Beschwerde hin vergibt der Aufgabenträger %{n} doch an dich, für %{amount}: die Konzession läuft bis %{date}."
  da: "Efter en klage giver trafikselskabet alligevel %{n} til dig, for %{amount}: koncessionen løber til %{date}."
  fr: "Suite à une réclamation, l'autorité vous attribue finalement %{n}, pour %{amount} : la concession court jusqu'au %{date}."
  nl: "Na een klacht gunt de opdrachtgever %{n} toch aan jou, voor %{amount}: de concessie loopt tot %{date}."
  pl: "Po skardze organizator jednak przyznaje %{n} tobie, za %{amount}: koncesja trwa do %{date}."
  ru: "По жалобе заказчик всё же отдаёт %{n} вам, за %{amount}: концессия действует до %{date}."
  uk: "За скаргою замовник усе ж віддає %{n} вам, за %{amount}: концесія діє до %{date}."
"Upon a complaint the authority gives %{n} to %{who} instead.":
  de: "Auf eine Beschwerde hin vergibt der Aufgabenträger %{n} stattdessen an %{who}."
  da: "Efter en klage giver trafikselskabet i stedet %{n} til %{who}."
  fr: "Suite à une réclamation, l'autorité attribue %{n} à %{who} à la place."
  nl: "Na een klacht gunt de opdrachtgever %{n} in plaats daarvan aan %{who}."
  pl: "Po skardze organizator przyznaje %{n} zamiast tego firmie %{who}."
  ru: "По жалобе заказчик отдаёт %{n} компании %{who}."
  uk: "За скаргою замовник віддає %{n} компанії %{who}."
"The complaint could not be written.":
  de: "Die Beschwerde konnte nicht geschrieben werden."
  da: "Klagen kunne ikke skrives."
  fr: "La réclamation n'a pas pu être écrite."
  nl: "De klacht kon niet worden weggeschreven."
