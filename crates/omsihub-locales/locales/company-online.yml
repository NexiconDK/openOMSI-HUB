"Closes at its next step":
  de: "Schließt bei seinem nächsten Schritt"
  da: "Lukker ved næste skridt"
  fr: "Ferme à sa prochaine étape"
  nl: "Sluit bij de volgende stap"
  pl: "Zamyka się w następnym kroku"
  ru: "Закроется на следующем шаге"
  uk: "Закриється на наступному кроці"
"The depot closes at its next step, within a minute: the buses it owns go to the depot you choose, as far as its yard has room, or are sold; a leased or rented bus is handed back. Its staff are let go and its lines go out to tender again. What is left of its money goes to the treasury, and a loss is covered by it. This cannot be undone.":
  de: "Das Depot schließt bei seinem nächsten Schritt, innerhalb einer Minute: Seine eigenen Busse gehen an das gewählte Depot, soweit dessen Hof Platz hat, oder werden verkauft; ein geleaster oder gemieteter Bus wird zurückgegeben. Sein Personal wird entlassen und seine Linien werden neu ausgeschrieben. Was von seinem Geld übrig ist, geht an die Kasse der Zentrale, die auch einen Verlust deckt. Das kann nicht rückgängig gemacht werden."
  da: "Garagen lukker ved sit næste skridt, inden for et minut: dens egne busser kører til den garage, du vælger, så langt der er plads i gården, eller sælges; en leaset eller lejet bus leveres tilbage. Personalet afskediges, og linjerne kommer i udbud igen. Det, der er tilbage af pengene, går til kassen, og et underskud dækkes af den. Det kan ikke fortrydes."
  fr: "Le dépôt ferme à sa prochaine étape, en moins d'une minute : les bus qui lui appartiennent vont au dépôt choisi, dans la limite de la place dans sa cour, ou sont vendus ; un bus en leasing ou loué est rendu. Son personnel est licencié et ses lignes sont remises en appel d'offres. Ce qui reste de son argent va à la trésorerie, qui couvre aussi une perte. C'est irréversible."
  nl: "De remise sluit bij de volgende stap, binnen een minuut: de eigen bussen gaan naar de gekozen remise, voor zover daar plaats is, of worden verkocht; een geleasde of gehuurde bus gaat terug. Het personeel wordt ontslagen en de lijnen worden opnieuw aanbesteed. Wat er over is van het geld gaat naar de kas van het hoofdkantoor, die ook een verlies dekt. Dit kan niet ongedaan worden gemaakt."
  pl: "Zajezdnia zamyka się w następnym kroku, w ciągu minuty: jej własne autobusy trafiają do wybranej zajezdni, o ile jest tam miejsce, albo zostają sprzedane; autobus w leasingu lub wynajmie jest zwracany. Personel zostaje zwolniony, a linie wracają do przetargu. Pozostałe pieniądze trafiają do kasy centrali, która pokrywa też stratę. Tego nie można cofnąć."
  ru: "Депо закроется на следующем шаге, в течение минуты: его собственные автобусы уйдут в выбранное депо, насколько там хватит места, или будут проданы; автобус в лизинге или аренде будет возвращён. Персонал уволят, линии снова выставят на тендер. Оставшиеся деньги уйдут в казну головного офиса, который покроет и убыток. Это нельзя отменить."
  uk: "Депо закриється на наступному кроці, протягом хвилини: його власні автобуси підуть до вибраного депо, наскільки там вистачить місця, або будуть продані; автобус у лізингу чи оренді повернуть. Персонал звільнять, лінії знову виставлять на тендер. Залишок грошей піде до каси головного офісу, який покриє і збиток. Це не можна скасувати."
