"AI drivers left to hire on this map: %{free} of %{pool}. None left, agency drivers run the duties nobody drives.":
  de: "KI-Fahrer, die auf dieser Karte noch einzustellen sind: %{free} von %{pool}. Sind keine mehr da, fahren Leihfahrer die Dienste, die niemand fährt."
  da: "AI-chauffører tilbage at ansætte på dette kort: %{free} af %{pool}. Er der ingen tilbage, kører vikarchauffører de vagter, som ingen kører."
  fr: "Conducteurs IA encore à embaucher sur cette carte : %{free} sur %{pool}. S'il n'en reste plus, des intérimaires assurent les services que personne ne conduit."
  nl: "AI-chauffeurs nog aan te nemen op deze kaart: %{free} van %{pool}. Zijn er geen meer, dan rijden uitzendchauffeurs de diensten die niemand rijdt."
  pl: "Kierowcy AI do zatrudnienia na tej mapie: %{free} z %{pool}. Gdy ich zabraknie, służby, których nikt nie prowadzi, obsługują kierowcy z agencji."
