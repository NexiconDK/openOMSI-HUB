  de: "%{amount} je Abfahrt mehr als eine Minute zu früh"
  fr: "%{amount} par départ plus d'une minute en avance"
  nl: "%{amount} per vertrek meer dan een minuut te vroeg"
  pl: "%{amount} za odjazd ponad minutę za wcześnie"
  ru: "%{amount} за отъезд раньше более чем на минуту"
  uk: "%{amount} за від'їзд раніше більш ніж на хвилину"
"Leaving a stop late":
