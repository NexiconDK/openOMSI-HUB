"Nobody is on the dispatcher's duty: the control room decides by itself.":
  de: "Niemand hat Disponentendienst: die Leitstelle entscheidet selbst."
  da: "Ingen har trafiklederens vagt: kontrolrummet bestemmer selv."
  fr: "Personne n'est au poste de régulateur : le PC de régulation décide seul."
  nl: "Niemand heeft dispatcherdienst: de verkeersleiding beslist zelf."
  pl: "Nikt nie pełni dyżuru dyspozytora: centrum sterowania decyduje samo."
  ru: "Никто не дежурит диспетчером: диспетчерская решает сама."
  uk: "Ніхто не чергує диспетчером: диспетчерська вирішує сама."
