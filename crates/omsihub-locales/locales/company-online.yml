"Every company of a big server, on its maps, around the clock: join one, or found your own from the money you earn there.":
  de: "Alle Betriebe eines großen Servers, auf seinen Karten, rund um die Uhr: tritt einem bei oder gründe deinen eigenen mit dem Geld, das du dort verdienst."
  fr: "Toutes les entreprises d'un grand serveur, sur ses cartes, 24 h/24 : rejoignez-en une, ou fondez la vôtre avec l'argent que vous y gagnez."
  nl: "Alle bedrijven van een grote server, op zijn kaarten, de klok rond: doe mee met een bedrijf, of richt je eigen op met het geld dat je daar verdient."
  pl: "Wszystkie firmy dużego serwera, na jego mapach, przez całą dobę: dołącz do jednej albo załóż własną za pieniądze, które tam zarobisz."
  ru: "Все компании большого сервера, на его картах, круглосуточно: присоединитесь к одной или основайте свою на деньги, заработанные там."
  uk: "Усі компанії великого сервера, на його мапах, цілодобово: приєднайтеся до однієї або заснуйте власну за гроші, зароблені там."
"With the server's code":
  de: "Mit dem Code des Servers"
  fr: "Avec le code du serveur"
  nl: "Met de code van de server"
  pl: "Z kodem serwera"
  ru: "С кодом сервера"
  uk: "З кодом сервера"
"Every company of a big server, on its maps, around the clock. Log in with your Omsi-Hub account or your Steam account, join a company or found your own.":
  de: "Alle Betriebe eines großen Servers, auf seinen Karten, rund um die Uhr. Melde dich mit deinem Omsi-Hub-Konto oder deinem Steam-Konto an, tritt einem Betrieb bei oder gründe deinen eigenen."
  fr: "Toutes les entreprises d'un grand serveur, sur ses cartes, 24 h/24. Connectez-vous avec votre compte Omsi-Hub ou votre compte Steam, rejoignez une entreprise ou fondez la vôtre."
  nl: "Alle bedrijven van een grote server, op zijn kaarten, de klok rond. Log in met je Omsi-Hub-account of je Steam-account, doe mee met een bedrijf of richt je eigen op."
  pl: "Wszystkie firmy dużego serwera, na jego mapach, przez całą dobę. Zaloguj się kontem Omsi-Hub lub kontem Steam, dołącz do firmy albo załóż własną."
  ru: "Все компании большого сервера, на его картах, круглосуточно. Войдите с аккаунтом Omsi-Hub или Steam, присоединитесь к компании или основайте свою."
  uk: "Усі компанії великого сервера, на його мапах, цілодобово. Увійдіть з обліковим записом Omsi-Hub або Steam, приєднайтеся до компанії або заснуйте власну."
"The server's code (HUB-…)":
  de: "Der Code des Servers (HUB-…)"
  fr: "Le code du serveur (HUB-…)"
  nl: "De code van de server (HUB-…)"
  pl: "Kod serwera (HUB-…)"
  ru: "Код сервера (HUB-…)"
  uk: "Код сервера (HUB-…)"
"Connect":
  de: "Verbinden"
  fr: "Se connecter"
  nl: "Verbinden"
  pl: "Połącz"
  ru: "Подключиться"
  uk: "Підключитися"
"The server's owner gives you its code: his main server shows it.":
  de: "Der Besitzer des Servers gibt dir seinen Code: sein Hauptserver zeigt ihn an."
  fr: "Le propriétaire du serveur vous donne son code : son serveur principal l'affiche."
  nl: "De eigenaar van de server geeft je de code: zijn hoofdserver toont hem."
  pl: "Właściciel serwera poda ci jego kod: pokazuje go jego serwer główny."
  ru: "Владелец сервера даст вам его код: его показывает главный сервер."
  uk: "Власник сервера дасть вам його код: його показує головний сервер."
"You log in with the Omsi-Hub account you are signed in with on the Hub page, or with this computer's Steam account - or with both, as one player.":
  de: "Du meldest dich mit dem Omsi-Hub-Konto an, mit dem du auf der Hub-Seite angemeldet bist, oder mit dem Steam-Konto dieses Computers - oder mit beiden, als ein Spieler."
  fr: "Vous vous connectez avec le compte Omsi-Hub utilisé sur la page Hub, ou avec le compte Steam de cet ordinateur - ou avec les deux, comme un seul joueur."
  nl: "Je logt in met het Omsi-Hub-account waarmee je op de Hub-pagina bent aangemeld, of met het Steam-account van deze computer - of met beide, als één speler."
  pl: "Logujesz się kontem Omsi-Hub, na które jesteś zalogowany na stronie Hub, albo kontem Steam tego komputera - albo obydwoma, jako jeden gracz."
  ru: "Вы входите с аккаунтом Omsi-Hub, в который вошли на странице Hub, или с аккаунтом Steam этого компьютера - или с обоими, как один игрок."
  uk: "Ви входите з обліковим записом Omsi-Hub, у який увійшли на сторінці Hub, або з обліковим записом Steam цього комп'ютера - або з обома, як один гравець."
"The server's companies":
  de: "Die Betriebe des Servers"
  fr: "Les entreprises du serveur"
  nl: "De bedrijven van de server"
  pl: "Firmy serwera"
  ru: "Компании сервера"
  uk: "Компанії сервера"
"No company on the server yet: found the first.":
  de: "Noch kein Betrieb auf dem Server: gründe den ersten."
  fr: "Aucune entreprise sur le serveur pour l'instant : fondez la première."
  nl: "Nog geen bedrijf op de server: richt het eerste op."
  pl: "Na serwerze nie ma jeszcze firmy: załóż pierwszą."
  ru: "На сервере пока нет компаний: основайте первую."
  uk: "На сервері ще немає компаній: заснуйте першу."
