  pl: "%{kind}, %{per}  ·  dwa tygodnie z autobusami diesla, miesiąc z elektrycznymi  ·  oferty to cena roczna"
  ru: "%{kind}, %{per}  ·  две недели с дизельными автобусами, месяц с электробусами  ·  ставки — цена за год"
  uk: "%{kind}, %{per}  ·  два тижні з дизельними автобусами, місяць з електробусами  ·  ставки — ціна за рік"
