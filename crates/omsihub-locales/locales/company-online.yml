  de: "Nur der Eigentümer und die Miteigentümer der Firma wählen, was mit den Diensten geschieht, die niemand abdeckt."
  da: "Kun firmaets ejer og medejere vælger, hvad der sker med de vagter, som ingen dækker."
  fr: "Seuls le propriétaire et les copropriétaires de l'entreprise choisissent ce qu'il advient des services que personne n'assure."
  nl: "Alleen de eigenaar en de mede-eigenaren van het bedrijf kiezen wat er gebeurt met de diensten die niemand dekt."
  pl: "Tylko właściciel i współwłaściciele firmy wybierają, co się dzieje ze służbami, których nikt nie obsadza."
  ru: "Только владелец и совладельцы компании выбирают, что будет со сменами, которые никто не закрывает."
  uk: "Лише власник і співвласники компанії обирають, що буде зі змінами, які ніхто не закриває."
"Fixed duties are for a company of the server.":
  de: "Feste Dienste gibt es für eine Firma des Servers."
  da: "Faste vagter er for et firma på serveren."
  fr: "Les services conducteur fixes sont pour une entreprise du serveur."
  nl: "Vaste diensten zijn voor een bedrijf van de server."
  pl: "Stałe służby są dla firmy z serwera."
  ru: "Постоянные смены — для компании сервера."
  uk: "Постійні зміни — для компанії сервера."
"There is no such player in the company.":
  de: "Diesen Spieler gibt es in der Firma nicht."
  da: "Der er ingen sådan spiller i firmaet."
  fr: "Ce joueur n'est pas dans l'entreprise."
  nl: "Die speler zit niet in het bedrijf."
  pl: "W firmie nie ma takiego gracza."
  ru: "В компании нет такого игрока."
  uk: "У компанії немає такого гравця."
"This duty is fixed for another player on that weekday already.":
  de: "Dieser Dienst ist an diesem Wochentag schon fest für einen anderen Spieler."
  da: "Denne vagt er allerede fast for en anden spiller på den ugedag."
  fr: "Ce service conducteur est déjà fixé pour un autre joueur ce jour de la semaine."
  nl: "Deze dienst is op die weekdag al vast voor een andere speler."
  pl: "Ta służba jest już stała dla innego gracza w tym dniu tygodnia."
  ru: "Эта смена в этот день недели уже закреплена за другим игроком."
  uk: "Ця зміна в цей день тижня вже закріплена за іншим гравцем."
"There is no such fixed duty of yours.":
  de: "Einen solchen festen Dienst hast du nicht."
  da: "Du har ingen sådan fast vagt."
  fr: "Vous n'avez pas ce service conducteur fixe."
  nl: "Zo'n vaste dienst heb je niet."
  pl: "Nie masz takiej stałej służby."
  ru: "У вас нет такой постоянной смены."
  uk: "У вас немає такої постійної зміни."
"Another player is on the dispatcher's duty.":
  de: "Ein anderer Spieler hat Disponentendienst."
  da: "En anden spiller har trafiklederens vagt."
  fr: "Un autre joueur est au poste de régulateur."
  nl: "Een andere speler heeft dispatcherdienst."
  pl: "Dyżur dyspozytora pełni inny gracz."
  ru: "Диспетчером дежурит другой игрок."
  uk: "Диспетчером чергує інший гравець."
