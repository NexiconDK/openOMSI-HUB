  uk: "Депо збанкрутує завтра"
"The depot has %{amount} in cash. Still in the red at tomorrow's close, it goes bankrupt: it closes, and its head office covers its loss. Sell buses, cut costs, or ask the head office for money.":
  de: "Das Depot hat %{amount} Kasse. Ist es beim morgigen Abschluss noch im Minus, geht es pleite: Es schließt, und die Zentrale deckt seinen Verlust. Verkaufe Busse, senke Kosten oder bitte die Zentrale um Geld."
  da: "Afdelingen har %{amount} i kontanter. Er den stadig i minus ved morgendagens afslutning, går den konkurs: den lukker, og hovedkontoret dækker dens tab. Sælg busser, skær i omkostningerne, eller bed hovedkontoret om penge."
  fr: "Le dépôt a %{amount} en caisse. Encore dans le rouge à la clôture de demain, il fait faillite : il ferme, et son siège couvre sa perte. Vendez des bus, réduisez les coûts ou demandez de l'argent au siège."
  nl: "De remise heeft %{amount} in kas. Staat ze bij de afsluiting van morgen nog rood, dan gaat ze failliet: ze sluit, en het hoofdkantoor dekt het verlies. Verkoop bussen, verlaag kosten of vraag het hoofdkantoor om geld."
  pl: "Zajezdnia ma %{amount} w kasie. Jeśli przy jutrzejszym zamknięciu nadal będzie na minusie, zbankrutuje: zostanie zamknięta, a centrala pokryje jej stratę. Sprzedaj autobusy, obetnij koszty albo poproś centralę o pieniądze."
  ru: "У депо %{amount} в кассе. Если при завтрашнем закрытии оно останется в минусе, оно обанкротится: закроется, а головной офис покроет его убыток. Продайте автобусы, сократите расходы или попросите деньги у головного офиса."
  uk: "Депо має %{amount} у касі. Якщо під час завтрашнього закриття воно лишиться в мінусі, воно збанкрутує: закриється, а головний офіс покриє його збиток. Продайте автобуси, скоротіть витрати або попросіть гроші в головного офісу."
"Depot %{name} is in the red: %{n} days to go":
  de: "Depot %{name} ist im Minus: noch %{n} Tage"
