  ru: "Изображение"
  uk: "Зображення"
"The picture could not be taken: a PNG, JPEG, GIF, BMP or WebP of at most 3 MB.":
  de: "Das Bild konnte nicht übernommen werden: ein PNG, JPEG, GIF, BMP oder WebP von höchstens 3 MB."
  da: "Billedet kunne ikke tages: en PNG, JPEG, GIF, BMP eller WebP på højst 3 MB."
  fr: "L'image n'a pas pu être prise : un PNG, JPEG, GIF, BMP ou WebP de 3 Mo au plus."
  nl: "De afbeelding kon niet worden overgenomen: een PNG, JPEG, GIF, BMP of WebP van hoogstens 3 MB."
  pl: "Nie udało się przyjąć obrazu: PNG, JPEG, GIF, BMP lub WebP o rozmiarze najwyżej 3 MB."
  ru: "Не удалось принять изображение: PNG, JPEG, GIF, BMP или WebP не больше 3 МБ."
  uk: "Не вдалося прийняти зображення: PNG, JPEG, GIF, BMP або WebP не більше 3 МБ."
"Its player left the duty":
  de: "Sein Spieler hat den Dienst verlassen"
  da: "Dens spiller forlod vagten"
  fr: "Son joueur a quitté le service"
  nl: "De speler heeft de dienst verlaten"
  pl: "Gracz opuścił służbę"
  ru: "Игрок покинул смену"
  uk: "Гравець покинув зміну"
"%{name} left duty %{k} of line %{n} (tour %{tour}): the rest of it is dropped.":
  de: "%{name} hat Dienst %{k} der Linie %{n} (Umlauf %{tour}) verlassen: Der Rest fällt aus."
  da: "%{name} forlod vagt %{k} på linje %{n} (vognløb %{tour}): resten af den droppes."
  fr: "%{name} a quitté le service %{k} de la ligne %{n} (tournée %{tour}) : le reste est supprimé."
  nl: "%{name} heeft dienst %{k} van lijn %{n} (omloop %{tour}) verlaten: de rest vervalt."
  pl: "%{name} opuścił(a) służbę %{k} linii %{n} (obieg %{tour}): reszta zostaje odwołana."
  ru: "%{name} покинул(а) смену %{k} линии %{n} (оборот %{tour}): остальное отменено."
  uk: "%{name} покинув(ла) зміну %{k} лінії %{n} (оборот %{tour}): решту скасовано."
"%{name} left duty %{k} of line %{n} (tour %{tour}) before its first trip: all of it is dropped.":
  de: "%{name} hat Dienst %{k} der Linie %{n} (Umlauf %{tour}) vor seiner ersten Fahrt verlassen: Er fällt ganz aus."
  da: "%{name} forlod vagt %{k} på linje %{n} (vognløb %{tour}) før dens første tur: hele den droppes."
  fr: "%{name} a quitté le service %{k} de la ligne %{n} (tournée %{tour}) avant son premier trajet : il est supprimé en entier."
  nl: "%{name} heeft dienst %{k} van lijn %{n} (omloop %{tour}) vóór de eerste rit verlaten: de hele dienst vervalt."
  pl: "%{name} opuścił(a) służbę %{k} linii %{n} (obieg %{tour}) przed pierwszym kursem: cała zostaje odwołana."
  ru: "%{name} покинул(а) смену %{k} линии %{n} (оборот %{tour}) до первого рейса: она отменена целиком."
  uk: "%{name} покинув(ла) зміну %{k} лінії %{n} (оборот %{tour}) до першого рейсу: її скасовано повністю."
"You left it: its trips are dropped":
  de: "Du hast ihn verlassen: seine Fahrten fallen aus"
  da: "Du forlod den: dens ture droppes"
  fr: "Vous l'avez quitté : ses trajets sont supprimés"
  nl: "Je hebt hem verlaten: de ritten vervallen"
  pl: "Opuściłeś ją: jej kursy są odwołane"
  ru: "Вы её покинули: её рейсы отменены"
  uk: "Ви її покинули: її рейси скасовано"
"You left it: the rest of it is dropped":
  de: "Du hast ihn verlassen: der Rest fällt aus"
  da: "Du forlod den: resten af den droppes"
  fr: "Vous l'avez quitté : le reste est supprimé"
  nl: "Je hebt hem verlaten: de rest vervalt"
  pl: "Opuściłeś ją: reszta jest odwołana"
  ru: "Вы её покинули: остальное отменено"
  uk: "Ви її покинули: решту скасовано"
"Dropped (%{name} left)":
  de: "Fällt aus (%{name} weg)"
  da: "Droppet (%{name} gik)"
  fr: "Supprimé (%{name} parti)"
  nl: "Vervalt (%{name} weg)"
  pl: "Odwołane (%{name} odszedł)"
  ru: "Отменено (%{name} ушёл)"
  uk: "Скасовано (%{name} пішов)"
"Left it: the rest is dropped":
  de: "Verlassen: der Rest fällt aus"
  da: "Forladt: resten droppes"
  fr: "Quitté : le reste est supprimé"
  nl: "Verlaten: de rest vervalt"
  pl: "Opuszczona: reszta odwołana"
  ru: "Покинута: остальное отменено"
  uk: "Покинута: решту скасовано"
"Duties left":
  de: "Verlassene Dienste"
  da: "Forladte vagter"
  fr: "Services quittés"
  nl: "Verlaten diensten"
  pl: "Opuszczone służby"
  ru: "Брошенные смены"
  uk: "Покинуті зміни"
"When a player leaves his duty halfway":
  de: "Wenn ein Spieler seinen Dienst mittendrin verlässt"
  da: "Når en spiller forlader sin vagt halvvejs"
  fr: "Quand un joueur quitte son service en cours"
  nl: "Als een speler zijn dienst halverwege verlaat"
  pl: "Gdy gracz opuści służbę w połowie"
  ru: "Когда игрок бросает смену на полпути"
  uk: "Коли гравець кидає зміну на півдорозі"
"The AI drives the rest":
  de: "Die KI fährt den Rest"
  da: "AI'en kører resten"
  fr: "L'IA conduit le reste"
  nl: "De AI rijdt de rest"
  pl: "Resztę prowadzi SI"
  ru: "Остальное ведёт ИИ"
  uk: "Решту веде ШІ"
"Its trips are dropped":
  de: "Seine Fahrten fallen aus"
  da: "Dens ture droppes"
  fr: "Ses trajets sont supprimés"
  nl: "De ritten vervallen"
  pl: "Jej kursy są odwołane"
  ru: "Её рейсы отменяются"
  uk: "Її рейси скасовуються"
"The AI drives the rest of his duty in the world, and the company books its trips. He is paid for what he drove; his card counts the duties he left.":
  de: "Die KI fährt den Rest seines Dienstes in der Welt, und der Betrieb bucht dessen Fahrten. Er wird für das bezahlt, was er gefahren ist; seine Karte zählt die Dienste, die er verlassen hat."
  da: "AI'en kører resten af hans vagt i verdenen, og selskabet bogfører dens ture. Han får løn for det, han kørte; hans kort tæller de vagter, han forlod."
  fr: "L'IA conduit le reste de son service dans le monde, et l'entreprise comptabilise ses trajets. Il est payé pour ce qu'il a conduit ; sa fiche compte les services qu'il a quittés."
  nl: "De AI rijdt de rest van zijn dienst in de wereld, en het bedrijf boekt de ritten. Hij wordt betaald voor wat hij reed; zijn kaart telt de diensten die hij verliet."
  pl: "Resztę jego służby w świecie prowadzi SI, a firma księguje jej kursy. Dostaje zapłatę za to, co przejechał; jego karta liczy opuszczone służby."
  ru: "Остаток его смены в мире ведёт ИИ, и компания учитывает её рейсы. Ему платят за то, что он проехал; его карточка считает брошенные смены."
  uk: "Решту його зміни у світі веде ШІ, і компанія обліковує її рейси. Йому платять за те, що він проїхав; його картка рахує покинуті зміни."
"Nobody drives the rest of his duty: its trips are dropped, the company loses their takings and pays the authority's penalties. He is paid for what he drove; his card counts the duties he left.":
  de: "Niemand fährt den Rest seines Dienstes: dessen Fahrten fallen aus, der Betrieb verliert ihre Einnahmen und zahlt die Strafen des Aufgabenträgers. Er wird für das bezahlt, was er gefahren ist; seine Karte zählt die Dienste, die er verlassen hat."
  da: "Ingen kører resten af hans vagt: dens ture droppes, selskabet mister deres indtægter og betaler trafikselskabets bøder. Han får løn for det, han kørte; hans kort tæller de vagter, han forlod."
  fr: "Personne ne conduit le reste de son service : ses trajets sont supprimés, l'entreprise perd leurs recettes et paie les pénalités de l'autorité. Il est payé pour ce qu'il a conduit ; sa fiche compte les services qu'il a quittés."
  nl: "Niemand rijdt de rest van zijn dienst: de ritten vervallen, het bedrijf verliest de opbrengst en betaalt de boetes van de opdrachtgever. Hij wordt betaald voor wat hij reed; zijn kaart telt de diensten die hij verliet."
  pl: "Nikt nie prowadzi reszty jego służby: kursy są odwołane, firma traci ich wpływy i płaci kary organizatora. Dostaje zapłatę za to, co przejechał; jego karta liczy opuszczone służby."
  ru: "Остаток его смены никто не ведёт: рейсы отменяются, компания теряет выручку и платит штрафы заказчика. Ему платят за то, что он проехал; его карточка считает брошенные смены."
  uk: "Решту його зміни ніхто не веде: рейси скасовуються, компанія втрачає виручку і платить штрафи замовника. Йому платять за те, що він проїхав; його картка рахує покинуті зміни."
"From now on what a player leaves of his duty is dropped.":
  de: "Ab jetzt fällt aus, was ein Spieler von seinem Dienst übrig lässt."
  da: "Fra nu af droppes det, en spiller efterlader af sin vagt."
  fr: "Désormais, ce qu'un joueur laisse de son service est supprimé."
  nl: "Vanaf nu vervalt wat een speler van zijn dienst laat liggen."
  pl: "Od teraz to, co gracz zostawi ze swojej służby, jest odwoływane."
  ru: "Теперь то, что игрок бросил из своей смены, отменяется."
  uk: "Відтепер те, що гравець покинув зі своєї зміни, скасовується."
"From now on the AI drives what a player leaves of his duty.":
  de: "Ab jetzt fährt die KI, was ein Spieler von seinem Dienst übrig lässt."
  da: "Fra nu af kører AI'en det, en spiller efterlader af sin vagt."
  fr: "Désormais, l'IA conduit ce qu'un joueur laisse de son service."
  nl: "Vanaf nu rijdt de AI wat een speler van zijn dienst laat liggen."
  pl: "Od teraz SI prowadzi to, co gracz zostawi ze swojej służby."
  ru: "Теперь то, что игрок бросил из своей смены, ведёт ИИ."
  uk: "Відтепер те, що гравець покинув зі своєї зміни, веде ШІ."
"On the Bus Company Online server every line is won in its tender: it cannot be bought outright.":
  de: "Auf dem Bus-Company-Online-Server wird jede Linie in ihrer Ausschreibung gewonnen: sie kann nicht direkt gekauft werden."
  da: "På Bus Company Online-serveren vindes hver linje i dens udbud: den kan ikke købes direkte."
  fr: "Sur le serveur Bus Company Online, chaque ligne se gagne par son appel d'offres : elle ne peut pas être achetée directement."
  nl: "Op de Bus Company Online-server wordt elke lijn in haar aanbesteding gewonnen: ze kan niet direct worden gekocht."
  pl: "Na serwerze Bus Company Online każdą linię wygrywa się w jej przetargu: nie można jej kupić od razu."
  ru: "На сервере Bus Company Online каждую линию выигрывают на её тендере: купить её сразу нельзя."
  uk: "На сервері Bus Company Online кожну лінію виграють на її тендері: купити її одразу не можна."
"Another company of the map runs this line: it goes out to tender again towards the end of its concession.":
  de: "Ein anderer Betrieb der Karte fährt diese Linie: sie wird gegen Ende seiner Konzession wieder ausgeschrieben."
  da: "Et andet selskab på kortet kører denne linje: den sendes i udbud igen hen imod slutningen af dens koncession."
  fr: "Une autre entreprise de la carte exploite cette ligne : elle est remise en appel d'offres vers la fin de sa concession."
  nl: "Een ander bedrijf van de kaart rijdt deze lijn: ze wordt tegen het einde van zijn concessie opnieuw aanbesteed."
  pl: "Tę linię obsługuje inna firma z mapy: trafi ponownie do przetargu pod koniec jej koncesji."
  ru: "Эту линию обслуживает другая компания карты: её снова выставят на тендер ближе к концу её концессии."
  uk: "Цю лінію обслуговує інша компанія карти: її знову виставлять на тендер ближче до кінця її концесії."
"The line goes out to tender in a moment: its auction is on the Concessions page.":
  de: "Die Linie wird gleich ausgeschrieben: ihre Auktion steht auf der Seite Konzessionen."
  da: "Linjen sendes i udbud om et øjeblik: dens auktion er på siden Koncessioner."
  fr: "La ligne est mise en appel d'offres dans un instant : son enchère est sur la page Concessions."
  nl: "De lijn wordt zo aanbesteed: de veiling staat op de pagina Concessies."
  pl: "Linia za chwilę trafi do przetargu: jej aukcja jest na stronie Koncesje."
  ru: "Линия вот-вот выйдет на тендер: её аукцион — на странице «Концессии»."
  uk: "Лінія ось-ось вийде на тендер: її аукціон — на сторінці «Концесії»."
"The tender of line %{n} is withdrawn: on the server the map's tenders are shared by its companies":
  de: "Die Ausschreibung der Linie %{n} ist zurückgezogen: auf dem Server teilen sich die Betriebe einer Karte deren Ausschreibungen"
  da: "Udbuddet på linje %{n} er trukket tilbage: på serveren deles kortets udbud mellem dets selskaber"
  fr: "L'appel d'offres de la ligne %{n} est retiré : sur le serveur, les appels d'offres d'une carte sont communs à ses entreprises"
  nl: "De aanbesteding van lijn %{n} is ingetrokken: op de server delen de bedrijven van een kaart haar aanbestedingen"
  pl: "Przetarg na linię %{n} został wycofany: na serwerze przetargi mapy są wspólne dla jej firm"
  ru: "Тендер на линию %{n} отозван: на сервере тендеры карты общие для всех её компаний"
  uk: "Тендер на лінію %{n} відкликано: на сервері тендери карти спільні для всіх її компаній"
"a company of the server":
  de: "ein Betrieb des Servers"
  da: "et selskab på serveren"
  fr: "une entreprise du serveur"
  nl: "een bedrijf van de server"
  pl: "firma z serwera"
  ru: "компания сервера"
  uk: "компанія сервера"
"Bids until %{time} (%{left} from now), scored 70 % price and 30 % quality; every company of the map bids. Ask at most %{amount} to lead now.":
  de: "Gebote bis %{time} (noch %{left}), bewertet zu 70 % nach Preis und 30 % nach Qualität; jeder Betrieb der Karte bietet mit. Biete höchstens %{amount}, um jetzt vorn zu liegen."
  da: "Bud indtil %{time} (%{left} fra nu), scoret med 70 % pris og 30 % kvalitet; hvert selskab på kortet byder. Byd højst %{amount} for at føre nu."
  fr: "Offres jusqu'à %{time} (dans %{left}), notées 70 % prix et 30 % qualité ; chaque entreprise de la carte enchérit. Demandez au plus %{amount} pour mener maintenant."
  nl: "Biedingen tot %{time} (nog %{left}), beoordeeld op 70 % prijs en 30 % kwaliteit; elk bedrijf van de kaart biedt mee. Vraag hoogstens %{amount} om nu voor te liggen."
  pl: "Oferty do %{time} (jeszcze %{left}), oceniane w 70 % za cenę i w 30 % za jakość; licytuje każda firma z mapy. Zażądaj najwyżej %{amount}, aby teraz prowadzić."
  ru: "Ставки до %{time} (осталось %{left}), оценка: 70 % цена и 30 % качество; торгуется каждая компания карты. Запросите не больше %{amount}, чтобы сейчас лидировать."
  uk: "Ставки до %{time} (залишилося %{left}), оцінка: 70 % ціна і 30 % якість; торгується кожна компанія карти. Запросіть не більше %{amount}, щоб зараз лідирувати."
"The application could not be written.":
  de: "Die Bewerbung konnte nicht gespeichert werden."
  da: "Ansøgningen kunne ikke skrives."
  fr: "La candidature n'a pas pu être enregistrée."
  nl: "De aanvraag kon niet worden opgeslagen."
  pl: "Nie udało się zapisać zgłoszenia."
  ru: "Не удалось записать заявку."
  uk: "Не вдалося записати заявку."
"The bid could not be written to the server's tenders.":
  de: "Das Gebot konnte nicht in die Ausschreibungen des Servers geschrieben werden."
  da: "Buddet kunne ikke skrives til serverens udbud."
  fr: "L'offre n'a pas pu être enregistrée dans les appels d'offres du serveur."
  nl: "Het bod kon niet in de aanbestedingen van de server worden opgeslagen."
  pl: "Nie udało się zapisać oferty w przetargach serwera."
  ru: "Не удалось записать ставку в тендеры сервера."
  uk: "Не вдалося записати ставку в тендери сервера."
"Line %{n} goes out to tender for every company of the map: bid for it on the Concessions page.":
  de: "Linie %{n} wird für alle Betriebe der Karte ausgeschrieben: biete auf der Seite Konzessionen mit."
  da: "Linje %{n} sendes i udbud for hvert selskab på kortet: byd på den på siden Koncessioner."
  fr: "La ligne %{n} est mise en appel d'offres pour toutes les entreprises de la carte : enchérissez sur la page Concessions."
  nl: "Lijn %{n} wordt aanbesteed voor alle bedrijven van de kaart: bied mee op de pagina Concessies."
  pl: "Linia %{n} trafia do przetargu dla wszystkich firm z mapy: licytuj na stronie Koncesje."
  ru: "Линия %{n} выходит на тендер для всех компаний карты: делайте ставку на странице «Концессии»."
  uk: "Лінія %{n} виходить на тендер для всіх компаній карти: робіть ставку на сторінці «Концесії»."
"Depots are for the companies of a Bus Company Online server.":
  de: "Depots gibt es für die Betriebe eines Bus-Company-Online-Servers."
  da: "Afdelinger er til selskaberne på en Bus Company Online-server."
  fr: "Les dépôts sont réservés aux entreprises d'un serveur Bus Company Online."
  nl: "Remises zijn er voor de bedrijven van een Bus Company Online-server."
  pl: "Zajezdnie są dla firm na serwerze Bus Company Online."
  ru: "Депо есть только у компаний сервера Bus Company Online."
  uk: "Депо є лише в компаній сервера Bus Company Online."
"A depot has no depots of its own: found them from the head office.":
  de: "Ein Depot hat keine eigenen Depots: gründe sie von der Zentrale aus."
  da: "En afdeling har ingen afdelinger: stift dem fra hovedkontoret."
  fr: "Un dépôt n'a pas de dépôts à lui : fondez-les depuis le siège."
  nl: "Een remise heeft geen eigen remises: richt ze op vanuit het hoofdkantoor."
  pl: "Zajezdnia nie ma własnych zajezdni: zakładaj je z centrali."
  ru: "У депо не бывает своих депо: открывайте их из головного офиса."
  uk: "У депо не буває власних депо: відкривайте їх із головного офісу."
"The head office runs this map: a depot goes on another.":
  de: "Die Zentrale fährt auf dieser Karte: ein Depot kommt auf eine andere."
  da: "Hovedkontoret driver dette kort: en afdeling kommer på et andet."
  fr: "Le siège exploite cette carte : un dépôt va sur une autre."
  nl: "Het hoofdkantoor rijdt op deze kaart: een remise komt op een andere."
  pl: "Centrala działa na tej mapie: zajezdnia trafia na inną."
  ru: "Головной офис работает на этой карте: депо открывается на другой."
  uk: "Головний офіс працює на цій карті: депо відкривається на іншій."
"The company has a depot on this map already.":
  de: "Der Betrieb hat auf dieser Karte schon ein Depot."
  da: "Selskabet har allerede en afdeling på dette kort."
  fr: "L'entreprise a déjà un dépôt sur cette carte."
  nl: "Het bedrijf heeft al een remise op deze kaart."
  pl: "Firma ma już zajezdnię na tej mapie."
  ru: "У компании уже есть депо на этой карте."
  uk: "У компанії вже є депо на цій карті."
"The head office has not the money for it: the depot and its starting money.":
  de: "Der Zentrale fehlt das Geld dafür: das Depot und sein Startgeld."
  da: "Hovedkontoret har ikke pengene til det: afdelingen og dens startpenge."
  fr: "Le siège n'a pas l'argent pour cela : le dépôt et son argent de départ."
  nl: "Het hoofdkantoor heeft het geld er niet voor: de remise en haar startgeld."
  pl: "Centrala nie ma na to pieniędzy: na zajezdnię i jej kapitał startowy."
  ru: "У головного офиса не хватает денег: на депо и его стартовый капитал."
  uk: "У головного офісу бракує грошей: на депо та його стартовий капітал."
"The server's clock is not set: the main server keeps it.":
  de: "Die Uhr des Servers ist nicht gestellt: der Hauptserver führt sie."
  da: "Serverens ur er ikke sat: hovedserveren holder det."
  fr: "L'horloge du serveur n'est pas réglée : le serveur principal la tient."
  nl: "De klok van de server is niet ingesteld: de hoofdserver houdt haar bij."
  pl: "Zegar serwera nie jest ustawiony: prowadzi go serwer główny."
  ru: "Часы сервера не установлены: их ведёт главный сервер."
  uk: "Годинник сервера не встановлено: його веде головний сервер."
"The depot could not be founded: the server says why in its log.":
  de: "Das Depot konnte nicht gegründet werden: der Server nennt den Grund in seinem Protokoll."
  da: "Afdelingen kunne ikke stiftes: serveren siger hvorfor i sin log."
  fr: "Le dépôt n'a pas pu être fondé : le serveur en donne la raison dans son journal."
  nl: "De remise kon niet worden opgericht: de server zegt waarom in zijn logboek."
  pl: "Nie udało się założyć zajezdni: serwer podaje powód w swoim dzienniku."
  ru: "Не удалось открыть депо: сервер пишет причину в своём журнале."
  uk: "Не вдалося відкрити депо: сервер пише причину у своєму журналі."
"A depot of %{hq}: its money, buses and staff are its own.":
  de: "Ein Depot von %{hq}: sein Geld, seine Busse und sein Personal sind seine eigenen."
  da: "En afdeling af %{hq}: dens penge, busser og personale er dens egne."
  fr: "Un dépôt de %{hq} : son argent, ses bus et son personnel sont les siens."
  nl: "Een remise van %{hq}: haar geld, bussen en personeel zijn van haarzelf."
  pl: "Zajezdnia firmy %{hq}: jej pieniądze, autobusy i personel są jej własne."
  ru: "Депо компании %{hq}: его деньги, автобусы и персонал — его собственные."
  uk: "Депо компанії %{hq}: його гроші, автобуси й персонал — його власні."
"%{lines} lines · %{buses} buses · %{staff} staff":
  de: "%{lines} Linien · %{buses} Busse · %{staff} Mitarbeiter"
  da: "%{lines} linjer · %{buses} busser · %{staff} personale"
  fr: "%{lines} lignes · %{buses} bus · %{staff} employés"
  nl: "%{lines} lijnen · %{buses} bussen · %{staff} medewerkers"
  pl: "%{lines} linii · %{buses} autobusów · %{staff} pracowników"
  ru: "%{lines} линий · %{buses} автобусов · %{staff} сотрудников"
  uk: "%{lines} ліній · %{buses} автобусів · %{staff} працівників"
"A depot runs the company on another map of the server: its own lines, buses, staff and tenders there. It costs %{price} of the company's money, besides the starting money you give it.":
  de: "Ein Depot betreibt den Betrieb auf einer anderen Karte des Servers: mit eigenen Linien, Bussen, Personal und Ausschreibungen dort. Es kostet %{price} vom Geld des Betriebs, dazu das Startgeld, das du ihm gibst."
  da: "En afdeling driver selskabet på et andet kort på serveren: dens egne linjer, busser, personale og udbud dér. Den koster %{price} af selskabets penge, ud over de startpenge, du giver den."
  fr: "Un dépôt fait tourner l'entreprise sur une autre carte du serveur : ses propres lignes, bus, personnel et appels d'offres là-bas. Il coûte %{price} de l'argent de l'entreprise, en plus de l'argent de départ que vous lui donnez."
  nl: "Een remise laat het bedrijf rijden op een andere kaart van de server: met eigen lijnen, bussen, personeel en aanbestedingen daar. Ze kost %{price} van het geld van het bedrijf, naast het startgeld dat je haar geeft."
  pl: "Zajezdnia prowadzi firmę na innej mapie serwera: z własnymi liniami, autobusami, personelem i przetargami. Kosztuje %{price} z pieniędzy firmy, oprócz kapitału startowego, który jej dasz."
  ru: "Депо ведёт дело компании на другой карте сервера: со своими линиями, автобусами, персоналом и тендерами там. Оно стоит %{price} из денег компании, помимо стартового капитала, который вы ему дадите."
  uk: "Депо веде справу компанії на іншій карті сервера: зі своїми лініями, автобусами, персоналом і тендерами там. Воно коштує %{price} з грошей компанії, крім стартового капіталу, який ви йому дасте."
