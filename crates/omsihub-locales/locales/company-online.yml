  uk: "Перевести автобус"
"A bus of the company's own moves to another of its maps for %{price} and is away %{n} days. A leased or rented bus stays with its contract.":
  de: "Ein eigener Bus der Firma zieht für %{price} auf eine andere ihrer Karten um und ist %{n} Tage unterwegs. Ein geleaster oder gemieteter Bus bleibt bei seinem Vertrag."
  fr: "Un bus appartenant à l'entreprise va sur une autre de ses cartes pour %{price} et reste %{n} jours en route. Un bus en leasing ou loué reste avec son contrat."
  nl: "Een eigen bus van het bedrijf verhuist voor %{price} naar een andere kaart van het bedrijf en is %{n} dagen onderweg. Een geleasde of gehuurde bus blijft bij zijn contract."
  pl: "Własny autobus firmy przenosi się na inną jej mapę za %{price} i jest w drodze %{n} dni. Autobus leasingowany lub wynajęty zostaje przy swojej umowie."
  ru: "Собственный автобус компании переезжает на другую её карту за %{price} и находится в пути %{n} дн. Лизинговый или арендованный автобус остаётся по своему договору."
  uk: "Власний автобус компанії переїжджає на іншу її карту за %{price} і перебуває в дорозі %{n} дн. Лізинговий чи орендований автобус лишається за своїм договором."
"The employee":
  de: "Mitarbeiter"
  fr: "L'employé"
  nl: "De medewerker"
  pl: "Pracownik"
  ru: "Сотрудник"
  uk: "Працівник"
"Lend":
  de: "Ausleihen"
  fr: "Prêter"
  nl: "Uitlenen"
  pl: "Wypożycz"
  ru: "Одолжить"
  uk: "Позичити"
"A lent employee goes the next day and works there for the days you choose, paid by the company that borrows him, then comes back.":
  de: "Ein ausgeliehener Mitarbeiter geht am nächsten Tag und arbeitet dort für die gewählten Tage, bezahlt von der Firma, die ihn ausleiht, und kommt dann zurück."
  fr: "Un employé prêté part le lendemain et y travaille pendant les jours choisis, payé par l'entreprise qui l'emprunte, puis revient."
  nl: "Een uitgeleende medewerker gaat de volgende dag en werkt daar de gekozen dagen, betaald door het bedrijf dat hem leent, en komt dan terug."
  pl: "Wypożyczony pracownik jedzie następnego dnia i pracuje tam przez wybrane dni, opłacany przez firmę, która go pożycza, a potem wraca."
  ru: "Одолженный сотрудник уезжает на следующий день и работает там выбранное число дней за счёт компании, которая его берёт, а затем возвращается."
  uk: "Позичений працівник їде наступного дня й працює там обрану кількість днів коштом компанії, яка його позичає, а потім повертається."
