"Depot %{name} is bankrupt":
  de: "Depot %{name} ist pleite"
  fr: "Le dépôt %{name} a fait faillite"
  nl: "Remise %{name} is failliet"
  pl: "Zajezdnia %{name} zbankrutowała"
  ru: "Депо %{name} обанкротилось"
  uk: "Депо %{name} збанкрутувало"
"Depot %{name} stayed in the red and is closed: its buses sold, its staff gone, its lines out to tender again. The head office covered its loss of %{amount}.":
  de: "Depot %{name} blieb im Minus und ist geschlossen: seine Busse verkauft, sein Personal weg, seine Linien neu ausgeschrieben. Die Zentrale hat seinen Verlust von %{amount} gedeckt."
  fr: "Le dépôt %{name} est resté dans le rouge et est fermé : ses bus vendus, son personnel parti, ses lignes remises en appel d'offres. Le siège a couvert sa perte de %{amount}."
  nl: "Remise %{name} bleef rood staan en is gesloten: haar bussen verkocht, haar personeel weg, haar lijnen opnieuw aanbesteed. Het hoofdkantoor dekte haar verlies van %{amount}."
  pl: "Zajezdnia %{name} pozostała na minusie i została zamknięta: autobusy sprzedane, personel odszedł, linie wróciły do przetargu. Centrala pokryła jej stratę w wysokości %{amount}."
  ru: "Депо %{name} осталось в минусе и закрыто: автобусы проданы, персонал ушёл, линии снова на тендере. Головной офис покрыл его убыток в %{amount}."
  uk: "Депо %{name} лишилося в мінусі й закрите: автобуси продано, персонал пішов, лінії знову на тендері. Головний офіс покрив його збиток у %{amount}."
"Depot %{name} is bankrupt: the head office is in the red":
  de: "Depot %{name} ist pleite: die Zentrale ist im Minus"
  fr: "Le dépôt %{name} a fait faillite : le siège est dans le rouge"
  nl: "Remise %{name} is failliet: het hoofdkantoor staat rood"
  pl: "Zajezdnia %{name} zbankrutowała: centrala jest na minusie"
  ru: "Депо %{name} обанкротилось: головной офис в минусе"
  uk: "Депо %{name} збанкрутувало: головний офіс у мінусі"
"Depot %{name} stayed in the red and is closed: its buses sold, its staff gone, its lines out to tender again. The head office covered its loss of %{amount} and is in the red now: sell buses, or close the company.":
  de: "Depot %{name} blieb im Minus und ist geschlossen: seine Busse verkauft, sein Personal weg, seine Linien neu ausgeschrieben. Die Zentrale hat seinen Verlust von %{amount} gedeckt und ist jetzt im Minus: Verkaufe Busse oder schließe die Firma."
  fr: "Le dépôt %{name} est resté dans le rouge et est fermé : ses bus vendus, son personnel parti, ses lignes remises en appel d'offres. Le siège a couvert sa perte de %{amount} et est maintenant dans le rouge : vendez des bus, ou fermez l'entreprise."
  nl: "Remise %{name} bleef rood staan en is gesloten: haar bussen verkocht, haar personeel weg, haar lijnen opnieuw aanbesteed. Het hoofdkantoor dekte haar verlies van %{amount} en staat nu rood: verkoop bussen, of sluit het bedrijf."
  pl: "Zajezdnia %{name} pozostała na minusie i została zamknięta: autobusy sprzedane, personel odszedł, linie wróciły do przetargu. Centrala pokryła jej stratę w wysokości %{amount} i jest teraz na minusie: sprzedaj autobusy albo zamknij firmę."
  ru: "Депо %{name} осталось в минусе и закрыто: автобусы проданы, персонал ушёл, линии снова на тендере. Головной офис покрыл его убыток в %{amount} и теперь в минусе: продайте автобусы или закройте компанию."
  uk: "Депо %{name} лишилося в мінусі й закрите: автобуси продано, персонал пішов, лінії знову на тендері. Головний офіс покрив його збиток у %{amount} і тепер у мінусі: продайте автобуси або закрийте компанію."
"Depot %{name} is closed":
  de: "Depot %{name} ist geschlossen"
  fr: "Le dépôt %{name} est fermé"
  nl: "Remise %{name} is gesloten"
  pl: "Zajezdnia %{name} została zamknięta"
  ru: "Депо %{name} закрыто"
  uk: "Депо %{name} закрите"
"Depot %{name} stayed in the red and is closed: its buses sold, its staff gone, its lines out to tender again. What was left of it, %{amount}, is the head office's.":
  de: "Depot %{name} blieb im Minus und ist geschlossen: seine Busse verkauft, sein Personal weg, seine Linien neu ausgeschrieben. Was übrig blieb, %{amount}, gehört der Zentrale."
  fr: "Le dépôt %{name} est resté dans le rouge et est fermé : ses bus vendus, son personnel parti, ses lignes remises en appel d'offres. Ce qui en restait, %{amount}, revient au siège."
  nl: "Remise %{name} bleef rood staan en is gesloten: haar bussen verkocht, haar personeel weg, haar lijnen opnieuw aanbesteed. Wat ervan overbleef, %{amount}, is van het hoofdkantoor."
  pl: "Zajezdnia %{name} pozostała na minusie i została zamknięta: autobusy sprzedane, personel odszedł, linie wróciły do przetargu. To, co zostało, %{amount}, należy do centrali."
  ru: "Депо %{name} осталось в минусе и закрыто: автобусы проданы, персонал ушёл, линии снова на тендере. Оставшиеся %{amount} достаются головному офису."
  uk: "Депо %{name} лишилося в мінусі й закрите: автобуси продано, персонал пішов, лінії знову на тендері. Залишок, %{amount}, належить головному офісу."
