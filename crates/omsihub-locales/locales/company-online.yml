  uk: "Ви водите для компанії безкоштовно: те, що коштував би ШІ-водій, лишається в компанії."
"You are paid for your trips as every player is, into your own money on the server.":
  de: "Du wirst für deine Fahrten bezahlt wie jeder Spieler, auf dein eigenes Geld auf dem Server."
  da: "Du får betaling for dine ture som alle spillere, ind på dine egne penge på serveren."
  fr: "Vous êtes payé pour vos trajets comme chaque joueur, sur votre propre argent sur le serveur."
  nl: "Je wordt voor je ritten betaald zoals elke speler, op je eigen geld op de server."
  pl: "Dostajesz zapłatę za kursy jak każdy gracz, na własne pieniądze na serwerze."
  ru: "Вам платят за рейсы, как каждому игроку, на ваши собственные деньги на сервере."
  uk: "Вам платять за рейси, як кожному гравцеві, на ваші власні гроші на сервері."
