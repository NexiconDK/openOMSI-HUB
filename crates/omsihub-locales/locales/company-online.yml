  da: "Diesel eller el"
  fr: "Diesel ou électrique"
  nl: "Diesel of elektrisch"
  pl: "Diesel czy elektryczny"
  ru: "Дизель или электро"
  uk: "Дизель чи електро"
"Bid with diesel buses: the contract runs two weeks. Bid with electric buses: it runs a month, and every tour is run with an electric bus.":
  de: "Gebot mit Dieselbussen: Der Vertrag läuft zwei Wochen. Gebot mit Elektrobussen: Er läuft einen Monat, und jeder Umlauf wird mit einem Elektrobus gefahren."
  da: "Byd med dieselbusser: kontrakten løber to uger. Byd med elbusser: den løber en måned, og hvert vognløb køres med en elbus."
  fr: "Offre avec des bus diesel : le contrat dure deux semaines. Offre avec des bus électriques : il dure un mois, et chaque service est assuré par un bus électrique."
  nl: "Bod met dieselbussen: het contract loopt twee weken. Bod met elektrische bussen: het loopt een maand, en elke omloop wordt met een elektrische bus gereden."
  pl: "Oferta z autobusami diesla: umowa trwa dwa tygodnie. Oferta z elektrycznymi: trwa miesiąc, a każdy kurs obsługuje autobus elektryczny."
  ru: "Ставка с дизельными автобусами: контракт длится две недели. Ставка с электробусами: месяц, и каждый оборот обслуживает электробус."
  uk: "Ставка з дизельними автобусами: контракт триває два тижні. Ставка з електробусами: місяць, і кожен оберт обслуговує електробус."
