  da: "Nej tak"
  fr: "Non, merci"
  nl: "Nee, dank je"
  pl: "Nie, dziękuję"
  ru: "Нет, спасибо"
  uk: "Ні, дякую"
"The buses are yours on the day your term begins.":
  de: "Die Busse gehören dir ab dem ersten Tag deiner Laufzeit."
  da: "Busserne er dine den dag, din løbetid begynder."
  fr: "Les bus sont à vous le premier jour de votre contrat."
