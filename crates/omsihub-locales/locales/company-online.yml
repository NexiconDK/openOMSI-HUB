"You drive for the company for nothing: what an AI driver would cost stays in the company.":
  de: "Du fährst für die Firma umsonst: was ein KI-Fahrer kosten würde, bleibt in der Firma."
  da: "Du kører gratis for firmaet: det, en AI-chauffør ville koste, bliver i firmaet."
