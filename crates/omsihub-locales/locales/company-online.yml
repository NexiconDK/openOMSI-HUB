  ru: "Такого предложения автобусов нет."
  uk: "Такої пропозиції автобусів немає."
"The company has not the money for these buses.":
  de: "Die Firma hat nicht das Geld für diese Busse."
  da: "Selskabet har ikke pengene til disse busser."
  fr: "L'entreprise n'a pas l'argent pour ces bus."
  nl: "Het bedrijf heeft het geld voor deze bussen niet."
  pl: "Firma nie ma pieniędzy na te autobusy."
  ru: "У компании нет денег на эти автобусы."
  uk: "Компанія не має грошей на ці автобуси."
"The answer could not be written: the server says why in its log.":
  de: "Die Antwort konnte nicht gespeichert werden: Der Server nennt den Grund in seinem Protokoll."
  da: "Svaret kunne ikke skrives: serveren siger hvorfor i sin log."
  fr: "La réponse n'a pas pu être enregistrée : le serveur en donne la raison dans son journal."
  nl: "Het antwoord kon niet worden opgeslagen: de server zegt waarom in zijn log."
  pl: "Nie udało się zapisać odpowiedzi: serwer podaje przyczynę w swoim dzienniku."
  ru: "Ответ не удалось записать: сервер сообщает причину в своём журнале."
  uk: "Відповідь не вдалося записати: сервер повідомляє причину у своєму журналі."
"Buses offered with line %{n}":
  de: "Busse mit Linie %{n} angeboten"
  da: "Busser tilbudt med linje %{n}"
  fr: "Bus proposés avec la ligne %{n}"
  nl: "Bussen aangeboden met lijn %{n}"
  pl: "Autobusy oferowane z linią %{n}"
  ru: "Автобусы предложены вместе с линией %{n}"
  uk: "Автобуси запропоновано разом із лінією %{n}"
"%{name} ran line %{n} with %{count} buses of its own. You may take them over at their book value, %{amount} together, on %{date}, the day your term begins: the Concessions page.":
  de: "%{name} fuhr Linie %{n} mit %{count} eigenen Bussen. Du kannst sie zum Buchwert übernehmen, zusammen %{amount}, am %{date}, dem ersten Tag deiner Laufzeit: auf der Seite Konzessionen."
  da: "%{name} kørte linje %{n} med %{count} egne busser. Du må overtage dem til deres bogførte værdi, %{amount} tilsammen, den %{date}, den dag din løbetid begynder: siden Koncessioner."
  fr: "%{name} exploitait la ligne %{n} avec %{count} bus à elle. Vous pouvez les reprendre à leur valeur comptable, %{amount} au total, le %{date}, premier jour de votre contrat : page Concessions."
  nl: "%{name} reed lijn %{n} met %{count} eigen bussen. Je kunt ze overnemen tegen boekwaarde, samen %{amount}, op %{date}, de dag dat je looptijd begint: de pagina Concessies."
  pl: "%{name} obsługiwała linię %{n} %{count} własnymi autobusami. Możesz je przejąć po wartości księgowej, razem %{amount}, %{date}, w dniu początku umowy: strona Koncesje."
  ru: "%{name} обслуживала линию %{n} %{count} своими автобусами. Вы можете выкупить их по балансовой стоимости, всего %{amount}, %{date}, в первый день срока: страница «Концессии»."
  uk: "%{name} обслуговувала лінію %{n} %{count} власними автобусами. Ви можете викупити їх за балансовою вартістю, разом %{amount}, %{date}, у перший день строку: сторінка «Концесії»."
"%{name} takes over your buses of line %{n}":
  de: "%{name} übernimmt deine Busse der Linie %{n}"
  da: "%{name} overtager dine busser på linje %{n}"
  fr: "%{name} reprend vos bus de la ligne %{n}"
  nl: "%{name} neemt je bussen van lijn %{n} over"
  pl: "%{name} przejmuje twoje autobusy z linii %{n}"
  ru: "%{name} выкупает ваши автобусы с линии %{n}"
  uk: "%{name} викуповує ваші автобуси з лінії %{n}"
"%{name} takes over the %{count} buses of yours that ran line %{n}, at their book value, on %{date}.":
  de: "%{name} übernimmt am %{date} deine %{count} Busse, die Linie %{n} gefahren sind, zum Buchwert."
  da: "%{name} overtager de %{count} busser fra dig, der kørte linje %{n}, til deres bogførte værdi, den %{date}."
  fr: "%{name} reprend le %{date} vos %{count} bus qui assuraient la ligne %{n}, à leur valeur comptable."
  nl: "%{name} neemt op %{date} je %{count} bussen die lijn %{n} reden over, tegen boekwaarde."
  pl: "%{name} przejmuje %{date} twoje %{count} autobusy z linii %{n}, po wartości księgowej."
  ru: "%{name} %{date} выкупает ваши %{count} автобусов, обслуживавших линию %{n}, по балансовой стоимости."
  uk: "%{name} %{date} викуповує ваші %{count} автобусів, що обслуговували лінію %{n}, за балансовою вартістю."
"%{name} does not take over your buses of line %{n}":
  de: "%{name} übernimmt deine Busse der Linie %{n} nicht"
  da: "%{name} overtager ikke dine busser på linje %{n}"
  fr: "%{name} ne reprend pas vos bus de la ligne %{n}"
  nl: "%{name} neemt je bussen van lijn %{n} niet over"
  pl: "%{name} nie przejmuje twoich autobusów z linii %{n}"
  ru: "%{name} не выкупает ваши автобусы с линии %{n}"
  uk: "%{name} не викуповує ваші автобуси з лінії %{n}"
"%{name} won line %{n} and does not take over the buses of yours that ran it: they stay yours.":
  de: "%{name} hat Linie %{n} gewonnen und übernimmt deine Busse darauf nicht: Sie bleiben deine."
  da: "%{name} vandt linje %{n} og overtager ikke de busser fra dig, der kørte den: de forbliver dine."
  fr: "%{name} a remporté la ligne %{n} et ne reprend pas vos bus qui l'assuraient : ils restent à vous."
  nl: "%{name} won lijn %{n} en neemt je bussen die erop reden niet over: ze blijven van jou."
  pl: "%{name} wygrała linię %{n} i nie przejmuje twoich autobusów, które ją obsługiwały: zostają twoje."
  ru: "%{name} выиграла линию %{n} и не выкупает ваши автобусы, обслуживавшие её: они остаются вашими."
  uk: "%{name} виграла лінію %{n} і не викуповує ваші автобуси, що її обслуговували: вони лишаються вашими."
# (NexiconDK) Bidding by the timetable hour, the payment by the hours run, the departures early
# and late and the delay reported (omsihub/company_more/concessions.rs, company/crew.rs,
# company::server_fines).
"%{amount} an hour":
  de: "%{amount} je Stunde"
  da: "%{amount} i timen"
  fr: "%{amount} de l'heure"
  nl: "%{amount} per uur"
  pl: "%{amount} za godzinę"
  ru: "%{amount} в час"
  uk: "%{amount} на годину"
"The most the authority pays a timetable hour: an ask above it does not count.":
  de: "Das Höchste, was die Behörde je Fahrplanstunde zahlt: ein höheres Gebot zählt nicht."
  da: "Det meste, trafikselskabet betaler pr. køreplantime: et bud over det tæller ikke."
  fr: "Le maximum que l'autorité paie par heure d'horaire : une offre au-dessus ne compte pas."
  nl: "Het meeste dat de opdrachtgever per dienstregelingsuur betaalt: een hoger bod telt niet."
  pl: "Najwięcej, ile zamawiający płaci za godzinę rozkładową: wyższa oferta się nie liczy."
  ru: "Максимум, который заказчик платит за час по расписанию: ставка выше не засчитывается."
  uk: "Максимум, який замовник платить за годину за розкладом: ставка вище не зараховується."
"Your ask a timetable hour":
  de: "Dein Gebot je Fahrplanstunde"
  da: "Dit bud pr. køreplantime"
  fr: "Votre offre par heure d'horaire"
  nl: "Je bod per dienstregelingsuur"
  pl: "Twoja oferta za godzinę rozkładową"
  ru: "Ваша ставка за час по расписанию"
  uk: "Ваша ставка за годину за розкладом"
"About %{week} a week and %{term} for the contract's %{days} days: %{hours} timetable hours at %{rate}":
  de: "Etwa %{week} pro Woche und %{term} für die %{days} Tage des Vertrags: %{hours} Fahrplanstunden zu %{rate}"
  da: "Omkring %{week} om ugen og %{term} for kontraktens %{days} dage: %{hours} køreplantimer til %{rate}"
  fr: "Environ %{week} par semaine et %{term} pour les %{days} jours du contrat : %{hours} heures d'horaire à %{rate}"
  nl: "Ongeveer %{week} per week en %{term} voor de %{days} dagen van het contract: %{hours} dienstregelingsuren tegen %{rate}"
  pl: "Około %{week} tygodniowo i %{term} za %{days} dni umowy: %{hours} godzin rozkładowych po %{rate}"
  ru: "Около %{week} в неделю и %{term} за %{days} дн. контракта: %{hours} ч по расписанию по %{rate}"
  uk: "Близько %{week} на тиждень і %{term} за %{days} дн. контракту: %{hours} год за розкладом по %{rate}"
"%{amount}: an ask above it does not count":
  de: "%{amount}: ein höheres Gebot zählt nicht"
  da: "%{amount}: et bud over det tæller ikke"
  fr: "%{amount} : une offre au-dessus ne compte pas"
  nl: "%{amount}: een hoger bod telt niet"
  pl: "%{amount}: wyższa oferta się nie liczy"
  ru: "%{amount}: ставка выше не засчитывается"
  uk: "%{amount}: ставка вище не зараховується"
"Payment":
  de: "Bezahlung"
  da: "Betaling"
  fr: "Paiement"
  nl: "Betaling"
  pl: "Płatność"
  ru: "Оплата"
  uk: "Оплата"
"Term":
  de: "Laufzeit"
  da: "Løbetid"
  fr: "Durée"
  nl: "Looptijd"
  pl: "Okres"
  ru: "Срок"
  uk: "Строк"
"Asks are a price a timetable hour. The contract pays it each day for the timetable hours run: a journey not run is not paid.":
  de: "Gebote sind ein Preis je Fahrplanstunde. Der Vertrag zahlt ihn jeden Tag für die gefahrenen Fahrplanstunden: eine ausgefallene Fahrt wird nicht bezahlt."
  da: "Bud er en pris pr. køreplantime. Kontrakten betaler den hver dag for de kørte køreplantimer: en tur, der ikke er kørt, betales ikke."
  fr: "Les offres sont un prix par heure d'horaire. Le contrat le paie chaque jour pour les heures d'horaire effectuées : un trajet non effectué n'est pas payé."
  nl: "Biedingen zijn een prijs per dienstregelingsuur. Het contract betaalt die elke dag voor de gereden dienstregelingsuren: een uitgevallen rit wordt niet betaald."
  pl: "Oferty to cena za godzinę rozkładową. Umowa płaci ją codziennie za przejechane godziny rozkładowe: niewykonany kurs nie jest opłacany."
  ru: "Ставки — цена за час по расписанию. Контракт платит её каждый день за выполненные часы: невыполненный рейс не оплачивается."
  uk: "Ставки — ціна за годину за розкладом. Контракт платить її щодня за виконані години: невиконаний рейс не оплачується."
"Leaving a stop early":
  de: "Zu frühe Abfahrt"
  da: "At forlade et stoppested for tidligt"
  fr: "Départ en avance"
  nl: "Te vroeg vertrekken"
  pl: "Zbyt wczesny odjazd"
  ru: "Ранний отъезд"
  uk: "Ранній від'їзд"
"%{amount} a departure more than a minute early":
  de: "%{amount} je Abfahrt mehr als eine Minute zu früh"
  da: "%{amount} pr. afgang mere end et minut for tidligt"
  fr: "%{amount} par départ plus d'une minute en avance"
  nl: "%{amount} per vertrek meer dan een minuut te vroeg"
  pl: "%{amount} za odjazd ponad minutę za wcześnie"
  ru: "%{amount} за отъезд раньше более чем на минуту"
  uk: "%{amount} за від'їзд раніше більш ніж на хвилину"
"Leaving a stop late":
  de: "Zu späte Abfahrt"
  da: "At forlade et stoppested for sent"
  fr: "Départ en retard"
  nl: "Te laat vertrekken"
  pl: "Zbyt późny odjazd"
  ru: "Поздний отъезд"
  uk: "Пізній від'їзд"
"%{amount} a departure more than 15 minutes late, unless the delay was reported to the control room: a player reports his on his duty, the dispatcher those of the company's drivers":
  de: "%{amount} je Abfahrt mehr als 15 Minuten zu spät, außer die Verspätung wurde der Leitstelle gemeldet: ein Spieler meldet seine bei seinem Dienst, der Disponent die der Fahrer der Firma"
  da: "%{amount} pr. afgang mere end 15 minutter for sent, medmindre forsinkelsen blev meldt til kontrolrummet: en spiller melder sin på sin vagt, trafiklederen dem for selskabets chauffører"
  fr: "%{amount} par départ plus de 15 minutes en retard, sauf si le retard a été signalé au poste de contrôle : un joueur signale le sien depuis son service, le régulateur ceux des conducteurs de l'entreprise"
  nl: "%{amount} per vertrek meer dan 15 minuten te laat, tenzij de vertraging aan de verkeersleiding is gemeld: een speler meldt de zijne bij zijn dienst, de dispatcher die van de chauffeurs van het bedrijf"
  pl: "%{amount} za odjazd ponad 15 minut za późno, chyba że opóźnienie zgłoszono dyspozytorni: gracz zgłasza swoje na swojej służbie, dyspozytor te kierowców firmy"
  ru: "%{amount} за отъезд позже более чем на 15 минут, если о задержке не сообщили в диспетчерскую: игрок сообщает о своей на своей смене, диспетчер — о задержках водителей компании"
  uk: "%{amount} за від'їзд пізніше більш ніж на 15 хвилин, якщо про затримку не повідомили диспетчерській: гравець повідомляє про свою на своїй зміні, диспетчер — про затримки водіїв компанії"
"%{amount} a timetable hour run":
  de: "%{amount} je gefahrene Fahrplanstunde"
  da: "%{amount} pr. kørt køreplantime"
  fr: "%{amount} par heure d'horaire effectuée"
  nl: "%{amount} per gereden dienstregelingsuur"
  pl: "%{amount} za przejechaną godzinę rozkładową"
  ru: "%{amount} за выполненный час по расписанию"
  uk: "%{amount} за виконану годину за розкладом"
"Report a delay":
  de: "Verspätung melden"
  da: "Meld en forsinkelse"
  fr: "Signaler un retard"
  nl: "Vertraging melden"
  pl: "Zgłoś opóźnienie"
  ru: "Сообщить о задержке"
  uk: "Повідомити про затримку"
"Tell the control room you run late: from now on your departures more than 15 minutes late are not fined.":
  de: "Melde der Leitstelle, dass du Verspätung hast: ab jetzt werden deine Abfahrten mit mehr als 15 Minuten Verspätung nicht bestraft."
  da: "Sig til kontrolrummet, at du kører for sent: fra nu af får dine afgange mere end 15 minutter for sent ikke en bod."
  fr: "Signalez au poste de contrôle que vous êtes en retard : désormais vos départs à plus de 15 minutes de retard ne sont pas pénalisés."
  nl: "Meld de verkeersleiding dat je te laat bent: vanaf nu krijgen je vertrekken met meer dan 15 minuten vertraging geen boete."
  pl: "Powiedz dyspozytorni, że masz opóźnienie: od teraz twoje odjazdy spóźnione o ponad 15 minut nie są karane."
  ru: "Сообщите диспетчерской, что опаздываете: отныне ваши отъезды с опозданием более 15 минут не штрафуются."
  uk: "Повідомте диспетчерській, що запізнюєтеся: відтепер ваші від'їзди із запізненням понад 15 хвилин не штрафуються."
"You are not driving a duty now.":
  de: "Du fährst gerade keinen Dienst."
  da: "Du kører ikke en vagt nu."
  fr: "Vous ne conduisez pas de service en ce moment."
  nl: "Je rijdt nu geen dienst."
  pl: "Nie prowadzisz teraz żadnej służby."
  ru: "Сейчас вы не ведёте смену."
  uk: "Зараз ви не ведете зміну."
"Your delay is reported to the control room: the authority does not fine your late departures from now on.":
  de: "Deine Verspätung ist der Leitstelle gemeldet: die Behörde bestraft deine verspäteten Abfahrten ab jetzt nicht."
  da: "Din forsinkelse er meldt til kontrolrummet: trafikselskabet idømmer ikke bod for dine sene afgange fra nu af."
  fr: "Votre retard est signalé au poste de contrôle : l'autorité ne pénalise plus vos départs en retard."
  nl: "Je vertraging is gemeld aan de verkeersleiding: de opdrachtgever beboet je late vertrekken vanaf nu niet."
  pl: "Twoje opóźnienie zgłoszono dyspozytorni: zamawiający od teraz nie karze twoich spóźnionych odjazdów."
  ru: "О вашей задержке сообщено в диспетчерскую: заказчик больше не штрафует ваши поздние отъезды."
  uk: "Про вашу затримку повідомлено диспетчерській: замовник більше не штрафує ваші пізні від'їзди."
# (NexiconDK) Phase 4 step 4: a depot in the red warned, then bankrupt (company::server_depots).
"The depot is in the red: %{n} days to go":
  de: "Das Depot ist im Minus: noch %{n} Tage"
  da: "Afdelingen er i minus: %{n} dage tilbage"
  fr: "Le dépôt est dans le rouge : encore %{n} jours"
  nl: "De remise staat rood: nog %{n} dagen"
  pl: "Zajezdnia jest na minusie: zostało %{n} dni"
  ru: "Депо в минусе: осталось %{n} дн."
  uk: "Депо в мінусі: лишилося %{n} дн."
"The depot has %{amount} in cash. Still in the red at the close of %{n} more days, it goes bankrupt: it closes, and its head office covers its loss. Sell buses, cut costs, or ask the head office for money.":
  de: "Das Depot hat %{amount} Kasse. Ist es nach Abschluss von %{n} weiteren Tagen noch im Minus, geht es pleite: Es schließt, und die Zentrale deckt seinen Verlust. Verkaufe Busse, senke Kosten oder bitte die Zentrale um Geld."
  da: "Afdelingen har %{amount} i kontanter. Er den stadig i minus ved afslutningen af %{n} dage mere, går den konkurs: den lukker, og hovedkontoret dækker dens tab. Sælg busser, skær i omkostningerne, eller bed hovedkontoret om penge."
  fr: "Le dépôt a %{amount} en caisse. Encore dans le rouge à la clôture de %{n} jours de plus, il fait faillite : il ferme, et son siège couvre sa perte. Vendez des bus, réduisez les coûts ou demandez de l'argent au siège."
  nl: "De remise heeft %{amount} in kas. Staat ze na de afsluiting van nog %{n} dagen nog rood, dan gaat ze failliet: ze sluit, en het hoofdkantoor dekt het verlies. Verkoop bussen, verlaag kosten of vraag het hoofdkantoor om geld."
  pl: "Zajezdnia ma %{amount} w kasie. Jeśli po zamknięciu kolejnych %{n} dni nadal będzie na minusie, zbankrutuje: zostanie zamknięta, a centrala pokryje jej stratę. Sprzedaj autobusy, obetnij koszty albo poproś centralę o pieniądze."
  ru: "У депо %{amount} в кассе. Если после закрытия ещё %{n} дн. оно останется в минусе, оно обанкротится: закроется, а головной офис покроет его убыток. Продайте автобусы, сократите расходы или попросите деньги у головного офиса."
  uk: "Депо має %{amount} у касі. Якщо після закриття ще %{n} дн. воно лишиться в мінусі, воно збанкрутує: закриється, а головний офіс покриє його збиток. Продайте автобуси, скоротіть витрати або попросіть гроші в головного офісу."
