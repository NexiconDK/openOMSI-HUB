"The game starts by itself as soon as the world is ready. You may leave this open.":
  de: "Das Spiel startet von selbst, sobald die Welt bereit ist. Du kannst dies offen lassen."
  da: "Spillet starter af sig selv, så snart verdenen er klar. Du kan lade dette stå åbent."
  fr: "Le jeu démarre tout seul dès que le monde est prêt. Vous pouvez laisser ceci ouvert."
  nl: "Het spel start vanzelf zodra de wereld klaar is. Je kunt dit open laten."
  pl: "Gra uruchomi się sama, gdy świat będzie gotowy. Możesz zostawić to otwarte."
  ru: "Игра запустится сама, как только мир будет готов. Это окно можно оставить открытым."
  uk: "Гра запуститься сама, щойно світ буде готовий. Це вікно можна залишити відкритим."
