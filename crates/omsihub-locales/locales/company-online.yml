"The subcontract on %{lines} with %{who} ends with notice on %{date}.":
  de: "Der Unterauftrag über %{lines} mit %{who} endet mit Kündigung am %{date}."
  da: "Underleverandøraftalen om %{lines} med %{who} slutter efter opsigelse den %{date}."
  fr: "La sous-traitance sur %{lines} avec %{who} prend fin avec préavis le %{date}."
  nl: "De onderaanneming op %{lines} met %{who} eindigt na opzegging op %{date}."
  pl: "Podwykonawstwo na %{lines} z %{who} kończy się z wypowiedzeniem %{date}."
  ru: "Субподряд на %{lines} с %{who} прекращается с уведомлением %{date}."
  uk: "Субпідряд на %{lines} з %{who} припиняється з повідомленням %{date}."
"The joint bid on %{n} lost: the subcontract with %{who} on %{lines} falls away.":
  de: "Das gemeinsame Gebot für %{n} hat verloren: der Unterauftrag mit %{who} über %{lines} entfällt."
  da: "Det fælles bud på %{n} tabte: underleverandøraftalen med %{who} om %{lines} bortfalder."
  fr: "L'offre commune sur %{n} a perdu : la sous-traitance avec %{who} sur %{lines} tombe."
  nl: "Het gezamenlijke bod op %{n} heeft verloren: de onderaanneming met %{who} op %{lines} vervalt."
  pl: "Wspólna oferta na %{n} przegrała: podwykonawstwo z %{who} na %{lines} odpada."
  ru: "Совместная ставка на %{n} проиграла: субподряд с %{who} на %{lines} отпадает."
  uk: "Спільна ставка на %{n} програла: субпідряд з %{who} на %{lines} відпадає."
