"Asks are a price a timetable hour. The contract pays it each day for the timetable hours run: a journey not run is not paid.":
  de: "Gebote sind ein Preis je Fahrplanstunde. Der Vertrag zahlt ihn jeden Tag für die gefahrenen Fahrplanstunden: eine ausgefallene Fahrt wird nicht bezahlt."
  fr: "Les offres sont un prix par heure d'horaire. Le contrat le paie chaque jour pour les heures d'horaire effectuées : un trajet non effectué n'est pas payé."
  nl: "Biedingen zijn een prijs per dienstregelingsuur. Het contract betaalt die elke dag voor de gereden dienstregelingsuren: een uitgevallen rit wordt niet betaald."
  pl: "Oferty to cena za godzinę rozkładową. Umowa płaci ją codziennie za przejechane godziny rozkładowe: niewykonany kurs nie jest opłacany."
  ru: "Ставки — цена за час по расписанию. Контракт платит её каждый день за выполненные часы: невыполненный рейс не оплачивается."
  uk: "Ставки — ціна за годину за розкладом. Контракт платить її щодня за виконані години: невиконаний рейс не оплачується."
