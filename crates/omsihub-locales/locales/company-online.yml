"A duty with a bus and no driver is run by a free colleague or an agency driver at the agency's price.":
  de: "Ein Dienst mit Bus, aber ohne Fahrer wird von einem freien Kollegen oder einem Leihfahrer zum Preis der Agentur gefahren."
  da: "En vagt med en bus, men ingen chauffør køres af en ledig kollega eller en vikarchauffør til bureauets pris."
  fr: "Un service avec un bus mais sans conducteur est assuré par un collègue libre ou un intérimaire au prix de l'agence."
  nl: "Een dienst met een bus maar zonder chauffeur wordt gereden door een vrije collega of een uitzendchauffeur tegen de prijs van het bureau."
  pl: "Służbę z autobusem, ale bez kierowcy prowadzi wolny kolega albo kierowca z agencji po cenie agencji."
  ru: "Смену с автобусом, но без водителя ведёт свободный коллега или водитель агентства по цене агентства."
  uk: "Зміну з автобусом, але без водія веде вільний колега або водій агенції за ціною агенції."
"A duty with a bus and no driver is not run: its journeys are dropped, fined and count against the bonus.":
  de: "Ein Dienst mit Bus, aber ohne Fahrer fährt nicht: seine Fahrten fallen aus, werden bestraft und zählen gegen den Bonus."
  da: "En vagt med en bus, men ingen chauffør køres ikke: dens ture droppes, giver bod og tæller mod bonussen."
  fr: "Un service avec un bus mais sans conducteur ne roule pas : ses courses sont supprimées, pénalisées et comptent contre le bonus."
  nl: "Een dienst met een bus maar zonder chauffeur rijdt niet: de ritten vervallen, worden beboet en tellen tegen de bonus."
  pl: "Służba z autobusem, ale bez kierowcy nie jedzie: jej kursy przepadają, są karane i liczą się przeciw premii."
  ru: "Смена с автобусом, но без водителя не выходит: её рейсы отменяются, штрафуются и идут в минус бонусу."
  uk: "Зміна з автобусом, але без водія не виходить: її рейси скасовуються, штрафуються і йдуть у мінус бонусу."
