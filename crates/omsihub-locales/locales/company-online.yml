# (NexiconDK) Phase 4 step 3: buses moved between a company's maps and staff lent
# (company::server_depots, omsihub/company/dialogs.rs moves_part).
"This bus is not in the fleet.":
  de: "Dieser Bus ist nicht in der Flotte."
  da: "Denne bus er ikke i flåden."
  fr: "Ce bus ne fait pas partie de la flotte."
  nl: "Deze bus zit niet in de vloot."
  pl: "Tego autobusu nie ma we flocie."
  ru: "Этого автобуса нет в парке."
  uk: "Цього автобуса немає в парку."
"Only a bus the company owns moves to another map: a leased or rented one stays with its contract.":
  de: "Nur ein Bus im Eigentum der Firma zieht auf eine andere Karte um: ein geleaster oder gemieteter bleibt bei seinem Vertrag."
  da: "Kun en bus, selskabet ejer, flyttes til et andet kort: en leaset eller lejet bliver med sin kontrakt."
  fr: "Seul un bus appartenant à l'entreprise peut aller sur une autre carte : un bus en leasing ou loué reste avec son contrat."
  nl: "Alleen een bus die het bedrijf bezit verhuist naar een andere kaart: een geleasde of gehuurde blijft bij zijn contract."
  pl: "Na inną mapę przenosi się tylko autobus będący własnością firmy: leasingowany lub wynajęty zostaje przy swojej umowie."
  ru: "На другую карту переезжает только автобус, принадлежащий компании: лизинговый или арендованный остаётся по своему договору."
  uk: "На іншу карту переїжджає лише автобус, що належить компанії: лізинговий чи орендований лишається за своїм договором."
"The company has not the money for the move.":
  de: "Die Firma hat nicht das Geld für den Umzug."
  da: "Selskabet har ikke pengene til flytningen."
  fr: "L'entreprise n'a pas l'argent pour le transfert."
  nl: "Het bedrijf heeft het geld voor de verhuizing niet."
  pl: "Firma nie ma pieniędzy na przeniesienie."
  ru: "У компании нет денег на перевод."
  uk: "Компанія не має грошей на переведення."
"The other company's depot has no room for another bus.":
  de: "Das Depot der anderen Firma hat keinen Platz für einen weiteren Bus."
  da: "Det andet selskabs afdeling har ikke plads til endnu en bus."
  fr: "Le dépôt de l'autre entreprise n'a pas de place pour un bus de plus."
  nl: "De remise van het andere bedrijf heeft geen plaats voor nog een bus."
  pl: "Zajezdnia drugiej firmy nie ma miejsca na kolejny autobus."
  ru: "В депо другой компании нет места для ещё одного автобуса."
  uk: "У депо іншої компанії немає місця для ще одного автобуса."
"They do not work here.":
  de: "Diese Person arbeitet nicht hier."
  da: "De arbejder ikke her."
  fr: "Cette personne ne travaille pas ici."
  nl: "Deze persoon werkt hier niet."
  pl: "Ta osoba tu nie pracuje."
  ru: "Этот человек здесь не работает."
  uk: "Ця людина тут не працює."
"They are leaving the company.":
  de: "Diese Person verlässt die Firma."
  da: "De forlader selskabet."
  fr: "Cette personne quitte l'entreprise."
  nl: "Deze persoon verlaat het bedrijf."
  pl: "Ta osoba odchodzi z firmy."
  ru: "Этот человек уходит из компании."
  uk: "Ця людина йде з компанії."
"They are lent to the company: they go back first.":
  de: "Diese Person ist an die Firma ausgeliehen: sie geht erst zurück."
  da: "De er udlånt til selskabet: de går først tilbage."
  fr: "Cette personne est prêtée à l'entreprise : elle doit d'abord repartir."
  nl: "Deze persoon is aan het bedrijf uitgeleend: die gaat eerst terug."
  pl: "Ta osoba jest wypożyczona firmie: najpierw wraca."
  ru: "Этот человек одолжен компании: сначала он вернётся."
  uk: "Цю людину позичено компанії: спершу вона повернеться."
"They are to be lent already.":
  de: "Diese Person wird bereits ausgeliehen."
  da: "De skal allerede udlånes."
  fr: "Cette personne doit déjà être prêtée."
  nl: "Deze persoon wordt al uitgeleend."
  pl: "Ta osoba jest już do wypożyczenia."
  ru: "Этого человека уже одалживают."
  uk: "Цю людину вже позичають."
"Lend them for 1 to 90 days.":
  de: "Für 1 bis 90 Tage ausleihen."
  da: "Udlån dem i 1 til 90 dage."
  fr: "Prêter pour 1 à 90 jours."
  nl: "Leen uit voor 1 tot 90 dagen."
  pl: "Wypożycz na 1 do 90 dni."
  ru: "Одолжите на срок от 1 до 90 дней."
  uk: "Позичте на строк від 1 до 90 днів."
