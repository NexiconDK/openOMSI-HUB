"You may complain until the day before the start, %{d}: the authority looks at the bids and either lets the award stand or gives the contract to the next valid bidder.":
  de: "Du kannst dich bis zum Tag vor dem Beginn, %{d}, beschweren: der Aufgabenträger prüft die Gebote und lässt die Vergabe stehen oder gibt den Vertrag dem nächsten gültigen Bieter."
  da: "Du kan klage indtil dagen før start, %{d}: trafikselskabet ser på buddene og lader enten tildelingen stå eller giver kontrakten til den næste gyldige byder."
  fr: "Vous pouvez contester jusqu'à la veille du début, %{d} : l'autorité examine les offres et maintient l'attribution ou donne le contrat au soumissionnaire valide suivant."
  nl: "Je kunt klagen tot de dag vóór de start, %{d}: de opdrachtgever bekijkt de biedingen en laat de gunning staan of geeft het contract aan de volgende geldige bieder."
  pl: "Możesz złożyć skargę do dnia przed startem, %{d}: organizator przegląda oferty i albo utrzymuje rozstrzygnięcie, albo daje umowę kolejnemu ważnemu oferentowi."
  ru: "Жаловаться можно до дня перед началом, %{d}: заказчик рассмотрит ставки и либо оставит решение, либо отдаст контракт следующему действительному участнику."
  uk: "Скаржитися можна до дня перед початком, %{d}: замовник розгляне ставки й або залишить рішення, або віддасть контракт наступному дійсному учаснику."
