  da: "Et så stort køb kræver først hovedkontorets godkendelse: bed om den i indstillingerne under Afdelinger."
  fr: "Un achat aussi important nécessite d'abord l'accord du siège : demandez-le dans les paramètres, sous Dépôts."
  nl: "Een aankoop van deze omvang heeft eerst de goedkeuring van het hoofdkantoor nodig: vraag erom in de instellingen, onder Depots."
  pl: "Tak duży zakup wymaga najpierw zgody centrali: poproś o nią w ustawieniach, w części Zajezdnie."
