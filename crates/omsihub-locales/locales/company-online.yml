"On the server the admin decides whether agency drivers run the duties nobody covers.":
  de: "Auf dem Server bestimmt der Admin, ob Leihfahrer die Dienste fahren, die niemand übernimmt."
  da: "På serveren bestemmer admin, om vikarer kører de vagter, som ingen dækker."
  fr: "Sur le serveur, l'admin décide si des intérimaires assurent les services que personne ne couvre."
  nl: "Op de server beslist de admin of uitzendchauffeurs de diensten rijden die niemand dekt."
  pl: "Na serwerze admin decyduje, czy kierowcy z agencji jeżdżą służby, których nikt nie obsadzi."
  ru: "На сервере админ решает, ездят ли водители из агентства на сменах, которые никто не взял."
  uk: "На сервері адмін вирішує, чи їздять водії з агентства на змінах, які ніхто не взяв."
"Decided by the server's admin":
  de: "Bestimmt der Admin des Servers"
  da: "Bestemmes af serverens admin"
  fr: "Décidé par l'admin du serveur"
  nl: "Bepaald door de admin van de server"
  pl: "Decyduje admin serwera"
  ru: "Решает админ сервера"
  uk: "Вирішує адмін сервера"
"Breaking the rest rules":
  de: "Verstöße gegen die Ruhezeiten"
  da: "Brud på hviletidsreglerne"
  fr: "Enfreindre les règles de repos"
  nl: "Rusttijden overtreden"
  pl: "Łamanie zasad odpoczynku"
  ru: "Нарушение правил отдыха"
  uk: "Порушення правил відпочинку"
"A duty given breaking the rest rules anyway costs a fine of %{amount}, and the driver is less content.":
  de: "Ein Dienst, der trotz Verstoß gegen die Ruhezeiten vergeben wird, kostet eine Strafe von %{amount}, und der Fahrer ist weniger zufrieden."
  da: "En vagt givet trods brud på hviletidsreglerne koster en bøde på %{amount}, og chaufføren bliver mindre tilfreds."
  fr: "Un service donné malgré les règles de repos coûte une amende de %{amount}, et le conducteur est moins satisfait."
  nl: "Een dienst die toch wordt gegeven tegen de rusttijden in kost een boete van %{amount}, en de chauffeur is minder tevreden."
  pl: "Służba przydzielona mimo łamania zasad odpoczynku kosztuje karę %{amount}, a kierowca jest mniej zadowolony."
  ru: "Смена, отданная вопреки правилам отдыха, стоит штрафа %{amount}, а водитель менее доволен."
  uk: "Зміна, віддана всупереч правилам відпочинку, коштує штрафу %{amount}, а водій менш задоволений."
"No fine for breaking the rest rules: the driver is less content and more stressed.":
  de: "Keine Strafe für Verstöße gegen die Ruhezeiten: der Fahrer ist weniger zufrieden und gestresster."
  da: "Ingen bøde for brud på hviletidsreglerne: chaufføren bliver mindre tilfreds og mere stresset."
  fr: "Pas d'amende pour les règles de repos enfreintes : le conducteur est moins satisfait et plus stressé."
  nl: "Geen boete voor het overtreden van de rusttijden: de chauffeur is minder tevreden en meer gestrest."
  pl: "Brak kary za łamanie zasad odpoczynku: kierowca jest mniej zadowolony i bardziej zestresowany."
  ru: "Без штрафа за нарушение правил отдыха: водитель менее доволен и больше в стрессе."
  uk: "Без штрафу за порушення правил відпочинку: водій менш задоволений і більше в стресі."
"No fine":
  de: "Keine Strafe"
  da: "Ingen bøde"
  fr: "Pas d'amende"
  nl: "Geen boete"
  pl: "Bez kary"
  ru: "Без штрафа"
  uk: "Без штрафу"
"When a duty is given breaking the rest rules anyway (11 hours' rest, a day of at most 13 hours, a week of at most 48): the driver is less content and more stressed, and the company pays this fine.":
  de: "Wird ein Dienst trotz Verstoß gegen die Ruhezeiten vergeben (11 Stunden Ruhe, ein Tag von höchstens 13 Stunden, eine Woche von höchstens 48): der Fahrer ist weniger zufrieden und gestresster, und die Firma zahlt diese Strafe."
  da: "Når en vagt gives trods brud på hviletidsreglerne (11 timers hvil, en dag på højst 13 timer, en uge på højst 48): chaufføren bliver mindre tilfreds og mere stresset, og firmaet betaler denne bøde."
  fr: "Quand un service est donné malgré les règles de repos (11 heures de repos, une journée de 13 heures au plus, une semaine de 48 au plus) : le conducteur est moins satisfait et plus stressé, et l'entreprise paie cette amende."
  nl: "Als een dienst toch wordt gegeven tegen de rusttijden in (11 uur rust, een dag van hoogstens 13 uur, een week van hoogstens 48): de chauffeur is minder tevreden en meer gestrest, en het bedrijf betaalt deze boete."
  pl: "Gdy służba zostanie przydzielona mimo łamania zasad odpoczynku (11 godzin odpoczynku, dzień najwyżej 13 godzin, tydzień najwyżej 48): kierowca jest mniej zadowolony i bardziej zestresowany, a firma płaci tę karę."
  ru: "Когда смена отдаётся вопреки правилам отдыха (11 часов отдыха, день не больше 13 часов, неделя не больше 48): водитель менее доволен и больше в стрессе, а компания платит этот штраф."
  uk: "Коли зміну віддано всупереч правилам відпочинку (11 годин відпочинку, день не більше 13 годин, тиждень не більше 48): водій менш задоволений і більше в стресі, а компанія платить цей штраф."
"%{name} called at %{time}: ill and cannot come in today. Duty %{n} signs on at %{start} and has no driver now. Find a driver for it, or cut it.":
  de: "%{name} hat um %{time} angerufen: krank, kann heute nicht kommen. Dienst %{n} beginnt um %{start} und hat jetzt keinen Fahrer. Suchen Sie einen Fahrer dafür oder teilen Sie ihn."
  da: "%{name} ringede kl. %{time}: syg og kan ikke komme i dag. Vagt %{n} møder kl. %{start} og har ingen chauffør nu. Find en chauffør til den, eller klip den."
  fr: "%{name} a appelé à %{time} : malade, ne peut pas venir aujourd'hui. Le service %{n} commence à %{start} et n'a plus de conducteur. Trouvez-lui un conducteur ou coupez-le."
  nl: "%{name} belde om %{time}: ziek en kan vandaag niet komen. Dienst %{n} begint om %{start} en heeft nu geen chauffeur. Zoek er een chauffeur voor of knip hem."
  pl: "%{name} zadzwonił(a) o %{time}: chory/chora, nie przyjdzie dziś. Służba %{n} zaczyna się o %{start} i nie ma teraz kierowcy. Znajdź kierowcę albo ją podziel."
  ru: "%{name} позвонил(а) в %{time}: болен(а) и сегодня не придёт. Смена %{n} начинается в %{start} и сейчас без водителя. Найдите водителя или разрежьте её."
  uk: "%{name} зателефонував(ла) о %{time}: хворий(а) і сьогодні не прийде. Зміна %{n} починається о %{start} і зараз без водія. Знайдіть водія або розріжте її."
