  fr: "Départ en retard"
  nl: "Te laat vertrekken"
  pl: "Zbyt późny odjazd"
  ru: "Поздний отъезд"
  uk: "Пізній від'їзд"
"%{amount} a departure more than 15 minutes late, unless the delay was reported to the control room: a player reports his on his duty, the dispatcher those of the company's drivers":
  de: "%{amount} je Abfahrt mehr als 15 Minuten zu spät, außer die Verspätung wurde der Leitstelle gemeldet: ein Spieler meldet seine bei seinem Dienst, der Disponent die der Fahrer der Firma"
  fr: "%{amount} par départ plus de 15 minutes en retard, sauf si le retard a été signalé au poste de contrôle : un joueur signale le sien depuis son service, le régulateur ceux des conducteurs de l'entreprise"
  nl: "%{amount} per vertrek meer dan 15 minuten te laat, tenzij de vertraging aan de verkeersleiding is gemeld: een speler meldt de zijne bij zijn dienst, de dispatcher die van de chauffeurs van het bedrijf"
  pl: "%{amount} za odjazd ponad 15 minut za późno, chyba że opóźnienie zgłoszono dyspozytorni: gracz zgłasza swoje na swojej służbie, dyspozytor te kierowców firmy"
  ru: "%{amount} за отъезд позже более чем на 15 минут, если о задержке не сообщили в диспетчерскую: игрок сообщает о своей на своей смене, диспетчер — о задержках водителей компании"
  uk: "%{amount} за від'їзд пізніше більш ніж на 15 хвилин, якщо про затримку не повідомили диспетчерській: гравець повідомляє про свою на своїй зміні, диспетчер — про затримки водіїв компанії"
"%{amount} a timetable hour run":
  de: "%{amount} je gefahrene Fahrplanstunde"
  fr: "%{amount} par heure d'horaire effectuée"
  nl: "%{amount} per gereden dienstregelingsuur"
  pl: "%{amount} za przejechaną godzinę rozkładową"
  ru: "%{amount} за выполненный час по расписанию"
  uk: "%{amount} за виконану годину за розкладом"
"Report a delay":
  de: "Verspätung melden"
  fr: "Signaler un retard"
  nl: "Vertraging melden"
  pl: "Zgłoś opóźnienie"
  ru: "Сообщить о задержке"
  uk: "Повідомити про затримку"
"Tell the control room you run late: from now on your departures more than 15 minutes late are not fined.":
  de: "Melde der Leitstelle, dass du Verspätung hast: ab jetzt werden deine Abfahrten mit mehr als 15 Minuten Verspätung nicht bestraft."
  fr: "Signalez au poste de contrôle que vous êtes en retard : désormais vos départs à plus de 15 minutes de retard ne sont pas pénalisés."
  nl: "Meld de verkeersleiding dat je te laat bent: vanaf nu krijgen je vertrekken met meer dan 15 minuten vertraging geen boete."
  pl: "Powiedz dyspozytorni, że masz opóźnienie: od teraz twoje odjazdy spóźnione o ponad 15 minut nie są karane."
  ru: "Сообщите диспетчерской, что опаздываете: отныне ваши отъезды с опозданием более 15 минут не штрафуются."
  uk: "Повідомте диспетчерській, що запізнюєтеся: відтепер ваші від'їзди із запізненням понад 15 хвилин не штрафуються."
"You are not driving a duty now.":
  de: "Du fährst gerade keinen Dienst."
  fr: "Vous ne conduisez pas de service en ce moment."
  nl: "Je rijdt nu geen dienst."
  pl: "Nie prowadzisz teraz żadnej służby."
  ru: "Сейчас вы не ведёте смену."
  uk: "Зараз ви не ведете зміну."
"Your delay is reported to the control room: the authority does not fine your late departures from now on.":
  de: "Deine Verspätung ist der Leitstelle gemeldet: die Behörde bestraft deine verspäteten Abfahrten ab jetzt nicht."
  fr: "Votre retard est signalé au poste de contrôle : l'autorité ne pénalise plus vos départs en retard."
  nl: "Je vertraging is gemeld aan de verkeersleiding: de opdrachtgever beboet je late vertrekken vanaf nu niet."
  pl: "Twoje opóźnienie zgłoszono dyspozytorni: zamawiający od teraz nie karze twoich spóźnionych odjazdów."
  ru: "О вашей задержке сообщено в диспетчерскую: заказчик больше не штрафует ваши поздние отъезды."
  uk: "Про вашу затримку повідомлено диспетчерській: замовник більше не штрафує ваші пізні від'їзди."
# (NexiconDK) Phase 4 step 4: a depot in the red warned, then bankrupt (company::server_depots).
"The depot is in the red: %{n} days to go":
  de: "Das Depot ist im Minus: noch %{n} Tage"
  fr: "Le dépôt est dans le rouge : encore %{n} jours"
  nl: "De remise staat rood: nog %{n} dagen"
  pl: "Zajezdnia jest na minusie: zostało %{n} dni"
  ru: "Депо в минусе: осталось %{n} дн."
  uk: "Депо в мінусі: лишилося %{n} дн."
"The depot has %{amount} in cash. Still in the red at the close of %{n} more days, it goes bankrupt: it closes, and its head office covers its loss. Sell buses, cut costs, or ask the head office for money.":
  de: "Das Depot hat %{amount} Kasse. Ist es nach Abschluss von %{n} weiteren Tagen noch im Minus, geht es pleite: Es schließt, und die Zentrale deckt seinen Verlust. Verkaufe Busse, senke Kosten oder bitte die Zentrale um Geld."
  fr: "Le dépôt a %{amount} en caisse. Encore dans le rouge à la clôture de %{n} jours de plus, il fait faillite : il ferme, et son siège couvre sa perte. Vendez des bus, réduisez les coûts ou demandez de l'argent au siège."
  nl: "De remise heeft %{amount} in kas. Staat ze na de afsluiting van nog %{n} dagen nog rood, dan gaat ze failliet: ze sluit, en het hoofdkantoor dekt het verlies. Verkoop bussen, verlaag kosten of vraag het hoofdkantoor om geld."
