"Only a tender of the server's market takes a joint bid.":
  de: "Nur eine Ausschreibung des Server-Markts nimmt ein gemeinsames Gebot an."
  da: "Kun et udbud på serverens marked tager imod et fælles bud."
  fr: "Seul un appel d'offres du marché du serveur accepte une offre commune."
  nl: "Alleen een aanbesteding van de markt van de server neemt een gezamenlijk bod aan."
  pl: "Wspólną ofertę przyjmuje tylko przetarg z rynku serwera."
  ru: "Совместную ставку принимает только тендер рынка сервера."
  uk: "Спільну ставку приймає лише тендер ринку сервера."
"Sent to the server: it is taken at its next step.":
