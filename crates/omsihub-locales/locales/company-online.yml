  uk: "Запит %{name} на %{amount} відхилено."
"The guide":
  de: "Der Leitfaden"
  da: "Vejledningen"
  fr: "Le guide"
  nl: "De gids"
  pl: "Przewodnik"
  ru: "Руководство"
  uk: "Посібник"
"Bus Company Online: the guide":
  de: "Bus Company Online: der Leitfaden"
  da: "Bus Company Online: vejledningen"
  fr: "Bus Company Online : le guide"
  nl: "Bus Company Online: de gids"
  pl: "Bus Company Online: przewodnik"
  ru: "Bus Company Online: руководство"
  uk: "Bus Company Online: посібник"
"What it is":
  de: "Worum es geht"
  da: "Hvad det er"
  fr: "De quoi il s'agit"
  nl: "Wat het is"
  pl: "Czym to jest"
  ru: "Что это такое"
  uk: "Що це таке"
"Bus Company Online is one big server where the players' bus companies run around the clock, on the server's clock. Each map has a world of its own: everybody on a map drives in the same world, among every company's buses in their own colours. Where nobody drives, the AI drives the companies' tours.":
  de: "Bus Company Online ist ein großer Server, auf dem die Busfirmen der Spieler rund um die Uhr laufen, nach der Uhr des Servers. Jede Karte hat ihre eigene Welt: Alle auf einer Karte fahren in derselben Welt, zwischen den Bussen aller Firmen in ihren eigenen Farben. Wo niemand fährt, fährt die KI die Umläufe der Firmen."
  da: "Bus Company Online er én stor server, hvor spillernes buselskaber kører døgnet rundt, på serverens ur. Hvert kort har sin egen verden: alle på et kort kører i den samme verden, blandt alle selskabers busser i deres egne farver. Hvor ingen kører, kører AI'en selskabernes vognløb."
  fr: "Bus Company Online est un grand serveur où les entreprises de bus des joueurs tournent jour et nuit, à l'heure du serveur. Chaque carte a son propre monde : tous ceux qui sont sur une carte roulent dans le même monde, parmi les bus de toutes les entreprises dans leurs propres couleurs. Là où personne ne conduit, l'IA assure les services des entreprises."
  nl: "Bus Company Online is één grote server waarop de busbedrijven van de spelers de klok rond draaien, op de klok van de server. Elke kaart heeft een eigen wereld: iedereen op een kaart rijdt in dezelfde wereld, tussen de bussen van alle bedrijven in hun eigen kleuren. Waar niemand rijdt, rijdt de AI de omlopen van de bedrijven."
  pl: "Bus Company Online to jeden duży serwer, na którym firmy autobusowe graczy działają całą dobę, według zegara serwera. Każda mapa ma własny świat: wszyscy na danej mapie jeżdżą w tym samym świecie, wśród autobusów wszystkich firm w ich barwach. Tam, gdzie nikt nie jeździ, brygady firm obsługuje AI."
  ru: "Bus Company Online — это один большой сервер, где автобусные компании игроков работают круглосуточно, по часам сервера. У каждой карты свой мир: все на карте ездят в одном мире, среди автобусов всех компаний в их цветах. Где никто не ездит, выходы компаний обслуживает ИИ."
  uk: "Bus Company Online — це один великий сервер, де автобусні компанії гравців працюють цілодобово, за годинником сервера. Кожна карта має власний світ: усі на карті їздять в одному світі, серед автобусів усіх компаній у їхніх кольорах. Де ніхто не їздить, виходи компаній обслуговує ШІ."
"Getting in":
  de: "Hineinkommen"
  da: "At komme ind"
  fr: "Entrer"
  nl: "Binnenkomen"
  pl: "Jak dołączyć"
  ru: "Как войти"
  uk: "Як увійти"
"Ask the server's owner for its code (HUB-…) and enter it here. You log in with your Omsi-Hub account, this computer's Steam account, or both as one player. Your money on the server is your own: you start with some and earn more by driving.":
  de: "Frage den Besitzer des Servers nach seinem Code (HUB-…) und gib ihn hier ein. Du meldest dich mit deinem Omsi-Hub-Konto, dem Steam-Konto dieses Computers oder beidem als ein Spieler an. Dein Geld auf dem Server gehört dir: Du startest mit etwas und verdienst mehr durch Fahren."
  da: "Bed serverens ejer om dens kode (HUB-…), og indtast den her. Du logger ind med din Omsi-Hub-konto, denne computers Steam-konto eller begge som én spiller. Dine penge på serveren er dine egne: du starter med nogle og tjener mere ved at køre."
  fr: "Demandez au propriétaire du serveur son code (HUB-…) et saisissez-le ici. Vous vous connectez avec votre compte Omsi-Hub, le compte Steam de cet ordinateur, ou les deux comme un seul joueur. Votre argent sur le serveur est à vous : vous commencez avec un peu et en gagnez davantage en conduisant."
  nl: "Vraag de eigenaar van de server om de code (HUB-…) en vul die hier in. Je logt in met je Omsi-Hub-account, het Steam-account van deze computer, of allebei als één speler. Je geld op de server is van jou: je begint met wat en verdient meer door te rijden."
  pl: "Poproś właściciela serwera o jego kod (HUB-…) i wpisz go tutaj. Logujesz się kontem Omsi-Hub, kontem Steam tego komputera albo obydwoma jako jeden gracz. Twoje pieniądze na serwerze są twoje: zaczynasz z pewną kwotą i zarabiasz więcej, jeżdżąc."
  ru: "Попросите у владельца сервера его код (HUB-…) и введите его здесь. Вы входите с учётной записью Omsi-Hub, учётной записью Steam этого компьютера или обеими как один игрок. Деньги на сервере — ваши собственные: вы начинаете с некоторой суммы и зарабатываете больше, водя автобус."
  uk: "Попросіть у власника сервера його код (HUB-…) і введіть його тут. Ви входите з обліковим записом Omsi-Hub, обліковим записом Steam цього комп'ютера або обома як один гравець. Гроші на сервері — ваші власні: ви починаєте з певною сумою і заробляєте більше, водячи автобус."
"Joining a company":
  de: "Einer Firma beitreten"
  da: "At deltage i et selskab"
  fr: "Rejoindre une entreprise"
  nl: "Bij een bedrijf komen"
  pl: "Dołączanie do firmy"
  ru: "Вступление в компанию"
  uk: "Вступ до компанії"
"Join opens a company's pages with the role its owner gave you: driver, planner, manager or co-owner. A driver gets his duties in the planning; Drive starts the map's world on the server if it is not running and puts you on your duty with the company's bus.":
  de: "Beitreten öffnet die Seiten einer Firma mit der Rolle, die dir ihr Besitzer gegeben hat: Fahrer, Planer, Manager oder Mitinhaber. Ein Fahrer bekommt seine Dienste in der Planung; Fahren startet die Welt der Karte auf dem Server, falls sie nicht läuft, und setzt dich mit dem Bus der Firma in deinen Dienst."
  da: "Deltag åbner et selskabs sider med den rolle, dets ejer gav dig: chauffør, planlægger, leder eller medejer. En chauffør får sine vagter i planlægningen; Kør starter kortets verden på serveren, hvis den ikke kører, og sætter dig på din vagt med selskabets bus."
  fr: "Rejoindre ouvre les pages d'une entreprise avec le rôle que son propriétaire vous a donné : conducteur, planificateur, gestionnaire ou copropriétaire. Un conducteur reçoit ses services dans la planification ; Conduire démarre le monde de la carte sur le serveur s'il ne tourne pas et vous place sur votre service avec le bus de l'entreprise."
  nl: "Meedoen opent de pagina's van een bedrijf met de rol die de eigenaar je gaf: chauffeur, planner, manager of mede-eigenaar. Een chauffeur krijgt zijn diensten in de planning; Rijden start de wereld van de kaart op de server als die niet draait en zet je op je dienst met de bus van het bedrijf."
  pl: "Dołącz otwiera strony firmy z rolą nadaną ci przez właściciela: kierowca, planista, menedżer lub współwłaściciel. Kierowca dostaje służby w planowaniu; Jedź uruchamia świat mapy na serwerze, jeśli nie działa, i stawia cię na twojej służbie z autobusem firmy."
  ru: "«Вступить» открывает страницы компании с ролью, которую дал вам владелец: водитель, планировщик, менеджер или совладелец. Водитель получает смены в планировании; «Ехать» запускает мир карты на сервере, если он не запущен, и ставит вас на смену с автобусом компании."
  uk: "«Вступити» відкриває сторінки компанії з роллю, яку дав вам власник: водій, планувальник, менеджер або співвласник. Водій отримує зміни в плануванні; «Їхати» запускає світ карти на сервері, якщо він не працює, і ставить вас на зміну з автобусом компанії."
"Driving and pay":
  de: "Fahren und Lohn"
  da: "Kørsel og løn"
  fr: "Conduite et salaire"
  nl: "Rijden en loon"
  pl: "Jazda i wynagrodzenie"
  ru: "Вождение и оплата"
  uk: "Водіння та оплата"
"The world measures every trip you drive: it has to see your bus on that tour. The company books the trip and keeps its share (its owner sets it); the rest is your pay, into your money on the server. Running late? Report the delay on your duty: a departure more than 15 minutes late that was not reported is fined.":
  de: "Die Welt misst jede Fahrt, die du fährst: Sie muss deinen Bus auf diesem Umlauf sehen. Die Firma bucht die Fahrt und behält ihren Anteil (ihr Besitzer legt ihn fest); der Rest ist dein Lohn, auf dein Geld auf dem Server. Verspätet? Melde die Verspätung in deinem Dienst: Eine Abfahrt mehr als 15 Minuten zu spät, die nicht gemeldet wurde, kostet eine Strafe."
  da: "Verdenen måler hver tur, du kører: den skal se din bus på det vognløb. Selskabet bogfører turen og beholder sin andel (dets ejer fastsætter den); resten er din løn, ind på dine penge på serveren. Kører du for sent? Meld forsinkelsen på din vagt: en afgang mere end 15 minutter for sent, som ikke blev meldt, straffes med en bod."
  fr: "Le monde mesure chaque trajet que vous conduisez : il doit voir votre bus sur ce service. L'entreprise enregistre le trajet et garde sa part (fixée par son propriétaire) ; le reste est votre salaire, versé sur votre argent du serveur. En retard ? Signalez le retard sur votre service : un départ de plus de 15 minutes de retard non signalé est sanctionné."
  nl: "De wereld meet elke rit die je rijdt: hij moet je bus op die omloop zien. Het bedrijf boekt de rit en houdt zijn deel (de eigenaar bepaalt het); de rest is je loon, op je geld op de server. Te laat? Meld de vertraging bij je dienst: een vertrek van meer dan 15 minuten te laat dat niet gemeld is, levert een boete op."
  pl: "Świat mierzy każdy przejechany kurs: musi widzieć twój autobus na tej brygadzie. Firma księguje kurs i zatrzymuje swój udział (ustala go właściciel); reszta to twoje wynagrodzenie, na twoje pieniądze na serwerze. Spóźniasz się? Zgłoś opóźnienie w swojej służbie: niezgłoszony odjazd spóźniony o ponad 15 minut kończy się karą."
  ru: "Мир измеряет каждый ваш рейс: он должен видеть ваш автобус на этом выходе. Компания записывает рейс и оставляет свою долю (её задаёт владелец); остальное — ваша оплата, на ваши деньги на сервере. Опаздываете? Сообщите о задержке в своей смене: незаявленное отправление с опозданием более 15 минут штрафуется."
  uk: "Світ вимірює кожен ваш рейс: він має бачити ваш автобус на цьому виході. Компанія записує рейс і залишає свою частку (її встановлює власник); решта — ваша оплата, на ваші гроші на сервері. Запізнюєтеся? Повідомте про затримку у своїй зміні: незаявлене відправлення із запізненням понад 15 хвилин штрафується."
"Founding your own company":
  de: "Eine eigene Firma gründen"
  da: "At stifte dit eget selskab"
  fr: "Fonder votre propre entreprise"
  nl: "Een eigen bedrijf oprichten"
  pl: "Zakładanie własnej firmy"
  ru: "Основание своей компании"
  uk: "Заснування власної компанії"
"Founding a company costs %{price} of your own money.":
  de: "Eine Firma zu gründen kostet %{price} deines eigenen Geldes."
  da: "At stifte et selskab koster %{price} af dine egne penge."
  fr: "Fonder une entreprise coûte %{price} de votre propre argent."
  nl: "Een bedrijf oprichten kost %{price} van je eigen geld."
  pl: "Założenie firmy kosztuje %{price} z twoich pieniędzy."
  ru: "Основание компании стоит %{price} ваших собственных денег."
  uk: "Заснування компанії коштує %{price} ваших власних грошей."
"First you drive %{n} trips for a company on the server.":
  de: "Zuerst fährst du %{n} Fahrten für eine Firma auf dem Server."
  da: "Først kører du %{n} ture for et selskab på serveren."
  fr: "D'abord, vous effectuez %{n} trajets pour une entreprise du serveur."
  nl: "Eerst rijd je %{n} ritten voor een bedrijf op de server."
  pl: "Najpierw przejeżdżasz %{n} kursów dla firmy na serwerze."
  ru: "Сначала вы выполняете %{n} рейсов для компании на сервере."
  uk: "Спершу ви виконуєте %{n} рейсів для компанії на сервері."
"You take the leadership course: %{price}, %{days} days on the server's clock.":
  de: "Du machst den Führungskurs: %{price}, %{days} Tage nach der Uhr des Servers."
  da: "Du tager lederskabskurset: %{price}, %{days} dage på serverens ur."
  fr: "Vous suivez la formation de direction : %{price}, %{days} jours à l'heure du serveur."
  nl: "Je volgt de leiderschapscursus: %{price}, %{days} dagen op de klok van de server."
  pl: "Przechodzisz kurs kierowniczy: %{price}, %{days} dni według zegara serwera."
  ru: "Вы проходите курс руководителя: %{price}, %{days} дн. по часам сервера."
  uk: "Ви проходите курс керівника: %{price}, %{days} дн. за годинником сервера."
"And you pass a driving test on the server: book it in the found dialog - your next trip with a bus of that class is the test, to be driven to its end, on time, smoothly and safely.":
  de: "Und du bestehst eine Fahrprüfung auf dem Server: Buche sie im Gründungsdialog - deine nächste Fahrt mit einem Bus dieser Klasse ist die Prüfung, bis zum Ende, pünktlich, ruhig und sicher zu fahren."
  da: "Og du består en køreprøve på serveren: book den i stiftelsesdialogen - din næste tur med en bus i den klasse er prøven, der skal køres til ende, til tiden, roligt og sikkert."
  fr: "Et vous réussissez un examen de conduite sur le serveur : réservez-le dans la fenêtre de création - votre prochain trajet avec un bus de cette classe est l'examen, à conduire jusqu'au bout, à l'heure, en douceur et en sécurité."
  nl: "En je haalt een rijexamen op de server: boek het in het oprichtingsvenster - je volgende rit met een bus van die klasse is het examen, tot het einde, op tijd, rustig en veilig te rijden."
  pl: "I zdajesz egzamin z jazdy na serwerze: zarezerwuj go w oknie zakładania - twój następny kurs autobusem tej klasy jest egzaminem, do przejechania do końca, punktualnie, płynnie i bezpiecznie."
  ru: "И вы сдаёте экзамен по вождению на сервере: запишитесь на него в окне основания — ваш следующий рейс на автобусе этого класса и есть экзамен; его нужно проехать до конца, вовремя, плавно и безопасно."
  uk: "І ви складаєте іспит з водіння на сервері: забронюйте його у вікні заснування — ваш наступний рейс автобусом цього класу і є іспитом; його треба проїхати до кінця, вчасно, плавно й безпечно."
"Lines and tenders":
  de: "Linien und Ausschreibungen"
  da: "Linjer og udbud"
  fr: "Lignes et appels d'offres"
  nl: "Lijnen en aanbestedingen"
  pl: "Linie i przetargi"
  ru: "Линии и тендеры"
  uk: "Лінії та тендери"
"On each map a line belongs to one company at most, won in a tender. A tender is open for three days. Every company of the map and its operators hand in one sealed bid - a price per timetable hour, with diesel buses (a two-week contract) or electric ones (a month) - and nobody sees another's until the close; then all are opened, and the lowest price weighed with quality wins. A bid under 85 % of the authority's cost price is rejected as abnormally low, and the cap is that cost price by one and a half. An operator that wins runs the line for its term, but may give it up early: then it is out to tender again at once. A chrono event of the map that brings lines of its own - a match day's shuttles - puts them out to tender a week before it, for its days alone. A renewal is a new tender: it opens six days before the term ends and is decided three days before.":
  de: "Auf jeder Karte gehört eine Linie höchstens einer Firma, gewonnen in einer Ausschreibung. Eine Ausschreibung ist drei Tage offen. Jede Firma der Karte und ihre Betreiber geben ein verdecktes Gebot ab - einen Preis pro Fahrplanstunde, mit Dieselbussen (ein Vertrag über zwei Wochen) oder Elektrobussen (ein Monat) - und niemand sieht das eines anderen vor dem Schluss; dann werden alle geöffnet, und der niedrigste Preis, gewichtet mit der Qualität, gewinnt. Ein Gebot unter 85 % des Kostenpreises der Behörde wird als ungewöhnlich niedrig abgelehnt, und die Obergrenze ist dieser Kostenpreis mal anderthalb. Ein Betreiber, der gewinnt, fährt die Linie seine Laufzeit lang, kann sie aber früher aufgeben: dann wird sie sofort neu ausgeschrieben. Ein Chrono-Ereignis der Karte mit eigenen Linien - die Shuttles eines Spieltags - schreibt sie eine Woche vorher aus, nur für seine Tage. Eine Verlängerung ist eine neue Ausschreibung: Sie öffnet sechs Tage vor Ende der Laufzeit und wird drei Tage vorher entschieden."
  da: "På hvert kort tilhører en linje højst ét selskab, vundet i et udbud. Et udbud er åbent i tre dage. Hvert selskab på kortet og dets operatører afgiver ét forseglet bud - en pris pr. køreplantime, med dieselbusser (en kontrakt på to uger) eller elbusser (en måned) - og ingen ser en andens før lukningen; så åbnes alle, og den laveste pris, vejet med kvalitet, vinder. Et bud under 85 % af trafikselskabets kostpris afvises som unormalt lavt, og loftet er den kostpris gange halvanden. En operatør, der vinder, kører linjen i sin løbetid, men kan opgive den tidligt: så er den i udbud igen med det samme. En chrono-begivenhed på kortet, der bringer egne linjer - en kampdags ekstrabusser - sender dem i udbud en uge før, kun for dens dage. En fornyelse er et nyt udbud: det åbner seks dage før løbetiden slutter og afgøres tre dage før."
  fr: "Sur chaque carte, une ligne appartient au plus à une entreprise, gagnée par appel d'offres. Un appel d'offres reste ouvert trois jours. Chaque entreprise de la carte et ses exploitants remettent une offre cachetée - un prix par heure de service, avec des bus diesel (un contrat de deux semaines) ou électriques (un mois) - et personne ne voit celle d'un autre avant la clôture ; toutes sont alors ouvertes, et le prix le plus bas pondéré par la qualité l'emporte. Une offre sous 85 % du prix de revient de l'autorité est rejetée comme anormalement basse, et le plafond est ce prix de revient multiplié par 1,5. Un exploitant qui gagne exploite la ligne pendant sa période, mais peut l'abandonner plus tôt : elle est alors remise en appel d'offres aussitôt. Un événement chrono de la carte qui apporte ses propres lignes - les navettes d'un jour de match - les met en appel d'offres une semaine avant, pour ses seuls jours. Un renouvellement est un nouvel appel d'offres : il ouvre six jours avant la fin de la période et est décidé trois jours avant."
  nl: "Op elke kaart hoort een lijn bij hoogstens één bedrijf, gewonnen in een aanbesteding. Een aanbesteding staat drie dagen open. Elk bedrijf van de kaart en haar vervoerders doen één gesloten bod - een prijs per dienstregelingsuur, met dieselbussen (een contract van twee weken) of elektrische (een maand) - en niemand ziet dat van een ander voor de sluiting; dan worden ze allemaal geopend, en de laagste prijs, gewogen met kwaliteit, wint. Een bod onder 85 % van de kostprijs van de opdrachtgever wordt als abnormaal laag afgewezen, en het plafond is die kostprijs maal anderhalf. Een vervoerder die wint, rijdt de lijn zijn looptijd lang, maar kan haar eerder opgeven: dan wordt ze meteen opnieuw aanbesteed. Een chrono-evenement van de kaart met eigen lijnen - de shuttles van een wedstrijddag - besteedt ze een week ervoor aan, alleen voor de dagen ervan. Een verlenging is een nieuwe aanbesteding: die opent zes dagen voor het einde van de looptijd en wordt drie dagen ervoor beslist."
  pl: "Na każdej mapie linia należy najwyżej do jednej firmy, wygrana w przetargu. Przetarg jest otwarty przez trzy dni. Każda firma mapy i jej przewoźnicy składają jedną zamkniętą ofertę - cenę za godzinę rozkładową, z autobusami diesla (umowa na dwa tygodnie) lub elektrycznymi (miesiąc) - i nikt nie widzi cudzej przed zamknięciem; wtedy wszystkie są otwierane, a wygrywa najniższa cena ważona jakością. Oferta poniżej 85 % ceny kosztowej organizatora jest odrzucana jako rażąco niska, a limit to ta cena kosztowa razy półtora. Przewoźnik, który wygra, obsługuje linię przez swój okres, ale może z niej zrezygnować wcześniej: wtedy od razu trafia ona ponownie do przetargu. Wydarzenie chrono mapy z własnymi liniami - wahadła w dniu meczu - wystawia je do przetargu tydzień wcześniej, tylko na swoje dni. Przedłużenie to nowy przetarg: otwiera się sześć dni przed końcem okresu i jest rozstrzygany trzy dni wcześniej."
  ru: "На каждой карте линия принадлежит не более чем одной компании и выигрывается в тендере. Тендер открыт три дня. Каждая компания карты и её перевозчики подают одну закрытую заявку — цену за час по расписанию, с дизельными автобусами (контракт на две недели) или электрическими (на месяц), — и никто не видит чужую до закрытия; затем все вскрываются, и побеждает самая низкая цена с учётом качества. Заявка ниже 85 % себестоимости заказчика отклоняется как аномально низкая, а потолок — эта себестоимость, умноженная на полтора. Перевозчик-победитель обслуживает линию свой срок, но может отказаться от неё раньше: тогда она сразу снова выставляется на тендер. Хроно-событие карты со своими линиями - шаттлы дня матча - выставляет их на торги за неделю, только на свои дни. Продление — это новый тендер: он открывается за шесть дней до конца срока и решается за три дня."
  uk: "На кожній карті лінія належить щонайбільше одній компанії й виграється в тендері. Тендер відкритий три дні. Кожна компанія карти та її перевізники подають одну закриту пропозицію — ціну за годину за розкладом, з дизельними автобусами (контракт на два тижні) або електричними (на місяць), — і ніхто не бачить чужу до закриття; потім усі розкривають, і перемагає найнижча ціна з урахуванням якості. Пропозиція нижче 85 % собівартості замовника відхиляється як аномально низька, а стеля — ця собівартість, помножена на півтора. Перевізник-переможець обслуговує лінію свій строк, але може відмовитися від неї раніше: тоді вона одразу знову йде на тендер. Хроно-подія мапи з власними лініями - шатли дня матчу - виставляє їх на торги за тиждень, лише на свої дні. Продовження — це новий тендер: він відкривається за шість днів до кінця строку й вирішується за три дні."
"The contract's rules":
  de: "Die Regeln des Vertrags"
  da: "Kontraktens regler"
  fr: "Les règles du contrat"
  nl: "De regels van het contract"
  pl: "Zasady umowy"
  ru: "Правила контракта"
  uk: "Правила контракту"
"Each tour is run with the bus size its timetable asks for or a bigger one, and a contract won with electric buses with electric buses. The authority fines journeys not run, a bus too small, departures more than a minute early or more than 15 minutes late without a report, and complaints. A company that wins a line from another is offered the other's buses of it at their book value.":
  de: "Jeder Umlauf wird mit der Busgröße gefahren, die sein Fahrplan verlangt, oder einer größeren, und ein mit Elektrobussen gewonnener Vertrag mit Elektrobussen. Die Behörde bestraft nicht gefahrene Fahrten, einen zu kleinen Bus, Abfahrten mehr als eine Minute zu früh oder mehr als 15 Minuten zu spät ohne Meldung sowie Beschwerden. Eine Firma, die einer anderen eine Linie abnimmt, bekommt deren Busse dieser Linie zum Buchwert angeboten."
  da: "Hvert vognløb køres med den busstørrelse, dets køreplan kræver, eller en større, og en kontrakt vundet med elbusser med elbusser. Trafikselskabet idømmer bod for ture, der ikke er kørt, en for lille bus, afgange mere end et minut for tidligt eller mere end 15 minutter for sent uden en melding, og klager. Et selskab, der vinder en linje fra et andet, tilbydes det andets busser på den til deres bogførte værdi."
  fr: "Chaque service est assuré avec la taille de bus que demande son horaire ou une plus grande, et un contrat gagné avec des bus électriques avec des bus électriques. L'autorité sanctionne les trajets non effectués, un bus trop petit, les départs plus d'une minute en avance ou plus de 15 minutes en retard sans signalement, ainsi que les réclamations. Une entreprise qui gagne une ligne à une autre se voit proposer les bus de celle-ci sur cette ligne à leur valeur comptable."
  nl: "Elke omloop wordt gereden met de busgrootte die de dienstregeling vraagt of een grotere, en een contract gewonnen met elektrische bussen met elektrische bussen. De opdrachtgever beboet niet gereden ritten, een te kleine bus, vertrekken meer dan een minuut te vroeg of meer dan 15 minuten te laat zonder melding, en klachten. Een bedrijf dat een lijn van een ander wint, krijgt de bussen van dat bedrijf op die lijn aangeboden tegen hun boekwaarde."
  pl: "Każda brygada jest obsługiwana autobusem o wielkości, jakiej wymaga rozkład, lub większym, a umowa wygrana z autobusami elektrycznymi — elektrycznymi. Organizator karze za niewykonane kursy, za mały autobus, odjazdy ponad minutę za wcześnie lub ponad 15 minut za późno bez zgłoszenia oraz za skargi. Firma, która wygrywa linię od innej, dostaje ofertę jej autobusów z tej linii po wartości księgowej."
  ru: "Каждый выход обслуживается автобусом того размера, который требует расписание, или больше, а контракт, выигранный с электробусами, — электробусами. Заказчик штрафует за невыполненные рейсы, слишком маленький автобус, отправления раньше более чем на минуту или позже более чем на 15 минут без заявки и за жалобы. Компании, выигравшей линию у другой, предлагают автобусы той компании с этой линии по балансовой стоимости."
  uk: "Кожен вихід обслуговується автобусом того розміру, якого вимагає розклад, або більшим, а контракт, виграний з електробусами, — електробусами. Замовник штрафує за невиконані рейси, замалий автобус, відправлення раніше ніж на хвилину чи пізніше ніж на 15 хвилин без заявки та за скарги. Компанії, що виграла лінію в іншої, пропонують автобуси тієї компанії з цієї лінії за балансовою вартістю."
"The control room":
  de: "Die Leitstelle"
  da: "Kontrolrummet"
  fr: "La salle de contrôle"
  nl: "De verkeersleiding"
  pl: "Dyspozytornia"
  ru: "Диспетчерская"
  uk: "Диспетчерська"
"While the map's world runs, the fleet map and the Operations page show every bus where it is in the world, with its real delay; otherwise where the timetable has it. Service control can run a late bus out of service to its terminus, cancel a trip, or swap in a spare bus at the terminus - and the bus in the world does it.":
  de: "Solange die Welt der Karte läuft, zeigen die Flottenkarte und die Seite Betrieb jeden Bus dort, wo er in der Welt ist, mit seiner echten Verspätung; sonst dort, wo ihn der Fahrplan hat. Die Betriebsleitung kann einen verspäteten Bus ohne Halt zur Endhaltestelle schicken, eine Fahrt streichen oder an der Endhaltestelle einen Reservebus einsetzen - und der Bus in der Welt tut es."
  da: "Mens kortets verden kører, viser flådekortet og siden Drift hver bus, hvor den er i verdenen, med dens rigtige forsinkelse; ellers hvor køreplanen har den. Trafikstyringen kan køre en forsinket bus ude af drift til dens endestation, aflyse en tur eller sætte en reservebus ind ved endestationen - og bussen i verdenen gør det."
  fr: "Tant que le monde de la carte tourne, la carte de la flotte et la page Exploitation montrent chaque bus là où il est dans le monde, avec son vrai retard ; sinon là où l'horaire le place. La régulation peut envoyer un bus en retard hors service jusqu'au terminus, supprimer un trajet ou mettre un bus de réserve au terminus - et le bus du monde le fait."
  nl: "Zolang de wereld van de kaart draait, tonen de vlootkaart en de pagina Bedrijfsvoering elke bus waar hij in de wereld is, met zijn echte vertraging; anders waar de dienstregeling hem heeft. De verkeersleiding kan een te late bus buiten dienst naar zijn eindpunt sturen, een rit laten vervallen of bij het eindpunt een reservebus inzetten - en de bus in de wereld doet het."
  pl: "Dopóki działa świat mapy, mapa floty i strona Eksploatacja pokazują każdy autobus tam, gdzie jest w świecie, z jego prawdziwym opóźnieniem; w przeciwnym razie tam, gdzie ma go rozkład. Dyspozytor może wysłać spóźniony autobus bez zatrzymywania do pętli, odwołać kurs albo podstawić rezerwę na pętli - a autobus w świecie to wykona."
  ru: "Пока мир карты работает, карта парка и страница «Эксплуатация» показывают каждый автобус там, где он находится в мире, с его реальной задержкой; иначе — там, где его ставит расписание. Диспетчер может отправить опаздывающий автобус без остановок до конечной, отменить рейс или выпустить резервный автобус на конечной — и автобус в мире это сделает."
  uk: "Поки світ карти працює, карта парку й сторінка «Експлуатація» показують кожен автобус там, де він є у світі, з його справжньою затримкою; інакше — там, де його ставить розклад. Диспетчер може відправити запізнілий автобус без зупинок до кінцевої, скасувати рейс або випустити резервний автобус на кінцевій — і автобус у світі це зробить."
"A company that does well opens a depot on another map: its own lines, buses, staff and money there. The head office's owner sends money, moves buses and lends staff between the maps, and approves a depot's big purchases.":
  de: "Eine erfolgreiche Firma eröffnet ein Depot auf einer anderen Karte: mit eigenen Linien, Bussen, Personal und Geld dort. Der Besitzer der Zentrale schickt Geld, verlegt Busse und verleiht Personal zwischen den Karten und genehmigt die großen Käufe eines Depots."
  da: "Et selskab, der går godt, åbner en afdeling på et andet kort: egne linjer, busser, personale og penge dér. Hovedkontorets ejer sender penge, flytter busser og udlåner personale mellem kortene og godkender en afdelings store køb."
  fr: "Une entreprise qui marche bien ouvre un dépôt sur une autre carte : avec ses propres lignes, bus, personnel et argent là-bas. Le propriétaire du siège envoie de l'argent, déplace des bus et prête du personnel entre les cartes, et approuve les gros achats d'un dépôt."
  nl: "Een bedrijf dat het goed doet, opent een depot op een andere kaart: met eigen lijnen, bussen, personeel en geld daar. De eigenaar van het hoofdkantoor stuurt geld, verplaatst bussen en leent personeel uit tussen de kaarten, en keurt de grote aankopen van een depot goed."
  pl: "Firma, której dobrze idzie, otwiera zajezdnię na innej mapie: z własnymi liniami, autobusami, personelem i pieniędzmi. Właściciel centrali przesyła pieniądze, przenosi autobusy i wypożycza personel między mapami oraz zatwierdza duże zakupy zajezdni."
  ru: "Успешная компания открывает депо на другой карте: со своими линиями, автобусами, персоналом и деньгами там. Владелец головного офиса переводит деньги, перегоняет автобусы и одалживает персонал между картами, а также одобряет крупные покупки депо."
  uk: "Успішна компанія відкриває депо на іншій карті: із власними лініями, автобусами, персоналом і грошима там. Власник головного офісу переказує гроші, переганяє автобуси й позичає персонал між картами, а також схвалює великі покупки депо."
"In the red":
  de: "Im Minus"
  da: "I minus"
  fr: "Dans le rouge"
  nl: "In de min"
  pl: "Na minusie"
  ru: "В минусе"
  uk: "У мінусі"
"A depot that closes its days in the red is warned twice, then goes bankrupt, and its head office covers its loss. A head office in the red gets the bank's emergency loan; in the red again while that loan runs, it is warned twice and then goes bankrupt, its depots with it.":
  de: "Ein Depot, das seine Tage im Minus abschließt, wird zweimal gewarnt, geht dann in Konkurs, und seine Zentrale deckt den Verlust. Eine Zentrale im Minus bekommt den Notkredit der Bank; gerät sie wieder ins Minus, solange er läuft, wird sie zweimal gewarnt und geht dann in Konkurs, mit ihren Depots."
  da: "En afdeling, der afslutter sine dage i minus, advares to gange og går så konkurs, og dens hovedkontor dækker dens tab. Et hovedkontor i minus får bankens nødlån; er det i minus igen, mens lånet løber, advares det to gange og går så konkurs, dets afdelinger med."
  fr: "Un dépôt qui clôture ses journées dans le rouge est averti deux fois, puis fait faillite, et son siège couvre sa perte. Un siège dans le rouge reçoit le prêt d'urgence de la banque ; de nouveau dans le rouge pendant ce prêt, il est averti deux fois puis fait faillite, avec ses dépôts."
  nl: "Een depot dat zijn dagen in de min afsluit, krijgt twee waarschuwingen, gaat dan failliet, en zijn hoofdkantoor dekt het verlies. Een hoofdkantoor in de min krijgt de noodlening van de bank; weer in de min zolang die loopt, krijgt het twee waarschuwingen en gaat dan failliet, met zijn depots."
  pl: "Zajezdnia, która zamyka dni na minusie, dostaje dwa ostrzeżenia, potem bankrutuje, a centrala pokrywa jej stratę. Centrala na minusie dostaje pożyczkę awaryjną banku; jeśli znów będzie na minusie, gdy pożyczka trwa, dostaje dwa ostrzeżenia, a potem bankrutuje wraz z zajezdniami."
  ru: "Депо, которое закрывает дни в минусе, получает два предупреждения, затем банкротится, и головной офис покрывает его убыток. Головной офис в минусе получает экстренный кредит банка; снова в минусе, пока кредит действует, он получает два предупреждения и затем банкротится вместе со своими депо."
  uk: "Депо, яке закриває дні в мінусі, отримує два попередження, потім банкрутує, і головний офіс покриває його збиток. Головний офіс у мінусі отримує екстрений кредит банку; знову в мінусі, поки кредит діє, він отримує два попередження й потім банкрутує разом зі своїми депо."
"The server runs on its machine's own time, summer time too, and nobody can change it. A company's day closes at midnight; when the server was off, the time is caught up.":
  de: "Der Server läuft nach der Uhrzeit seines Rechners, auch mit Sommerzeit, und niemand kann sie ändern. Der Tag einer Firma schließt um Mitternacht; war der Server aus, wird die Zeit nachgeholt."
  da: "Serveren kører på sin maskines egen tid, også sommertid, og ingen kan ændre den. Et selskabs dag afsluttes ved midnat; når serveren var slukket, indhentes tiden."
  fr: "Le serveur suit l'heure de sa machine, heure d'été comprise, et personne ne peut la changer. La journée d'une entreprise se clôture à minuit ; quand le serveur était arrêté, le temps est rattrapé."
  nl: "De server loopt op de tijd van zijn eigen machine, ook zomertijd, en niemand kan die veranderen. De dag van een bedrijf sluit om middernacht; stond de server uit, dan wordt de tijd ingehaald."
  pl: "Serwer działa według czasu swojej maszyny, również letniego, i nikt nie może go zmienić. Dzień firmy zamyka się o północy; gdy serwer był wyłączony, czas jest nadrabiany."
  ru: "Сервер работает по времени своей машины, включая летнее, и никто не может его изменить. День компании закрывается в полночь; если сервер был выключен, время навёрстывается."
  uk: "Сервер працює за часом своєї машини, зокрема літнім, і ніхто не може його змінити. День компанії закривається опівночі; якщо сервер був вимкнений, час надолужується."
# (NexiconDK, Bus Company Online: a duty of the company's AI driver taken over by a player)
"Take over this duty":
  de: "Diesen Dienst übernehmen"
  da: "Overtag denne vagt"
  fr: "Reprendre ce service"
  nl: "Deze dienst overnemen"
  pl: "Przejmij tę służbę"
  ru: "Взять эту смену"
  uk: "Взяти цю зміну"
"Ask to take over this duty":
  de: "Um Übernahme dieses Dienstes bitten"
  da: "Bed om at overtage denne vagt"
  fr: "Demander à reprendre ce service"
  nl: "Vragen om deze dienst over te nemen"
  pl: "Poproś o przejęcie tej służby"
  ru: "Попросить взять эту смену"
  uk: "Попросити взяти цю зміну"
"Ask to take over from the next trip":
  de: "Um Übernahme ab der nächsten Fahrt bitten"
  da: "Bed om at overtage fra næste tur"
  fr: "Demander à prendre le relais au prochain trajet"
  nl: "Vragen om over te nemen vanaf de volgende rit"
  pl: "Poproś o przejęcie od następnego kursu"
  ru: "Попросить смену со следующего рейса"
  uk: "Попросити зміну з наступного рейсу"
"Under way: the AI drives it as %{name}":
  de: "Unterwegs: die KI fährt ihn als %{name}"
  da: "Undervejs: AI'en kører den som %{name}"
  fr: "En cours : l'IA le conduit en tant que %{name}"
  nl: "Onderweg: de AI rijdt hem als %{name}"
  pl: "W trakcie: SI prowadzi ją jako %{name}"
  ru: "В пути: ИИ ведёт её как %{name}"
  uk: "У дорозі: ШІ веде її як %{name}"
"The AI drives it as %{name}":
  de: "Die KI fährt ihn als %{name}"
  da: "AI'en kører den som %{name}"
  fr: "L'IA le conduit en tant que %{name}"
  nl: "De AI rijdt hem als %{name}"
  pl: "SI prowadzi ją jako %{name}"
  ru: "ИИ ведёт её как %{name}"
  uk: "ШІ веде її як %{name}"
"Driven by the AI":
  de: "Von der KI gefahren"
  da: "Kørt af AI'en"
  fr: "Conduits par l'IA"
  nl: "Gereden door de AI"
  pl: "Prowadzone przez SI"
  ru: "Ведёт ИИ"
  uk: "Веде ШІ"
"The company's AI drivers drive these in the server's world. Take one over: it is yours from its start, or from its next trip when it is under way.":
  de: "Die KI-Fahrer der Firma fahren diese in der Welt des Servers. Übernimm einen: er gehört dir ab seinem Beginn, oder ab seiner nächsten Fahrt, wenn er schon läuft."
  da: "Selskabets AI-chauffører kører disse i serverens verden. Overtag en: den er din fra dens start eller fra dens næste tur, når den er undervejs."
  fr: "Les conducteurs IA de l'entreprise les assurent dans le monde du serveur. Reprends-en un : il est à toi dès son début, ou dès son prochain trajet s'il est en cours."
  nl: "De AI-chauffeurs van het bedrijf rijden deze in de wereld van de server. Neem er een over: hij is van jou vanaf het begin, of vanaf de volgende rit als hij al loopt."
  pl: "Kierowcy SI firmy prowadzą je w świecie serwera. Przejmij jedną: jest twoja od początku albo od następnego kursu, jeśli już trwa."
  ru: "Водители-ИИ компании ведут эти смены в мире сервера. Возьми одну: она твоя с начала или со следующего рейса, если уже идёт."
  uk: "Водії-ШІ компанії ведуть ці зміни у світі сервера. Візьми одну: вона твоя з початку або з наступного рейсу, якщо вже триває."
"Under Duties you take an open duty, or take one over from the company's AI drivers: from its start, or from its next trip when it is under way.":
  de: "Unter Dienste nimmst du einen offenen Dienst oder übernimmst einen von den KI-Fahrern der Firma: ab seinem Beginn, oder ab seiner nächsten Fahrt, wenn er schon läuft."
  da: "Under Vagter tager du en ledig vagt eller overtager en fra selskabets AI-chauffører: fra dens start eller fra dens næste tur, når den er undervejs."
  fr: "Sous Services, tu prends un service libre ou tu en reprends un aux conducteurs IA de l'entreprise : dès son début, ou dès son prochain trajet s'il est en cours."
  nl: "Onder Diensten neem je een open dienst, of neem je er een over van de AI-chauffeurs van het bedrijf: vanaf het begin, of vanaf de volgende rit als hij al loopt."
  pl: "W zakładce Służby bierzesz wolną służbę albo przejmujesz ją od kierowców SI firmy: od początku albo od następnego kursu, jeśli już trwa."
  ru: "В разделе «Смены» ты берёшь свободную смену или забираешь её у водителей-ИИ компании: с начала или со следующего рейса, если она уже идёт."
  uk: "У розділі «Зміни» ти береш вільну зміну або забираєш її у водіїв-ШІ компанії: з початку або з наступного рейсу, якщо вона вже триває."
"A duty that begins with the bus in service starts on foot at its stop: the bus comes there, its driver gets out, and G at the front door takes the wheel. Not there within five minutes of the departure, the AI drives that trip and you take over at the next.":
  de: "Ein Dienst, der mit dem Bus im Einsatz beginnt, startet zu Fuß an seiner Haltestelle: der Bus kommt dorthin, sein Fahrer steigt aus, und G an der Vordertür übernimmt das Steuer. Bist du nicht binnen fünf Minuten nach der Abfahrt da, fährt die KI diese Fahrt, und du übernimmst bei der nächsten."
  da: "En vagt, der begynder med bussen i drift, starter til fods ved sit stoppested: bussen kommer dertil, dens chauffør stiger ud, og G ved fordøren tager rattet. Er du ikke der inden fem minutter efter afgangen, kører AI'en den tur, og du overtager ved den næste."
  fr: "Un service qui commence avec le bus déjà en ligne démarre à pied à son arrêt : le bus y arrive, son conducteur descend, et G à la porte avant prend le volant. Si tu n'es pas là dans les cinq minutes après le départ, l'IA fait ce trajet et tu reprends au suivant."
  nl: "Een dienst die begint met de bus al in dienst, start te voet bij zijn halte: de bus komt daar, de chauffeur stapt uit, en G bij de voordeur neemt het stuur over. Ben je er niet binnen vijf minuten na vertrek, dan rijdt de AI die rit en neem je de volgende over."
  pl: "Służba, która zaczyna się, gdy autobus jest już na trasie, zaczyna się pieszo na jej przystanku: autobus tam przyjeżdża, kierowca wysiada, a G przy przednich drzwiach przejmuje kierownicę. Jeśli nie zdążysz w ciągu pięciu minut od odjazdu, SI prowadzi ten kurs, a ty przejmujesz następny."
  ru: "Смена, которая начинается с автобусом уже на линии, начинается пешком на её остановке: автобус приходит туда, водитель выходит, и G у передней двери — за руль. Не успел в течение пяти минут после отправления — этот рейс ведёт ИИ, а ты принимаешь следующий."
  uk: "Зміна, що починається з автобусом уже на лінії, починається пішки на її зупинці: автобус приходить туди, водій виходить, і G біля передніх дверей — за кермо. Не встиг протягом п'яти хвилин після відправлення — цей рейс веде ШІ, а ти приймаєш наступний."
