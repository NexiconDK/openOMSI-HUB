  nl: "Je volgende bod geldt met deze bussen: het contract loopt twee weken met dieselbussen en een maand met elektrische, waarna de omlopen met elektrische bussen worden gereden."
  pl: "Twoja następna oferta jest z tymi autobusami: umowa trwa dwa tygodnie z autobusami diesla i miesiąc z elektrycznymi, a wtedy jej kursy obsługują autobusy elektryczne."
  ru: "Ваша следующая ставка делается с этими автобусами: контракт длится две недели с дизельными и месяц с электробусами, и тогда его обороты обслуживают электробусы."
