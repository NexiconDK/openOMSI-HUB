  ru: "Отправлено на сервер: он учтёт это на следующем шаге."
  uk: "Надіслано на сервер: він врахує це на наступному кроці."
"Bid together with another company":
  de: "Gemeinsam mit einer anderen Firma bieten"
  da: "Byd sammen med et andet firma"
  fr: "Soumissionner avec une autre entreprise"
  nl: "Samen met een ander bedrijf bieden"
  pl: "Złóż ofertę razem z inną firmą"
  ru: "Сделать ставку вместе с другой компанией"
  uk: "Зробити ставку разом з іншою компанією"
"Your partner runs the lines you give it as your subcontractor from the contract's first day, at its price a timetable hour, if your bid wins: it accepts on its Concessions page before the award. Your bid is scored on your quality.":
  de: "Dein Partner fährt die Linien, die du ihm gibst, ab dem ersten Vertragstag als dein Subunternehmer zu seinem Preis je Fahrplanstunde, wenn dein Gebot gewinnt: er nimmt vor der Vergabe auf seiner Konzessionsseite an. Dein Gebot wird nach deiner Qualität bewertet."
  da: "Din partner kører de linjer, du giver den, som din underleverandør fra kontraktens første dag til dens pris pr. køreplantime, hvis dit bud vinder: den accepterer på sin side Koncessioner før tildelingen. Dit bud bedømmes på din kvalitet."
  fr: "Votre partenaire exploite les lignes que vous lui confiez en sous-traitance dès le premier jour du contrat, à son prix par heure d'horaire, si votre offre gagne : il accepte sur sa page Concessions avant l'attribution. Votre offre est notée sur votre qualité."
  nl: "Je partner rijdt de lijnen die je hem geeft als je onderaannemer vanaf de eerste contractdag, voor zijn prijs per dienstregelingsuur, als je bod wint: hij neemt vóór de gunning aan op zijn concessiepagina. Je bod wordt op jouw kwaliteit beoordeeld."
  pl: "Twój partner obsługuje przekazane mu linie jako twój podwykonawca od pierwszego dnia umowy, za swoją cenę za godzinę rozkładową, jeśli twoja oferta wygra: przyjmuje to na swojej stronie Koncesje przed rozstrzygnięciem. Twoja oferta jest oceniana według twojej jakości."
  ru: "Ваш партнёр обслуживает переданные ему линии как ваш субподрядчик с первого дня контракта по своей цене за час, если ваша ставка выиграет: он принимает это на своей странице «Концессии» до присуждения. Ставка оценивается по вашему качеству."
  uk: "Ваш партнер обслуговує передані йому лінії як ваш субпідрядник з першого дня контракту за своєю ціною за годину, якщо ваша ставка виграє: він приймає це на своїй сторінці «Концесії» до присудження. Ставку оцінюють за вашою якістю."
"A fixed price: the quality decides":
  de: "Ein fester Preis: die Qualität entscheidet"
  da: "En fast pris: kvaliteten afgør det"
  fr: "Un prix fixe : la qualité décide"
  nl: "Een vaste prijs: de kwaliteit beslist"
  pl: "Stała cena: decyduje jakość"
  ru: "Фиксированная цена: решает качество"
  uk: "Фіксована ціна: вирішує якість"
"The authority pays a fixed %{p} a timetable hour: every valid bid gets the %{w} price points, the quality decides.":
  de: "Der Aufgabenträger zahlt fest %{p} je Fahrplanstunde: jedes gültige Gebot bekommt die %{w} Preispunkte, die Qualität entscheidet."
  da: "Trafikselskabet betaler fast %{p} pr. køreplantime: alle gyldige bud får de %{w} prispoint, kvaliteten afgør det."
  fr: "L'autorité paie un prix fixe de %{p} l'heure d'horaire : chaque offre valide obtient les %{w} points de prix, la qualité décide."
  nl: "De opdrachtgever betaalt vast %{p} per dienstregelingsuur: elk geldig bod krijgt de %{w} prijspunten, de kwaliteit beslist."
  pl: "Organizator płaci stałe %{p} za godzinę rozkładową: każda ważna oferta dostaje %{w} pkt za cenę, decyduje jakość."
  ru: "Заказчик платит фиксированно %{p} за час по расписанию: каждая действительная ставка получает %{w} баллов за цену, решает качество."
  uk: "Замовник платить фіксовано %{p} за годину за розкладом: кожна дійсна ставка отримує %{w} балів за ціну, вирішує якість."
"No AI driver is left to hire on this map: drivers are short. Your duties nobody drives are run by agency drivers at the agency's price - or by players.":
  de: "Auf dieser Karte ist kein KI-Fahrer mehr einzustellen: Fahrer sind knapp. Dienste, die niemand fährt, übernehmen Leihfahrer zum Preis der Agentur - oder Spieler."
  da: "Der er ingen AI-chauffør tilbage at ansætte på dette kort: der er mangel på chauffører. Vagter, som ingen kører, køres af vikarchauffører til vikarbureauets pris - eller af spillere."
  fr: "Plus aucun conducteur IA à embaucher sur cette carte : les conducteurs manquent. Les services que personne ne conduit sont assurés par des intérimaires au prix de l'agence - ou par des joueurs."
  nl: "Er is op deze kaart geen AI-chauffeur meer aan te nemen: chauffeurs zijn schaars. Diensten die niemand rijdt, rijden uitzendchauffeurs tegen het tarief van het bureau - of spelers."
  pl: "Na tej mapie nie ma już kierowców AI do zatrudnienia: brakuje kierowców. Służby, których nikt nie prowadzi, obsługują kierowcy z agencji po jej cenie - albo gracze."
  ru: "На этой карте не осталось ИИ-водителей для найма: водителей не хватает. Смены, которые никто не ведёт, выполняют водители агентства по его цене - или игроки."
  uk: "На цій мапі не лишилося ШІ-водіїв для найму: водіїв бракує. Зміни, які ніхто не веде, виконують водії агенції за її ціною - або гравці."
"Only the owner and the co-owners of the company choose whether their own driving is paid.":
  de: "Nur der Eigentümer und die Miteigentümer der Firma wählen, ob ihr eigenes Fahren bezahlt wird."
  da: "Kun firmaets ejer og medejere vælger, om deres egen kørsel betales."
  fr: "Seuls le propriétaire et les copropriétaires de l'entreprise choisissent si leur propre conduite est payée."
  nl: "Alleen de eigenaar en de mede-eigenaren van het bedrijf kiezen of hun eigen rijden wordt betaald."
  pl: "Tylko właściciel i współwłaściciele firmy wybierają, czy ich własna jazda jest płatna."
  ru: "Только владелец и совладельцы компании выбирают, оплачивается ли их собственное вождение."
  uk: "Лише власник і співвласники компанії обирають, чи оплачується їхнє власне водіння."
"A player of the company is paid %{share} % of what an AI driver costs for the same time (the server's rule): about %{amount} a timetable hour.":
  de: "Ein Spieler der Firma bekommt %{share} % dessen, was ein KI-Fahrer für dieselbe Zeit kostet (Regel des Servers): etwa %{amount} je Fahrplanstunde."
  da: "En spiller i firmaet får %{share} % af det, en AI-chauffør koster for samme tid (serverens regel): ca. %{amount} pr. køreplantime."
  fr: "Un joueur de l'entreprise est payé %{share} % de ce que coûte un conducteur IA pour le même temps (règle du serveur) : environ %{amount} par heure d'horaire."
  nl: "Een speler van het bedrijf krijgt %{share} % van wat een AI-chauffeur voor dezelfde tijd kost (regel van de server): ongeveer %{amount} per dienstregelingsuur."
  pl: "Gracz firmy dostaje %{share} % tego, ile kosztuje kierowca AI za ten sam czas (zasada serwera): około %{amount} za godzinę rozkładową."
  ru: "Игроку компании платят %{share} % того, что стоит ИИ-водитель за то же время (правило сервера): около %{amount} за час по расписанию."
  uk: "Гравцеві компанії платять %{share} % того, що коштує ШІ-водій за той самий час (правило сервера): близько %{amount} за годину за розкладом."
