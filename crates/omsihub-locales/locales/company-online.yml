  uk: "Депо %{name} у мінусі: лишилося %{n} дн."
"Depot %{name} has %{amount} in cash. Still in the red at the close of %{n} more days, it goes bankrupt and the head office covers its loss: send it money from the head office's page, or give it a rule that tops it up.":
  de: "Depot %{name} hat %{amount} Kasse. Ist es nach Abschluss von %{n} weiteren Tagen noch im Minus, geht es pleite und die Zentrale deckt seinen Verlust: Schicke ihm Geld von der Seite der Zentrale oder gib ihm eine Regel, die es auffüllt."
  da: "Afdeling %{name} har %{amount} i kontanter. Er den stadig i minus ved afslutningen af %{n} dage mere, går den konkurs, og hovedkontoret dækker dens tab: send den penge fra hovedkontorets side, eller giv den en regel, der fylder den op."
  fr: "Le dépôt %{name} a %{amount} en caisse. Encore dans le rouge à la clôture de %{n} jours de plus, il fait faillite et le siège couvre sa perte : envoyez-lui de l'argent depuis la page du siège, ou donnez-lui une règle qui le renfloue."
  nl: "Remise %{name} heeft %{amount} in kas. Staat ze na de afsluiting van nog %{n} dagen nog rood, dan gaat ze failliet en dekt het hoofdkantoor het verlies: stuur haar geld via de pagina van het hoofdkantoor, of geef haar een regel die haar aanvult."
  pl: "Zajezdnia %{name} ma %{amount} w kasie. Jeśli po zamknięciu kolejnych %{n} dni nadal będzie na minusie, zbankrutuje, a centrala pokryje jej stratę: wyślij jej pieniądze ze strony centrali albo daj jej regułę, która ją uzupełnia."
  ru: "У депо %{name} %{amount} в кассе. Если после закрытия ещё %{n} дн. оно останется в минусе, оно обанкротится, и головной офис покроет его убыток: отправьте ему деньги со страницы главного офиса или задайте ему правило пополнения."
  uk: "Депо %{name} має %{amount} у касі. Якщо після закриття ще %{n} дн. воно лишиться в мінусі, воно збанкрутує, і головний офіс покриє його збиток: надішліть йому гроші зі сторінки головного офісу або задайте йому правило поповнення."
