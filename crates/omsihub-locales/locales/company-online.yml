  pl: "Zajezdnia %{name} pozostała na minusie i została zamknięta: autobusy sprzedane, personel odszedł, linie wróciły do przetargu. To, co zostało, %{amount}, należy do centrali."
  ru: "Депо %{name} осталось в минусе и закрыто: автобусы проданы, персонал ушёл, линии снова на тендере. Оставшиеся %{amount} достаются головному офису."
  uk: "Депо %{name} лишилося в мінусі й закрите: автобуси продано, персонал пішов, лінії знову на тендері. Залишок, %{amount}, належить головному офісу."
