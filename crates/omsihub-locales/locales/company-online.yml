  uk: "Депо %{name} збанкрутувало"
"Depot %{name} stayed in the red and is closed: its buses sold, its staff gone, its lines out to tender again. The head office covered its loss of %{amount}.":
  de: "Depot %{name} blieb im Minus und ist geschlossen: seine Busse verkauft, sein Personal weg, seine Linien neu ausgeschrieben. Die Zentrale hat seinen Verlust von %{amount} gedeckt."
  da: "Afdeling %{name} forblev i minus og er lukket: dens busser solgt, dens personale væk, dens linjer i udbud igen. Hovedkontoret dækkede dens tab på %{amount}."
  fr: "Le dépôt %{name} est resté dans le rouge et est fermé : ses bus vendus, son personnel parti, ses lignes remises en appel d'offres. Le siège a couvert sa perte de %{amount}."
  nl: "Remise %{name} bleef rood staan en is gesloten: haar bussen verkocht, haar personeel weg, haar lijnen opnieuw aanbesteed. Het hoofdkantoor dekte haar verlies van %{amount}."
  pl: "Zajezdnia %{name} pozostała na minusie i została zamknięta: autobusy sprzedane, personel odszedł, linie wróciły do przetargu. Centrala pokryła jej stratę w wysokości %{amount}."
  ru: "Депо %{name} осталось в минусе и закрыто: автобусы проданы, персонал ушёл, линии снова на тендере. Головной офис покрыл его убыток в %{amount}."
  uk: "Депо %{name} лишилося в мінусі й закрите: автобуси продано, персонал пішов, лінії знову на тендері. Головний офіс покрив його збиток у %{amount}."
