  pl: "Diesel · dwa tygodnie"
  ru: "Дизель · две недели"
  uk: "Дизель · два тижні"
"Electric · a month":
  de: "Elektro · ein Monat"
  da: "El · en måned"
  fr: "Électrique · un mois"
