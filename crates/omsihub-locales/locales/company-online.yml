  ru: "%{count} автобусов по балансовой стоимости, всего %{amount}, переходят %{date}, в первый день вашего срока."
  uk: "%{count} автобусів за балансовою вартістю, разом %{amount}, переходять %{date}, у перший день вашого строку."
"Take them over":
