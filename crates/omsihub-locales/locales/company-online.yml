"Paid %{p} % more to the player who drives it. A doubling the admin ordered at short notice is for players only: if nobody takes it, it does not run.":
  de: "Dem Spieler, der sie fährt, mit %{p} % mehr bezahlt. Eine kurzfristig vom Admin bestellte Verstärkerfahrt ist nur für Spieler: Übernimmt sie niemand, fährt sie nicht."
  da: "Spilleren, der kører den, får %{p} % mere. En dublering, som admin har bestilt med kort varsel, er kun for spillere: tager ingen den, køres den ikke."
  fr: "Payée %{p} % de plus au joueur qui la conduit. Un doublage commandé par l'admin au dernier moment est réservé aux joueurs : si personne ne le prend, il ne roule pas."
  nl: "De speler die het rijdt krijgt %{p} % meer. Een versterkingsrit die de admin op korte termijn bestelde is alleen voor spelers: neemt niemand hem, dan rijdt hij niet."
  pl: "Gracz, który go prowadzi, dostaje %{p} % więcej. Kurs dodatkowy zlecony przez admina w krótkim terminie jest tylko dla graczy: jeśli nikt go nie weźmie, nie pojedzie."
  ru: "Игроку, который его ведёт, платят на %{p} % больше. Срочный дополнительный рейс, заказанный админом, только для игроков: если никто его не возьмёт, он не выйдет."
  uk: "Гравцеві, який його веде, платять на %{p} % більше. Терміновий додатковий рейс, замовлений адміном, лише для гравців: якщо ніхто його не візьме, він не вийде."
