"The server reads its settings when it starts: restart it for changes to take effect.":
  de: "Der Server liest seine Einstellungen beim Start: Starte ihn neu, damit Änderungen wirksam werden."
  da: "Serveren læser sine indstillinger, når den starter: genstart den, for at ændringer træder i kraft."
  fr: "Le serveur lit ses paramètres au démarrage : redémarre-le pour appliquer les changements."
  nl: "De server leest zijn instellingen bij het starten: start hem opnieuw om wijzigingen door te voeren."
  pl: "Serwer wczytuje ustawienia przy starcie: uruchom go ponownie, aby zmiany zadziałały."
  ru: "Сервер читает настройки при запуске: перезапусти его, чтобы изменения вступили в силу."
  uk: "Сервер читає налаштування під час запуску: перезапусти його, щоб зміни набули чинності."
