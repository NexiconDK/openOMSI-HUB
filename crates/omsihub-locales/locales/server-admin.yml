  da: "Adminpanelet åbner kun på denne maskine. \"Adminpanel udefra\" i indstillingerne åbner det også fra din telefon eller en anden pc med administratoradgangskoden."
  fr: "Le panneau d'admin ne s'ouvre que sur cette machine. « Panneau d'admin depuis ailleurs » dans les paramètres l'ouvre aussi depuis ton téléphone ou un autre PC, avec le mot de passe admin."
  nl: "Het beheerpaneel opent alleen op deze computer. \"Beheerpaneel van elders\" in de instellingen opent het ook vanaf je telefoon of een andere pc, met het beheerderswachtwoord."
  pl: "Panel administratora otwiera się tylko na tym komputerze. „Panel administratora z zewnątrz” w ustawieniach otwiera go też z twojego telefonu lub innego PC, z hasłem administratora."
  ru: "Панель администратора открывается только на этом компьютере. «Панель администратора извне» в настройках открывает её и с твоего телефона или другого ПК, с паролем администратора."
  uk: "Панель адміністратора відкривається лише на цьому комп'ютері. «Панель адміністратора ззовні» в налаштуваннях відкриває її і з твого телефона чи іншого ПК, з паролем адміністратора."
