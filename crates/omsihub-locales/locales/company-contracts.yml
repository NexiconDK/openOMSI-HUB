"Your passengers used %{used} GB, %{short} GB more than the %{gb} GB a day of the contract with %{name}: they were annoyed. Take more data a day, or top it up when it runs low.":
  nl: "Je reizigers gebruikten %{used} GB, %{short} GB meer dan de %{gb} GB per dag van het contract met %{name}: ze ergerden zich. Neem meer data per dag, of waardeer op als het opraakt."
  de: "Deine Fahrgäste haben %{used} GB verbraucht, %{short} GB mehr als die %{gb} GB pro Tag aus dem Vertrag mit %{name}: Sie waren verärgert. Nimm mehr Daten pro Tag oder buche nach, wenn es knapp wird."
  da: "Dine passagerer brugte %{used} GB, %{short} GB mere end de %{gb} GB om dagen i kontrakten med %{name}: de blev irriterede. Tag flere data om dagen, eller fyld op, når det løber lavt."
  fr: "Vos voyageurs ont utilisé %{used} Go, soit %{short} Go de plus que les %{gb} Go par jour du contrat avec %{name} : ils étaient agacés. Prenez plus de données par jour, ou rechargez quand elles s'épuisent."
  ru: "Ваши пассажиры израсходовали %{used} ГБ, на %{short} ГБ больше, чем %{gb} ГБ в день по контракту с %{name}: они были недовольны. Возьмите больше трафика в день или докупайте, когда он заканчивается."
