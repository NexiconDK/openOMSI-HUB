  fr: "Du %{from} au %{until}, la ville demande de laisser la voiture au garage : attendez-vous à plus de voyageurs. Prévoyez assez de bus, et ajoutez-en si vous le pouvez."
  ru: "С %{from} по %{until} город просит оставить машины дома: ожидается больше пассажиров. Позаботьтесь, чтобы автобусов хватило, и по возможности выпустите дополнительные."
