"No goal runs now. Take on up to three of those on offer: each counts your company's days from today until it is reached or its time runs out.":
  nl: "Er loopt nu geen doel. Neem er tot drie van de aangeboden doelen aan: elk telt de dagen van je bedrijf vanaf vandaag tot het gehaald is of de tijd om is."
  de: "Gerade läuft kein Ziel. Nimm bis zu drei der angebotenen an: Jedes zählt die Tage deines Unternehmens ab heute, bis es erreicht ist oder die Zeit abläuft."
  da: "Intet mål kører nu. Tag op til tre af dem, der tilbydes: hvert tæller dit selskabs dage fra i dag, til det er nået, eller dets tid løber ud."
  fr: "Aucun objectif en cours. Acceptez-en jusqu'à trois parmi ceux proposés : chacun compte les journées de votre entreprise à partir d'aujourd'hui jusqu'à ce qu'il soit atteint ou que le temps soit écoulé."
  ru: "Сейчас нет активных целей. Возьмите до трёх из предложенных: каждая учитывает дни вашей компании с сегодняшнего дня, пока не будет достигнута или не выйдет время."
  uk: "Зараз немає активних цілей. Візьміть до трьох із запропонованих: кожна враховує дні вашої компанії від сьогодні, доки її не досягнуто або не вийде час."
