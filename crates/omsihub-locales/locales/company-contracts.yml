"Every trip run counts, yours too; a dropped one does not.":
  nl: "Elke gereden rit telt, ook die van jou; een uitgevallen rit niet."
  de: "Jede gefahrene Fahrt zählt, auch deine; eine ausgefallene nicht."
  da: "Hver kørt tur tæller, også dine; en droppet gør ikke."
  fr: "Chaque trajet effectué compte, les vôtres aussi ; un trajet supprimé ne compte pas."
  ru: "Считается каждый выполненный рейс, и ваши тоже; отменённый — нет."
  uk: "Зараховується кожен виконаний рейс, і ваші теж; скасований — ні."
  pl: "Liczy się każdy wykonany kurs, twoje też; odwołany nie."
"Every passenger on your lines counts.":
  nl: "Elke reiziger op je lijnen telt."
  de: "Jeder Fahrgast auf deinen Linien zählt."
  da: "Hver passager på dine linjer tæller."
  fr: "Chaque voyageur sur vos lignes compte."
  ru: "Считается каждый пассажир на ваших линиях."
  uk: "Зараховується кожен пасажир на ваших лініях."
  pl: "Liczy się każdy pasażer na twoich liniach."
"Every kilometre your buses run on the lines counts.":
  nl: "Elke kilometer die je bussen op de lijnen rijden telt."
  de: "Jeder Kilometer, den deine Busse auf den Linien fahren, zählt."
  da: "Hver kilometer, dine busser kører på linjerne, tæller."
  fr: "Chaque kilomètre parcouru par vos bus sur les lignes compte."
  ru: "Считается каждый километр, пройденный вашими автобусами по линиям."
  uk: "Зараховується кожен кілометр, пройдений вашими автобусами лініями."
  pl: "Liczy się każdy kilometr przejechany przez twoje autobusy na liniach."
"Your rating is your reputation in stars: trips on time and happy passengers raise it.":
  nl: "Je beoordeling is je reputatie in sterren: ritten op tijd en tevreden reizigers verhogen hem."
  de: "Deine Bewertung ist dein Ruf in Sternen: pünktliche Fahrten und zufriedene Fahrgäste heben sie."
  da: "Din vurdering er dit omdømme i stjerner: ture til tiden og glade passagerer hæver den."
  fr: "Votre note est votre réputation en étoiles : les trajets à l'heure et les voyageurs satisfaits la font monter."
  ru: "Ваш рейтинг — это ваша репутация в звёздах: рейсы вовремя и довольные пассажиры повышают его."
  uk: "Ваш рейтинг — це ваша репутація в зірках: рейси вчасно й задоволені пасажири підвищують його."
  pl: "Twoja ocena to reputacja w gwiazdkach: punktualne kursy i zadowoleni pasażerowie ją podnoszą."
"A day with a dropped trip starts the count again.":
  nl: "Een dag met een uitgevallen rit laat de telling opnieuw beginnen."
  de: "Ein Tag mit einer ausgefallenen Fahrt beginnt die Zählung von vorn."
  da: "En dag med en droppet tur starter optællingen forfra."
  fr: "Une journée avec un trajet supprimé remet le compte à zéro."
  ru: "День с отменённым рейсом обнуляет счёт."
  uk: "День зі скасованим рейсом обнуляє лік."
  pl: "Dzień z odwołanym kursem zaczyna liczenie od nowa."
"A day with fewer trips on time starts the count again.":
  nl: "Een dag met minder ritten op tijd laat de telling opnieuw beginnen."
  de: "Ein Tag mit weniger pünktlichen Fahrten beginnt die Zählung von vorn."
  da: "En dag med færre ture til tiden starter optællingen forfra."
  fr: "Une journée avec moins de trajets à l'heure remet le compte à zéro."
  ru: "День с меньшей долей рейсов вовремя обнуляет счёт."
  uk: "День із меншою часткою рейсів вчасно обнуляє лік."
  pl: "Dzień z mniejszą liczbą punktualnych kursów zaczyna liczenie od nowa."
"A day on which the line drops a trip or runs more than one in ten late starts the count again.":
  nl: "Een dag waarop de lijn een rit laat uitvallen of meer dan een op de tien te laat rijdt, laat de telling opnieuw beginnen."
  de: "Ein Tag, an dem die Linie eine Fahrt ausfallen lässt oder mehr als jede zehnte verspätet fährt, beginnt die Zählung von vorn."
  da: "En dag, hvor linjen dropper en tur eller kører mere end en ud af ti for sent, starter optællingen forfra."
  fr: "Une journée où la ligne supprime un trajet ou en fait plus d'un sur dix en retard remet le compte à zéro."
  ru: "День, когда на линии отменён рейс или опоздал больше чем каждый десятый, обнуляет счёт."
  uk: "День, коли на лінії скасовано рейс або запізнився більше ніж кожен десятий, обнуляє лік."
  pl: "Dzień, w którym linia odwoła kurs albo więcej niż co dziesiąty się spóźni, zaczyna liczenie od nowa."
"Every day that ends with a profit counts.":
  nl: "Elke dag die met winst eindigt telt."
  de: "Jeder Tag, der mit Gewinn endet, zählt."
  da: "Hver dag, der ender med overskud, tæller."
  fr: "Chaque journée qui se termine en bénéfice compte."
  ru: "Считается каждый день, закрытый с прибылью."
  uk: "Зараховується кожен день, закритий із прибутком."
  pl: "Liczy się każdy dzień zakończony zyskiem."
"Research WLAN on the buses first.":
