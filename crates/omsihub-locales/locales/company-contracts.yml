"The buses have no WLAN yet. Research it, and the internet providers make their offers here: your passengers like to be online, and a connection that lasts the day raises your reputation.":
  nl: "De bussen hebben nog geen wifi. Onderzoek het, en de internetproviders doen hier hun aanbod: je reizigers zijn graag online, en een verbinding die de hele dag meegaat verhoogt je reputatie."
  de: "Die Busse haben noch kein WLAN. Erforsche es, und die Internetanbieter machen hier ihre Angebote: Deine Fahrgäste sind gern online, und eine Verbindung, die den ganzen Tag hält, hebt deinen Ruf."
  da: "Busserne har endnu intet WLAN. Forsk i det, så giver internetudbyderne deres tilbud her: dine passagerer kan lide at være online, og en forbindelse, der holder hele dagen, hæver dit omdømme."
  fr: "Les bus n'ont pas encore de Wi-Fi. Recherchez-le, et les fournisseurs d'accès feront leurs offres ici : vos voyageurs aiment être en ligne, et une connexion qui tient toute la journée améliore votre réputation."
  ru: "В автобусах пока нет Wi-Fi. Исследуйте его, и интернет-провайдеры сделают здесь свои предложения: пассажиры любят быть онлайн, а связь, которой хватает на весь день, повышает репутацию."
  uk: "В автобусах поки немає Wi-Fi. Дослідіть його, і інтернет-провайдери зроблять тут свої пропозиції: пасажири люблять бути онлайн, а зв'язок, якого вистачає на весь день, підвищує репутацію."
  pl: "Autobusy nie mają jeszcze Wi-Fi. Zbadaj je, a dostawcy internetu złożą tu swoje oferty: pasażerowie lubią być online, a połączenie, które wystarcza na cały dzień, podnosi twoją reputację."
