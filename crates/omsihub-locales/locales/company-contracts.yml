"A fixed price runs until its last day: it cannot be ended early.":
  nl: "Een vaste prijs loopt tot de laatste dag: hij kan niet eerder worden beëindigd."
  de: "Ein Festpreis läuft bis zu seinem letzten Tag: Er kann nicht vorzeitig beendet werden."
  da: "En fast pris kører til sin sidste dag: den kan ikke afsluttes tidligt."
  fr: "Un prix fixe court jusqu'à son dernier jour : il ne peut pas être arrêté plus tôt."
  ru: "Фиксированная цена действует до последнего дня: досрочно её не отменить."
  uk: "Фіксована ціна діє до останнього дня: достроково її не скасувати."
  pl: "Stała cena obowiązuje do ostatniego dnia: nie można jej zakończyć wcześniej."
"Fix the price for a while: from tomorrow the company pays the same, whatever the market does. Sign before a price rise the inbox tells of - but a fixed price also stays when diesel gets cheaper.":
  nl: "Leg de prijs een tijd vast: vanaf morgen betaalt het bedrijf hetzelfde, wat de markt ook doet. Teken voor een prijsstijging die de inbox aankondigt - maar een vaste prijs blijft ook als diesel goedkoper wordt."
  de: "Lege den Preis für eine Weile fest: Ab morgen zahlt das Unternehmen dasselbe, egal was der Markt macht. Unterschreibe vor einer Preiserhöhung, die der Posteingang ankündigt - aber ein Festpreis bleibt auch, wenn Diesel billiger wird."
  da: "Fastlæg prisen for en tid: fra i morgen betaler selskabet det samme, uanset hvad markedet gør. Skriv under før en prisstigning, som indbakken fortæller om - men en fast pris bliver også, når diesel bliver billigere."
  fr: "Fixez le prix pour un temps : dès demain, l'entreprise paie la même chose, quoi que fasse le marché. Signez avant une hausse annoncée dans la boîte de réception - mais un prix fixe reste aussi quand le gazole baisse."
  ru: "Зафиксируйте цену на время: с завтрашнего дня компания платит одинаково, что бы ни происходило на рынке. Подпишите до подорожания, о котором сообщают входящие, - но фиксированная цена остаётся и когда дизель дешевеет."
  uk: "Зафіксуйте ціну на якийсь час: з завтра компанія платить однаково, хоч би що робив ринок. Підпишіть до подорожчання, про яке повідомляють вхідні, - але фіксована ціна лишається й тоді, коли дизель дешевшає."
  pl: "Ustal cenę na jakiś czas: od jutra firma płaci tyle samo, cokolwiek zrobi rynek. Podpisz przed podwyżką zapowiedzianą w skrzynce odbiorczej - ale stała cena zostaje też wtedy, gdy olej napędowy tanieje."
