"An outside company cleans your buses every night: %{amount} a bus, %{total} a day for your %{n} buses. Clean buses please the passengers: the reputation rises a little every day they run.":
  nl: "Een extern bedrijf maakt je bussen elke nacht schoon: %{amount} per bus, %{total} per dag voor je %{n} bussen. Schone bussen bevallen de reizigers: de reputatie stijgt elke dag dat ze rijden een beetje."
  de: "Eine externe Firma reinigt deine Busse jede Nacht: %{amount} pro Bus, %{total} pro Tag für deine %{n} Busse. Saubere Busse gefallen den Fahrgästen: Der Ruf steigt an jedem Tag, an dem sie fahren, ein wenig."
  da: "Et eksternt firma rengør dine busser hver nat: %{amount} pr. bus, %{total} om dagen for dine %{n} busser. Rene busser glæder passagererne: omdømmet stiger lidt hver dag, de kører."
  fr: "Une entreprise extérieure nettoie vos bus chaque nuit : %{amount} par bus, %{total} par jour pour vos %{n} bus. Des bus propres plaisent aux voyageurs : la réputation monte un peu chaque jour où ils roulent."
  ru: "Сторонняя компания каждую ночь убирает ваши автобусы: %{amount} за автобус, %{total} в день за ваши %{n} автобусов. Чистые автобусы нравятся пассажирам: репутация немного растёт каждый день, когда они ездят."
  uk: "Стороння компанія щоночі прибирає ваші автобуси: %{amount} за автобус, %{total} на день за ваші %{n} автобусів. Чисті автобуси подобаються пасажирам: репутація трохи зростає щодня, коли вони їздять."
  pl: "Zewnętrzna firma sprząta twoje autobusy każdej nocy: %{amount} za autobus, %{total} dziennie za twoje %{n} autobusów. Czyste autobusy podobają się pasażerom: reputacja rośnie trochę każdego dnia, w którym kursują."
