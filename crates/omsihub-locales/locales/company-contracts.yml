"Here your company tells you what happens: events in town that bring more or fewer passengers or change the diesel's price, your staff, your buses and the workshop, your money, and the goals and contracts you can take on. A new message is marked until you have read it.":
  nl: "Hier vertelt je bedrijf wat er gebeurt: gebeurtenissen in de stad die meer of minder reizigers brengen of de dieselprijs veranderen, je personeel, je bussen en de werkplaats, je geld, en de doelen en contracten die je kunt aannemen. Een nieuw bericht blijft gemarkeerd tot je het hebt gelezen."
  de: "Hier erzählt dir dein Unternehmen, was passiert: Ereignisse in der Stadt, die mehr oder weniger Fahrgäste bringen oder den Dieselpreis ändern, dein Personal, deine Busse und die Werkstatt, dein Geld und die Ziele und Verträge, die du annehmen kannst. Eine neue Nachricht bleibt markiert, bis du sie gelesen hast."
  da: "Her fortæller dit selskab dig, hvad der sker: begivenheder i byen, der giver flere eller færre passagerer eller ændrer dieselprisen, dit personale, dine busser og værkstedet, dine penge og de mål og kontrakter, du kan tage på dig. En ny besked er markeret, til du har læst den."
  fr: "Ici, votre entreprise vous dit ce qui se passe : les événements en ville qui amènent plus ou moins de voyageurs ou changent le prix du gazole, votre personnel, vos bus et l'atelier, votre argent, ainsi que les objectifs et contrats que vous pouvez accepter. Un nouveau message reste marqué jusqu'à ce que vous l'ayez lu."
  ru: "Здесь ваша компания сообщает, что происходит: события в городе, которые приводят больше или меньше пассажиров или меняют цену дизеля, ваш персонал, автобусы и мастерская, ваши деньги, а также цели и контракты, которые можно взять. Новое сообщение отмечено, пока вы его не прочтёте."
  uk: "Тут ваша компанія повідомляє, що відбувається: події в місті, які приводять більше чи менше пасажирів або змінюють ціну дизеля, ваш персонал, автобуси й майстерня, ваші гроші, а також цілі й контракти, які можна взяти. Нове повідомлення позначене, доки ви його не прочитаєте."
  pl: "Tutaj firma mówi ci, co się dzieje: wydarzenia w mieście, które przynoszą więcej lub mniej pasażerów albo zmieniają cenę oleju napędowego, twój personel, autobusy i warsztat, twoje pieniądze oraz cele i umowy, które możesz przyjąć. Nowa wiadomość jest oznaczona, dopóki jej nie przeczytasz."
