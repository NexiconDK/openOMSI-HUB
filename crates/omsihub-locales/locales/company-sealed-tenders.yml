  fr: "%{who} a abandonné la ligne %{n} : elle est remise en appel d'offres, offres cachetées jusqu'à %{time}"
  nl: "%{who} heeft lijn %{n} opgegeven: ze is opnieuw aanbesteed, gesloten biedingen tot %{time}"
  pl: "%{who} zrezygnował z linii %{n}: trafia ponownie do przetargu, oferty zamknięte do %{time}"
  ru: "%{who} отказался от линии %{n}: она снова на торгах, закрытые заявки до %{time}"
  uk: "%{who} відмовився від лінії %{n}: вона знову на торгах, закриті пропозиції до %{time}"
