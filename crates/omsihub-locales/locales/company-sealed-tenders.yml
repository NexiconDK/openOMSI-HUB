  pl: "Około %{week} tygodniowo i %{term} za %{days} dni umowy: %{hours} godzin rozkładowych po %{rate} i %{buses} autobusów umownych po %{bus} dziennie"
  ru: "Около %{week} в неделю и %{term} за %{days} дней контракта: %{hours} часов по расписанию по %{rate} и %{buses} автобусов по контракту по %{bus} в день"
  uk: "Близько %{week} на тиждень і %{term} за %{days} днів контракту: %{hours} годин за розкладом по %{rate} і %{buses} автобусів за контрактом по %{bus} на день"
