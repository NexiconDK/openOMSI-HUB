"About %{week} a week and %{term} for the contract's %{days} days: %{hours} timetable hours at %{rate} and %{buses} contract buses at %{bus} a day":
  de: "Etwa %{week} die Woche und %{term} für die %{days} Tage des Vertrags: %{hours} Fahrplanstunden zu %{rate} und %{buses} Vertragsbusse zu %{bus} am Tag"
