"No tender of the map has closed yet: when one does, every bid is shown here with its points.":
  de: "Noch ist keine Ausschreibung der Karte geschlossen: Danach steht hier jedes Gebot mit seinen Punkten."
  da: "Intet af kortets udbud er lukket endnu: når et gør, vises hvert bud her med sine point."
  fr: "Aucun appel d'offres de la carte n'est encore clos : ensuite, chaque offre s'affiche ici avec ses points."
  nl: "Nog geen aanbesteding van de kaart is gesloten: daarna staat hier elk bod met zijn punten."
  pl: "Żaden przetarg mapy nie został jeszcze zamknięty: potem każda oferta pojawi się tu z punktami."
  ru: "Торги карты ещё не закрывались: после закрытия здесь будет каждая заявка с баллами."
  uk: "Торги мапи ще не закривалися: після закриття тут буде кожна пропозиція з балами."
