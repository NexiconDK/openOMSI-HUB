  de: "Geöffnete Gebote"
  da: "Åbnede bud"
  fr: "Offres ouvertes"
  nl: "Geopende biedingen"
  pl: "Otwarte oferty"
  ru: "Вскрытые заявки"
  uk: "Розкриті пропозиції"
"Sealed bids until %{time} (%{left} from now): every company of the map and its operators bid, nobody sees another's bid until the close, and they are scored 70 % price and 30 % quality. Ask at least %{low} and at most %{cap}.":
  de: "Verdeckte Gebote bis %{time} (noch %{left}): Jede Firma der Karte und ihre Betreiber bieten, niemand sieht ein anderes Gebot vor dem Schluss, und sie werden zu 70 % nach Preis und 30 % nach Qualität bewertet. Biete mindestens %{low} und höchstens %{cap}."
  da: "Forseglede bud indtil %{time} (%{left} fra nu): hvert selskab på kortet og dets operatører byder, ingen ser en andens bud før lukningen, og de scores med 70 % pris og 30 % kvalitet. Byd mindst %{low} og højst %{cap}."
  fr: "Offres cachetées jusqu'à %{time} (dans %{left}) : chaque entreprise de la carte et ses exploitants font une offre, personne ne voit celle d'un autre avant la clôture, et elles sont notées à 70 % sur le prix et 30 % sur la qualité. Propose au moins %{low} et au plus %{cap}."
  nl: "Gesloten biedingen tot %{time} (nog %{left}): elk bedrijf van de kaart en haar vervoerders bieden, niemand ziet een ander bod voor de sluiting, en ze worden beoordeeld op 70 % prijs en 30 % kwaliteit. Bied minstens %{low} en hoogstens %{cap}."
  pl: "Oferty zamknięte do %{time} (za %{left}): każda firma mapy i jej przewoźnicy składają oferty, nikt nie widzi cudzej przed zamknięciem, a ocena to 70 % cena i 30 % jakość. Zaproponuj co najmniej %{low} i najwyżej %{cap}."
  ru: "Закрытые заявки до %{time} (через %{left}): каждая компания карты и её перевозчики подают заявки, никто не видит чужую до закрытия, а оценка — 70 % цена и 30 % качество. Предложи не меньше %{low} и не больше %{cap}."
  uk: "Закриті пропозиції до %{time} (через %{left}): кожна компанія карти та її перевізники подають пропозиції, ніхто не бачить чужу до закриття, а оцінка — 70 % ціна і 30 % якість. Запропонуй не менше %{low} і не більше %{cap}."
"Your cost price with a 5 % margin is %{own}: under the abnormally low line, so ask at least %{amount}":
  de: "Ihr Selbstkostenpreis mit 5 % Marge ist %{own}: unter der Grenze für ungewöhnlich niedrige Gebote, also bieten Sie mindestens %{amount}"
  da: "Din kostpris med 5 % avance er %{own}: under grænsen for unormalt lave bud, så byd mindst %{amount}"
  fr: "Votre prix de revient avec une marge de 5 % est de %{own} : sous le seuil anormalement bas, demandez donc au moins %{amount}"
  nl: "Uw kostprijs met 5 % marge is %{own}: onder de grens voor abnormaal lage biedingen, vraag dus minstens %{amount}"
  pl: "Twój koszt własny z 5 % marży to %{own}: poniżej progu rażąco niskiej ceny, więc żądaj co najmniej %{amount}"
  ru: "Ваша себестоимость с наценкой 5 % — %{own}: ниже порога аномально низкой цены, поэтому просите не меньше %{amount}"
  uk: "Ваша собівартість із націнкою 5 % — %{own}: нижче порогу аномально низької ціни, тож просіть щонайменше %{amount}"
"%{p} price + %{q} quality (operation %{a}, vehicles %{v}, plan %{l}, working environment %{w}) = %{t} points":
  de: "%{p} Preis + %{q} Qualität (Betrieb %{a}, Fahrzeuge %{v}, Plan %{l}, Arbeitsumfeld %{w}) = %{t} Punkte"
  da: "%{p} pris + %{q} kvalitet (drift %{a}, materiel %{v}, plan %{l}, arbejdsmiljø %{w}) = %{t} point"
  fr: "%{p} prix + %{q} qualité (exploitation %{a}, véhicules %{v}, plan %{l}, conditions de travail %{w}) = %{t} points"
  nl: "%{p} prijs + %{q} kwaliteit (exploitatie %{a}, voertuigen %{v}, plan %{l}, werkomgeving %{w}) = %{t} punten"
  pl: "%{p} cena + %{q} jakość (eksploatacja %{a}, pojazdy %{v}, plan %{l}, środowisko pracy %{w}) = %{t} pkt"
  ru: "%{p} цена + %{q} качество (эксплуатация %{a}, автобусы %{v}, план %{l}, условия труда %{w}) = %{t} баллов"
  uk: "%{p} ціна + %{q} якість (експлуатація %{a}, автобуси %{v}, план %{l}, умови праці %{w}) = %{t} балів"
"Price %{w} %: the lowest valid ask gets all %{w} points, every other ask lowest ÷ ask of them.":
  de: "Preis %{w} %: das niedrigste gültige Gebot bekommt alle %{w} Punkte, jedes andere niedrigstes ÷ eigenes davon."
  da: "Pris %{w} %: det laveste gyldige bud får alle %{w} point, ethvert andet bud laveste ÷ eget bud af dem."
  fr: "Prix %{w} % : l'offre valide la plus basse obtient les %{w} points, toute autre la plus basse ÷ la sienne."
  nl: "Prijs %{w} %: het laagste geldige bod krijgt alle %{w} punten, elk ander laagste ÷ eigen bod ervan."
  pl: "Cena %{w} %: najniższa ważna oferta dostaje wszystkie %{w} pkt, każda inna najniższa ÷ własna z nich."
  ru: "Цена %{w} %: самая низкая действительная ставка получает все %{w} баллов, остальные — низшая ÷ своя."
  uk: "Ціна %{w} %: найнижча дійсна ставка отримує всі %{w} балів, решта — найнижча ÷ своя."
"Operating quality %{w} %: your track record, %{v} of 100 - %{p} points.":
  de: "Betriebsqualität %{w} %: deine Bilanz, %{v} von 100 - %{p} Punkte."
  da: "Driftskvalitet %{w} %: din historik, %{v} af 100 - %{p} point."
  fr: "Qualité d'exploitation %{w} % : votre bilan, %{v} sur 100 - %{p} points."
  nl: "Exploitatiekwaliteit %{w} %: je staat van dienst, %{v} van 100 - %{p} punten."
  pl: "Jakość eksploatacji %{w} %: twój dorobek, %{v} na 100 - %{p} pkt."
  ru: "Качество эксплуатации %{w} %: ваша репутация, %{v} из 100 - %{p} баллов."
  uk: "Якість експлуатації %{w} %: ваша репутація, %{v} зі 100 - %{p} балів."
"Vehicles %{w} %: your buses' age and drive, %{v} of 100 - %{p} points.":
  de: "Fahrzeuge %{w} %: Alter und Antrieb deiner Busse, %{v} von 100 - %{p} Punkte."
  da: "Materiel %{w} %: dine bussers alder og drivmiddel, %{v} af 100 - %{p} point."
  fr: "Véhicules %{w} % : âge et motorisation de vos bus, %{v} sur 100 - %{p} points."
  nl: "Voertuigen %{w} %: leeftijd en aandrijving van je bussen, %{v} van 100 - %{p} punten."
  pl: "Pojazdy %{w} %: wiek i napęd twoich autobusów, %{v} na 100 - %{p} pkt."
  ru: "Автобусы %{w} %: возраст и тип привода ваших автобусов, %{v} из 100 - %{p} баллов."
  uk: "Автобуси %{w} %: вік і тип приводу ваших автобусів, %{v} зі 100 - %{p} балів."
"Implementation plan %{w} %: room, buses and drivers for the work, %{v} of 100 - %{p} points.":
  de: "Umsetzungsplan %{w} %: Platz, Busse und Fahrer für die Leistung, %{v} von 100 - %{p} Punkte."
  da: "Implementeringsplan %{w} %: plads, busser og chauffører til opgaven, %{v} af 100 - %{p} point."
  fr: "Plan de mise en œuvre %{w} % : place, bus et conducteurs pour le service, %{v} sur 100 - %{p} points."
  nl: "Implementatieplan %{w} %: ruimte, bussen en chauffeurs voor het werk, %{v} van 100 - %{p} punten."
  pl: "Plan wdrożenia %{w} %: miejsce, autobusy i kierowcy do pracy, %{v} na 100 - %{p} pkt."
  ru: "План внедрения %{w} %: место, автобусы и водители для работы, %{v} из 100 - %{p} баллов."
  uk: "План впровадження %{w} %: місце, автобуси й водії для роботи, %{v} зі 100 - %{p} балів."
"Working environment %{w} %: your staff's satisfaction, less those off sick, %{v} of 100 - %{p} points.":
  de: "Arbeitsumfeld %{w} %: Zufriedenheit deines Personals, abzüglich Kranker, %{v} von 100 - %{p} Punkte."
  da: "Arbejdsmiljø %{w} %: personalets tilfredshed minus de syge, %{v} af 100 - %{p} point."
  fr: "Conditions de travail %{w} % : satisfaction de votre personnel, moins les malades, %{v} sur 100 - %{p} points."
  nl: "Werkomgeving %{w} %: tevredenheid van je personeel, min de zieken, %{v} van 100 - %{p} punten."
  pl: "Środowisko pracy %{w} %: zadowolenie personelu, minus chorzy, %{v} na 100 - %{p} pkt."
  ru: "Условия труда %{w} %: удовлетворённость персонала за вычетом больных, %{v} из 100 - %{p} баллов."
  uk: "Умови праці %{w} %: задоволеність персоналу за вирахуванням хворих, %{v} зі 100 - %{p} балів."
"The Viborg model: 50 % price + 50 % quality":
  de: "Das Viborg-Modell: 50 % Preis + 50 % Qualität"
  da: "Viborg-modellen: 50 % pris + 50 % kvalitet"
  fr: "Le modèle de Viborg : 50 % prix + 50 % qualité"
  nl: "Het Viborg-model: 50 % prijs + 50 % kwaliteit"
  pl: "Model Viborg: 50 % cena + 50 % jakość"
  ru: "Модель Виборга: 50 % цена + 50 % качество"
  uk: "Модель Віборга: 50 % ціна + 50 % якість"
"The lowest price wins":
  de: "Der niedrigste Preis gewinnt"
  da: "Laveste pris vinder"
  fr: "Le prix le plus bas l'emporte"
  nl: "De laagste prijs wint"
  pl: "Wygrywa najniższa cena"
  ru: "Побеждает самая низкая цена"
  uk: "Перемагає найнижча ціна"
"Price up to %{p}":
  de: "Preis bis %{p}"
  da: "Pris op til %{p}"
  fr: "Prix jusqu'à %{p}"
  nl: "Prijs tot %{p}"
  pl: "Cena do %{p}"
  ru: "Цена до %{p}"
  uk: "Ціна до %{p}"
