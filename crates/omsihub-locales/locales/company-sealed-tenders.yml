"Your price points are known when the bids are opened: the lowest valid ask gets all 70.":
  de: "Deine Preispunkte stehen fest, wenn die Gebote geöffnet werden: Das niedrigste gültige Gebot bekommt alle 70."
  da: "Dine prispoint kendes, når buddene åbnes: den laveste gyldige pris får alle 70."
  fr: "Tes points de prix sont connus à l'ouverture des offres : l'offre valable la plus basse obtient les 70."
  nl: "Je prijspunten zijn bekend als de biedingen geopend worden: het laagste geldige bod krijgt alle 70."
  pl: "Twoje punkty za cenę będą znane po otwarciu ofert: najniższa ważna oferta dostaje wszystkie 70."
  ru: "Твои баллы за цену известны после вскрытия: минимальная допустимая заявка получает все 70."
  uk: "Твої бали за ціну відомі після розкриття: найнижча дійсна пропозиція отримує всі 70."
"Sealed bids: opened together at the close. Under 85 % of the authority's cost price a bid is rejected as abnormally low; above the cap it does not count.":
  de: "Verdeckte Gebote: gemeinsam beim Schluss geöffnet. Unter 85 % des Kostenpreises der Behörde wird ein Gebot als ungewöhnlich niedrig abgelehnt; über der Obergrenze zählt es nicht."
  da: "Forseglede bud: åbnes samlet ved lukningen. Under 85 % af trafikselskabets kostpris afvises et bud som unormalt lavt; over loftet tæller det ikke."
  fr: "Offres cachetées : ouvertes ensemble à la clôture. Sous 85 % du prix de revient de l'autorité, une offre est rejetée comme anormalement basse ; au-dessus du plafond, elle ne compte pas."
  nl: "Gesloten biedingen: samen geopend bij de sluiting. Onder 85 % van de kostprijs van de overheid wordt een bod als abnormaal laag afgewezen; boven het plafond telt het niet."
  pl: "Oferty zamknięte: otwierane razem przy zamknięciu. Poniżej 85 % ceny kosztowej organizatora oferta jest odrzucana jako rażąco niska; powyżej limitu się nie liczy."
  ru: "Закрытые заявки: вскрываются вместе при закрытии. Ниже 85 % себестоимости заказчика заявка отклоняется как аномально низкая; выше предела не учитывается."
  uk: "Закриті пропозиції: розкриваються разом під час закриття. Нижче 85 % собівартості замовника пропозиція відхиляється як аномально низька; вище межі не враховується."
"Sealed tender: nobody sees another's bid until it closes - not the other companies, not the operators. You may change your bid until the deadline: your last counts. At the close every bid is opened and shown with its points.":
  de: "Verdeckte Ausschreibung: Niemand sieht ein anderes Gebot vor dem Schluss - weder die anderen Unternehmen noch die Betreiber. Du kannst dein Gebot bis zur Frist ändern: Das letzte zählt. Beim Schluss wird jedes Gebot geöffnet und mit seinen Punkten gezeigt."
  da: "Forseglet udbud: ingen ser en andens bud, før det lukker - hverken de andre selskaber eller operatørerne. Du kan ændre dit bud indtil fristen: dit sidste tæller. Ved lukningen åbnes hvert bud og vises med sine point."
  fr: "Appel d'offres cacheté : personne ne voit l'offre d'un autre avant la clôture - ni les autres entreprises, ni les exploitants. Tu peux modifier ton offre jusqu'à l'échéance : la dernière compte. À la clôture, chaque offre est ouverte et affichée avec ses points."
  nl: "Gesloten aanbesteding: niemand ziet een ander bod voor de sluiting - niet de andere bedrijven, niet de vervoerders. Je kunt je bod wijzigen tot de deadline: je laatste telt. Bij de sluiting wordt elk bod geopend en met zijn punten getoond."
  pl: "Przetarg z ofertami zamkniętymi: nikt nie widzi cudzej oferty przed zamknięciem - ani inne firmy, ani przewoźnicy. Możesz zmieniać ofertę do terminu: liczy się ostatnia. Przy zamknięciu każda oferta zostaje otwarta i pokazana z punktami."
  ru: "Закрытые торги: никто не видит чужую заявку до закрытия - ни другие компании, ни перевозчики. Ты можешь менять заявку до срока: учитывается последняя. При закрытии каждая заявка вскрывается и показывается с баллами."
  uk: "Закриті торги: ніхто не бачить чужу пропозицію до закриття - ні інші компанії, ні перевізники. Ти можеш змінювати пропозицію до терміну: враховується остання. Під час закриття кожну пропозицію розкривають і показують з балами."
