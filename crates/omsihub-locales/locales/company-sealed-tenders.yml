"85 % of the authority's cost price: a bid under it is abnormally low and is rejected when the bids are opened.":
  de: "85 % des Kostenpreises der Behörde: Ein Gebot darunter ist ungewöhnlich niedrig und wird bei der Öffnung abgelehnt."
  da: "85 % af trafikselskabets kostpris: et bud under den er unormalt lavt og afvises, når buddene åbnes."
  fr: "85 % du prix de revient de l'autorité : une offre en dessous est anormalement basse et est rejetée à l'ouverture."
  nl: "85 % van de kostprijs van de overheid: een bod daaronder is abnormaal laag en wordt bij de opening afgewezen."
  pl: "85 % ceny kosztowej organizatora: oferta poniżej jest rażąco niska i zostaje odrzucona przy otwarciu."
  ru: "85 % себестоимости заказчика: заявка ниже аномально низкая и отклоняется при вскрытии."
  uk: "85 % собівартості замовника: пропозиція нижче аномально низька і відхиляється під час розкриття."
"The authority's cost price by one and a half, at most the server's cap: an ask above it does not count.":
  de: "Der Kostenpreis der Behörde mal anderthalb, höchstens die Obergrenze des Servers: Ein Gebot darüber zählt nicht."
  da: "Trafikselskabets kostpris gange halvanden, højst serverens loft: en pris over den tæller ikke."
  fr: "Le prix de revient de l'autorité multiplié par 1,5, au plus le plafond du serveur : une offre au-dessus ne compte pas."
  nl: "De kostprijs van de overheid maal anderhalf, hoogstens het plafond van de server: een bod daarboven telt niet."
  pl: "Cena kosztowa organizatora razy półtora, najwyżej limit serwera: oferta powyżej się nie liczy."
  ru: "Себестоимость заказчика, умноженная на полтора, но не выше предела сервера: заявка выше не учитывается."
  uk: "Собівартість замовника, помножена на півтора, але не вище межі сервера: пропозиція вище не враховується."
