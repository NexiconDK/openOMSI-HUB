  de: "Qualität %{q} von %{m}"
  da: "Kvalitet %{q} af %{m}"
  fr: "Qualité %{q} sur %{m}"
  nl: "Kwaliteit %{q} van %{m}"
  pl: "Jakość %{q} z %{m}"
  ru: "Качество %{q} из %{m}"
  uk: "Якість %{q} з %{m}"
"Your price points are known when the bids are opened: the lowest valid ask gets them all.":
  de: "Deine Preispunkte stehen fest, wenn die Gebote geöffnet werden: das niedrigste gültige Gebot bekommt alle."
  da: "Dine prispoint kendes, når buddene åbnes: det laveste gyldige bud får dem alle."
  fr: "Vos points de prix sont connus à l'ouverture des offres : l'offre valide la plus basse les obtient tous."
  nl: "Je prijspunten zijn bekend als de biedingen worden geopend: het laagste geldige bod krijgt ze allemaal."
  pl: "Twoje punkty za cenę będą znane po otwarciu ofert: najniższa ważna oferta dostaje wszystkie."
  ru: "Ваши баллы за цену станут известны при вскрытии ставок: самая низкая действительная получает все."
  uk: "Ваші бали за ціну стануть відомі під час розкриття ставок: найнижча дійсна отримує всі."
"The bids are opened: their points are below.":
  de: "Die Gebote sind geöffnet: ihre Punkte stehen unten."
  da: "Buddene er åbnet: deres point står nedenfor."
  fr: "Les offres sont ouvertes : leurs points sont ci-dessous."
  nl: "De biedingen zijn geopend: hun punten staan hieronder."
  pl: "Oferty są otwarte: ich punkty są poniżej."
  ru: "Ставки вскрыты: их баллы ниже."
  uk: "Ставки розкрито: їхні бали нижче."
"From %{date}. Option: %{d} days more, at most %{n} times, when run satisfactorily (not red, at most 2 % of its journeys dropped)":
  de: "Ab %{date}. Option: %{d} Tage mehr, höchstens %{n}-mal, bei zufriedenstellendem Betrieb (nicht rot, höchstens 2 % der Fahrten ausgefallen)"
  da: "Fra %{date}. Option: %{d} dage mere, højst %{n} gange, ved tilfredsstillende kørsel (ikke rød, højst 2 % af turene udgået)"
  fr: "À partir du %{date}. Option : %{d} jours de plus, au plus %{n} fois, si l'exploitation est satisfaisante (pas rouge, au plus 2 % des courses supprimées)"
  nl: "Vanaf %{date}. Optie: %{d} dagen meer, hoogstens %{n} keer, bij goede uitvoering (niet rood, hoogstens 2 % van de ritten uitgevallen)"
  pl: "Od %{date}. Opcja: %{d} dni więcej, najwyżej %{n} razy, przy zadowalającej eksploatacji (nie czerwona, najwyżej 2 % kursów odwołanych)"
  ru: "С %{date}. Опцион: на %{d} дней больше, не более %{n} раз, при удовлетворительной работе (не красный, отменено не более 2 % рейсов)"
  uk: "З %{date}. Опціон: на %{d} днів більше, не більше %{n} разів, за задовільної роботи (не червоний, скасовано не більше 2 % рейсів)"
"The next term is announced six days before it begins, takes bids from five days before and is decided two days before it: the winner has two days to make ready.":
  de: "Die nächste Laufzeit wird sechs Tage vor ihrem Beginn angekündigt, nimmt ab fünf Tage davor Gebote an und wird zwei Tage davor entschieden: der Gewinner hat zwei Tage zur Vorbereitung."
  da: "Næste periode annonceres seks dage før den begynder, tager imod bud fra fem dage før og afgøres to dage før: vinderen har to dage til at gøre klar."
  fr: "La période suivante est annoncée six jours avant son début, reçoit des offres à partir de cinq jours avant et est attribuée deux jours avant : le gagnant a deux jours pour se préparer."
  nl: "De volgende termijn wordt zes dagen voor de start aangekondigd, neemt biedingen aan vanaf vijf dagen ervoor en wordt twee dagen ervoor gegund: de winnaar heeft twee dagen om zich voor te bereiden."
  pl: "Kolejny okres ogłaszany jest sześć dni przed jego początkiem, przyjmuje oferty od pięciu dni przed i jest rozstrzygany dwa dni przed: zwycięzca ma dwa dni na przygotowanie."
  ru: "Следующий срок объявляется за шесть дней до начала, ставки принимаются за пять дней, решение за два дня: у победителя два дня на подготовку."
  uk: "Наступний строк оголошують за шість днів до початку, ставки приймають за п'ять днів, рішення за два дні: переможець має два дні на підготовку."
"Small work (%{h} timetable hours a week): with diesel buses the contract runs %{d} days, with electric buses %{e} days, every tour run with an electric bus.":
  de: "Kleine Leistung (%{h} Fahrplanstunden pro Woche): mit Dieselbussen läuft der Vertrag %{d} Tage, mit Elektrobussen %{e} Tage, jeder Umlauf mit einem Elektrobus."
  da: "Lille opgave (%{h} køreplantimer om ugen): med dieselbusser kører kontrakten %{d} dage, med elbusser %{e} dage, hvor hvert vognløb køres med elbus."
  fr: "Petit service (%{h} heures d'horaire par semaine) : avec des bus diesel le contrat dure %{d} jours, avec des bus électriques %{e} jours, chaque service avec un bus électrique."
  nl: "Klein werk (%{h} dienstregelingsuren per week): met dieselbussen loopt het contract %{d} dagen, met elektrische bussen %{e} dagen, elke omloop met een elektrische bus."
  pl: "Mała praca (%{h} godzin rozkładowych tygodniowo): z autobusami diesla umowa trwa %{d} dni, z elektrycznymi %{e} dni, każdy obieg autobusem elektrycznym."
  ru: "Малый объём (%{h} часов по расписанию в неделю): с дизельными автобусами контракт длится %{d} дней, с электробусами %{e} дней, каждый выход на электробусе."
  uk: "Малий обсяг (%{h} годин за розкладом на тиждень): з дизельними автобусами контракт триває %{d} днів, з електробусами %{e} днів, кожен виїзд на електробусі."
"Medium work (%{h} timetable hours a week): with diesel buses the contract runs %{d} days, with electric buses %{e} days, every tour run with an electric bus.":
  de: "Mittlere Leistung (%{h} Fahrplanstunden pro Woche): mit Dieselbussen läuft der Vertrag %{d} Tage, mit Elektrobussen %{e} Tage, jeder Umlauf mit einem Elektrobus."
  da: "Mellemstor opgave (%{h} køreplantimer om ugen): med dieselbusser kører kontrakten %{d} dage, med elbusser %{e} dage, hvor hvert vognløb køres med elbus."
  fr: "Service moyen (%{h} heures d'horaire par semaine) : avec des bus diesel le contrat dure %{d} jours, avec des bus électriques %{e} jours, chaque service avec un bus électrique."
  nl: "Middelgroot werk (%{h} dienstregelingsuren per week): met dieselbussen loopt het contract %{d} dagen, met elektrische bussen %{e} dagen, elke omloop met een elektrische bus."
  pl: "Średnia praca (%{h} godzin rozkładowych tygodniowo): z autobusami diesla umowa trwa %{d} dni, z elektrycznymi %{e} dni, każdy obieg autobusem elektrycznym."
  ru: "Средний объём (%{h} часов по расписанию в неделю): с дизельными автобусами контракт длится %{d} дней, с электробусами %{e} дней, каждый выход на электробусе."
  uk: "Середній обсяг (%{h} годин за розкладом на тиждень): з дизельними автобусами контракт триває %{d} днів, з електробусами %{e} днів, кожен виїзд на електробусі."
"Large work (%{h} timetable hours a week): with diesel buses the contract runs %{d} days, with electric buses %{e} days, every tour run with an electric bus.":
  de: "Große Leistung (%{h} Fahrplanstunden pro Woche): mit Dieselbussen läuft der Vertrag %{d} Tage, mit Elektrobussen %{e} Tage, jeder Umlauf mit einem Elektrobus."
  da: "Stor opgave (%{h} køreplantimer om ugen): med dieselbusser kører kontrakten %{d} dage, med elbusser %{e} dage, hvor hvert vognløb køres med elbus."
  fr: "Grand service (%{h} heures d'horaire par semaine) : avec des bus diesel le contrat dure %{d} jours, avec des bus électriques %{e} jours, chaque service avec un bus électrique."
  nl: "Groot werk (%{h} dienstregelingsuren per week): met dieselbussen loopt het contract %{d} dagen, met elektrische bussen %{e} dagen, elke omloop met een elektrische bus."
  pl: "Duża praca (%{h} godzin rozkładowych tygodniowo): z autobusami diesla umowa trwa %{d} dni, z elektrycznymi %{e} dni, każdy obieg autobusem elektrycznym."
  ru: "Большой объём (%{h} часов по расписанию в неделю): с дизельными автобусами контракт длится %{d} дней, с электробусами %{e} дней, каждый выход на электробусе."
  uk: "Великий обсяг (%{h} годин за розкладом на тиждень): з дизельними автобусами контракт триває %{d} днів, з електробусами %{e} днів, кожен виїзд на електробусі."
"A contract bus a day may ask at most the tender's cap for it.":
  de: "Ein Vertragsbus am Tag darf höchstens die Obergrenze der Ausschreibung dafür verlangen."
  da: "En kontraktbus om dagen må højst koste udbuddets loft for den."
  fr: "Un bus du contrat par jour ne peut pas dépasser le plafond de l'appel d'offres pour lui."
  nl: "Een contractbus per dag mag hoogstens het plafond van de aanbesteding ervoor vragen."
  pl: "Autobus umowny dziennie może kosztować najwyżej limit przetargu dla niego."
  ru: "Автобус по контракту в день не может стоить больше потолка тендера для него."
  uk: "Автобус за контрактом на день не може коштувати більше стелі тендеру для нього."
