_version: 2
# (NexiconDK, 31 October 2026) Bus Company Online's tenders as sealed bids (company::sealed,
# company::shared_tenders, omsihub/company_more/concessions.rs): the bids opened at the close, the
# abnormally low ones rejected, the operators' lines and their giving up.
"Abnormally low: under 85 % of the authority's cost price a bid is rejected at the close.":
  de: "Ungewöhnlich niedrig: Ein Gebot unter 85 % des Kostenpreises der Behörde wird bei der Öffnung abgelehnt."
  da: "Unormalt lavt: under 85 % af trafikselskabets kostpris afvises et bud ved lukningen."
  fr: "Anormalement bas : une offre sous 85 % du prix de revient de l'autorité est rejetée à la clôture."
  nl: "Abnormaal laag: een bod onder 85 % van de kostprijs van de overheid wordt bij de opening afgewezen."
  pl: "Rażąco niska: oferta poniżej 85 % ceny kosztowej organizatora zostaje odrzucona przy otwarciu."
  ru: "Аномально низкая: заявка ниже 85 % себестоимости заказчика отклоняется при вскрытии."
  uk: "Аномально низька: пропозиція нижче 85 % собівартості замовника відхиляється під час розкриття."
"One of the map's operators runs this line on the contract it won: it goes out to tender again when that ends.":
  de: "Einer der Betreiber der Karte fährt diese Linie im gewonnenen Vertrag: Sie wird nach dessen Ende neu ausgeschrieben."
  da: "En af kortets operatører kører denne linje på den kontrakt, den vandt: den sendes i udbud igen, når den udløber."
  fr: "Un des exploitants de la carte exploite cette ligne selon le contrat qu'il a remporté : elle sera remise en appel d'offres à sa fin."
  nl: "Een van de vervoerders van de kaart rijdt deze lijn op het gewonnen contract: ze wordt opnieuw aanbesteed als dat afloopt."
  pl: "Jeden z przewoźników mapy obsługuje tę linię w ramach wygranej umowy: po jej zakończeniu trafi do nowego przetargu."
  ru: "Один из перевозчиков карты обслуживает эту линию по выигранному контракту: по его окончании она снова будет выставлена на торги."
  uk: "Один із перевізників мапи обслуговує цю лінію за виграним контрактом: після його закінчення вона знову піде на торги."
