"Your next bid is made with these buses: the contract's days are by them, and with electric buses its tours are run with electric ones.":
  de: "Dein nächstes Gebot wird mit diesen Bussen abgegeben: die Vertragstage richten sich nach ihnen, und mit Elektrobussen werden die Umläufe elektrisch gefahren."
  da: "Dit næste bud gives med disse busser: kontraktens dage afhænger af dem, og med elbusser køres vognløbene med elbusser."
  fr: "Votre prochaine offre se fait avec ces bus : les jours du contrat en dépendent, et avec des bus électriques ses services sont assurés en électrique."
  nl: "Je volgende bod wordt met deze bussen gedaan: de contractdagen hangen ervan af, en met elektrische bussen worden de omlopen elektrisch gereden."
  pl: "Twoja następna oferta jest składana z tymi autobusami: od nich zależą dni umowy, a z elektrycznymi kursy jeżdżą autobusy elektryczne."
  ru: "Ваша следующая ставка делается с этими автобусами: от них зависят дни контракта, а с электробусами рейсы выполняются электробусами."
  uk: "Ваша наступна ставка робиться з цими автобусами: від них залежать дні контракту, а з електробусами рейси виконують електробуси."
"Small work (%{h} timetable hours a week): the contract runs %{d} days with diesel buses, %{g} with CNG and %{e} with electric ones, every tour then run with an electric bus.":
  de: "Kleine Leistung (%{h} Fahrplanstunden je Woche): der Vertrag läuft %{d} Tage mit Dieselbussen, %{g} mit CNG und %{e} mit Elektrobussen, jeder Umlauf dann elektrisch."
  da: "Lille opgave (%{h} køreplantimer om ugen): kontrakten kører %{d} dage med dieselbusser, %{g} med CNG og %{e} med elbusser, hvor hvert vognløb så køres med elbus."
  fr: "Petit lot (%{h} heures d'horaire par semaine) : le contrat dure %{d} jours avec des bus diesel, %{g} au GNV et %{e} en électrique, chaque service alors en électrique."
  nl: "Klein werk (%{h} dienstregelingsuren per week): het contract loopt %{d} dagen met dieselbussen, %{g} met CNG en %{e} met elektrische, elke omloop dan elektrisch."
  pl: "Mała praca (%{h} godzin rozkładowych tygodniowo): umowa trwa %{d} dni z autobusami diesel, %{g} z CNG i %{e} z elektrycznymi, każdy kurs wtedy elektrycznie."
  ru: "Малый объём (%{h} часов по расписанию в неделю): контракт идёт %{d} дн. с дизельными автобусами, %{g} с КПГ и %{e} с электробусами, каждый рейс тогда на электробусе."
  uk: "Малий обсяг (%{h} годин за розкладом на тиждень): контракт триває %{d} дн. з дизельними автобусами, %{g} з КПГ і %{e} з електробусами, кожен рейс тоді на електробусі."
