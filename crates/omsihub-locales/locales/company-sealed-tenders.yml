  da: "Mellemstor opgave (%{h} køreplantimer om ugen): kontrakten kører %{d} dage med dieselbusser, %{g} med CNG og %{e} med elbusser, hvor hvert vognløb så køres med elbus."
  fr: "Lot moyen (%{h} heures d'horaire par semaine) : le contrat dure %{d} jours avec des bus diesel, %{g} au GNV et %{e} en électrique, chaque service alors en électrique."
