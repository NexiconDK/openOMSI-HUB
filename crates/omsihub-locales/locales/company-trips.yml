"Players may take them":
  de: "Spieler dürfen sie übernehmen"
  fr: "Les joueurs peuvent les prendre"
  nl: "Spelers mogen ze nemen"
  pl: "Gracze mogą je brać"
  ru: "Игроки могут их брать"
  uk: "Гравці можуть їх брати"
"Whole duties only":
  de: "Nur ganze Dienste"
  fr: "Services entiers uniquement"
  nl: "Alleen hele diensten"
  pl: "Tylko całe służby"
  ru: "Только целые смены"
  uk: "Лише цілі зміни"
"A player may take a single trip of a duty the company's AI driver has - by its line, its stop, or the next free one - and the AI drives the tour on after it. The duty stays its driver's: the plan, his pay and hours do not change. Duties planned for players come first.":
  de: "Ein Spieler darf eine einzelne Fahrt eines Dienstes übernehmen, den der KI-Fahrer des Unternehmens hat - nach Linie, Haltestelle oder die nächste freie - und die KI fährt den Umlauf danach weiter. Der Dienst bleibt der seines Fahrers: Plan, Lohn und Stunden ändern sich nicht. Für Spieler geplante Dienste gehen vor."
  fr: "Un joueur peut prendre un trajet seul d'un service du conducteur IA de la société - par sa ligne, son arrêt ou le prochain libre - et l'IA poursuit le service ensuite. Le service reste à son conducteur : le plan, sa paie et ses heures ne changent pas. Les services planifiés pour des joueurs passent en premier."
  nl: "Een speler mag een losse rit nemen van een dienst van de AI-chauffeur van het bedrijf - op lijn, halte of de volgende vrije - en de AI rijdt de omloop daarna verder. De dienst blijft van zijn chauffeur: het plan, zijn loon en uren veranderen niet. Diensten die voor spelers gepland zijn gaan voor."
  pl: "Gracz może wziąć pojedynczy kurs służby kierowcy SI firmy - według linii, przystanku lub następny wolny - a SI prowadzi brygadę dalej po nim. Służba pozostaje jej kierowcy: plan, jego płaca i godziny się nie zmieniają. Służby zaplanowane dla graczy mają pierwszeństwo."
  ru: "Игрок может взять отдельный рейс смены водителя-ИИ компании - по маршруту, остановке или ближайший свободный, - и ИИ ведёт выход дальше после него. Смена остаётся за её водителем: план, его оплата и часы не меняются. Смены, запланированные для игроков, идут первыми."
  uk: "Гравець може взяти окремий рейс зміни водія-ШІ компанії - за маршрутом, зупинкою або найближчий вільний, - і ШІ веде вихід далі після нього. Зміна лишається за її водієм: план, його оплата й години не змінюються. Зміни, заплановані для гравців, ідуть першими."
"Players take whole duties only: a duty planned for them, an open one, or one of the AI drivers' to take over.":
  de: "Spieler übernehmen nur ganze Dienste: einen für sie geplanten, einen offenen oder einen der KI-Fahrer zum Übernehmen."
  fr: "Les joueurs ne prennent que des services entiers : un service planifié pour eux, un ouvert, ou l'un de ceux des conducteurs IA à reprendre."
  nl: "Spelers nemen alleen hele diensten: een dienst voor hen gepland, een open dienst, of een van de AI-chauffeurs om over te nemen."
  pl: "Gracze biorą tylko całe służby: zaplanowaną dla nich, otwartą albo jedną z służb kierowców SI do przejęcia."
  ru: "Игроки берут только целые смены: запланированную для них, открытую или одну из смен водителей-ИИ, чтобы её перенять."
  uk: "Гравці беруть лише цілі зміни: заплановану для них, відкриту або одну зі змін водіїв-ШІ, щоб її перейняти."
"From now on players may take single trips.":
  de: "Ab jetzt dürfen Spieler einzelne Fahrten übernehmen."
  fr: "Désormais, les joueurs peuvent prendre des trajets seuls."
  nl: "Vanaf nu mogen spelers losse ritten nemen."
  pl: "Od teraz gracze mogą brać pojedyncze kursy."
  ru: "Теперь игроки могут брать отдельные рейсы."
  uk: "Відтепер гравці можуть брати окремі рейси."
"From now on players take whole duties only.":
  de: "Ab jetzt übernehmen Spieler nur ganze Dienste."
  fr: "Désormais, les joueurs ne prennent que des services entiers."
  nl: "Vanaf nu nemen spelers alleen hele diensten."
  pl: "Od teraz gracze biorą tylko całe służby."
  ru: "Теперь игроки берут только целые смены."
  uk: "Відтепер гравці беруть лише цілі зміни."
"Asked for: waiting for a yes.":
  de: "Angefragt: wartet auf ein Ja."
  fr: "Demandé : en attente d'un oui."
  nl: "Gevraagd: wacht op een ja."
  pl: "Poproszono: czeka na zgodę."
  ru: "Запрошено: ждём согласия."
  uk: "Запитано: чекаємо на згоду."
"The trip is yours: Drive starts your game at its stop, where the AI hands you the bus.":
  de: "Die Fahrt gehört dir: Fahren startet dein Spiel an ihrer Haltestelle, wo die KI dir den Bus übergibt."
  fr: "Le trajet est à toi : Conduire lance ton jeu à son arrêt, où l'IA te remet le bus."
  nl: "De rit is van jou: Rijden start je spel bij de halte, waar de AI je de bus overdraagt."
  pl: "Kurs jest twój: Jedź uruchamia grę na jego przystanku, gdzie SI przekaże ci autobus."
  ru: "Рейс твой: «Ехать» запустит игру на его остановке, где ИИ передаст тебе автобус."
  uk: "Рейс твій: «Їхати» запустить гру на його зупинці, де ШІ передасть тобі автобус."
"Drive one trip of a duty the AI drives: you take its bus over at the stop, and the AI drives the tour on after it. At its end you may drive its next trip as well (game menu › Drive on with the next trip).":
  de: "Fahre eine Fahrt eines Dienstes, den die KI fährt: du übernimmst den Bus an der Haltestelle, und die KI fährt den Umlauf danach weiter. An ihrem Ende kannst du auch die nächste Fahrt fahren (Spielmenü › Mit der nächsten Fahrt weiterfahren)."
  fr: "Conduis un trajet d'un service que l'IA conduit : tu reprends son bus à l'arrêt, et l'IA poursuit le service ensuite. À sa fin, tu peux aussi conduire le trajet suivant (menu du jeu › Continuer avec le trajet suivant)."
  nl: "Rijd één rit van een dienst die de AI rijdt: je neemt de bus over bij de halte, en de AI rijdt de omloop daarna verder. Aan het eind mag je ook de volgende rit rijden (spelmenu › Doorrijden met de volgende rit)."
  pl: "Poprowadź jeden kurs służby, którą prowadzi SI: przejmujesz autobus na przystanku, a SI prowadzi brygadę dalej po nim. Na jego końcu możesz poprowadzić też następny kurs (menu gry › Jedź dalej następnym kursem)."
  ru: "Проведи один рейс смены, которую ведёт ИИ: ты перенимаешь автобус на остановке, а ИИ ведёт выход дальше после него. В конце можешь провести и следующий рейс (меню игры › Ехать дальше следующим рейсом)."
  uk: "Проведи один рейс зміни, яку веде ШІ: ти переймаєш автобус на зупинці, а ШІ веде вихід далі після нього. Наприкінці можеш провести й наступний рейс (меню гри › Їхати далі наступним рейсом)."
