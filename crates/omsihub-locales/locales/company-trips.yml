_version: 2
# NexiconDK, Bus Company Online: single trips (27 October 2026) - a player takes one trip of a duty
# the company's AI driver has, found by its line or stop or the next free one; the AI drives the
# tour on after it (crates/omsi-launcher-core/src/company/together/book.rs, host.rs; the launcher's
# together/join.rs, company/dialogs.rs, company_more/fleetmap.rs).
"The company does not let its players take single trips.":
  de: "Das Unternehmen lässt seine Spieler keine einzelnen Fahrten übernehmen."
  fr: "La société ne laisse pas ses joueurs prendre des trajets seuls."
  nl: "Het bedrijf laat zijn spelers geen losse ritten nemen."
  pl: "Firma nie pozwala swoim graczom brać pojedynczych kursów."
  ru: "Компания не разрешает своим игрокам брать отдельные рейсы."
  uk: "Компанія не дозволяє своїм гравцям брати окремі рейси."
"This trip cannot be taken on its own.":
  de: "Diese Fahrt kann nicht einzeln übernommen werden."
  fr: "Ce trajet ne peut pas être pris seul."
  nl: "Deze rit kan niet los genomen worden."
  pl: "Tego kursu nie można wziąć osobno."
  ru: "Этот рейс нельзя взять отдельно."
  uk: "Цей рейс не можна взяти окремо."
"This trip leaves too soon: take a later one.":
  de: "Diese Fahrt fährt zu bald ab: nimm eine spätere."
  fr: "Ce trajet part trop tôt : prends-en un plus tard."
  nl: "Deze rit vertrekt te snel: neem een latere."
  pl: "Ten kurs odjeżdża zbyt szybko: weź późniejszy."
  ru: "Этот рейс отправляется слишком скоро: возьми более поздний."
  uk: "Цей рейс вирушає надто скоро: візьми пізніший."
"No free trip right now: try another line or stop, or a little later.":
  de: "Gerade keine freie Fahrt: versuch eine andere Linie oder Haltestelle, oder etwas später."
  fr: "Aucun trajet libre pour l'instant : essaie une autre ligne ou un autre arrêt, ou un peu plus tard."
  nl: "Nu geen vrije rit: probeer een andere lijn of halte, of iets later."
  pl: "Teraz brak wolnego kursu: spróbuj innej linii lub przystanku, albo trochę później."
  ru: "Сейчас свободных рейсов нет: попробуй другой маршрут или остановку, или чуть позже."
  uk: "Зараз вільних рейсів немає: спробуй інший маршрут чи зупинку, або трохи пізніше."
"%{name} takes the %{time} trip of line %{n} (tour %{tour}) from %{stop}.":
  de: "%{name} übernimmt die Fahrt um %{time} der Linie %{n} (Umlauf %{tour}) ab %{stop}."
  fr: "%{name} prend le trajet de %{time} de la ligne %{n} (service %{tour}) depuis %{stop}."
  nl: "%{name} neemt de rit van %{time} van lijn %{n} (omloop %{tour}) vanaf %{stop}."
  pl: "%{name} bierze kurs o %{time} linii %{n} (brygada %{tour}) z przystanku %{stop}."
  ru: "%{name} берёт рейс в %{time} маршрута %{n} (выход %{tour}) от остановки %{stop}."
  uk: "%{name} бере рейс о %{time} маршруту %{n} (вихід %{tour}) від зупинки %{stop}."
"%{name} asks for the %{time} trip of line %{n} (tour %{tour}).":
  de: "%{name} fragt nach der Fahrt um %{time} der Linie %{n} (Umlauf %{tour})."
  fr: "%{name} demande le trajet de %{time} de la ligne %{n} (service %{tour})."
  nl: "%{name} vraagt om de rit van %{time} van lijn %{n} (omloop %{tour})."
  pl: "%{name} prosi o kurs o %{time} linii %{n} (brygada %{tour})."
  ru: "%{name} просит рейс в %{time} маршрута %{n} (выход %{tour})."
  uk: "%{name} просить рейс о %{time} маршруту %{n} (вихід %{tour})."
"%{name} drives the %{time} trip of line %{n} (tour %{tour}).":
  de: "%{name} fährt die Fahrt um %{time} der Linie %{n} (Umlauf %{tour})."
  fr: "%{name} conduit le trajet de %{time} de la ligne %{n} (service %{tour})."
  nl: "%{name} rijdt de rit van %{time} van lijn %{n} (omloop %{tour})."
  pl: "%{name} prowadzi kurs o %{time} linii %{n} (brygada %{tour})."
  ru: "%{name} ведёт рейс в %{time} маршрута %{n} (выход %{tour})."
  uk: "%{name} веде рейс о %{time} маршруту %{n} (вихід %{tour})."
"%{name} gave the %{time} trip of line %{n} (tour %{tour}) back: the AI drives it.":
  de: "%{name} hat die Fahrt um %{time} der Linie %{n} (Umlauf %{tour}) zurückgegeben: die KI fährt sie."
  fr: "%{name} a rendu le trajet de %{time} de la ligne %{n} (service %{tour}) : l'IA le conduit."
  nl: "%{name} gaf de rit van %{time} van lijn %{n} (omloop %{tour}) terug: de AI rijdt hem."
  pl: "%{name} oddał kurs o %{time} linii %{n} (brygada %{tour}): prowadzi go SI."
  ru: "%{name} вернул рейс в %{time} маршрута %{n} (выход %{tour}): его ведёт ИИ."
  uk: "%{name} повернув рейс о %{time} маршруту %{n} (вихід %{tour}): його веде ШІ."
