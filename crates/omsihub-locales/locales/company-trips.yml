"Takes the first free trip your choice finds and starts your game on it.":
  de: "Übernimmt die erste freie Fahrt, die deine Auswahl findet, und startet dein Spiel darauf."
  fr: "Prend le premier trajet libre que ton choix trouve et lance ton jeu dessus."
  nl: "Neemt de eerste vrije rit die je keuze vindt en start je spel erop."
  pl: "Bierze pierwszy wolny kurs, który znajdzie twój wybór, i uruchamia na nim grę."
  ru: "Берёт первый свободный рейс по твоему выбору и запускает на нём игру."
  uk: "Бере перший вільний рейс за твоїм вибором і запускає на ньому гру."
