"A week for each reserve driver, five days in a frame: the named frames forward week by week - RAM1, RAM2, RAM3, RAM4 - two days off together":
  de: "Eine Woche pro Reservefahrer, fünf Tage in einem Rahmen: die benannten Rahmen Woche für Woche vorwärts - RAM1, RAM2, RAM3, RAM4 - zwei freie Tage zusammen"
  da: "En uge til hver reservechauffør, fem dage i en ramme: de navngivne rammer fremad uge for uge - RAM1, RAM2, RAM3, RAM4 - to fridage i træk"
  fr: "Une semaine par conducteur de réserve, cinq jours dans un cadre : les cadres nommés en avançant semaine après semaine - RAM1, RAM2, RAM3, RAM4 - deux jours de repos ensemble"
  nl: "Een week per reservechauffeur, vijf dagen in een kader: de benoemde kaders week na week vooruit - RAM1, RAM2, RAM3, RAM4 - twee vrije dagen samen"
  pl: "Tydzień na każdego kierowcę rezerwowego, pięć dni w ramce: nazwane ramki do przodu tydzień po tygodniu - RAM1, RAM2, RAM3, RAM4 - dwa dni wolne razem"
  ru: "Неделя на каждого резервного водителя, пять дней в рамке: именованные рамки вперёд неделя за неделей - RAM1, RAM2, RAM3, RAM4 - два выходных подряд"
  uk: "Тиждень на кожного резервного водія, п'ять днів у рамці: іменовані рамки вперед тиждень за тижнем - RAM1, RAM2, RAM3, RAM4 - два вихідні поспіль"
"The week's duties no other rota has by turns: two weeks of early duties, then middle, late and night, two days off after the nights":
  de: "Die Dienste der Woche, die kein anderer Turnus hat, im Wechsel: zwei Wochen Frühdienste, dann Mittel, Spät und Nacht, zwei freie Tage nach den Nächten"
  da: "Ugens vagter, som ingen anden turnus har, på skift: to uger med tidlige vagter, så mellem, sene og nat, to fridage efter nætterne"
  fr: "Les services de la semaine qu'aucun autre roulement n'a, à tour de rôle : deux semaines de services tôt, puis milieu, tard et nuit, deux jours de repos après les nuits"
  nl: "De diensten van de week die geen ander rooster heeft, om de beurt: twee weken vroege diensten, dan midden, laat en nacht, twee vrije dagen na de nachten"
  pl: "Służby tygodnia, których nie ma inny grafik, na zmianę: dwa tygodnie wczesnych, potem środkowe, późne i nocne, dwa dni wolne po nocach"
  ru: "Смены недели, которых нет в другом графике, по очереди: две недели ранних, затем средние, поздние и ночные, два выходных после ночей"
  uk: "Зміни тижня, яких немає в іншому графіку, по черзі: два тижні ранніх, потім середні, пізні та нічні, два вихідні після ночей"
