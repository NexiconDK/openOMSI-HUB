"Line %{n}: its running times and its timetable grid will be planned here.":
  de: "Linie %{n}: ihre Fahrzeiten und ihr Fahrplanraster werden hier geplant."
  da: "Linje %{n}: dens køretider og dens køreplansgitter planlægges her."
  fr: "Ligne %{n} : ses temps de parcours et sa grille horaire seront planifiés ici."
  nl: "Lijn %{n}: haar rijtijden en dienstregelingsrooster worden hier gepland."
  pl: "Linia %{n}: jej czasy przejazdu i siatka rozkładu będą planowane tutaj."
  ru: "Маршрут %{n}: его время в пути и сетка расписания будут планироваться здесь."
  uk: "Маршрут %{n}: його час у дорозі та сітка розкладу плануватимуться тут."
"The lines' running times and their timetable grid will be planned here.":
  de: "Fahrzeiten und Fahrplanraster der Linien werden hier geplant."
  da: "Linjernes køretider og deres køreplansgitter planlægges her."
  fr: "Les temps de parcours et la grille horaire des lignes seront planifiés ici."
  nl: "De rijtijden en het dienstregelingsrooster van de lijnen worden hier gepland."
  pl: "Czasy przejazdu i siatka rozkładu linii będą planowane tutaj."
  ru: "Время в пути и сетка расписания маршрутов будут планироваться здесь."
  uk: "Час у дорозі та сітка розкладу маршрутів плануватимуться тут."
"Optimised proposal: the KPIs show it against your planning. Locked vehicles and duties are kept.":
  de: "Optimierter Vorschlag: die Kennzahlen zeigen ihn gegen deine Planung. Gesperrte Fahrzeuge und Dienste bleiben."
  da: "Optimeret forslag: KPI'erne viser det mod din planlægning. Låste køretøjer og vagter bevares."
  fr: "Proposition optimisée : les indicateurs la comparent à ta planification. Les véhicules et services verrouillés sont gardés."
  nl: "Geoptimaliseerd voorstel: de kerncijfers zetten het af tegen je planning. Vergrendelde voertuigen en diensten blijven."
  pl: "Propozycja zoptymalizowana: wskaźniki porównują ją z Twoim planem. Zablokowane pojazdy i służby zostają."
  ru: "Оптимизированное предложение: показатели сравнивают его с вашим планом. Заблокированные машины и смены сохраняются."
  uk: "Оптимізована пропозиція: показники порівнюють її з вашим планом. Заблоковані машини й зміни зберігаються."
