  nl: "Vervuld: de wens van %{name} is genoteerd."
  pl: "Spełnione: życzenie – %{name} – zapisane."
  ru: "Выполнено: пожелание %{name} записано."
  uk: "Виконано: побажання %{name} записано."
"Refused: %{name} is less content.":
