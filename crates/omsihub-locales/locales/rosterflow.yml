"A reserve in a frame takes the open duties in it. A day in a named frame pays the hours driven, at least 7,4 h.":
  de: "Eine Reserve im Rahmen übernimmt die offenen Dienste darin. Ein Tag in einem benannten Rahmen zahlt die gefahrenen Stunden, mindestens 7,4 Std."
  da: "En reserve i en ramme tager de åbne vagter i den. En dag i en navngiven ramme betaler de kørte timer, mindst 7,4 t."
  fr: "Une réserve dans un cadre prend les services ouverts qui s'y trouvent. Un jour dans un cadre nommé paie les heures conduites, au moins 7,4 h."
  nl: "Een reserve in een kader neemt de open diensten erin. Een dag in een benoemd kader betaalt de gereden uren, minstens 7,4 u."
  pl: "Rezerwa w ramce bierze otwarte służby w niej. Dzień w nazwanej ramce płaci przejechane godziny, co najmniej 7,4 h."
  ru: "Резерв в рамке берёт открытые смены в ней. День в именованной рамке оплачивает отработанные часы, не меньше 7,4 ч."
  uk: "Резерв у рамці бере відкриті зміни в ній. День в іменованій рамці оплачує відпрацьовані години, щонайменше 7,4 год."
"A mixed team: two weeks of early duties, then middle, late and night - forward, so the rest holds - with two days off after the nights. The numbers by the week count its kinds of duty.":
  de: "Ein gemischtes Team: zwei Wochen Frühdienste, dann Mittel, Spät und Nacht - vorwärts, damit die Ruhe hält - mit zwei freien Tagen nach den Nächten. Die Zahlen bei der Woche zählen ihre Dienstarten."
  da: "Et blandet hold: to uger med tidlige vagter, så mellem, sene og nat - fremad, så hvilet holder - med to fridage efter nætterne. Tallene ved ugen tæller dens slags vagter."
  fr: "Une équipe mixte : deux semaines de services tôt, puis milieu, tard et nuit - en avançant, pour que le repos tienne - avec deux jours de repos après les nuits. Les chiffres près de la semaine comptent ses types de service."
  nl: "Een gemengd team: twee weken vroege diensten, dan midden, laat en nacht - vooruit, zodat de rust klopt - met twee vrije dagen na de nachten. De getallen bij de week tellen haar soorten diensten."
  pl: "Zespół mieszany: dwa tygodnie wczesnych służb, potem środkowe, późne i nocne - do przodu, by odpoczynek się zgadzał - z dwoma dniami wolnymi po nocach. Liczby przy tygodniu liczą jego rodzaje służb."
  ru: "Смешанная бригада: две недели ранних смен, затем средние, поздние и ночные - вперёд, чтобы отдых соблюдался - с двумя выходными после ночей. Числа у недели считают её виды смен."
  uk: "Змішана бригада: два тижні ранніх змін, потім середні, пізні та нічні - уперед, щоб відпочинок дотримувався - з двома вихідними після ночей. Числа біля тижня рахують її види змін."
"The named frames take turns week by week: RAM1, RAM2, RAM3, RAM4. A frame is a window, not work: a day in it pays the hours driven, at least 7,4 h.":
  de: "Die benannten Rahmen wechseln Woche für Woche: RAM1, RAM2, RAM3, RAM4. Ein Rahmen ist ein Zeitfenster, keine Arbeit: ein Tag darin zahlt die gefahrenen Stunden, mindestens 7,4 Std."
  da: "De navngivne rammer skifter uge for uge: RAM1, RAM2, RAM3, RAM4. En ramme er et tidsrum, ikke arbejde: en dag i den betaler de kørte timer, mindst 7,4 t."
  fr: "Les cadres nommés alternent semaine après semaine : RAM1, RAM2, RAM3, RAM4. Un cadre est une plage, pas du travail : un jour dedans paie les heures conduites, au moins 7,4 h."
  nl: "De benoemde kaders wisselen week na week: RAM1, RAM2, RAM3, RAM4. Een kader is een tijdvak, geen werk: een dag erin betaalt de gereden uren, minstens 7,4 u."
  pl: "Nazwane ramki zmieniają się tydzień po tygodniu: RAM1, RAM2, RAM3, RAM4. Ramka to okno czasu, nie praca: dzień w niej płaci przejechane godziny, co najmniej 7,4 h."
  ru: "Именованные рамки сменяются неделя за неделей: RAM1, RAM2, RAM3, RAM4. Рамка — это окно, не работа: день в ней оплачивает отработанные часы, не меньше 7,4 ч."
  uk: "Іменовані рамки змінюються тиждень за тижнем: RAM1, RAM2, RAM3, RAM4. Рамка — це вікно, не робота: день у ній оплачує відпрацьовані години, щонайменше 7,4 год."
"A named frame: the first to cover an open duty in it; the day pays the hours driven, at least 7,4 h":
  de: "Ein benannter Rahmen: als Erster für einen offenen Dienst darin; der Tag zahlt die gefahrenen Stunden, mindestens 7,4 Std."
  da: "En navngiven ramme: den første til at dække en åben vagt i den; dagen betaler de kørte timer, mindst 7,4 t"
  fr: "Un cadre nommé : le premier à couvrir un service ouvert qui s'y trouve ; le jour paie les heures conduites, au moins 7,4 h"
  nl: "Een benoemd kader: de eerste voor een open dienst erin; de dag betaalt de gereden uren, minstens 7,4 u"
  pl: "Nazwana ramka: pierwsza do obsadzenia otwartej służby w niej; dzień płaci przejechane godziny, co najmniej 7,4 h"
  ru: "Именованная рамка: первая закрывает открытую смену в ней; день оплачивает отработанные часы, не меньше 7,4 ч"
  uk: "Іменована рамка: перша закриває відкриту зміну в ній; день оплачує відпрацьовані години, щонайменше 7,4 год"
