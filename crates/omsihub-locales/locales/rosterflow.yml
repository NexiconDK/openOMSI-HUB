  nl: "Hij staat tot %{date} in de werkplaats. De omlopen hebben nu geen bus: geef elk een andere bij de businzet."
  pl: "Jest w warsztacie do %{date}. Jego kursy nie mają teraz autobusu: daj każdemu inny w dyspozycji autobusów."
  ru: "Он в мастерской до %{date}. У его выпусков теперь нет автобуса: дайте каждому другой в распределении."
