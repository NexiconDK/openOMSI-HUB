"No weeks yet: \"Make the rota automatically\" makes them, or add a week and fill its days.":
  de: "Noch keine Wochen: \"Turnus automatisch erstellen\" erstellt sie, oder fügen Sie eine Woche hinzu und füllen Sie ihre Tage."
  da: "Ingen uger endnu: \"Lav turnus automatisk\" laver dem, eller tilføj en uge og udfyld dagene."
  fr: "Pas encore de semaines : « Faire le roulement automatiquement » les crée, ou ajoutez une semaine et remplissez ses jours."
  nl: "Nog geen weken: \"Rooster automatisch maken\" maakt ze, of voeg een week toe en vul de dagen."
  pl: "Jeszcze nie ma tygodni: \"Utwórz grafik automatycznie\" je utworzy, albo dodaj tydzień i wypełnij dni."
  ru: "Недель пока нет: «Составить график автоматически» создаст их, или добавьте неделю и заполните дни."
  uk: "Тижнів поки немає: «Скласти графік автоматично» створить їх, або додайте тиждень і заповніть дні."
