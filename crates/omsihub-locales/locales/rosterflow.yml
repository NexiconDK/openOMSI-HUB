"Saved: the roster, the day and the game run this planning now.":
  de: "Gespeichert: Dienstplan, Tag und Spiel fahren jetzt diese Planung."
  da: "Gemt: vagtplanen, dagen og spillet kører nu denne planlægning."
  fr: "Enregistré : le roulement, la journée et le jeu suivent maintenant cette planification."
  nl: "Opgeslagen: het rooster, de dag en het spel rijden nu deze planning."
  pl: "Zapisano: grafik, dzień i gra działają teraz według tego planu."
  ru: "Сохранено: график, день и игра теперь работают по этому плану."
  uk: "Збережено: графік, день і гра тепер працюють за цим планом."
"Discarded: back to the saved planning.":
  de: "Verworfen: zurück zur gespeicherten Planung."
  da: "Kasseret: tilbage til den gemte planlægning."
  fr: "Abandonné : retour à la planification enregistrée."
  nl: "Verworpen: terug naar de opgeslagen planning."
  pl: "Odrzucono: powrót do zapisanego planu."
  ru: "Отменено: возврат к сохранённому плану."
  uk: "Скасовано: повернення до збереженого плану."
"Preferences: the rules the duties are checked against and Optimise works to":
  de: "Einstellungen: die Regeln, nach denen die Dienste geprüft werden und Optimieren arbeitet"
  da: "Indstillinger: de regler, vagterne kontrolleres mod, og som Optimér arbejder efter"
  fr: "Préférences : les règles auxquelles les services sont confrontés et que l'optimisation suit"
  nl: "Voorkeuren: de regels waaraan de diensten worden getoetst en waarnaar Optimaliseren werkt"
  pl: "Preferencje: zasady, według których sprawdzane są służby i działa optymalizacja"
  ru: "Предпочтения: правила, по которым проверяются смены и работает оптимизация"
  uk: "Вподобання: правила, за якими перевіряються зміни й працює оптимізація"
