"Seven tabs, used in this order. Hiring and employment are on the Staff page.":
  de: "Sieben Reiter, in dieser Reihenfolge benutzt. Einstellen und Anstellung stehen auf der Seite Personal."
  da: "Syv faner, brugt i denne rækkefølge. Ansættelse og ansættelsesforhold findes på siden Personale."
  fr: "Sept onglets, utilisés dans cet ordre. L'embauche et les contrats sont sur la page Personnel."
  nl: "Zeven tabbladen, in deze volgorde gebruikt. Aannemen en dienstverband staan op de pagina Personeel."
  pl: "Siedem kart, używanych w tej kolejności. Zatrudnianie i warunki pracy są na stronie Personel."
  ru: "Семь вкладок, по порядку. Наём и условия работы — на странице «Персонал»."
  uk: "Сім вкладок, по черзі. Наймання й умови роботи — на сторінці «Персонал»."
"How RosterFlow Pro works: its seven tabs in order":
  de: "So funktioniert RosterFlow Pro: seine sieben Reiter der Reihe nach"
  da: "Sådan virker RosterFlow Pro: de syv faner i rækkefølge"
  fr: "Comment fonctionne RosterFlow Pro : ses sept onglets dans l'ordre"
  nl: "Zo werkt RosterFlow Pro: de zeven tabbladen op volgorde"
  pl: "Jak działa RosterFlow Pro: siedem kart po kolei"
  ru: "Как работает RosterFlow Pro: семь вкладок по порядку"
  uk: "Як працює RosterFlow Pro: сім вкладок по черзі"
"Which bus runs which block: every bus a row of its blocks of the day, those without a bus in red on top. Click a block to choose a bus that can take it, or let \"Assign buses automatically\" do it.":
  de: "Welcher Bus welchen Umlauf fährt: jeder Bus eine Zeile mit seinen Umläufen des Tages, die ohne Bus rot oben. Klicke auf einen Umlauf, um einen Bus zu wählen, der ihn übernehmen kann, oder lass „Automatisch verteilen“ es tun."
  da: "Hvilken bus der kører hvilket vognløb: hver bus en række med dagens vognløb, dem uden bus i rødt øverst. Klik på et vognløb for at vælge en bus, der kan tage det, eller lad \"Fordel automatisk\" gøre det."
  fr: "Quel bus fait quel service : chaque bus une ligne de ses services du jour, ceux sans bus en rouge en haut. Cliquez sur un service pour choisir un bus qui peut le prendre, ou laissez « Attribuer automatiquement » le faire."
  nl: "Welke bus welke omloop rijdt: elke bus een rij met zijn omlopen van de dag, die zonder bus rood bovenaan. Klik op een omloop om een bus te kiezen die hem kan nemen, of laat \"Automatisch verdelen\" het doen."
  pl: "Który autobus jedzie który kurs: każdy autobus to wiersz z kursami dnia, te bez autobusu na czerwono u góry. Kliknij kurs, aby wybrać autobus, który może go przejąć, albo użyj „Przydziel automatycznie”."
  ru: "Какой автобус идёт на какой выпуск: каждый автобус — строка с его выпусками за день, без автобуса — красным сверху. Нажмите на выпуск, чтобы выбрать автобус, или «Распределить автоматически»."
  uk: "Який автобус іде на який випуск: кожен автобус — рядок із його випусками за день, без автобуса — червоним угорі. Натисніть на випуск, щоб обрати автобус, або «Розподілити автоматично»."

