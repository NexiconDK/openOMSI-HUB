"Split duties only Monday to Friday, and never with night-bus work. A night-bus driver drives one long night duty. The duties are numbered in the order they sign on.":
  de: "Geteilte Dienste nur montags bis freitags und nie mit Nachtbusfahrten. Wer Nachtbus fährt, fährt einen langen Nachtdienst. Die Dienste werden in der Reihenfolge des Dienstbeginns nummeriert."
  da: "Delte vagter kun mandag til fredag og aldrig med natbus. En natbuschauffør kører én lang natvagt. Vagterne nummereres i rækkefølge efter mødetid."
  fr: "Services fractionnés du lundi au vendredi seulement, et jamais avec un bus de nuit. Qui conduit le bus de nuit fait un long service de nuit. Les services sont numérotés dans l'ordre de leur prise de service."
  nl: "Gebroken diensten alleen maandag tot vrijdag en nooit met nachtbuswerk. Wie nachtbus rijdt, rijdt één lange nachtdienst. De diensten worden genummerd in de volgorde waarin ze beginnen."
  pl: "Służby dzielone tylko od poniedziałku do piątku i nigdy z autobusem nocnym. Kto jeździ autobusem nocnym, ma jedną długą służbę nocną. Służby są numerowane według godziny rozpoczęcia."
  ru: "Разрывные смены только с понедельника по пятницу и никогда с ночным автобусом. Кто водит ночной автобус, работает одну длинную ночную смену. Смены нумеруются по времени начала."
  uk: "Розривні зміни лише з понеділка по п'ятницю і ніколи з нічним автобусом. Хто водить нічний автобус, працює одну довгу нічну зміну. Зміни нумеруються за часом початку."
