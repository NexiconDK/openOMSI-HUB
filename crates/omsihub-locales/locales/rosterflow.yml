  fr: "La semaine dernière : salaires %{amount} (dont heures supplémentaires %{over}), jours de maladie : %{sick}, services non pourvus : %{uncovered}. Le rapport montre aussi les souhaits, les échanges, les plaintes, la plus grande fatigue et la satisfaction la plus basse."
  nl: "Vorige week: lonen %{amount} (waarvan overuren %{over}), ziektedagen: %{sick}, diensten zonder chauffeur: %{uncovered}. Het rapport toont ook de wensen, de ruilen, de klachten, en wie het meest moe en het minst tevreden is."
