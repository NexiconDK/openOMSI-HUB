"Click for a spare duty of custom work, or drop trips here to begin a duty with them":
  en: "Click for a spare duty of custom work, or drop trips here to begin a duty with them"
  de: "Klicken für einen Reservedienst mit eigener Arbeit, oder Fahrten hier ablegen, um damit einen Dienst zu beginnen"
  da: "Klik for en reservevagt med specialarbejde, eller slip ture her for at begynde en vagt med dem"
  fr: "Cliquer pour un service de réserve avec un travail libre, ou déposer ici des courses pour commencer un service avec elles"
  nl: "Klik voor een reservedienst met eigen werk, of laat hier ritten los om er een dienst mee te beginnen"
  pl: "Kliknij, aby dodać służbę rezerwową z własną pracą, lub upuść tu kursy, aby zacząć od nich służbę"
  ru: "Нажмите для резервной смены с особой работой или отпустите здесь рейсы, чтобы начать с ними смену"
  uk: "Натисніть для резервної зміни з особливою роботою або відпустіть тут рейси, щоб почати з ними зміну"
"Drag or double-click to move this trip to another duty or a new one: the bus stays the same. Shift or Ctrl and a click choose more trips. Alt and a drag takes the whole piece of work on this bus.":
  en: "Drag or double-click to move this trip to another duty or a new one: the bus stays the same. Shift or Ctrl and a click choose more trips. Alt and a drag takes the whole piece of work on this bus."
  de: "Ziehen oder doppelklicken, um diese Fahrt in einen anderen oder einen neuen Dienst zu verschieben: der Bus bleibt derselbe. Umschalt oder Strg und ein Klick wählen weitere Fahrten. Alt und Ziehen nimmt das ganze Dienststück auf diesem Bus."
  da: "Træk eller dobbeltklik for at flytte denne tur til en anden vagt eller en ny: bussen forbliver den samme. Shift eller Ctrl og et klik vælger flere ture. Alt og et træk tager hele arbejdsdelen på denne bus."
  fr: "Faites glisser ou double-cliquez pour déplacer cette course vers un autre service ou un nouveau : le bus reste le même. Maj ou Ctrl et un clic choisissent d'autres courses. Alt et un glisser prennent toute la partie de travail sur ce bus."
  nl: "Sleep of dubbelklik om deze rit naar een andere of een nieuwe dienst te verplaatsen: de bus blijft dezelfde. Shift of Ctrl en een klik kiezen meer ritten. Alt en slepen neemt het hele dienststuk op deze bus mee."
  pl: "Przeciągnij lub kliknij dwukrotnie, aby przenieść ten kurs do innej lub nowej służby: autobus zostaje ten sam. Shift lub Ctrl i kliknięcie wybierają więcej kursów. Alt i przeciągnięcie bierze całą część pracy na tym autobusie."
  ru: "Перетащите или щёлкните дважды, чтобы перенести этот рейс в другую или новую смену: автобус остаётся тем же. Shift или Ctrl и щелчок выбирают ещё рейсы. Alt и перетаскивание берут всю часть работы на этом автобусе."
  uk: "Перетягніть або клацніть двічі, щоб перенести цей рейс до іншої або нової зміни: автобус залишається тим самим. Shift або Ctrl і клік вибирають ще рейси. Alt і перетягування беруть усю частину роботи на цьому автобусі."
"A driver takes over here, at %{stop}. Click to join the two duties.":
  de: "Hier übernimmt ein Fahrer, an %{stop}. Klicken, um die beiden Dienste zu verbinden."
  da: "En chauffør overtager her, ved %{stop}. Klik for at sætte de to vagter sammen."
  fr: "Un conducteur prend la relève ici, à %{stop}. Cliquer pour joindre les deux services."
  nl: "Hier neemt een chauffeur het over, bij %{stop}. Klik om de twee diensten samen te voegen."
  pl: "Tu kierowca przejmuje, na %{stop}. Kliknij, aby połączyć obie służby."
  ru: "Здесь водитель сменяется, на %{stop}. Нажмите, чтобы объединить две смены."
  uk: "Тут водій змінюється, на %{stop}. Натисніть, щоб об'єднати дві зміни."
