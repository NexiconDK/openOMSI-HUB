"a cycle of %{n} weeks":
  de: "ein Zyklus von %{n} Wochen"
  da: "%{n} uger"
  fr: "un cycle de %{n} semaines"
  nl: "een cyclus van %{n} weken"
  pl: "cykl %{n} tygodni"
  ru: "цикл из %{n} нед."
  uk: "цикл із %{n} тиж."
"A rota is several weeks in a row. Every week each driver moves a week down, and after the last week he begins again at week 1.":
  de: "Ein Turnus sind mehrere Wochen hintereinander. Jede Woche rückt jeder Fahrer eine Woche nach unten, und nach der letzten Woche beginnt er wieder bei Woche 1."
  da: "En turnus er flere uger i træk. Hver uge rykker chaufføren en uge ned, og efter sidste uge starter han forfra på uge 1."
  fr: "Un roulement, ce sont plusieurs semaines de suite. Chaque semaine, chaque conducteur descend d'une semaine, et après la dernière il recommence à la semaine 1."
  nl: "Een rooster is een aantal weken achter elkaar. Elke week schuift elke chauffeur een week op, en na de laatste week begint hij weer bij week 1."
  pl: "Grafik to kilka tygodni z rzędu. Co tydzień każdy kierowca przesuwa się o tydzień w dół, a po ostatnim zaczyna znów od tygodnia 1."
  ru: "График - это несколько недель подряд. Каждую неделю каждый водитель сдвигается на неделю вниз, а после последней снова начинает с недели 1."
  uk: "Графік - це кілька тижнів поспіль. Щотижня кожен водій зсувається на тиждень униз, а після останнього знову починає з тижня 1."
"Split duties Monday to Friday: Saturday and Sunday are always off.":
  de: "Geteilte Dienste Montag bis Freitag: Samstag und Sonntag sind immer frei."
  da: "Delte vagter mandag til fredag: lørdag og søndag er altid fri."
  fr: "Services fractionnés du lundi au vendredi : le samedi et le dimanche sont toujours libres."
  nl: "Gebroken diensten maandag tot vrijdag: zaterdag en zondag zijn altijd vrij."
  pl: "Służby dzielone od poniedziałku do piątku: sobota i niedziela zawsze wolne."
  ru: "Разрывные смены с понедельника по пятницу: суббота и воскресенье всегда свободны."
  uk: "Розривні зміни з понеділка по п'ятницю: субота й неділя завжди вільні."
"A weekend is the Saturday of one week and the Sunday of the next: the drivers work every other weekend.":
  de: "Ein Wochenende ist der Samstag einer Woche und der Sonntag der nächsten: die Fahrer arbeiten jedes zweite Wochenende."
  da: "En weekend er lørdagen i én uge og søndagen i den næste: chaufførerne kører hver anden weekend."
  fr: "Un week-end, c'est le samedi d'une semaine et le dimanche de la suivante : les conducteurs travaillent un week-end sur deux."
  nl: "Een weekend is de zaterdag van de ene week en de zondag van de volgende: de chauffeurs werken om het andere weekend."
  pl: "Weekend to sobota jednego tygodnia i niedziela następnego: kierowcy pracują co drugi weekend."
  ru: "Выходные - это суббота одной недели и воскресенье следующей: водители работают каждые вторые выходные."
  uk: "Вихідні - це субота одного тижня й неділя наступного: водії працюють кожні другі вихідні."
"The weekend after the week: its Saturday and the next week's Sunday":
  de: "Das Wochenende nach der Woche: ihr Samstag und der Sonntag der nächsten Woche"
  da: "Weekenden efter ugen: dens lørdag og næste uges søndag"
  fr: "Le week-end après la semaine : son samedi et le dimanche de la semaine suivante"
  nl: "Het weekend na de week: de zaterdag ervan en de zondag van de week erna"
  pl: "Weekend po tygodniu: jego sobota i niedziela następnego tygodnia"
  ru: "Выходные после недели: её суббота и воскресенье следующей недели"
  uk: "Вихідні після тижня: його субота й неділя наступного тижня"
"Weekend":
