"The day shown: the planning of a weekday holds for that weekday every week":
  de: "Der gezeigte Tag: die Planung eines Wochentags gilt jede Woche für diesen Wochentag"
  da: "Den viste dag: planlægningen for en ugedag gælder for den ugedag hver uge"
  fr: "Le jour affiché : la planification d'un jour de semaine vaut chaque semaine pour ce jour"
  nl: "De getoonde dag: de planning van een weekdag geldt elke week voor die weekdag"
