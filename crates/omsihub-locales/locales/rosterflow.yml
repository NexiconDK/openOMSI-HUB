"A reserve within his frame and a permanent driver within his week cost nothing more; above his week it is overtime. The hourly paid are paid at least 3 hours a day called in.":
  de: "Eine Reserve in ihrem Rahmen und ein fester Fahrer innerhalb seiner Woche kosten nichts extra; über seiner Woche ist es Überstunde. Stundenlöhner bekommen mindestens 3 Stunden pro Einsatztag."
  da: "En ramme-chauffør i sin ramme og en fast chauffør inden for sin uge koster ikke ekstra; over ugen er det overarbejde. Timelønnede får mindst 3 timer pr. dag, de kaldes ind."
  fr: "Un réserviste dans son créneau et un conducteur permanent dans sa semaine ne coûtent rien de plus ; au-delà de sa semaine, ce sont des heures supplémentaires. Les payés à l'heure reçoivent au moins 3 heures par jour d'appel."
  nl: "Een reserve binnen zijn kader en een vaste chauffeur binnen zijn week kosten niets extra; boven zijn week is het overwerk. Uurloners krijgen minstens 3 uur per opgeroepen dag."
  pl: "Rezerwowy w swoich ramach i stały kierowca w swoim tygodniu nie kosztują więcej; ponad tydzień to nadgodziny. Godzinowi dostają co najmniej 3 godziny za dzień wezwania."
  ru: "Резерв в своём окне и постоянный водитель в пределах своей недели ничего сверх не стоят; сверх недели — сверхурочные. Почасовикам платят минимум 3 часа за вызов."
  uk: "Резерв у своєму вікні та постійний водій у межах свого тижня нічого понад не коштують; понад тиждень — понаднормові. Погодинникам платять щонайменше 3 години за виклик."
