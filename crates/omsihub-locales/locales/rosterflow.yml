"Five tabs, used in this order. Hiring and employment are on the Staff page.":
  de: "Fünf Reiter, in dieser Reihenfolge benutzt. Einstellungen und Anstellung stehen auf der Personalseite."
  da: "Fem faner, som bruges i denne rækkefølge. Ansættelser finder du på siden Personale."
  fr: "Cinq onglets, utilisés dans cet ordre. L'embauche et les contrats sont sur la page du personnel."
  nl: "Vijf tabbladen, in deze volgorde gebruikt. Aannemen en dienstverbanden staan op de personeelspagina."
  pl: "Pięć kart, używanych w tej kolejności. Zatrudnianie i umowy są na stronie Personelu."
  ru: "Пять вкладок, по порядку. Найм и условия работы - на странице персонала."
  uk: "П'ять вкладок, по черзі. Найм і умови роботи - на сторінці персоналу."
"Begin with Blocks":
  de: "Mit den Umläufen beginnen"
  da: "Begynd med Vognløb"
  fr: "Commencer par les blocs"
  nl: "Begin met de omlopen"
  pl: "Zacznij od obiegów"
  ru: "Начать с выпусков"
  uk: "Почати з випусків"
"The buses' day from the timetables: every bus a row of its trips, a red mark where a driver can change. Read only: the timetables are the lines'.":
  de: "Der Tag der Busse aus den Fahrplänen: jeder Bus eine Zeile seiner Fahrten, eine rote Marke, wo ein Fahrer wechseln kann. Nur zum Lesen: die Fahrpläne gehören zu den Linien."
  da: "Bussernes dag ud fra køreplanerne: hver bus er en række af ture, og en rød trekant viser, hvor en chauffør kan skiftes. Kun til at se på: køreplanerne retter du på linjerne."
  fr: "La journée des bus d'après les horaires : chaque bus une ligne de ses courses, une marque rouge où un conducteur peut être relevé. En lecture seule : les horaires sont ceux des lignes."
  nl: "De dag van de bussen uit de dienstregelingen: elke bus een rij ritten, een rode markering waar een chauffeur kan wisselen. Alleen lezen: de dienstregelingen horen bij de lijnen."
  pl: "Dzień autobusów z rozkładów: każdy autobus to wiersz kursów, czerwony znak tam, gdzie można zmienić kierowcę. Tylko do odczytu: rozkłady są przy liniach."
  ru: "День автобусов по расписаниям: каждый автобус - строка его рейсов, красная метка - где можно сменить водителя. Только для чтения: расписания задаются у линий."
  uk: "День автобусів за розкладами: кожен автобус - рядок його рейсів, червона мітка - де можна змінити водія. Лише для читання: розклади задаються в лініях."
"Cut the blocks at the red marks and put the pieces together as duties - a change of line or bus with its walk between - or let \"Make duties automatically\" do it. Save.":
  de: "Schneiden Sie die Umläufe an den roten Marken und setzen Sie die Stücke zu Diensten zusammen - ein Linien- oder Buswechsel mit dem Weg dazwischen - oder lassen Sie \"Dienste automatisch erstellen\" es tun. Speichern."
  da: "Klip vognløbene ved de røde trekanter og saml stykkerne til vagter - også med skift af linje eller bus og gangtid imellem - eller lad \"Lav vagter automatisk\" gøre det. Gem."
  fr: "Coupez les blocs aux marques rouges et assemblez les morceaux en services - un changement de ligne ou de bus avec la marche entre les deux - ou laissez « Faire les services automatiquement » le faire. Enregistrez."
  nl: "Knip de omlopen bij de rode markeringen en zet de stukken samen tot diensten - een lijn- of buswissel met de looptijd ertussen - of laat \"Diensten automatisch maken\" het doen. Opslaan."
  pl: "Potnij obiegi przy czerwonych znakach i złóż kawałki w służby - ze zmianą linii lub autobusu i przejściem pomiędzy - albo niech zrobi to \"Utwórz służby automatycznie\". Zapisz."
  ru: "Разрежьте выпуски у красных меток и соберите куски в смены - со сменой линии или автобуса и переходом между ними - или пусть это сделает «Составить смены автоматически». Сохраните."
  uk: "Розріжте випуски біля червоних міток і зберіть шматки в зміни - зі зміною лінії чи автобуса та переходом між ними - або нехай це зробить «Скласти зміни автоматично». Збережіть."
"A rota is several weeks in a row: every week each driver moves a week down, after the last week he begins again at week 1. The drivers work every other weekend; split duties have a rota of their own, Monday to Friday.":
  de: "Ein Turnus sind mehrere Wochen hintereinander: jede Woche rückt jeder Fahrer eine Woche nach unten, nach der letzten Woche beginnt er wieder bei Woche 1. Die Fahrer arbeiten jedes zweite Wochenende; geteilte Dienste haben einen eigenen Turnus, Montag bis Freitag."
  da: "En turnus er flere uger i træk: hver uge rykker chaufføren en uge ned, og efter sidste uge starter han forfra på uge 1. Chaufførerne kører hver anden weekend; delte vagter har deres egen turnus mandag til fredag."
  fr: "Un roulement, ce sont plusieurs semaines de suite : chaque semaine, chaque conducteur descend d'une semaine, après la dernière il recommence à la semaine 1. Les conducteurs travaillent un week-end sur deux ; les services fractionnés ont leur propre roulement, du lundi au vendredi."
  nl: "Een rooster is een aantal weken achter elkaar: elke week schuift elke chauffeur een week op, na de laatste week begint hij weer bij week 1. De chauffeurs werken om het andere weekend; gebroken diensten hebben een eigen rooster, maandag tot vrijdag."
  pl: "Grafik to kilka tygodni z rzędu: co tydzień każdy kierowca przesuwa się o tydzień w dół, po ostatnim zaczyna znów od tygodnia 1. Kierowcy pracują co drugi weekend; służby dzielone mają własny grafik, od poniedziałku do piątku."
  ru: "График - это несколько недель подряд: каждую неделю каждый водитель сдвигается на неделю вниз, после последней снова начинает с недели 1. Водители работают каждые вторые выходные; у разрывных смен свой график, с понедельника по пятницу."
  uk: "Графік - це кілька тижнів поспіль: щотижня кожен водій зсувається на тиждень униз, після останнього знову починає з тижня 1. Водії працюють кожні другі вихідні; у розривних змін свій графік, з понеділка по п'ятницю."
"A day: the duties without a driver and why, who could take each and what he costs. Ask the drivers - they answer as people do - and give the duty to one who says yes.":
  de: "Ein Tag: die Dienste ohne Fahrer und warum, wer jeden übernehmen könnte und was er kostet. Fragen Sie die Fahrer - sie antworten wie Menschen - und geben Sie den Dienst einem, der ja sagt."
  da: "En dag: vagterne uden chauffør og hvorfor, hvem der kan tage hver af dem, og hvad det koster. Spørg chaufførerne - de svarer som mennesker - og giv vagten til en, der siger ja."
  fr: "Une journée : les services sans conducteur et pourquoi, qui pourrait prendre chacun et ce qu'il coûte. Demandez aux conducteurs - ils répondent comme des gens - et donnez le service à celui qui dit oui."
  nl: "Een dag: de diensten zonder chauffeur en waarom, wie elke dienst zou kunnen nemen en wat hij kost. Vraag het de chauffeurs - ze antwoorden zoals mensen doen - en geef de dienst aan wie ja zegt."
  pl: "Dzień: służby bez kierowcy i dlaczego, kto mógłby wziąć każdą i ile kosztuje. Zapytaj kierowców - odpowiadają jak ludzie - i daj służbę temu, kto się zgodzi."
  ru: "День: смены без водителя и почему, кто мог бы взять каждую и сколько это стоит. Спросите водителей - они отвечают по-человечески - и отдайте смену тому, кто согласится."
  uk: "День: зміни без водія і чому, хто міг би взяти кожну і скільки це коштує. Запитайте водіїв - вони відповідають по-людськи - і віддайте зміну тому, хто погодиться."
"Every driver's week from Sunday: his sign-on times, driver number, employment and hours this week, and how many duties are missing a driver each day.":
  de: "Die Woche jedes Fahrers ab Sonntag: seine Meldezeiten, Fahrernummer, Anstellung und Stunden dieser Woche, und wie vielen Diensten jeden Tag ein Fahrer fehlt."
  da: "Hver chaufførs uge fra søndag: mødetider, chf. nr., ansættelse og timer i ugen, og hvor mange vagter der mangler en chauffør hver dag."
  fr: "La semaine de chaque conducteur à partir du dimanche : ses heures de prise de service, son numéro, son contrat et ses heures de la semaine, et combien de services manquent d'un conducteur chaque jour."
  nl: "De week van elke chauffeur vanaf zondag: zijn meldtijden, chauffeursnummer, dienstverband en uren deze week, en hoeveel diensten elke dag een chauffeur missen."
  pl: "Tydzień każdego kierowcy od niedzieli: godziny stawienia się, numer kierowcy, umowa i godziny w tym tygodniu oraz ile służb każdego dnia nie ma kierowcy."
  ru: "Неделя каждого водителя с воскресенья: время явки, номер водителя, условия работы и часы за неделю, и сколько смен каждый день без водителя."
  uk: "Тиждень кожного водія з неділі: час явки, номер водія, умови роботи й години за тиждень, і скільки змін щодня без водія."
"Spread the split duties of Monday to Friday no other rota has over enough weeks: the weekends off":
  de: "Die geteilten Dienste von Montag bis Freitag, die kein anderer Turnus hat, auf genug Wochen verteilen: die Wochenenden frei"
  da: "Fordel de delte vagter mandag til fredag, som ingen anden turnus har, over nok uger: weekenderne fri"
  fr: "Répartir les services fractionnés du lundi au vendredi qu'aucun autre roulement n'a sur assez de semaines : les week-ends libres"
  nl: "De gebroken diensten van maandag tot vrijdag die geen ander rooster heeft over genoeg weken verdelen: de weekenden vrij"
  pl: "Rozłóż służby dzielone od poniedziałku do piątku, których nie ma inny grafik, na dość tygodni: weekendy wolne"
  ru: "Распределить разрывные смены с понедельника по пятницу, которых нет в других графиках, на достаточно недель: выходные свободны"
  uk: "Розподілити розривні зміни з понеділка по п'ятницю, яких немає в інших графіках, на досить тижнів: вихідні вільні"
"A week for each reserve driver, five days in his frame":
  de: "Eine Woche für jeden Reservefahrer, fünf Tage in seinem Rahmen"
  da: "En uge til hver reservechauffør, fem dage i hans ramme"
  fr: "Une semaine pour chaque conducteur de réserve, cinq jours dans sa plage"
  nl: "Een week voor elke reservechauffeur, vijf dagen in zijn kader"
  pl: "Tydzień dla każdego kierowcy rezerwowego, pięć dni w jego ramie"
  ru: "Неделя для каждого резервного водителя, пять дней в его рамке"
  uk: "Тиждень для кожного резервного водія, п'ять днів у його рамці"
"Spread the week's duties no other rota has over enough weeks: every other weekend off, two days off together, the rest kept, the hours evened":
  de: "Die Dienste der Woche, die kein anderer Turnus hat, auf genug Wochen verteilen: jedes zweite Wochenende frei, zwei freie Tage am Stück, die Ruhe eingehalten, die Stunden ausgeglichen"
  da: "Fordel ugens vagter, som ingen anden turnus har, over nok uger: fri hver anden weekend, to fridage i træk, hviletiden holdt og timerne udjævnet"
  fr: "Répartir les services de la semaine qu'aucun autre roulement n'a sur assez de semaines : un week-end sur deux libre, deux jours de repos d'affilée, le repos respecté, les heures égalisées"
  nl: "De diensten van de week die geen ander rooster heeft over genoeg weken verdelen: om het andere weekend vrij, twee vrije dagen achter elkaar, de rust bewaard, de uren gelijkgetrokken"
  pl: "Rozłóż służby tygodnia, których nie ma inny grafik, na dość tygodni: co drugi weekend wolny, dwa wolne dni z rzędu, odpoczynek zachowany, godziny wyrównane"
  ru: "Распределить смены недели, которых нет в других графиках, на достаточно недель: каждые вторые выходные свободны, два выходных подряд, отдых соблюдён, часы выровнены"
  uk: "Розподілити зміни тижня, яких немає в інших графіках, на досить тижнів: кожні другі вихідні вільні, два вихідні поспіль, відпочинок дотримано, години вирівняно"
