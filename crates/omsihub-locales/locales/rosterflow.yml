"How RosterFlow Pro works: its five tabs in order":
  de: "So funktioniert RosterFlow Pro: seine fünf Reiter der Reihe nach"
  da: "Sådan bruger du RosterFlow Pro: de fem faner i rækkefølge"
  fr: "Comment fonctionne RosterFlow Pro : ses cinq onglets dans l'ordre"
  nl: "Zo werkt RosterFlow Pro: de vijf tabbladen op volgorde"
  pl: "Jak działa RosterFlow Pro: pięć kart po kolei"
