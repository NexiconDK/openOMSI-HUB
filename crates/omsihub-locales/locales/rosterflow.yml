  ru: "У его выпусков теперь нет автобуса. Дайте каждому другой автобус в распределении или нажмите «Распределить автоматически»."
  uk: "Його випуски тепер без автобуса. Дайте кожному інший автобус у розподілі або натисніть «Розподілити автоматично»."
