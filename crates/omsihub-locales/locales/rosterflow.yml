"Granted, a wish makes the driver more content; refused or left until its day, less - three in a row, more so. A day off granted leaves the driver's duty that day open.":
  de: "Erfüllt macht ein Wunsch den Fahrer zufriedener; abgelehnt oder bis zu seinem Tag liegen gelassen, unzufriedener – dreimal in Folge noch mehr. Ein erfüllter freier Tag lässt den Dienst des Fahrers an dem Tag offen."
  da: "Et opfyldt ønske gør chaufføren mere tilfreds; afvist eller ladet ligge til dagen, mindre – tre gange i træk endnu mere. En opfyldt fridag efterlader chaufførens vagt den dag åben."
  fr: "Accordé, un souhait rend le conducteur plus content ; refusé ou laissé jusqu'à son jour, moins – trois fois de suite, encore moins. Un jour libre accordé laisse ouvert le service du conducteur ce jour-là."
  nl: "Een vervulde wens maakt de chauffeur tevredener; afgewezen of blijven liggen tot de dag, minder – drie keer op rij nog meer. Een vervulde vrije dag laat de dienst van de chauffeur die dag open."
  pl: "Spełnione życzenie zwiększa zadowolenie kierowcy; odrzucone lub pozostawione do swojego dnia – zmniejsza, trzy razy z rzędu jeszcze bardziej. Przyznany dzień wolny zostawia służbę kierowcy tego dnia bez obsady."
  ru: "Выполненное пожелание делает водителя довольнее; отклонённое или забытое до своего дня – наоборот, три раза подряд – ещё сильнее. Выходной по пожеланию оставляет смену водителя в этот день открытой."
