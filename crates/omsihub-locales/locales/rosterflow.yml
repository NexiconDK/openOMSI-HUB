"Cut the buses before and after these departures and make them one duty":
  de: "Die Busse vor und nach diesen Abfahrten teilen und daraus einen Dienst machen"
  da: "Klip busserne før og efter disse afgange, og gør dem til én vagt"
  fr: "Couper les bus avant et après ces départs et en faire un service"
  nl: "Knip de bussen voor en na deze vertrekken en maak er één dienst van"
  pl: "Podziel autobusy przed i po tych odjazdach i zrób z nich jedną służbę"
  ru: "Разрезать автобусы до и после этих отправлений и сделать из них одну смену"
  uk: "Розрізати автобуси до й після цих відправлень і зробити з них одну зміну"
"Click the departures of the duty in the list: one at a time, of one bus or several. The trips between two of the same bus and its runs to and from them go with them.":
  de: "Klicke die Abfahrten des Dienstes in der Liste an: eine nach der anderen, von einem Bus oder mehreren. Die Fahrten zwischen zwei Abfahrten desselben Busses und seine Leerfahrten dorthin und zurück kommen mit."
  da: "Klik vagtens afgange i listen: én ad gangen, fra én bus eller flere. Turene mellem to afgange med samme bus og dens tomkørsel til og fra dem kommer med."
  fr: "Cliquez les départs du service dans la liste : un à la fois, d'un bus ou de plusieurs. Les trajets entre deux départs du même bus et ses trajets à vide vers eux et depuis eux suivent."
  nl: "Klik de vertrekken van de dienst in de lijst aan: één tegelijk, van één bus of meer. De ritten tussen twee vertrekken van dezelfde bus en de lege ritten ernaartoe en ervandaan gaan mee."
  pl: "Kliknij odjazdy służby na liście: po jednym, z jednego autobusu lub kilku. Kursy między dwoma odjazdami tego samego autobusu i jego przejazdy bez pasażerów do nich i z nich dochodzą automatycznie."
  ru: "Щёлкните отправления смены в списке: по одному, одного автобуса или нескольких. Рейсы между двумя отправлениями одного автобуса и его порожние рейсы к ним и от них добавляются сами."
  uk: "Клацніть відправлення зміни у списку: по одному, одного автобуса чи кількох. Рейси між двома відправленнями одного автобуса та його порожні рейси до них і від них додаються самі."
"Eight tabs, used in this order. Hiring and employment are on the Staff page.":
  de: "Acht Reiter, in dieser Reihenfolge benutzt. Einstellungen und Beschäftigung stehen auf der Seite Personal."
  da: "Otte faner, brugt i denne rækkefølge. Ansættelse og ansættelsesforhold findes på siden Personale."
  fr: "Huit onglets, utilisés dans cet ordre. L'embauche et les contrats sont sur la page Personnel."
  nl: "Acht tabbladen, in deze volgorde gebruikt. Aannemen en dienstverband staan op de pagina Personeel."
  pl: "Osiem kart, używanych w tej kolejności. Zatrudnianie i umowy są na stronie Personel."
  ru: "Восемь вкладок, в этом порядке. Найм и условия работы — на странице «Персонал»."
  uk: "Вісім вкладок, у цьому порядку. Найм і умови роботи — на сторінці «Персонал»."
"Every departure of the day in order of time, its line, bus and duty. Build a duty one at a time: click its departures, give it a name if you like, and save it - the buses are cut before and after them.":
  de: "Jede Abfahrt des Tages nach der Zeit, mit Linie, Bus und Dienst. Baue einen Dienst nach dem anderen: Abfahrten anklicken, nach Wunsch einen Namen geben und speichern - die Busse werden davor und danach geteilt."
  da: "Alle dagens afgange efter tid med linje, bus og vagt. Byg én vagt ad gangen: klik dens afgange, giv den et navn, hvis du vil, og gem den - busserne bliver klippet før og efter dem."
  fr: "Chaque départ de la journée par ordre d'heure, avec sa ligne, son bus et son service. Construisez un service à la fois : cliquez ses départs, donnez-lui un nom si vous voulez, et enregistrez-le - les bus sont coupés avant et après."
  nl: "Elk vertrek van de dag op tijd, met lijn, bus en dienst. Bouw één dienst tegelijk: klik de vertrekken aan, geef hem desgewenst een naam en sla hem op - de bussen worden ervoor en erna geknipt."
  pl: "Każdy odjazd dnia według godziny, z linią, autobusem i służbą. Buduj służby po jednej: kliknij odjazdy, nadaj nazwę, jeśli chcesz, i zapisz - autobusy zostaną podzielone przed i po nich."
  ru: "Все отправления дня по времени: линия, автобус и смена. Стройте смены по одной: щёлкните отправления, при желании дайте название и сохраните — автобусы разрезаются до и после них."
  uk: "Усі відправлення дня за часом: лінія, автобус і зміна. Будуйте зміни по одній: клацніть відправлення, за бажання дайте назву й збережіть — автобуси розрізаються до й після них."
