"The central covered its first block with a free bus. Change it in the bus dispatch if another suits better.":
  de: "Die Leitstelle hat seinen ersten Umlauf mit einem freien Bus besetzt. Ändere es in der Busdisposition, wenn ein anderer besser passt."
