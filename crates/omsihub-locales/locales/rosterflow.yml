  fr: "Un demi-week-end : le samedi de la semaine %{a} et le dimanche de la semaine %{b} devraient être tous deux libres ou tous deux travaillés"
  nl: "Een half weekend: de zaterdag van week %{a} en de zondag van week %{b} moeten allebei vrij of allebei werk zijn"
  pl: "Pół weekendu: sobota tygodnia %{a} i niedziela tygodnia %{b} powinny być obie wolne albo obie pracujące"
  ru: "Половина выходных: суббота недели %{a} и воскресенье недели %{b} должны быть либо обе выходными, либо обе рабочими"
