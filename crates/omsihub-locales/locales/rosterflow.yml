  nl: "De diensten die nog in geen rooster zitten komen eerst; een dienst die die dag in een andere week zit is grijs (de plaats bij aanwijzen)."
  pl: "Najpierw służby, których nie ma żaden grafik; służba w innym tygodniu tego dnia jest szara (miejsce po najechaniu)."
