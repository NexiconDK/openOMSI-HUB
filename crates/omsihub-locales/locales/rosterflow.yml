"Early, middle, late and night duties by turns: two weeks of each kind, forward from early to night, two days off after the nights. Every other weekend off.":
  de: "Früh-, Mittel-, Spät- und Nachtdienste im Wechsel: je zwei Wochen, vorwärts von früh bis nachts, zwei freie Tage nach den Nächten. Jedes zweite Wochenende frei."
  da: "Tidlige, mellem-, sene og nattevagter på skift: to uger af hver slags, fremad fra tidlig til nat, to fridage efter nætterne. Fri hver anden weekend."
  fr: "Services tôt, de milieu, tard et de nuit à tour de rôle : deux semaines de chaque type, en avançant du matin à la nuit, deux jours de repos après les nuits. Un week-end sur deux libre."
  nl: "Vroege, midden-, late en nachtdiensten om de beurt: twee weken van elke soort, vooruit van vroeg naar nacht, twee vrije dagen na de nachten. Om het andere weekend vrij."
  pl: "Służby wczesne, środkowe, późne i nocne na zmianę: po dwa tygodnie każdego rodzaju, do przodu od wczesnych do nocnych, dwa dni wolne po nocach. Co drugi weekend wolny."
  ru: "Ранние, средние, поздние и ночные смены по очереди: по две недели каждого вида, вперёд от ранних к ночным, два выходных после ночей. Каждые вторые выходные свободны."
  uk: "Ранні, середні, пізні та нічні зміни по черзі: по два тижні кожного виду, уперед від ранніх до нічних, два вихідні після ночей. Кожні другі вихідні вільні."
