"Each hourly-paid driver says a day at a time when they can work: all day, from-to, or not that day. Asked for a duty within it they mostly say yes, and answer sooner; outside it, mostly no. Click a day to change it.":
  de: "Jeder Stundenlöhner meldet Tag für Tag, wann er arbeiten kann: ganztägig, von–bis oder an dem Tag nicht. Für einen Dienst darin gefragt, sagt er meist ja und antwortet schneller; außerhalb meist nein. Klick auf einen Tag, um ihn zu ändern."
  da: "Hver timelønnet chauffør melder dag for dag, hvornår vedkommende kan arbejde: hele dagen, fra–til eller ikke den dag. Spurgt om en vagt inden for det siger de oftest ja og svarer hurtigere; uden for det oftest nej. Klik på en dag for at ændre den."
  fr: "Chaque conducteur payé à l'heure indique jour par jour quand il peut travailler : toute la journée, de–à, ou pas ce jour-là. Sollicité pour un service dans ce créneau, il dit le plus souvent oui et répond plus vite ; en dehors, le plus souvent non. Cliquez sur un jour pour le modifier."
  nl: "Elke uurloner geeft per dag op wanneer hij kan werken: de hele dag, van–tot of die dag niet. Gevraagd voor een dienst daarbinnen zegt hij meestal ja en antwoordt sneller; daarbuiten meestal nee. Klik op een dag om hem te wijzigen."
  pl: "Każdy kierowca godzinowy podaje dzień po dniu, kiedy może pracować: cały dzień, od–do albo nie tego dnia. Zapytany o służbę w tym czasie zwykle mówi tak i odpowiada szybciej; poza nim zwykle nie. Kliknij dzień, aby go zmienić."
  ru: "Каждый почасовой водитель сообщает по дням, когда может работать: весь день, с–до или не в этот день. Спрошенный о смене в это время, он обычно соглашается и отвечает быстрее; вне его — обычно нет. Щёлкните день, чтобы изменить его."
  uk: "Кожен погодинний водій повідомляє по днях, коли може працювати: увесь день, з–до або не цього дня. Запитаний про зміну в цей час, він зазвичай погоджується й відповідає швидше; поза ним — зазвичай ні. Клацніть день, щоб змінити його."
