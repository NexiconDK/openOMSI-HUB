"Every week each driver moves a week down; after the last week he begins again at week 1.":
  de: "Jede Woche rückt jeder Fahrer eine Woche nach unten; nach der letzten Woche beginnt er wieder bei Woche 1."
  da: "Hver uge rykker hver chauffør en uge ned; efter sidste uge starter han forfra på uge 1."
  fr: "Chaque semaine, chaque conducteur descend d'une semaine ; après la dernière, il recommence à la semaine 1."
  nl: "Elke week schuift elke chauffeur een week op; na de laatste week begint hij weer bij week 1."
  pl: "Co tydzień każdy kierowca przesuwa się o tydzień w dół; po ostatnim zaczyna znów od tygodnia 1."
  ru: "Каждую неделю каждый водитель сдвигается на неделю вниз; после последней он снова начинает с недели 1."
  uk: "Щотижня кожен водій зсувається на тиждень униз; після останнього він знову починає з тижня 1."
