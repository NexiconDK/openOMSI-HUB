"Income: what the line's contract pays and its fares, passes and grants, as booked. The days to come: the contract's day, the fares at the line's average day of late.":
  de: "Einnahmen: was der Vertrag der Linie zahlt, dazu ihre Fahrgeldeinnahmen, Abos und Zuschüsse, wie gebucht. Die kommenden Tage: der Vertragswert eines Tages, das Fahrgeld nach dem Tagesschnitt der letzten Zeit."
  da: "Indtægt: hvad linjens kontrakt betaler, og dens billetter, kort og tilskud, som bogført. De kommende dage: kontraktens dag, billetterne efter linjens gennemsnitsdag på det seneste."
  fr: "Recettes : ce que paie le contrat de la ligne, avec ses billets, abonnements et subventions, comme comptabilisé. Les jours à venir : la journée du contrat, les billets selon la journée moyenne récente de la ligne."
  nl: "Inkomsten: wat het contract van de lijn betaalt en haar kaartjes, abonnementen en subsidies, zoals geboekt. De komende dagen: de contractdag, de kaartjes naar de gemiddelde dag van de laatste tijd."
  pl: "Przychody: to, co płaci umowa linii, oraz jej bilety, karty i dotacje, jak zaksięgowano. Dni przyszłe: dzień umowy, bilety według średniego dnia linii z ostatniego czasu."
  ru: "Доходы: то, что платит контракт линии, и её билеты, проездные и субсидии, как проведено. Будущие дни: день контракта, билеты по среднему дню линии за последнее время."
  uk: "Доходи: те, що платить контракт лінії, та її квитки, проїзні й субсидії, як проведено. Майбутні дні: день контракту, квитки за середнім днем лінії за останній час."
"Drivers: every day's duties at the Vagter tab's price - the paid hours at the drivers' average wage, the supplements and the employer's costs - shared out by the minutes each duty works on each line.":
  de: "Fahrkräfte: die Dienste jedes Tages zum Preis des Vagter-Tabs - die bezahlten Stunden zum Durchschnittslohn, die Zuschläge und die Arbeitgeberkosten -, verteilt nach den Minuten, die jeder Dienst auf jeder Linie arbeitet."
  da: "Chauffører: hver dags vagter til Vagter-fanens pris - de betalte timer til chaufførernes gennemsnitsløn, tillæg og arbejdsgiverudgifter - fordelt efter de minutter, hver vagt arbejder på hver linje."
  fr: "Conducteur·rices : les services de chaque jour au prix de l'onglet Vagter - les heures payées au salaire moyen, les majorations et les charges patronales -, répartis selon les minutes que chaque service travaille sur chaque ligne."
  nl: "Chauffeurs: de diensten van elke dag tegen de prijs van het tabblad Vagter - de betaalde uren tegen het gemiddelde loon, de toeslagen en de werkgeverslasten - verdeeld naar de minuten die elke dienst op elke lijn werkt."
  pl: "Kierowcy: służby każdego dnia po cenie z karty Vagter - płatne godziny według średniej płacy, dodatki i koszty pracodawcy - rozdzielone według minut, które każda służba przepracowuje na każdej linii."
  ru: "Водители: смены каждого дня по цене вкладки Vagter - оплачиваемые часы по средней зарплате, надбавки и расходы работодателя - распределены по минутам, которые каждая смена работает на каждой линии."
  uk: "Водії: зміни кожного дня за ціною вкладки Vagter - оплачувані години за середньою зарплатою, надбавки та витрати роботодавця - розподілені за хвилинами, які кожна зміна працює на кожній лінії."
"Fuel and workshop: the diesel or power and the maintenance booked for the line's buses; the days to come at its average day.":
  de: "Kraftstoff und Werkstatt: Diesel oder Strom und die Wartung, gebucht für die Busse der Linie; die kommenden Tage nach ihrem Tagesschnitt."
  da: "Brændstof og værksted: diesel eller strøm og vedligehold bogført for linjens busser; de kommende dage efter dens gennemsnitsdag."
  fr: "Carburant et atelier : le gazole ou l'électricité et l'entretien comptabilisés pour les bus de la ligne ; les jours à venir selon sa journée moyenne."
  nl: "Brandstof en werkplaats: de diesel of stroom en het onderhoud geboekt voor de bussen van de lijn; de komende dagen naar haar gemiddelde dag."
  pl: "Paliwo i warsztat: olej napędowy lub prąd i obsługa zaksięgowane dla autobusów linii; dni przyszłe według jej średniego dnia."
  ru: "Топливо и мастерская: дизель или электричество и обслуживание, проведённые для автобусов линии; будущие дни по её среднему дню."
  uk: "Пальне та майстерня: дизель або електрика й обслуговування, проведені для автобусів лінії; майбутні дні за її середнім днем."
"Not in it: the buses' purchase, leasing and insurance, the depot and the overheads - they are the company's, not one line's.":
  de: "Nicht enthalten: Kauf, Leasing und Versicherung der Busse, der Betriebshof und die Gemeinkosten - sie gehören der Firma, nicht einer Linie."
  da: "Ikke med: bussernes køb, leasing og forsikring, depotet og fællesomkostningerne - de er firmaets, ikke én linjes."
  fr: "Non compris : l'achat, le leasing et l'assurance des bus, le dépôt et les frais généraux - ils sont à l'entreprise, pas à une ligne."
  nl: "Niet inbegrepen: aankoop, lease en verzekering van de bussen, de stalling en de overhead - die zijn van het bedrijf, niet van één lijn."
  pl: "Nie wliczono: zakupu, leasingu i ubezpieczenia autobusów, zajezdni i kosztów ogólnych - należą do firmy, nie do jednej linii."
  ru: "Не входит: покупка, лизинг и страховка автобусов, депо и накладные расходы - они относятся к компании, а не к одной линии."
  uk: "Не входить: купівля, лізинг і страхування автобусів, депо та накладні витрати - вони належать компанії, а не одній лінії."
