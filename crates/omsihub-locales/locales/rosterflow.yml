"Approved, the swap is made at once for both drivers - ⇄ in the calendar, the day's box undoes it until its first duty begins - and both are a little more content; refused or left open, a little less.":
  de: "Genehmigt wird der Tausch sofort für beide eingetragen – ⇄ im Kalender, im Tagesfenster rückgängig zu machen, bis der erste Dienst beginnt – und beide sind etwas zufriedener; abgelehnt oder liegen gelassen etwas weniger."
  da: "Godkendt bliver byttet lavet med det samme for begge chauffører – ⇄ i kalenderen, og dagens boks kan fortryde det, til den første vagt begynder – og begge bliver lidt gladere; afvist eller ignoreret lidt mindre glade."
  fr: "Approuvé, l'échange est fait tout de suite pour les deux – ⇄ dans le calendrier, annulable dans la fenêtre du jour jusqu'au début du premier service – et la satisfaction des deux monte un peu ; refusé ou laissé sans réponse, elle baisse un peu."
  nl: "Goedgekeurd wordt de ruil meteen voor beide chauffeurs gemaakt – ⇄ in de kalender, in het dagvenster terug te draaien tot de eerste dienst begint – en beiden zijn wat tevredener; geweigerd of blijven liggen wat minder."
  pl: "Po zatwierdzeniu zamiana obowiązuje od razu dla obu osób – ⇄ w kalendarzu, w oknie dnia można ją cofnąć do początku pierwszej służby – a zadowolenie obu trochę rośnie; po odmowie lub bez odpowiedzi trochę spada."
  ru: "После одобрения обмен сразу вносится для обоих – ⇄ в календаре, его можно отменить в окне дня до начала первой смены – и удовлетворённость обоих немного растёт; при отказе или без ответа немного падает."
  uk: "Після схвалення обмін одразу вноситься для обох – ⇄ у календарі, його можна скасувати у вікні дня до початку першої зміни – і задоволеність обох трохи зростає; при відмові чи без відповіді трохи падає."
