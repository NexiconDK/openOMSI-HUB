"The hourly paid say a day at a time when they can work - all day, from-to or not that day - and remember it when they are asked. Change a day by clicking it.":
  de: "Die Stundenlöhner melden Tag für Tag, wann sie arbeiten können – ganztägig, von–bis oder an dem Tag nicht – und erinnern sich daran, wenn sie gefragt werden. Ändere einen Tag mit einem Klick."
  da: "De timelønnede melder dag for dag, hvornår de kan arbejde – hele dagen, fra–til eller ikke den dag – og husker det, når de bliver spurgt. Ændr en dag ved at klikke på den."
  fr: "Les conducteurs payés à l'heure indiquent jour par jour quand ils peuvent travailler – toute la journée, de–à ou pas ce jour-là – et s'en souviennent quand on leur demande. Modifiez un jour en cliquant dessus."
  nl: "De uurloners geven per dag op wanneer ze kunnen werken – de hele dag, van–tot of die dag niet – en houden zich eraan als ze gevraagd worden. Wijzig een dag door erop te klikken."
  pl: "Pracownicy godzinowi podają dzień po dniu, kiedy mogą pracować – cały dzień, od–do albo nie tego dnia – i pamiętają o tym, gdy są pytani. Zmień dzień, klikając go."
  ru: "Почасовые сообщают по дням, когда могут работать – весь день, с–до или не в этот день – и помнят об этом, когда их спрашивают. Измените день щелчком."
  uk: "Погодинні повідомляють по днях, коли можуть працювати – увесь день, з–до або не цього дня – і пам'ятають про це, коли їх запитують. Змініть день клацанням."
