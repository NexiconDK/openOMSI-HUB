"The least time a bus stands between two trips at one place.":
  de: "Die kürzeste Zeit, die ein Bus zwischen zwei Fahrten an einem Ort steht."
  da: "Den mindste tid, en bus holder mellem to ture på ét sted."
  fr: "Le temps minimal qu'un bus reste à un endroit entre deux courses."
  nl: "De kortste tijd die een bus tussen twee ritten op één plek staat."
  pl: "Najkrótszy postój autobusu między dwoma kursami w jednym miejscu."
  ru: "Наименьшее время стоянки автобуса между двумя рейсами в одном месте."
  uk: "Найменший час стоянки автобуса між двома рейсами в одному місці."
"The bus's check before it leaves the depot and after it is back.":
  de: "Die Kontrolle des Busses, bevor er das Depot verlässt und wenn er zurück ist."
  da: "Busens tjek, før den forlader garagen, og efter den er tilbage."
  fr: "Le contrôle du bus avant qu'il quitte le dépôt et à son retour."
  nl: "De controle van de bus voor hij de remise verlaat en nadat hij terug is."
  pl: "Kontrola autobusu przed wyjazdem z zajezdni i po powrocie."
  ru: "Осмотр автобуса перед выездом из депо и после возвращения."
  uk: "Огляд автобуса перед виїздом із депо та після повернення."
"The paid minutes a driver signs on before work and off after it, at the duty's ends and around a split.":
  de: "Die bezahlten Minuten, mit denen sich ein Fahrer vor der Arbeit an- und danach abmeldet, an den Enden des Dienstes und um eine Teilung."
  da: "De betalte minutter, en chauffør møder ind før arbejdet og har fyraften efter det, ved vagtens ender og omkring en delt vagt."
  fr: "Les minutes payées de prise de service avant le travail et de fin après, aux extrémités du service et autour d'une coupure."
  nl: "De betaalde minuten waarmee een chauffeur zich voor het werk aanmeldt en erna afmeldt, aan het begin en eind van de dienst en rond een onderbreking."
  pl: "Płatne minuty rozpoczęcia przed pracą i zakończenia po niej, na końcach służby i wokół przerwy."
  ru: "Оплачиваемые минуты явки до работы и сдачи после неё, в начале и конце смены и вокруг разрыва."
  uk: "Оплачувані хвилини явки до роботи та здачі після неї, на початку й наприкінці зміни та довкола розриву."
"When the driver changes within the bus's layover at a relief point (a terminus or the depot).":
  de: "Wann der Fahrer während der Wendezeit des Busses an einem Ablösepunkt wechselt (Endhaltestelle oder Depot)."
  da: "Når chaufføren skifter inden for busens ophold ved et afløsningspunkt (en endestation eller garagen)."
  fr: "Quand le conducteur change pendant le battement du bus à un point de relève (un terminus ou le dépôt)."
  nl: "Wanneer de chauffeur wisselt tijdens de keertijd van de bus op een aflospunt (een eindpunt of de remise)."
  pl: "Kiedy kierowca się zmienia podczas postoju autobusu w punkcie zmiany (pętla lub zajezdnia)."
  ru: "Когда меняется водитель во время отстоя автобуса в пункте пересменки (конечная или депо)."
  uk: "Коли змінюється водій під час відстою автобуса в пункті перезміни (кінцева чи депо)."
"How a driver gets to a relief point at another place, and how long it takes.":
  de: "Wie ein Fahrer zu einem Ablösepunkt an einem anderen Ort kommt, und wie lange das dauert."
  da: "Hvordan en chauffør kommer til et afløsningspunkt et andet sted, og hvor lang tid det tager."
  fr: "Comment un conducteur rejoint un point de relève ailleurs, et combien de temps cela prend."
  nl: "Hoe een chauffeur bij een aflospunt elders komt, en hoe lang dat duurt."
  pl: "Jak kierowca dociera do punktu zmiany w innym miejscu i ile to trwa."
  ru: "Как водитель добирается до пункта пересменки в другом месте и сколько это занимает."
  uk: "Як водій дістається до пункту перезміни в іншому місці і скільки це триває."
"A duty working longer than this needs a meal break of at least this long.":
  de: "Ein Dienst, der länger arbeitet, braucht eine Essenspause von mindestens dieser Länge."
  da: "En vagt, der arbejder længere end dette, kræver en spisepause på mindst så lang tid."
  fr: "Un service plus long que ceci a besoin d'une pause repas d'au moins cette durée."
  nl: "Een dienst die langer werkt dan dit heeft een maaltijdpauze van minstens zo lang nodig."
  pl: "Służba dłuższa niż to potrzebuje przerwy na posiłek co najmniej tak długiej."
  ru: "Смене длиннее этого нужен перерыв на обед не короче этого."
  uk: "Зміні, довшій за це, потрібна обідня перерва не коротша за це."
"The longest a driver works without a break of at least this long.":
  de: "Das Längste, das ein Fahrer ohne Pause von mindestens dieser Länge arbeitet."
  da: "Det længste, en chauffør arbejder uden en pause på mindst så lang tid."
  fr: "Le plus longtemps qu'un conducteur travaille sans pause d'au moins cette durée."
  nl: "Het langst dat een chauffeur werkt zonder een pauze van minstens zo lang."
  pl: "Najdłużej, ile kierowca pracuje bez przerwy co najmniej tak długiej."
  ru: "Наибольшее время работы водителя без перерыва не короче этого."
  uk: "Найбільший час роботи водія без перерви не коротшої за це."
"The spread of a duty (sign-on to sign-off) at most.":
  de: "Die Dienstspanne (Dienstbeginn bis Dienstende) höchstens."
  da: "En vagts spredning (fra mødetid til fyraften) højst."
  fr: "L'amplitude d'un service (prise à fin de service) au plus."
  nl: "De spreiding van een dienst (aanmelden tot afmelden) ten hoogste."
  pl: "Rozpiętość służby (od rozpoczęcia do zakończenia) najwyżej."
  ru: "Протяжённость смены (от явки до сдачи) не больше."
  uk: "Тривалість зміни (від явки до здачі) не більше."
"Pieces of work at least this long: short pieces are costly.":
  de: "Dienststücke mindestens so lang: kurze Stücke sind teuer."
  da: "Arbejdsdele mindst så lange: korte dele er dyre."
  fr: "Des parties de travail au moins aussi longues : les courtes coûtent cher."
  nl: "Dienststukken minstens zo lang: korte stukken zijn duur."
  pl: "Części pracy co najmniej tak długie: krótkie są kosztowne."
  ru: "Части работы не короче этого: короткие части дороги."
  uk: "Частини роботи не коротші за це: короткі частини дорогі."
"How many times a driver may change buses in a duty.":
  de: "Wie oft ein Fahrer in einem Dienst den Bus wechseln darf."
  da: "Hvor mange gange en chauffør må skifte bus i en vagt."
  fr: "Combien de fois un conducteur peut changer de bus dans un service."
  nl: "Hoe vaak een chauffeur in een dienst van bus mag wisselen."
  pl: "Ile razy kierowca może zmienić autobus w służbie."
  ru: "Сколько раз водитель может сменить автобус в смене."
  uk: "Скільки разів водій може змінити автобус у зміні."
"A break between two pieces this long or longer is a split: unpaid.":
  de: "Eine Pause zwischen zwei Stücken dieser Länge oder länger ist eine Teilung: unbezahlt."
  da: "En pause mellem to dele af denne længde eller længere er en delt vagt: ulønnet."
  fr: "Une pause entre deux parties de cette durée ou plus est une coupure : non payée."
  nl: "Een pauze tussen twee stukken van deze lengte of langer is een onderbreking: onbetaald."
  pl: "Przerwa między dwiema częściami tej długości lub dłuższa to przerwa dzieląca: niepłatna."
  ru: "Перерыв между двумя частями такой длины или дольше — разрыв: не оплачивается."
  uk: "Перерва між двома частинами такої довжини чи довша — розрив: не оплачується."
"The kinds of duty the company works. A duty no allowed type fits is Other, an issue. The first that fits is its type.":
  de: "Die Dienstarten des Betriebs. Ein Dienst, zu dem kein erlaubter Typ passt, ist Sonstiges, ein Problem. Der erste passende ist sein Typ."
  da: "De slags vagter, selskabet arbejder med. En vagt, ingen tilladt type passer til, er Anden, et problem. Den første, der passer, er dens type."
  fr: "Les types de service de l'entreprise. Un service qu'aucun type permis ne couvre est Autre, un problème. Le premier qui convient est son type."
  nl: "De soorten dienst die het bedrijf werkt. Een dienst waarop geen toegestaan type past is Anders, een probleem. Het eerste dat past is zijn type."
  pl: "Rodzaje służb firmy. Służba, do której nie pasuje żaden dozwolony typ, to Inna, problem. Pierwszy pasujący to jej typ."
  ru: "Виды смен компании. Смена, которой не подходит ни один разрешённый тип, — Прочее, это проблема. Первый подходящий — её тип."
  uk: "Види змін компанії. Зміна, якій не підходить жоден дозволений тип, — Інше, це проблема. Перший відповідний — її тип."
"How many buses the depot holds: buses out at once at most.":
  de: "Wie viele Busse das Depot fasst: höchstens so viele Busse gleichzeitig unterwegs."
  da: "Hvor mange busser garagen rummer: busser ude på én gang højst."
  fr: "Combien de bus le dépôt contient : au plus autant de bus dehors en même temps."
  nl: "Hoeveel bussen de remise kan hebben: ten hoogste zoveel bussen tegelijk onderweg."
  pl: "Ile autobusów mieści zajezdnia: najwyżej tyle naraz w trasie."
  ru: "Сколько автобусов вмещает депо: не больше стольких на линии одновременно."
  uk: "Скільки автобусів вміщує депо: не більше стількох на лінії одночасно."
"What the crew and the vehicles cost: Optimise works the cost down.":
  de: "Was Personal und Fahrzeuge kosten: Optimieren senkt die Kosten."
  da: "Hvad besætningen og køretøjerne koster: Optimér arbejder omkostningen ned."
  fr: "Ce que coûtent les équipages et les véhicules : l'optimisation réduit le coût."
  nl: "Wat personeel en voertuigen kosten: Optimaliseren drukt de kosten."
  pl: "Ile kosztują załogi i pojazdy: optymalizacja obniża koszt."
  ru: "Сколько стоят экипажи и машины: оптимизация снижает стоимость."
  uk: "Скільки коштують екіпажі та машини: оптимізація знижує вартість."
"What Optimise makes: the vehicles' blocks, the duties, or both.":
  de: "Was Optimieren macht: die Umläufe, die Dienste oder beides."
  da: "Hvad Optimér laver: køretøjernes vognløb, vagterne eller begge."
  fr: "Ce que l'optimisation produit : les blocs, les services, ou les deux."
  nl: "Wat Optimaliseren maakt: de omlopen, de diensten, of beide."
  pl: "Co tworzy optymalizacja: obiegi, służby lub oba."
  ru: "Что делает оптимизация: выпуски, смены или оба."
  uk: "Що робить оптимізація: випуски, зміни або обидва."
