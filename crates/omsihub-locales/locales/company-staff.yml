  uk: "Контрольна зміна триває від 2 до 10 годин."
"A patrol has 1 to 4 inspectors, a storaktion 2 to 8.":
  de: "Ein Kontrolldienst hat 1 bis 4 Kontrollkräfte, eine Großkontrolle 2 bis 8."
  da: "En kontrolvagt har 1 til 4 kontrollører, en storaktion 2 til 8."
  fr: "Un service de contrôle compte 1 à 4 personnes, un grand contrôle 2 à 8."
  nl: "Een controledienst heeft 1 tot 4 controleurs, een grote controle 2 tot 8."
  pl: "Dyżur kontrolny ma od 1 do 4 osób, akcja kontrolna od 2 do 8."
  ru: "В контрольной смене от 1 до 4 контролёров, в масштабной проверке от 2 до 8."
  uk: "У контрольній зміні від 1 до 4 контролерів, у масштабній перевірці від 2 до 8."
"Choose the days of the week the duty is on.":
  de: "Wähle die Wochentage des Dienstes."
  da: "Vælg de ugedage, vagten er på."
  fr: "Choisissez les jours de la semaine du service."
  nl: "Kies de weekdagen van de dienst."
  pl: "Wybierz dni tygodnia dyżuru."
  ru: "Выберите дни недели смены."
  uk: "Виберіть дні тижня зміни."
"Choose the stop of the storaktion: one the company's lines pass.":
  de: "Wähle die Haltestelle der Großkontrolle: eine, an der Linien des Unternehmens vorbeikommen."
  da: "Vælg storaktionens stoppested: et, som selskabets linjer kommer forbi."
  fr: "Choisissez l'arrêt du grand contrôle : un arrêt où passent les lignes de l'entreprise."
  nl: "Kies de halte van de grote controle: een die de lijnen van het bedrijf aandoen."
  pl: "Wybierz przystanek akcji kontrolnej: taki, przez który jeżdżą linie firmy."
  ru: "Выберите остановку масштабной проверки: ту, через которую идут линии компании."
  uk: "Виберіть зупинку масштабної перевірки: ту, через яку йдуть лінії компанії."
"The company has no such line.":
  de: "Das Unternehmen hat keine solche Linie."
  da: "Selskabet har ingen sådan linje."
  fr: "L'entreprise n'a pas cette ligne."
  nl: "Het bedrijf heeft zo'n lijn niet."
  pl: "Firma nie ma takiej linii."
  ru: "У компании нет такой линии."
  uk: "У компанії немає такої лінії."
"That inspector does not work for the company.":
  de: "Diese Kontrollkraft arbeitet nicht für das Unternehmen."
  da: "Den kontrollør arbejder ikke for selskabet."
  fr: "Cette personne de contrôle ne travaille pas pour l'entreprise."
  nl: "Die controleur werkt niet voor het bedrijf."
  pl: "Ta osoba kontrolująca nie pracuje dla firmy."
  ru: "Этот контролёр не работает в компании."
  uk: "Цей контролер не працює в компанії."
"There is no such inspection duty.":
