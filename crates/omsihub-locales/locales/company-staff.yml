"No line chosen: the busiest line no other team checks that day.":
  de: "Keine Linie gewählt: die meistbefahrene Linie, die an dem Tag kein anderes Team kontrolliert."
  da: "Ingen linje valgt: den travleste linje, som intet andet hold tjekker den dag."
  fr: "Aucune ligne choisie : la ligne la plus chargée qu'aucune autre équipe ne contrôle ce jour-là."
  nl: "Geen lijn gekozen: de drukste lijn die geen ander team die dag controleert."
  pl: "Nie wybrano linii: najbardziej obciążona linia, której tego dnia nie sprawdza inna para."
  ru: "Линия не выбрана: самая загруженная линия, которую в этот день не проверяет другая пара."
  uk: "Лінію не вибрано: найзавантаженіша лінія, яку того дня не перевіряє інша пара."
