  uk: "Контроль квитків: %{n} без квитка"
"The ticket inspectors checked %{checked} passengers on line %{lines} and caught %{n} without a ticket: %{amount} in fines written, about two thirds of which get paid. The Ticket inspection tab of the Staff page shows each check.":
  de: "Die Fahrkartenkontrolle hat %{checked} Fahrgäste auf Linie %{lines} kontrolliert und %{n} ohne Fahrkarte erwischt: %{amount} an Entgelten ausgestellt, davon werden etwa zwei Drittel bezahlt. Der Reiter Fahrkartenkontrolle auf der Personalseite zeigt jede Kontrolle."
  da: "Billetkontrollørerne tjekkede %{checked} passagerer på linje %{lines} og tog %{n} uden billet: %{amount} i kontrolafgifter udskrevet, og omkring to tredjedele bliver betalt. Fanen Billetkontrol på siden Personale viser hver kontrol."
  fr: "Le contrôle a vérifié %{checked} voyageurs sur la ligne %{lines} et en a trouvé %{n} sans titre : %{amount} d'amendes dressées, dont environ deux tiers seront payés. L'onglet Contrôle des titres de la page Personnel montre chaque contrôle."
  nl: "De kaartcontrole heeft %{checked} reizigers op lijn %{lines} gecontroleerd en %{n} zonder kaartje betrapt: %{amount} aan boetes uitgeschreven, waarvan ongeveer twee derde wordt betaald. Het tabblad Kaartcontrole op de personeelspagina toont elke controle."
  pl: "Kontrola biletów sprawdziła %{checked} pasażerów na linii %{lines} i złapała %{n} bez biletu: wystawiono opłaty na %{amount}, z czego zapłacone zostaną około dwie trzecie. Karta Kontrola biletów na stronie Personel pokazuje każdą kontrolę."
  ru: "Контроль проверил %{checked} пассажиров на линии %{lines} и нашёл %{n} без билета: выписано штрафов на %{amount}, около двух третей из них будет оплачено. Вкладка «Контроль билетов» на странице персонала показывает каждую проверку."
  uk: "Контроль перевірив %{checked} пасажирів на лінії %{lines} і знайшов %{n} без квитка: виписано штрафів на %{amount}, близько двох третин з них буде сплачено. Вкладка «Контроль квитків» на сторінці персоналу показує кожну перевірку."
"Ticket inspectors check the passengers' tickets on your lines: fewer people ride without one, and those caught pay a fine. Research ticket inspection first; then they can be hired on the Hire employees tab.":
  de: "Die Fahrkartenkontrolle prüft die Fahrkarten auf Ihren Linien: Weniger Menschen fahren schwarz, und wer erwischt wird, zahlt. Erforschen Sie zuerst die Fahrkartenkontrolle; danach kann sie auf dem Reiter Mitarbeiter einstellen eingestellt werden."
  da: "Billetkontrollører tjekker passagerernes billetter på dine linjer: Færre kører uden billet, og den, der bliver taget, betaler en kontrolafgift. Forsk først i billetkontrol; derefter kan de ansættes på fanen Ansæt medarbejdere."
  fr: "Le contrôle vérifie les titres de transport sur vos lignes : moins de personnes voyagent sans titre, et les personnes prises paient une amende. Recherchez d'abord le contrôle des titres ; l'équipe peut ensuite être embauchée dans l'onglet Embaucher."
  nl: "De kaartcontrole controleert de kaartjes op je lijnen: minder mensen rijden zwart, en wie betrapt wordt betaalt een boete. Onderzoek eerst de kaartcontrole; daarna kan het personeel worden aangenomen op het tabblad Personeel aannemen."
  pl: "Kontrola biletów sprawdza bilety na Twoich liniach: mniej osób jeździ bez biletu, a złapane osoby płacą opłatę dodatkową. Najpierw zbadaj kontrolę biletów; potem można ją zatrudnić na karcie Zatrudnij pracowników."
  ru: "Контроль проверяет билеты на ваших линиях: без билета ездит меньше людей, а пойманные платят штраф. Сначала исследуйте контроль билетов; затем его можно нанять на вкладке «Нанять сотрудников»."
  uk: "Контроль перевіряє квитки на ваших лініях: без квитка їздить менше людей, а спіймані сплачують штраф. Спершу дослідіть контроль квитків; потім його можна найняти на вкладці «Найняти працівників»."
"The company may hire ticket inspectors now. They work in teams of two, each team on a line of its own - the busiest lines first - and a line they check keeps fewer dodgers for about two weeks.":
  de: "Das Unternehmen kann jetzt Personal für die Fahrkartenkontrolle einstellen. Es arbeitet in Zweierteams, jedes Team auf einer eigenen Linie - die meistbefahrenen zuerst -, und eine kontrollierte Linie hat etwa zwei Wochen lang weniger Schwarzfahrende."
  da: "Selskabet kan nu ansætte billetkontrollører. De arbejder i hold på to, hvert hold på sin egen linje - de travleste linjer først - og en linje, de tjekker, har færre plankere i omkring to uger."
  fr: "L'entreprise peut maintenant embaucher pour le contrôle. L'équipe travaille en binômes, chaque binôme sur sa propre ligne - les plus chargées d'abord - et une ligne contrôlée connaît moins de fraude pendant environ deux semaines."
  nl: "Het bedrijf kan nu personeel voor de kaartcontrole aannemen. Zij werken in teams van twee, elk team op een eigen lijn - de drukste lijnen eerst - en een gecontroleerde lijn heeft ongeveer twee weken minder zwartrijders."
  pl: "Firma może teraz zatrudnić kontrolę biletów. Pracuje ona w zespołach dwuosobowych, każdy zespół na własnej linii - najpierw najbardziej obciążone - a sprawdzana linia ma przez około dwa tygodnie mniej jazdy bez biletu."
  ru: "Компания теперь может нанять контроль билетов. Он работает парами, каждая пара на своей линии - сначала самые загруженные, - и на проверенной линии около двух недель меньше безбилетного проезда."
  uk: "Компанія тепер може найняти контроль квитків. Він працює парами, кожна пара на своїй лінії - спершу найзавантаженіші, - і на перевіреній лінії близько двох тижнів менше безквиткового проїзду."
"About %{base} of the passengers ride without a ticket by day, more in the evening, at night and on full buses. A line the inspectors check keeps fewer for about two weeks. Each one caught pays %{fine}; about two thirds of the fines get paid.":
  de: "Tagsüber fahren etwa %{base} der Fahrgäste ohne Fahrkarte, abends, nachts und in vollen Bussen mehr. Eine kontrollierte Linie hat etwa zwei Wochen lang weniger. Wer erwischt wird, zahlt %{fine}; etwa zwei Drittel der Entgelte werden bezahlt."
  da: "Om dagen kører omkring %{base} af passagererne uden billet, flere om aftenen, om natten og i fyldte busser. En linje, kontrollørerne tjekker, har færre i omkring to uger. Den, der bliver taget, betaler %{fine}; omkring to tredjedele af afgifterne bliver betalt."
  fr: "En journée, environ %{base} des voyageurs n'ont pas de titre, davantage le soir, la nuit et dans les bus pleins. Une ligne contrôlée en compte moins pendant environ deux semaines. Chaque personne prise paie %{fine} ; environ deux tiers des amendes sont payés."
  nl: "Overdag rijdt ongeveer %{base} van de reizigers zonder kaartje, 's avonds, 's nachts en in volle bussen meer. Een gecontroleerde lijn heeft er ongeveer twee weken minder. Wie betrapt wordt betaalt %{fine}; ongeveer twee derde van de boetes wordt betaald."
  pl: "W dzień około %{base} pasażerów jeździ bez biletu, więcej wieczorem, w nocy i w pełnych autobusach. Sprawdzana linia ma ich mniej przez około dwa tygodnie. Każda złapana osoba płaci %{fine}; płacone są około dwie trzecie opłat."
  ru: "Днём около %{base} пассажиров едут без билета, вечером, ночью и в полных автобусах больше. На проверенной линии их меньше около двух недель. Каждый пойманный пассажир платит %{fine}; оплачивается около двух третей штрафов."
  uk: "Удень близько %{base} пасажирів їдуть без квитка, увечері, вночі та в повних автобусах більше. На перевіреній лінії їх менше близько двох тижнів. Кожен спійманий пасажир сплачує %{fine}; сплачується близько двох третин штрафів."
