# (Round L, NexiconDK 7 November 2026) A reserve's frame, contract week and rota.
"Reserve · %{frame} · %{h} h a week":
  de: "Reserve · %{frame} · %{h} Std. pro Woche"
  da: "Reserve · %{frame} · %{h} t om ugen"
  fr: "Réserve · %{frame} · %{h} h par semaine"
  nl: "Reserve · %{frame} · %{h} u per week"
  pl: "Rezerwa · %{frame} · %{h} godz. tygodniowo"
  ru: "Резерв · %{frame} · %{h} ч в неделю"
  uk: "Резерв · %{frame} · %{h} год на тиждень"
"Reserve: a frame is the window a duty may come in, not the hours. A day of the frame pays the hours driven, at least 7:24; the contract week is guaranteed, overtime above it. First to cover an open duty within it, without being asked; told of a duty given from noon the day before.":
  de: "Reserve: ein Rahmen ist das Zeitfenster, in dem ein Dienst kommen kann, nicht die Arbeitszeit. Ein Rahmentag bezahlt die gefahrenen Stunden, mindestens 7:24; die Vertragswoche ist garantiert, darüber Überstunden. Übernimmt als Erster einen offenen Dienst darin, ohne gefragt zu werden; erfährt von einem Dienst, der ab 12 Uhr am Vortag vergeben wird."
  da: "Reserve: en ramme er det tidsrum, en vagt kan komme i, ikke arbejdstiden. En rammedag betaler de kørte timer, mindst 7:24; kontraktugen er garanteret, overtid derover. Dækker først en åben vagt inden for den uden at blive spurgt; får besked om en vagt, der gives fra kl. 12 dagen før."
  fr: "Réserve : un créneau est la plage où un service peut tomber, pas le temps de travail. Un jour du créneau paie les heures conduites, au moins 7:24 ; la semaine du contrat est garantie, heures supplémentaires au-delà. Premier à couvrir un service ouvert dans ce créneau, sans qu'on le lui demande ; prévenu d'un service attribué à partir de midi la veille."
  nl: "Reserve: een tijdvak is het venster waarin een dienst kan komen, niet de werktijd. Een dag van het tijdvak betaalt de gereden uren, minstens 7:24; de contractweek is gegarandeerd, overuren daarboven. Neemt als eerste een open dienst daarbinnen, zonder dat het gevraagd wordt; hoort het van een dienst die vanaf 12 uur de dag ervoor wordt gegeven."
  pl: "Rezerwa: okno to czas, w którym może przyjść służba, a nie czas pracy. Dzień okna płaci przejechane godziny, co najmniej 7:24; tydzień z umowy jest gwarantowany, ponad nim nadgodziny. Jako pierwszy obsadza otwartą służbę w tym oknie, bez pytania; dostaje wiadomość o służbie przydzielonej od południa dnia poprzedniego."
  ru: "Резерв: окно - это время, в которое может прийти смена, а не рабочее время. День окна оплачивает отработанные часы, не меньше 7:24; неделя по договору гарантирована, сверх неё сверхурочные. Первым закрывает открытую смену в этом окне без запроса; получает сообщение о смене, назначенной с полудня накануне."
  uk: "Резерв: вікно - це час, у який може прийти зміна, а не робочий час. День вікна оплачує відпрацьовані години, не менше 7:24; тиждень за договором гарантований, понад нього понаднормові. Першим закриває відкриту зміну в цьому вікні без запиту; отримує повідомлення про зміну, призначену з полудня напередодні."
