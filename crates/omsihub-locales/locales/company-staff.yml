  ru: "Такой контрольной смены нет."
  uk: "Такої контрольної зміни немає."
"Only today and later dates can be planned.":
  de: "Nur heute und spätere Tage können geplant werden."
  da: "Kun i dag og senere datoer kan planlægges."
  fr: "Seuls aujourd'hui et les dates suivantes peuvent être planifiés."
  nl: "Alleen vandaag en latere datums kunnen worden gepland."
  pl: "Zaplanować można tylko dziś i późniejsze daty."
  ru: "Планировать можно только сегодня и более поздние даты."
  uk: "Планувати можна лише сьогодні та пізніші дати."
"That date is planned already.":
