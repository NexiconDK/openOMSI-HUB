"Nothing is planned: the inspectors work in teams of two, each team on a line of its own, the busiest lines first. A day with inspection duties follows them instead; inspectors without a duty that day patrol so, on the lines no duty checks.":
  de: "Nichts ist geplant: Die Kontrollkräfte arbeiten zu zweit, jedes Team auf einer eigenen Linie, die meistbefahrenen zuerst. Ein Tag mit Kontrolldiensten folgt stattdessen diesen; wer an dem Tag keinen Dienst hat, kontrolliert so weiter, auf den Linien, die kein Dienst kontrolliert."
  da: "Intet er planlagt: Kontrollørerne arbejder to og to, hvert hold på sin egen linje, de travleste linjer først. En dag med kontrolvagter følger dem i stedet; kontrollører uden en vagt den dag kontrollerer på samme måde på de linjer, ingen vagt tjekker."
  fr: "Rien n'est planifié : les équipes de contrôle travaillent à deux, chacune sur sa propre ligne, les plus chargées d'abord. Un jour avec des services de contrôle les suit à la place ; qui n'a pas de service ce jour-là contrôle ainsi, sur les lignes qu'aucun service ne contrôle."
  nl: "Er is niets gepland: de controleurs werken met z'n tweeën, elk team op een eigen lijn, de drukste eerst. Een dag met controlediensten volgt die in plaats daarvan; wie die dag geen dienst heeft, controleert zo op de lijnen die geen dienst controleert."
  pl: "Nic nie jest zaplanowane: osoby kontrolujące pracują w parach, każda para na własnej linii, najpierw najbardziej obciążone. Dzień z dyżurami kontrolnymi przebiega według nich; kto nie ma tego dnia dyżuru, sprawdza tak samo linie, których nie sprawdza żaden dyżur."
  ru: "Ничего не запланировано: контролёры работают парами, каждая пара на своей линии, сначала самые загруженные. День с контрольными сменами идёт по ним; у кого в этот день нет смены, проверяет так же линии, которые не проверяет ни одна смена."
  uk: "Нічого не заплановано: контролери працюють парами, кожна пара на своїй лінії, спершу найзавантаженіші. День із контрольними змінами йде за ними; хто того дня не має зміни, перевіряє так само лінії, які не перевіряє жодна зміна."
