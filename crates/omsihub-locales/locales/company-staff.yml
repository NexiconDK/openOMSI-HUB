"Part time: fewer hours a week, guaranteed pro rata; overtime above them.":
  de: "Teilzeit: weniger Stunden pro Woche, anteilig garantiert; darüber Überstunden."
  da: "Deltid: færre timer om ugen, garanteret forholdsmæssigt; overarbejde ud over dem."
  fr: "Temps partiel : moins d'heures par semaine, garanties au prorata ; heures supplémentaires au-delà."
  nl: "Deeltijd: minder uren per week, naar rato gegarandeerd; overuren daarboven."
  pl: "Niepełny etat: mniej godzin tygodniowo, gwarantowanych proporcjonalnie; powyżej nadgodziny."
  ru: "Неполная ставка: меньше часов в неделю, гарантированы пропорционально; сверх них - сверхурочные."
  uk: "Неповна ставка: менше годин на тиждень, гарантовано пропорційно; понад них - понаднормові."
"Reserve: a frame on its weekdays, paid whether used or not. First to cover an open duty within it, without being asked; told of a duty given from noon the day before.":
  de: "Reserve: ein Rahmen an seinen Wochentagen, bezahlt, ob genutzt oder nicht. Übernimmt als Erster einen offenen Dienst darin, ohne gefragt zu werden; erfährt von einem Dienst, der ab 12 Uhr am Vortag vergeben wird."
  da: "Reserve: en ramme på dens ugedage, betalt uanset om den bruges. Dækker først en åben vagt inden for den uden at blive spurgt; får besked om en vagt, der gives fra kl. 12 dagen før."
  fr: "Réserve : un créneau sur ses jours de semaine, payé qu'il serve ou non. Premier à couvrir un service ouvert dans ce créneau, sans qu'on le lui demande ; prévenu d'un service attribué à partir de midi la veille."
  nl: "Reserve: een tijdvak op de gekozen weekdagen, betaald of het nu gebruikt wordt of niet. Neemt als eerste een open dienst daarbinnen, zonder dat het gevraagd wordt; hoort het van een dienst die vanaf 12 uur de dag ervoor wordt gegeven."
  pl: "Rezerwa: okno czasowe w wybrane dni tygodnia, płatne niezależnie od wykorzystania. Jako pierwszy obsadza otwartą służbę w tym oknie, bez pytania; dostaje wiadomość o służbie przydzielonej od południa dnia poprzedniego."
  ru: "Резерв: временное окно в выбранные дни недели, оплачивается независимо от использования. Первым закрывает открытую смену в этом окне без запроса; получает сообщение о смене, назначенной с полудня накануне."
  uk: "Резерв: часове вікно у вибрані дні тижня, оплачується незалежно від використання. Першим закриває відкриту зміну в цьому вікні без запиту; отримує повідомлення про зміну, призначену з полудня напередодні."
"Hourly paid: no guarantee, only the hours worked - at least 3 a day called in - at 10 % more an hour. Called in after the reserves and colleagues.":
  de: "Stundenlohn: keine Garantie, nur die gearbeiteten Stunden - mindestens 3 an einem Tag mit Einsatz - mit 10 % mehr pro Stunde. Wird nach den Reserven und Kollegen gerufen."
  da: "Timelønnet: ingen garanti, kun de arbejdede timer - mindst 3 på en dag med tilkald - med 10 % mere i timen. Tilkaldes efter reserverne og kollegerne."
  fr: "Payé à l'heure : aucune garantie, seulement les heures travaillées - au moins 3 un jour d'appel - à 10 % de plus de l'heure. Appelé après les réserves et les collègues."
  nl: "Uurloon: geen garantie, alleen de gewerkte uren - minstens 3 op een dag dat hij wordt opgeroepen - tegen 10 % meer per uur. Opgeroepen na de reserves en collega's."
  pl: "Płatny godzinowo: bez gwarancji, tylko przepracowane godziny - co najmniej 3 w dniu wezwania - o 10 % więcej za godzinę. Wzywany po rezerwach i kolegach."
  ru: "Почасовая оплата: без гарантии, только отработанные часы - не меньше 3 в день вызова - на 10 % дороже за час. Вызывается после резерва и коллег."
  uk: "Погодинна оплата: без гарантії, лише відпрацьовані години - щонайменше 3 у день виклику - на 10 % дорожче за годину. Викликається після резерву та колег."
