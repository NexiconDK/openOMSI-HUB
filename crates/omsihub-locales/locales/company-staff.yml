"The timetable is being read: the stops come with it.":
  de: "Der Fahrplan wird gelesen: Die Haltestellen kommen mit ihm."
  da: "Køreplanen læses: Stoppestederne kommer med den."
  fr: "L'horaire est en cours de lecture : les arrêts arrivent avec lui."
  nl: "De dienstregeling wordt gelezen: de haltes komen mee."
  pl: "Rozkład jest wczytywany: przystanki pojawią się razem z nim."
  ru: "Расписание читается: остановки появятся вместе с ним."
  uk: "Розклад зчитується: зупинки з'являться разом із ним."
"Lines through the stop":
  de: "Linien über die Haltestelle"
  da: "Linjer gennem stoppestedet"
  fr: "Lignes passant par l'arrêt"
  nl: "Lijnen via de halte"
  pl: "Linie przez przystanek"
  ru: "Линии через остановку"
  uk: "Лінії через зупинку"
"Many inspectors at one stop board every bus of the company's lines passing it within the hours and check everyone aboard. More are caught, and every line through the stop keeps fewer dodgers for the days after.":
  de: "Viele Kontrollkräfte an einer Haltestelle steigen in jeden Bus der Linien des Unternehmens, der sie in der Zeit passiert, und kontrollieren alle an Bord. Es werden mehr erwischt, und jede Linie über die Haltestelle hat in den Tagen danach weniger Schwarzfahrende."
  da: "Mange kontrollører ved ét stoppested går om bord i hver bus på selskabets linjer, der kommer forbi i tidsrummet, og tjekker alle om bord. Flere bliver taget, og hver linje gennem stoppestedet har færre plankere de følgende dage."
  fr: "De nombreuses personnes de contrôle à un arrêt montent dans chaque bus des lignes de l'entreprise qui y passe pendant ces heures et contrôlent tout le monde. Davantage sont pris, et chaque ligne passant par l'arrêt compte moins de fraude les jours suivants."
  nl: "Veel controleurs bij één halte stappen in elke bus van de lijnen van het bedrijf die er in die uren langskomt en controleren iedereen aan boord. Er worden er meer betrapt, en elke lijn via de halte heeft de dagen erna minder zwartrijders."
  pl: "Wiele osób kontrolujących na jednym przystanku wsiada do każdego autobusu linii firmy, który przejeżdża w tych godzinach, i sprawdza wszystkich. Łapanych jest więcej, a każda linia przez przystanek ma w kolejnych dniach mniej gapowiczów."
  ru: "Много контролёров на одной остановке входят в каждый автобус линий компании, проезжающий её в эти часы, и проверяют всех. Ловят больше, и на каждой линии через эту остановку в следующие дни меньше безбилетников."
  uk: "Багато контролерів на одній зупинці заходять у кожен автобус ліній компанії, що проїжджає її в ці години, і перевіряють усіх. Ловлять більше, і на кожній лінії через цю зупинку в наступні дні менше безквиткових."
"2 to 10 hours; past midnight too.":
