"On a planned day the inspectors without a duty work their core hours and check the busiest lines no duty checks (rows marked automatic).":
  de: "An einem geplanten Tag arbeiten die Kontrollkräfte ohne Dienst ihre Kernzeit und kontrollieren die meistbefahrenen Linien, die kein Dienst kontrolliert (Zeilen „automatisch“)."
  da: "På en planlagt dag arbejder kontrollører uden en vagt deres kernetid og tjekker de travleste linjer, som ingen vagt tjekker (rækker mærket automatisk)."
  fr: "Un jour planifié, le personnel de contrôle sans service travaille ses heures de base et contrôle les lignes les plus chargées qu'aucun service ne contrôle (lignes marquées automatique)."
  nl: "Op een geplande dag werken controleurs zonder dienst hun kerntijd en controleren ze de drukste lijnen die geen dienst controleert (rijen gemarkeerd als automatisch)."
  pl: "W zaplanowany dzień osoby kontrolujące bez dyżuru pracują w swoich podstawowych godzinach i sprawdzają najbardziej obciążone linie, których nie sprawdza żaden dyżur (wiersze oznaczone jako automatyczne)."
  ru: "В запланированный день контролёры без смены работают свои основные часы и проверяют самые загруженные линии, которые не проверяет ни одна смена (строки с пометкой «автоматически»)."
  uk: "У запланований день контролери без зміни працюють свої основні години й перевіряють найзавантаженіші лінії, які не перевіряє жодна зміна (рядки з позначкою «автоматично»)."
