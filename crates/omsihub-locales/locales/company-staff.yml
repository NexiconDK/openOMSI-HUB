"A date planned otherwise has its own inspection duties instead of its weekday's; without any it is automatic.":
  de: "Ein anders geplanter Tag hat eigene Kontrolldienste statt der seines Wochentags; ohne welche läuft er automatisch."
  da: "En dato med egen plan har sine egne kontrolvagter i stedet for ugedagens; uden nogen kører den automatisk."
  fr: "Une date planifiée autrement a ses propres services de contrôle au lieu de ceux de son jour de semaine ; sans aucun, elle est automatique."
  nl: "Een anders geplande datum heeft eigen controlediensten in plaats van die van zijn weekdag; zonder loopt hij automatisch."
  pl: "Data zaplanowana inaczej ma własne dyżury kontrolne zamiast tych z dnia tygodnia; bez nich działa automatycznie."
  ru: "У даты с особым планом свои контрольные смены вместо смен её дня недели; без них она идёт автоматически."
  uk: "Дата з окремим планом має власні контрольні зміни замість змін її дня тижня; без них вона йде автоматично."
