  fr: "Plus personne à embaucher pour ce travail cette semaine. Une offre d'emploi amène aussitôt de nouveaux candidats."
  ru: "На эту работу на этой неделе больше некого нанять. Объявление сразу приведёт новых кандидатов."
  uk: "На цю роботу цього тижня більше нікого найняти. Оголошення одразу приведе нових кандидатів."
  pl: "W tym tygodniu nie ma już kogo zatrudnić do tej pracy. Ogłoszenie od razu przyniesie nowych kandydatów."
