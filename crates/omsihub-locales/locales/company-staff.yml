  da: "Den dato er allerede planlagt."
  fr: "Cette date est déjà planifiée."
  nl: "Die datum is al gepland."
  pl: "Ta data jest już zaplanowana."
  ru: "Эта дата уже запланирована."
  uk: "Цю дату вже заплановано."
