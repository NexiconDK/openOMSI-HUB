  ru: "Назначенные контролёры"
  uk: "Призначені контролери"
"Named inspectors work it when they are at work and rested; free ones take the places of those away.":
  de: "Namentlich Eingeteilte arbeiten ihn, wenn sie im Dienst und ausgeruht sind; freie Kontrollkräfte vertreten die Abwesenden."
  da: "Navngivne kontrollører tager vagten, når de er på arbejde og udhvilede; ledige kontrollører tager pladsen for dem, der er væk."
  fr: "Les personnes désignées l'assurent si elles travaillent et sont reposées ; des personnes libres remplacent les absentes."
  nl: "Aangewezen controleurs werken hem als ze aan het werk en uitgerust zijn; vrije controleurs nemen de plaats in van wie weg is."
  pl: "Wyznaczone osoby pełnią dyżur, gdy są w pracy i wypoczęte; wolne osoby zastępują nieobecne."
  ru: "Назначенные контролёры работают, если они на работе и отдохнули; свободные заменяют отсутствующих."
  uk: "Призначені контролери працюють, якщо вони на роботі й відпочили; вільні заміняють відсутніх."
