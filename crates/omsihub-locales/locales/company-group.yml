"At its day's close a depot sends home what it has over the amount it keeps; below the top-up the head office tops it up from the treasury, as far as the treasury goes. Leave a field empty for none.":
  de: "Zum Tagesabschluss schickt ein Depot alles über dem Betrag, den es behält, an die Zentrale; unter der Auffüllgrenze füllt die Zentrale es aus der Konzernkasse auf, soweit die Kasse reicht. Ein leeres Feld: keine."
  fr: "À la clôture de sa journée, un dépôt envoie au siège ce qu'il a au-delà du montant qu'il garde ; en dessous du seuil, le siège le renfloue depuis la trésorerie, dans la limite de celle-ci. Laissez un champ vide pour aucun."
  nl: "Bij zijn dagafsluiting stuurt een depot wat het boven het bedrag dat het houdt heeft naar het hoofdkantoor; onder de aanvulgrens vult het hoofdkantoor het aan uit de groepskas, zover die reikt. Laat een veld leeg voor geen."
  pl: "Przy zamknięciu dnia zajezdnia wysyła do centrali to, co ma ponad kwotę, którą zatrzymuje; poniżej progu centrala uzupełnia ją z kasy grupy, na ile starczy. Puste pole: brak."
  ru: "При закрытии дня депо отправляет в главный офис всё сверх суммы, которую оставляет себе; ниже порога главный офис пополняет его из кассы группы, насколько хватает денег. Пустое поле - без правила."
  uk: "Під час закриття дня депо надсилає до головного офісу все понад суму, яку залишає собі; нижче порогу головний офіс поповнює його з каси групи, наскільки вистачає грошей. Порожнє поле - без правила."
