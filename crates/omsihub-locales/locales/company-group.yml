"Top a depot up to less than it keeps: topped up over its surplus, it would send the money straight back.":
  de: "Fülle ein Depot auf weniger auf, als es behält: über seinen Überschuss aufgefüllt, schickte es das Geld gleich zurück."
  fr: "Renflouez un dépôt à moins que ce qu'il garde : renfloué au-delà, il renverrait aussitôt l'argent."
  nl: "Vul een depot aan tot minder dan het houdt: boven zijn overschot aangevuld zou het het geld meteen terugsturen."
  pl: "Uzupełniaj zajezdnię do kwoty niższej niż ta, którą zatrzymuje: uzupełniona ponad nadwyżkę od razu odesłałaby pieniądze."
  ru: "Пополняйте депо до суммы меньше той, что оно оставляет себе: пополненное сверх неё, оно сразу отправит деньги обратно."
  uk: "Поповнюйте депо до суми, меншої за ту, що воно залишає собі: поповнене понад неї, воно одразу надішле гроші назад."
"Only the group's owner and its management run its head office.":
  de: "Nur der Eigentümer des Konzerns und seine Konzernleitung führen die Zentrale."
  fr: "Seuls le propriétaire du groupe et sa direction dirigent son siège."
  nl: "Alleen de eigenaar van de groep en de groepsleiding leiden het hoofdkantoor."
  pl: "Centralę prowadzą tylko właściciel grupy i jej zarząd."
  ru: "Главным офисом управляют только владелец группы и её руководство."
  uk: "Головним офісом керують лише власник групи та її керівництво."
"That is less than the bank's smallest loan.":
  de: "Das ist weniger als der kleinste Kredit der Bank."
  fr: "C'est moins que le plus petit prêt de la banque."
  nl: "Dat is minder dan de kleinste lening van de bank."
  pl: "To mniej niż najmniejszy kredyt banku."
  ru: "Это меньше самого малого кредита банка."
  uk: "Це менше за найменший кредит банку."
"A company that does well opens a depot on another map: its own lines, buses, staff and money there. The company becomes a group: a head office with no map of its own above its depots, the first map's included. The head office keeps the group's treasury and its loans - the bank lends on the whole group - sends money to the depots by hand or by their rules, moves buses and lends staff between the maps, and approves a depot's big purchases.":
  de: "Eine erfolgreiche Firma eröffnet ein Depot auf einer anderen Karte: mit eigenen Linien, Bussen, Personal und Geld dort. Die Firma wird zum Konzern: eine Zentrale ohne eigene Karte über ihren Depots, das der ersten Karte eingeschlossen. Die Zentrale führt die Konzernkasse und ihre Kredite - die Bank leiht auf den ganzen Konzern -, schickt den Depots Geld von Hand oder nach ihren Regeln, verlegt Busse und verleiht Personal zwischen den Karten und genehmigt die großen Käufe eines Depots."
  fr: "Une entreprise qui réussit ouvre un dépôt sur une autre carte : ses propres lignes, bus, personnel et argent là-bas. L'entreprise devient un groupe : un siège sans carte à lui au-dessus de ses dépôts, celui de la première carte compris. Le siège tient la trésorerie du groupe et ses prêts - la banque prête sur tout le groupe -, envoie de l'argent aux dépôts à la main ou selon leurs règles, déplace des bus et prête du personnel entre les cartes, et approuve les gros achats d'un dépôt."
  nl: "Een bedrijf dat het goed doet, opent een depot op een andere kaart: met eigen lijnen, bussen, personeel en geld daar. Het bedrijf wordt een groep: een hoofdkantoor zonder eigen kaart boven zijn depots, dat van de eerste kaart inbegrepen. Het hoofdkantoor beheert de groepskas en de leningen - de bank leent op de hele groep -, stuurt de depots geld met de hand of volgens hun regels, verplaatst bussen en leent personeel uit tussen de kaarten, en keurt de grote aankopen van een depot goed."
  pl: "Firma, której dobrze idzie, otwiera zajezdnię na innej mapie: własne linie, autobusy, personel i pieniądze. Firma staje się grupą: centrala bez własnej mapy nad zajezdniami, łącznie z tą z pierwszej mapy. Centrala prowadzi kasę grupy i jej kredyty - bank pożycza całej grupie - wysyła zajezdniom pieniądze ręcznie lub według ich reguł, przenosi autobusy i wypożycza personel między mapami oraz zatwierdza duże zakupy zajezdni."
  ru: "Успешная компания открывает депо на другой карте: свои маршруты, автобусы, персонал и деньги. Компания становится группой: главный офис без собственной карты над своими депо, включая депо первой карты. Главный офис ведёт кассу группы и её кредиты - банк кредитует всю группу, - отправляет депо деньги вручную или по их правилам, перемещает автобусы и одалживает персонал между картами и одобряет крупные покупки депо."
  uk: "Успішна компанія відкриває депо на іншій карті: свої маршрути, автобуси, персонал і гроші. Компанія стає групою: головний офіс без власної карти над своїми депо, включно з депо першої карти. Головний офіс веде касу групи та її кредити - банк кредитує всю групу, - надсилає депо гроші вручну або за їхніми правилами, переміщує автобуси й позичає персонал між картами та схвалює великі покупки депо."
