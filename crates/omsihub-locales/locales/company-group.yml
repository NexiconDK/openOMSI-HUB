  ru: "Приказано: %{what} одолжен в %{other} на %{n} дн."
  uk: "Наказано: %{what} позичено до %{other} на %{n} дн."
"A bus of the group's own moves to another depot for %{price} and is away %{n} days; a leased or rented bus stays with its contract. The depot does the order at its next step.":
  de: "Ein eigener Bus des Konzerns wechselt für %{price} in ein anderes Depot und ist %{n} Tage unterwegs; ein geleaster oder gemieteter Bus bleibt bei seinem Vertrag. Das Depot führt die Anordnung bei seinem nächsten Schritt aus."
  fr: "Un bus appartenant au groupe passe dans un autre dépôt pour %{price} et reste absent %{n} jours ; un bus en leasing ou loué reste lié à son contrat. Le dépôt exécute l'ordre à son prochain pas."
  nl: "Een eigen bus van de groep gaat voor %{price} naar een ander depot en is %{n} dagen weg; een geleasede of gehuurde bus blijft bij zijn contract. Het depot voert de opdracht uit bij zijn volgende stap."
  pl: "Własny autobus grupy przechodzi do innej zajezdni za %{price} i jest w drodze %{n} dni; autobus w leasingu lub wynajmie zostaje przy swojej umowie. Zajezdnia wykona polecenie przy swoim następnym kroku."
  ru: "Собственный автобус группы переходит в другое депо за %{price} и в пути %{n} дн.; автобус в лизинге или аренде остаётся по своему договору. Депо выполнит приказ на своём следующем шаге."
  uk: "Власний автобус групи переходить до іншого депо за %{price} і в дорозі %{n} дн.; автобус у лізингу чи оренді залишається за своїм договором. Депо виконає наказ на своєму наступному кроці."
"Orders waiting for the depot":
  de: "Anordnungen, die auf das Depot warten"
  fr: "Ordres en attente du dépôt"
  nl: "Opdrachten die op het depot wachten"
  pl: "Polecenia czekające na zajezdnię"
  ru: "Приказы, ожидающие депо"
  uk: "Накази, що чекають на депо"
"No buses.":
  de: "Keine Busse."
  fr: "Aucun bus."
  nl: "Geen bussen."
  pl: "Brak autobusów."
  ru: "Автобусов нет."
  uk: "Автобусів немає."
"No staff.":
  de: "Kein Personal."
  fr: "Aucun personnel."
  nl: "Geen personeel."
  pl: "Brak personelu."
  ru: "Персонала нет."
  uk: "Персоналу немає."
"Choose another depot to send it to.":
  de: "Wähle ein anderes Depot als Ziel."
  fr: "Choisissez un autre dépôt de destination."
  nl: "Kies een ander depot om het naartoe te sturen."
  pl: "Wybierz inną zajezdnię docelową."
  ru: "Выберите другое депо назначения."
  uk: "Виберіть інше депо призначення."
"The order could not be given: the server says why in its log.":
  de: "Die Anordnung konnte nicht erteilt werden: Der Server nennt den Grund in seinem Protokoll."
  fr: "L'ordre n'a pas pu être donné : le serveur en donne la raison dans son journal."
  nl: "De opdracht kon niet worden gegeven: de server zegt waarom in zijn log."
  pl: "Nie udało się wydać polecenia: serwer podaje powód w swoim dzienniku."
  ru: "Не удалось отдать приказ: причина указана в журнале сервера."
  uk: "Не вдалося віддати наказ: причина вказана в журналі сервера."
"The head office sent %{bus} to %{other}":
  de: "Die Zentrale hat %{bus} nach %{other} geschickt"
  fr: "Le siège a envoyé %{bus} à %{other}"
  nl: "Het hoofdkantoor stuurde %{bus} naar %{other}"
  pl: "Centrala wysłała %{bus} do %{other}"
  ru: "Главный офис отправил %{bus} в %{other}"
  uk: "Головний офіс відправив %{bus} до %{other}"
"By the head office's order %{bus} is on its way to %{other}, there on %{day}.":
  de: "Auf Anordnung der Zentrale ist %{bus} unterwegs nach %{other}, dort am %{day}."
  fr: "Sur ordre du siège, %{bus} est en route vers %{other}, arrivée le %{day}."
  nl: "Op last van het hoofdkantoor is %{bus} onderweg naar %{other}, daar op %{day}."
  pl: "Na polecenie centrali %{bus} jest w drodze do %{other}, na miejscu %{day}."
  ru: "По приказу главного офиса %{bus} в пути в %{other}, прибудет %{day}."
  uk: "За наказом головного офісу %{bus} у дорозі до %{other}, прибуде %{day}."
"The head office lent %{name} to %{other}":
  de: "Die Zentrale hat %{name} an %{other} verliehen"
  fr: "Le siège a prêté %{name} à %{other}"
  nl: "Het hoofdkantoor leende %{name} uit aan %{other}"
  pl: "Centrala wypożyczyła %{name} do %{other}"
  ru: "Главный офис одолжил %{name} в %{other}"
  uk: "Головний офіс позичив %{name} до %{other}"
"By the head office's order %{name} goes to %{other} tomorrow for %{n} days.":
  de: "Auf Anordnung der Zentrale geht %{name} morgen für %{n} Tage zu %{other}."
  fr: "Sur ordre du siège, %{name} part demain chez %{other} pour %{n} jours."
  nl: "Op last van het hoofdkantoor gaat %{name} morgen voor %{n} dagen naar %{other}."
  pl: "Na polecenie centrali %{name} jedzie jutro do %{other} na %{n} dni."
  ru: "По приказу главного офиса %{name} завтра отправляется в %{other} на %{n} дн."
  uk: "За наказом головного офісу %{name} завтра вирушає до %{other} на %{n} дн."
"%{depot} could not do the order":
  de: "%{depot} konnte die Anordnung nicht ausführen"
  fr: "%{depot} n'a pas pu exécuter l'ordre"
  nl: "%{depot} kon de opdracht niet uitvoeren"
  pl: "%{depot} nie mogła wykonać polecenia"
  ru: "%{depot} не смогло выполнить приказ"
  uk: "%{depot} не змогло виконати наказ"
"%{depot} could not do the head office's order (%{what}): %{why}":
  de: "%{depot} konnte die Anordnung der Zentrale (%{what}) nicht ausführen: %{why}"
  fr: "%{depot} n'a pas pu exécuter l'ordre du siège (%{what}) : %{why}"
  nl: "%{depot} kon de opdracht van het hoofdkantoor (%{what}) niet uitvoeren: %{why}"
  pl: "%{depot} nie mogła wykonać polecenia centrali (%{what}): %{why}"
  ru: "%{depot} не смогло выполнить приказ главного офиса (%{what}): %{why}"
  uk: "%{depot} не змогло виконати наказ головного офісу (%{what}): %{why}"
# (step 4: the group's brand)
"Brand":
  de: "Marke"
  fr: "Marque"
  nl: "Merk"
  pl: "Marka"
  ru: "Бренд"
  uk: "Бренд"
"The group's name and mark":
  de: "Name und Zeichen des Konzerns"
  fr: "Nom et emblème du groupe"
  nl: "Naam en beeldmerk van de groep"
  pl: "Nazwa i znak grupy"
  ru: "Название и знак группы"
  uk: "Назва і знак групи"
"Every depot takes the group's name, short name, colours and logo within a minute, named by the group and its map.":
  de: "Jedes Depot übernimmt Name, Kurzname, Farben und Logo des Konzerns innerhalb einer Minute, benannt nach Konzern und Karte."
  fr: "Chaque dépôt reprend le nom, le nom court, les couleurs et le logo du groupe en moins d'une minute, nommé d'après le groupe et sa carte."
  nl: "Elk depot neemt de naam, korte naam, kleuren en het logo van de groep binnen een minuut over, genoemd naar de groep en zijn kaart."
  pl: "Każda zajezdnia przejmuje nazwę, skrót, kolory i logo grupy w ciągu minuty, nazwana od grupy i swojej mapy."
  ru: "Каждое депо в течение минуты перенимает название, краткое имя, цвета и логотип группы и называется по группе и своей карте."
  uk: "Кожне депо протягом хвилини переймає назву, коротке ім'я, кольори й логотип групи та називається за групою і своєю картою."
"Short name":
  de: "Kurzname"
  fr: "Nom court"
  nl: "Korte naam"
  pl: "Skrót"
  ru: "Краткое имя"
  uk: "Коротке ім'я"
"Colours":
  de: "Farben"
  fr: "Couleurs"
  nl: "Kleuren"
  pl: "Kolory"
  ru: "Цвета"
  uk: "Кольори"
"The group's mark has a logo picture: a depot's.":
  de: "Das Zeichen des Konzerns hat ein Logobild: das eines Depots."
  fr: "L'emblème du groupe a une image de logo : celle d'un dépôt."
  nl: "Het beeldmerk van de groep heeft een logoafbeelding: die van een depot."
  pl: "Znak grupy ma obraz logo: z jednej z zajezdni."
  ru: "У знака группы есть картинка логотипа: от одного из депо."
  uk: "Знак групи має зображення логотипа: від одного з депо."
"Not taken yet by: %{names}":
  de: "Noch nicht übernommen von: %{names}"
  fr: "Pas encore repris par : %{names}"
  nl: "Nog niet overgenomen door: %{names}"
  pl: "Jeszcze nie przejęły: %{names}"
  ru: "Ещё не перенято: %{names}"
  uk: "Ще не перейнято: %{names}"
"A depot's mark for the whole group":
  de: "Das Zeichen eines Depots für den ganzen Konzern"
  fr: "L'emblème d'un dépôt pour tout le groupe"
  nl: "Het beeldmerk van een depot voor de hele groep"
  pl: "Znak zajezdni dla całej grupy"
  ru: "Знак одного депо для всей группы"
  uk: "Знак одного депо для всієї групи"
"Choose the logo picture and the mark in a depot's settings, then make them the group's here.":
  de: "Wähle das Logobild und das Zeichen in den Einstellungen eines Depots und mache sie hier zu denen des Konzerns."
  fr: "Choisissez l'image du logo et l'emblème dans les réglages d'un dépôt, puis faites-en ceux du groupe ici."
  nl: "Kies de logoafbeelding en het beeldmerk in de instellingen van een depot en maak ze hier die van de groep."
  pl: "Wybierz obraz logo i znak w ustawieniach zajezdni, a potem ustaw je tutaj dla grupy."
  ru: "Выберите картинку логотипа и знак в настройках депо, затем сделайте их здесь знаком группы."
  uk: "Виберіть зображення логотипа і знак у налаштуваннях депо, а потім зробіть їх тут знаком групи."
"Use its mark":
  de: "Sein Zeichen verwenden"
  fr: "Utiliser son emblème"
  nl: "Zijn beeldmerk gebruiken"
  pl: "Użyj jej znaku"
  ru: "Взять его знак"
  uk: "Взяти його знак"
"The group's liveries":
  de: "Die Lackierungen des Konzerns"
  fr: "Les livrées du groupe"
  nl: "De lakken van de groep"
  pl: "Malowania grupy"
  ru: "Ливреи группы"
  uk: "Лівреї групи"
"A livery a depot made in the livery studio, shared with the whole group: every depot paints its buses in it in the workshop, its design paid once.":
  de: "Eine Lackierung, die ein Depot im Lackierstudio entworfen hat, für den ganzen Konzern: Jedes Depot lackiert seine Busse damit in der Werkstatt, der Entwurf nur einmal bezahlt."
  fr: "Une livrée qu'un dépôt a créée dans l'atelier de livrées, partagée avec tout le groupe : chaque dépôt en peint ses bus à l'atelier, le dessin payé une seule fois."
  nl: "Een lak die een depot in de lakstudio maakte, gedeeld met de hele groep: elk depot spuit zijn bussen ermee in de werkplaats, het ontwerp één keer betaald."
  pl: "Malowanie zaprojektowane przez zajezdnię w studiu malowań, wspólne dla całej grupy: każda zajezdnia maluje nim autobusy w warsztacie, projekt opłacony raz."
  ru: "Ливрея, созданная депо в студии ливрей, общая для всей группы: каждое депо красит в неё автобусы в мастерской, дизайн оплачен один раз."
  uk: "Ліврея, створена депо в студії лівреї, спільна для всієї групи: кожне депо фарбує в неї автобуси в майстерні, дизайн оплачено один раз."
"Share with the group":
  de: "Mit dem Konzern teilen"
  fr: "Partager avec le groupe"
  nl: "Delen met de groep"
  pl: "Udostępnij grupie"
  ru: "Поделиться с группой"
  uk: "Поділитися з групою"
"No liveries shared yet.":
  de: "Noch keine Lackierungen geteilt."
  fr: "Aucune livrée partagée pour l'instant."
  nl: "Nog geen lakken gedeeld."
  pl: "Nie udostępniono jeszcze malowań."
  ru: "Общих ливрей пока нет."
  uk: "Спільних лівреї поки немає."
"The depots' own liveries":
  de: "Die eigenen Lackierungen der Depots"
  fr: "Les livrées propres des dépôts"
  nl: "De eigen lakken van de depots"
  pl: "Własne malowania zajezdni"
  ru: "Собственные ливреи депо"
  uk: "Власні лівреї депо"
"The group's brand changed":
  de: "Die Marke des Konzerns hat sich geändert"
  fr: "La marque du groupe a changé"
  nl: "Het merk van de groep is veranderd"
  pl: "Marka grupy się zmieniła"
  ru: "Бренд группы изменился"
  uk: "Бренд групи змінився"
"The head office set the group's name, mark, colours and liveries: the depot wears them from now on. Its buses are painted in a livery of the group in the workshop, as in one of its own.":
  de: "Die Zentrale hat Name, Zeichen, Farben und Lackierungen des Konzerns festgelegt: Das Depot trägt sie ab jetzt. Seine Busse werden in der Werkstatt in einer Lackierung des Konzerns lackiert, wie in einer eigenen."
  fr: "Le siège a fixé le nom, l'emblème, les couleurs et les livrées du groupe : le dépôt les porte désormais. Ses bus sont peints à l'atelier dans une livrée du groupe, comme dans une des siennes."
  nl: "Het hoofdkantoor heeft de naam, het beeldmerk, de kleuren en de lakken van de groep vastgelegd: het depot draagt ze voortaan. Zijn bussen worden in de werkplaats in een lak van de groep gespoten, net als in een eigen lak."
  pl: "Centrala ustaliła nazwę, znak, kolory i malowania grupy: zajezdnia nosi je od teraz. Jej autobusy są malowane w warsztacie w malowaniu grupy, jak we własnym."
  ru: "Главный офис задал название, знак, цвета и ливреи группы: депо носит их с этого момента. Его автобусы красят в мастерской в ливрею группы, как в собственную."
  uk: "Головний офіс задав назву, знак, кольори й лівреї групи: депо носить їх відтепер. Його автобуси фарбують у майстерні в ліврею групи, як у власну."
"A short name has two to four letters or digits.":
  de: "Ein Kurzname hat zwei bis vier Buchstaben oder Ziffern."
  fr: "Un nom court compte deux à quatre lettres ou chiffres."
  nl: "Een korte naam heeft twee tot vier letters of cijfers."
  pl: "Skrót ma od dwóch do czterech liter lub cyfr."
  ru: "Краткое имя - от двух до четырёх букв или цифр."
  uk: "Коротке ім'я - від двох до чотирьох літер або цифр."
"A colour is written #rrggbb.":
  de: "Eine Farbe wird #rrggbb geschrieben."
  fr: "Une couleur s'écrit #rrggbb."
  nl: "Een kleur schrijf je als #rrggbb."
  pl: "Kolor zapisuje się jako #rrggbb."
  ru: "Цвет записывается как #rrggbb."
  uk: "Колір записується як #rrggbb."
"The depot has no such livery.":
  de: "Das Depot hat keine solche Lackierung."
  fr: "Le dépôt n'a pas cette livrée."
  nl: "Het depot heeft zo'n lak niet."
  pl: "Zajezdnia nie ma takiego malowania."
  ru: "У депо нет такой ливреи."
  uk: "Депо не має такої лівреї."
"Give the group a name.":
  de: "Gib dem Konzern einen Namen."
  fr: "Donnez un nom au groupe."
  nl: "Geef de groep een naam."
  pl: "Nadaj grupie nazwę."
  ru: "Дайте группе название."
  uk: "Дайте групі назву."
# (step 5: the group's roles)
"Roles":
  de: "Rollen"
  fr: "Rôles"
  nl: "Rollen"
  pl: "Role"
  ru: "Роли"
  uk: "Ролі"
"Management":
  de: "Konzernleitung"
  fr: "Direction"
  nl: "Groepsleiding"
  pl: "Zarząd"
  ru: "Руководство"
  uk: "Керівництво"
"Manager of %{depot}":
  de: "Leitung von %{depot}"
  fr: "Responsable de %{depot}"
  nl: "Leiding van %{depot}"
  pl: "Kierownik: %{depot}"
  ru: "Начальник депо %{depot}"
  uk: "Начальник депо %{depot}"
"%{name} owns the group and gives its roles.":
  de: "%{name} gehört der Konzern, und er vergibt die Rollen."
  fr: "%{name} possède le groupe et en attribue les rôles."
  nl: "%{name} is eigenaar van de groep en geeft de rollen."
  pl: "%{name} jest właścicielem grupy i nadaje role."
  ru: "%{name} владеет группой и раздаёт роли."
  uk: "%{name} володіє групою і роздає ролі."
"The group's people":
  de: "Die Leute des Konzerns"
  fr: "Les gens du groupe"
  nl: "De mensen van de groep"
  pl: "Ludzie grupy"
  ru: "Люди группы"
  uk: "Люди групи"
"The management runs the head office with the owner and is a co-owner of every depot; a depot's manager is a co-owner of his depot. Each depot takes the roles within a minute.":
  de: "Die Konzernleitung führt die Zentrale mit dem Eigentümer und ist Mitinhaber jedes Depots; die Leitung eines Depots ist Mitinhaber ihres Depots. Jedes Depot übernimmt die Rollen innerhalb einer Minute."
  fr: "La direction dirige le siège avec le propriétaire et est copropriétaire de chaque dépôt ; le responsable d'un dépôt en est copropriétaire. Chaque dépôt reprend les rôles en moins d'une minute."
  nl: "De groepsleiding leidt het hoofdkantoor met de eigenaar en is mede-eigenaar van elk depot; de leiding van een depot is mede-eigenaar van dat depot. Elk depot neemt de rollen binnen een minuut over."
  pl: "Zarząd prowadzi centralę razem z właścicielem i jest współwłaścicielem każdej zajezdni; kierownik zajezdni jest współwłaścicielem swojej zajezdni. Każda zajezdnia przejmuje role w ciągu minuty."
  ru: "Руководство управляет главным офисом вместе с владельцем и является совладельцем каждого депо; начальник депо - совладелец своего депо. Каждое депо перенимает роли в течение минуты."
  uk: "Керівництво керує головним офісом разом із власником і є співвласником кожного депо; начальник депо - співвласник свого депо. Кожне депо переймає ролі протягом хвилини."
"Depot manager":
  de: "Depotleitung"
  fr: "Responsable de dépôt"
  nl: "Depotleiding"
  pl: "Kierownik zajezdni"
  ru: "Начальник депо"
  uk: "Начальник депо"
"Player":
  de: "Spieler"
  fr: "Joueur"
  nl: "Speler"
  pl: "Gracz"
  ru: "Игрок"
  uk: "Гравець"
"Give the role":
  de: "Rolle vergeben"
  fr: "Attribuer le rôle"
  nl: "Rol geven"
  pl: "Nadaj rolę"
  ru: "Назначить роль"
  uk: "Призначити роль"
"Nobody yet: the owner runs the group alone.":
  de: "Noch niemand: Der Eigentümer führt den Konzern allein."
  fr: "Personne pour l'instant : le propriétaire dirige seul le groupe."
  nl: "Nog niemand: de eigenaar leidt de groep alleen."
  pl: "Jeszcze nikt: właściciel prowadzi grupę sam."
  ru: "Пока никого: владелец управляет группой один."
  uk: "Поки нікого: власник керує групою сам."
"Only the group's owner gives the group's roles.":
  de: "Nur der Eigentümer des Konzerns vergibt dessen Rollen."
  fr: "Seul le propriétaire du groupe attribue les rôles du groupe."
  nl: "Alleen de eigenaar van de groep geeft de rollen van de groep."
  pl: "Tylko właściciel grupy nadaje role w grupie."
  ru: "Роли в группе раздаёт только её владелец."
  uk: "Ролі в групі роздає лише її власник."
"The server has no such player.":
  de: "Der Server kennt keinen solchen Spieler."
  fr: "Le serveur n'a pas ce joueur."
  nl: "De server heeft zo'n speler niet."
  pl: "Serwer nie ma takiego gracza."
  ru: "На сервере нет такого игрока."
  uk: "На сервері немає такого гравця."
"That is no role of the group.":
  de: "Das ist keine Rolle des Konzerns."
  fr: "Ce n'est pas un rôle du groupe."
  nl: "Dat is geen rol van de groep."
  pl: "To nie jest rola w grupie."
