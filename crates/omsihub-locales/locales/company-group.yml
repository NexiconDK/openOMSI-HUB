# (the company's settings: its first depot makes it a group)
"The company becomes a group: a head office with no map above its depots - this company the first of them, named by its map - which its owner runs from Bus Company Online's server page.":
  de: "Die Firma wird zum Konzern: eine Zentrale ohne Karte über ihren Depots - diese Firma das erste davon, benannt nach ihrer Karte -, die ihr Eigentümer von der Server-Seite von Bus Company Online aus führt."
  fr: "L'entreprise devient un groupe : un siège sans carte au-dessus de ses dépôts - cette entreprise le premier d'entre eux, nommé d'après sa carte - que son propriétaire dirige depuis la page du serveur de Bus Company Online."
  nl: "Het bedrijf wordt een groep: een hoofdkantoor zonder kaart boven zijn depots - dit bedrijf het eerste daarvan, genoemd naar zijn kaart - dat de eigenaar leidt vanaf de serverpagina van Bus Company Online."
  pl: "Firma staje się grupą: centralą bez mapy nad zajezdniami - ta firma jest pierwszą z nich, nazwaną od swojej mapy - którą właściciel prowadzi ze strony serwera Bus Company Online."
  ru: "Компания становится группой: главный офис без карты над своими депо - эта компания станет первым из них, названным по своей карте, - которым владелец управляет со страницы сервера Bus Company Online."
  uk: "Компанія стає групою: головний офіс без карти над своїми депо - ця компанія стане першим із них, названим за своєю картою, - яким власник керує зі сторінки сервера Bus Company Online."
# (the treasury short at its day's close: its money called in from the depots)
"The treasury called in %{amount}":
  de: "Die Konzernkasse hat %{amount} eingefordert"
  fr: "La trésorerie a rappelé %{amount}"
  nl: "De groepskas heeft %{amount} opgevraagd"
  pl: "Kasa grupy wezwała %{amount}"
  ru: "Касса группы затребовала %{amount}"
  uk: "Каса групи затребувала %{amount}"
"The treasury closed the day short: %{amount} called in from the depots with money (%{depots}), sent home at their next step.":
  de: "Die Konzernkasse hat den Tag im Minus abgeschlossen: %{amount} von den Depots mit Geld eingefordert (%{depots}), bei ihrem nächsten Schritt an die Zentrale geschickt."
  fr: "La trésorerie a clôturé la journée à découvert : %{amount} rappelés auprès des dépôts qui ont de l'argent (%{depots}), envoyés au siège à leur prochain pas."
  nl: "De groepskas sloot de dag af met een tekort: %{amount} opgevraagd bij de depots met geld (%{depots}), bij hun volgende stap naar het hoofdkantoor gestuurd."
  pl: "Kasa grupy zamknęła dzień z niedoborem: wezwano %{amount} od zajezdni, które mają pieniądze (%{depots}); wyślą je do centrali przy następnym kroku."
  ru: "Касса группы закрыла день с недостачей: %{amount} затребовано у депо, у которых есть деньги (%{depots}); они отправят их в главный офис на следующем шаге."
  uk: "Каса групи закрила день із нестачею: %{amount} затребувано в депо, які мають гроші (%{depots}); вони надішлють їх до головного офісу на наступному кроці."
"The head office called in %{amount}":
  de: "Die Zentrale hat %{amount} eingefordert"
  fr: "Le siège a rappelé %{amount}"
  nl: "Het hoofdkantoor heeft %{amount} opgevraagd"
  pl: "Centrala wezwała %{amount}"
  ru: "Главный офис затребовал %{amount}"
  uk: "Головний офіс затребував %{amount}"
"The group's treasury was short at its day's close: %{amount} sent home.":
  de: "Die Konzernkasse war beim Tagesabschluss im Minus: %{amount} an die Zentrale geschickt."
  fr: "La trésorerie du groupe était à découvert à la clôture du jour : %{amount} envoyés au siège."
  nl: "De groepskas had bij de dagafsluiting een tekort: %{amount} naar het hoofdkantoor gestuurd."
  pl: "Kasa grupy miała niedobór przy zamknięciu dnia: wysłano %{amount} do centrali."
  ru: "У кассы группы была недостача при закрытии дня: %{amount} отправлено в главный офис."
  uk: "Каса групи мала нестачу під час закриття дня: %{amount} надіслано до головного офісу."
