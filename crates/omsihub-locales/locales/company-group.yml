"The bank lends the group on its buses and what it earns: up to %{limit}, %{left} more, at %{rate} % a year.":
  de: "Die Bank leiht dem Konzern auf seine Busse und seine Erträge: bis zu %{limit}, noch %{left}, zu %{rate} % im Jahr."
  fr: "La banque prête au groupe sur ses bus et ce qu'il gagne : jusqu'à %{limit}, encore %{left}, à %{rate} % par an."
  nl: "De bank leent de groep op zijn bussen en wat hij verdient: tot %{limit}, nog %{left}, tegen %{rate} % per jaar."
  pl: "Bank pożycza grupie pod jej autobusy i zarobki: do %{limit}, jeszcze %{left}, na %{rate} % rocznie."
  ru: "Банк кредитует группу под её автобусы и доходы: до %{limit}, ещё %{left}, под %{rate} % годовых."
  uk: "Банк кредитує групу під її автобуси та доходи: до %{limit}, ще %{left}, під %{rate} % річних."
"A depot runs the group on another map of the server: its own lines, buses, staff and money there. It costs %{price} of the treasury, besides the starting money you give it.":
  de: "Ein Depot betreibt den Konzern auf einer anderen Karte des Servers: mit eigenen Linien, Bussen, Personal und Geld dort. Es kostet %{price} aus der Konzernkasse, zusätzlich zum Startgeld, das du ihm gibst."
  fr: "Un dépôt fait rouler le groupe sur une autre carte du serveur : ses propres lignes, bus, personnel et argent là-bas. Il coûte %{price} de la trésorerie, en plus de l'argent de départ que vous lui donnez."
  nl: "Een depot laat de groep rijden op een andere kaart van de server: met eigen lijnen, bussen, personeel en geld daar. Het kost %{price} uit de groepskas, naast het startgeld dat je het geeft."
  pl: "Zajezdnia prowadzi grupę na innej mapie serwera: własne linie, autobusy, personel i pieniądze. Kosztuje %{price} z kasy grupy, oprócz kapitału startowego, który jej dasz."
  ru: "Депо ведёт дела группы на другой карте сервера: свои маршруты, автобусы, персонал и деньги. Оно стоит %{price} из кассы группы, помимо стартовых денег, которые вы ему дадите."
  uk: "Депо веде справи групи на іншій карті сервера: свої маршрути, автобуси, персонал і гроші. Воно коштує %{price} з каси групи, окрім стартових грошей, які ви йому дасте."
